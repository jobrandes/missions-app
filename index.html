. Count them on site. Written from sources, not yet checked on site."},"then":{"yr":"After 1898","label":"The church then","line":"A postcard of the church with its two towers, soon after 1898.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"ab_sf_then","by":"Detroit Publishing Company (scan by NYPL)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Church_of_San_Felipo,_Albuquerque,_N._M_(NYPL_b12647398-62496).tiff","note":"resized"}},"now":{"yr":"2018","head":"Today","label":"The church today","line":"The church on the Plaza, with Old Town shops around it.","ph":{"k":"ab_sf_now","by":"Don McCulley","lic":"CC0","lu":"https://creativecommons.org/publicdomain/zero/1.0/","page":"https://commons.wikimedia.org/wiki/File:San_Felipe_de_Neri_Church_IMG_5545.jpg","note":"resized"}},"story":["The church was founded in 1706 by Fray Manuel Moreno, one of the original settlers of Albuquerque. It was first dedicated to Saint Francis Xavier, but the Viceroy changed the patron saint to Saint Philip Neri in July 1706 to honor King Philip V.","The first church fell down in the winter of 1792 to 1793. The governor called the collapse a disgrace and ordered everyone nearby to help build a new one. Construction on the second church began in 1793.","Under Bishop Jean-Baptiste Lamy in the Victorian era, the church was remodeled with Gothic Revival bell towers and a pitched roof. It is the only building in Old Town proven to date to the Spanish colonial period, and it has been in use for over 200 years."],"fact":"The first church fell down, and the town rebuilt it.","disputed":"Many people think the whole church is a single colonial building. Wikipedia says the Gothic bell towers and roof were added later, in the Victorian era.","claims":[{"t":"The current church was begun in 1793.","a":0,"why":"Wikipedia: the new church was begun in 1793."},{"t":"The first church from 1706 is the one still standing.","a":2,"why":"The first church collapsed in the winter of 1792 to 1793."}],"sources":[{"t":"Wikipedia: San Felipe de Neri Church","u":"https://en.wikipedia.org/wiki/San_Felipe_de_Neri_Church"},{"t":"Wikipedia: Old Town Albuquerque","u":"https://en.wikipedia.org/wiki/Old_Town_Albuquerque"}],"card":{"a":"1706","b":"1793","la":"First church","lb":"Second church"}},{"id":"alvarado","name":"Alvarado Hotel site","short":"Alvarado","badge":"Alvarado","tag":"Stop 2 of 4","teaser":"The biggest Harvey House hotel ever, torn down in 1970.","map":"Alvarado Transportation Center, 100 1st St SW, Albuquerque, NM","clue":"Go to First Street downtown, by the train platforms. Look for the red-roofed station building with a tall tower.","safety":"This is a working train and bus center. Stay on public walkways, keep clear of the tracks, and watch for buses.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"What kind of vehicles use the center that stands on the hotel's old site?","options":["Ferries","Cable cars","Trains","Airplanes"],"answer":2,"hint":"Look beside the building and notice the rails.","verify":"Wikipedia says the Alvarado Transportation Center opened in 2002 on the hotel site. Look at the platforms on site. Written from sources, not yet checked on site."},"then":{"yr":"Survey photo","label":"The arcade then","line":"A survey photograph of the covered arcade that led from the train platform to the hotel.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"ab_av_then","by":"Fred Mang (Historic American Buildings Survey)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:EAST_FRONT,_ENTRANCE_FROM_STATION_PLATFORM_TO_ARCADE_WHICH_LEADS_AROUND_CENTRAL_PATIO_TO_HOTEL_-_Alvarado_Hotel,_First_Street,_Albuquerque,_Bernalillo_County,_NM_HABS_NM,1-ALBU,5-4.tif","note":"resized, cropped"}},"now":{"yr":"2007","head":"Today","label":"The site today","line":"The Alvarado Transportation Center, built where the hotel stood.","ph":{"k":"ab_av_now","by":"Asaavedra32","lic":"CC BY-SA 3.0","lu":"https://creativecommons.org/licenses/by-sa/3.0/","page":"https://commons.wikimedia.org/wiki/File:Albuquerque_NM_Alvarado_Transportation_Center.jpg","note":"resized"}},"story":["The Alvarado Hotel was built in 1901 and 1902 by the Santa Fe Railway and opened on May 10, 1902. The Fred Harvey Company ran it. Charles Frederick Whittlesey designed it in the Mission Revival style, and he also designed El Tovar at the Grand Canyon.","In 1922 it was remodeled and expanded to 120 rooms, with interiors redone by architect Mary Colter. It was then the largest of all the Harvey hotels, and for many travelers it was their first look at the American Southwest.","The railroad tore it down in 1970. A preservationist called it the most serious loss of a landmark the city had suffered, and it helped rally support for saving old buildings. The Alvarado Transportation Center opened on the site in 2002."],"fact":"It was the biggest Harvey House ever built.","disputed":"The Alvarado Transportation Center is named for the lost hotel, but the hotel itself is gone. Wikipedia says the center stands on its site.","claims":[{"t":"The Alvarado Hotel opened in 1902.","a":0,"why":"Wikipedia: it opened on May 10, 1902."},{"t":"The Alvarado Hotel is still standing.","a":2,"why":"The railroad demolished it in 1970."}],"sources":[{"t":"Wikipedia: Alvarado Hotel","u":"https://en.wikipedia.org/wiki/Alvarado_Hotel"},{"t":"Wikipedia: Fred Harvey Company","u":"https://en.wikipedia.org/wiki/Fred_Harvey_Company"}],"card":{"a":"1902","b":"1970","la":"Opened","lb":"Demolished"}},{"id":"kimo","name":"KiMo Theatre","short":"KiMo","badge":"KiMo","tag":"Stop 3 of 4","teaser":"A movie palace named in a contest, and designed to look like a pueblo.","map":"KiMo Theatre, 423 Central Ave NW, Albuquerque, NM","clue":"Go to Central Avenue at 5th Street downtown. Look for the cream-colored building with colorful decorations and a tall red neon sign.","safety":"Central Avenue is busy. Use crosswalks, check box office hours, and keep off the street when taking photos.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"A row of decorated terra cotta shields sits above the windows of which floor?","options":["Third","First","Second","Fourth"],"answer":0,"hint":"Look at the very top row of windows.","verify":"Wikipedia says a row of terra cotta shields runs above the third-floor windows. Check on site. Written from sources, not yet checked on site."},"then":{"yr":"1979","label":"The theater in 1979","line":"The KiMo in 1979, with its marquee, before the later restoration.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"ab_km_then","by":"John Margolies","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Kimo_Theater,_Albuquerque,_New_Mexico_LCCN2017708024.tif","note":"resized, cropped"}},"now":{"yr":"2012","head":"Today","label":"The theater today","line":"The restored front, with its neon sign and blue windows.","ph":{"k":"ab_km_now","by":"Asaavedra32","lic":"CC BY-SA 3.0","lu":"https://creativecommons.org/licenses/by-sa/3.0/","page":"https://commons.wikimedia.org/wiki/File:Facade_of_KIMO_2012.JPG","note":"resized"}},"story":["The KiMo opened on September 19, 1927, in a style called Pueblo Deco, a blend of Pueblo Revival and Art Deco. The Boller Brothers architecture firm designed it, after studying Southwest cultures and building styles.","The Albuquerque Journal held a naming contest with a $50 prize. The name had to be Indian and could not have more than six letters. Pablo Abeita, a former governor of Isleta Pueblo, won with \"Kimo\", which means mountain lion.","The theater closed in 1970 and a fire damaged it by 1977. The family sold it to the city, which saved it and restored it. A replica of the original neon sign, 24 feet tall, went up in June 2011."],"fact":"The theater's name came from a contest.","disputed":"Some people say Kimo means \"king of the beasts\". Wikipedia says it means mountain lion, sometimes loosely translated that way.","claims":[{"t":"The KiMo opened in 1927.","a":0,"why":"Wikipedia: opened September 19, 1927."},{"t":"The architect named the theater himself.","a":2,"why":"Pablo Abeita won a newspaper naming contest."}],"sources":[{"t":"Wikipedia: KiMo Theater","u":"https://en.wikipedia.org/wiki/KiMo_Theater"},{"t":"Wikipedia: Boller Brothers","u":"https://en.wikipedia.org/wiki/Boller_Brothers"}],"card":{"a":"1927","b":"2011","la":"Opened","lb":"Neon sign replica"}},{"id":"shops","name":"Santa Fe Railway Shops","short":"Rail Shops","badge":"Rail Shops","tag":"Stop 4 of 4","teaser":"A railroad workshop so big that it was Albuquerque's biggest employer.","map":"Albuquerque Rail Yards, 777 1st St SW, Albuquerque, NM","clue":"Go south of downtown to the Barelas neighborhood. Look for a huge old industrial building with tall glass walls.","safety":"Much of the rail yard is private or closed. View from public streets, and do not enter fenced areas.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"The huge machine shop's long north and south faces are mostly made of what?","options":["Brick","Wood","Adobe","Glass"],"answer":3,"hint":"Light poured in from all sides for the workers.","verify":"Wikipedia says the shop has uninterrupted glass walls on its north and south faces. Check on site. Written from sources, not yet checked on site."},"then":{"yr":"1943","label":"The railyard then","line":"Jack Delano photographed the Santa Fe Railway's tie plant in Albuquerque in March 1943.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"ab_ry_then","by":"Jack Delano (Farm Security Administration)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:At_the_Santa_Fe_R.R._tie_plant,_Albuquerque1a34734v.jpg","note":"resized, cropped"}},"now":{"yr":"2005","head":"Today","label":"The shop today","line":"A 2005 survey photo of the transfer table and machine shop.","ph":{"k":"ab_ry_now","by":"Jet Lowe (Historic American Engineering Record)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Looking_southwest_at_dual-track_transfer_table,_with_Machine_Shop_(Bldg._163)_in_background_-_Atchison,_Topeka,_Santa_Fe_Railroad,_Albuquerque_Shops,_908_Second_Street,_Southwest,_HAER_NM-12-5.tif","note":"resized, cropped"}},"story":["The Santa Fe Railway built shops in Albuquerque in the 1880s. The buildings that remain were put up between 1915 and 1925, and the shops became the city's biggest employer, with 970 workers in 1919 and a peak of 1,500 in the 1940s.","The main job was steam locomotive maintenance. Each locomotive needed a full rebuild every 12 to 18 months, and the shops finished about 40 overhauls a month at their peak.","The huge erection and machine shop was designed in 1920 and built in eight months, starting in February 1921. It covers about 165,000 square feet, with a main bay 604 feet long, 57 feet high and a crane that can lift 250 tons. Work declined in the 1950s as the railroad switched to diesel, and the shops later sat empty."],"fact":"The main bay is 604 feet long.","disputed":"Many people think railroad shops like these built diesel locomotives. Wikipedia says the Santa Fe moved diesel repair to other yards.","claims":[{"t":"The shops were once Albuquerque's largest employer.","a":0,"why":"Wikipedia: they were the largest employer in the city in their heyday."},{"t":"The shops mostly serviced diesel engines.","a":2,"why":"Their core work was steam locomotive maintenance."}],"sources":[{"t":"Wikipedia: Santa Fe Railway Shops (Albuquerque)","u":"https://en.wikipedia.org/wiki/Santa_Fe_Railway_Shops_(Albuquerque)"},{"t":"Wikipedia: Atchison, Topeka and Santa Fe Railway","u":"https://en.wikipedia.org/wiki/Atchison,_Topeka_and_Santa_Fe_Railway"}],"card":{"a":"1921","b":"1950s","la":"Machine shop built","lb":"Diesels arrive"}}],"heroKey":"ab_sf_now"},"tucson":{"id":"tucson","name":"Tucson","explorer":"Old Pueblo Explorer","initials":"TUC","ranks":[[0,"Visitor"],[100,"Desert Walker"],[250,"Landmark Hunter"],[450,"Tucson Scholar"],[600,"Tucson Historian"]],"heroAlt":"Mission San Xavier del Bac near Tucson","heroLi":"<li>Header: Philcomanforterie · CC BY-SA 4.0 · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:Mission_San_Xavier_del_Bac,_Tucson_AZ.jpg\">Source</a> · resized</li>","heroCredit":"Photo: Philcomanforterie · <a target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by-sa/4.0/\">CC BY-SA 4.0</a> · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:Mission_San_Xavier_del_Bac,_Tucson_AZ.jpg\">Source</a>","mission":"Find four landmarks around Tucson. At each one, check in to earn its badge, unlock its story, and collect a Time Card. Do them in any order. Everything stays on this phone.","afterDone":"All four badges earned. The rest of Tucson is waiting.","safetyNote":"<li>Tucson gets very hot. Go early or late in the day, bring water, wear sunscreen, and use crosswalks. The San Xavier mission is a working church, so be quiet and respectful.</li>","badgeMap":{"xavier":["tu_sx_now","50% 45%"],"depot":["tu_dp_now","50% 45%"],"courthouse":["tu_cc_now","50% 45%"],"oldmain":["tu_om_now","50% 45%"]},"level":"Classics","region":"The Southwest","stops":[{"id":"xavier","name":"Mission San Xavier del Bac","short":"San Xavier","badge":"San Xavier","tag":"Stop 1 of 4","teaser":"A bright white church in the desert, about 230 years old.","map":"Mission San Xavier del Bac, 1950 W San Xavier Rd, Tucson, AZ","clue":"Go about 10 miles south of downtown to the San Xavier Indian Reservation. Look for a bright church with two bell towers, standing alone in the desert.","safety":"The mission is an active church and place of pilgrimage. Check visiting hours, dress respectfully, be quiet, and ask before taking photos inside.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"What color is the mission's main building?","options":["White","Red","Blue","Black"],"answer":0,"hint":"Think of a desert bird that is also a symbol of peace.","verify":"Wikipedia calls it an outstanding example of Spanish Colonial architecture. Check the color on site. Written from sources, not yet checked on site."},"then":{"yr":"About 1902","label":"The mission then","line":"A color photochrom of the mission from about 1902.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"tu_sx_then","by":"Detroit Photographic Company (Smithsonian American Art Museum)","lic":"CC0","lu":"https://creativecommons.org/publicdomain/zero/1.0/","page":"https://commons.wikimedia.org/wiki/File:San_Xavier_Mission,_Tucson,_Arizona-saam_2004.29.38.jpg","note":"resized"}},"now":{"yr":"2018","head":"Today","label":"The mission today","line":"The white church with its two towers.","ph":{"k":"tu_sx_now","by":"Philcomanforterie","lic":"CC BY-SA 4.0","lu":"https://creativecommons.org/licenses/by-sa/4.0/","page":"https://commons.wikimedia.org/wiki/File:Mission_San_Xavier_del_Bac,_Tucson_AZ.jpg","note":"resized"}},"story":["Father Eusebio Kino, a Jesuit of Italian descent, founded the mission in 1692. It was named for Francis Xavier. The first church was built about two miles from today's site, and construction began on April 28, 1700. An Apache raid in 1770 destroyed the earlier church.","The present church was built between 1783 and 1797, which makes it the oldest European structure in Arizona. The O'odham people provided the labor.","The mission sits on the San Xavier Indian Reservation, in a settlement of the Sobaipuri O'odham. It is a pilgrimage site, with thousands visiting every year on foot and on horseback, and about 200,000 visitors a year in all."],"fact":"O'odham workers built the church.","disputed":"The mission is often called the oldest church in Arizona, but Wikipedia only says it is the oldest European structure in Arizona, and it was built between 1783 and 1797.","claims":[{"t":"Mission San Xavier del Bac was founded in 1692.","a":0,"why":"Wikipedia: founded in 1692 by Eusebio Kino."},{"t":"The present church was built in the 1900s.","a":2,"why":"It was built between 1783 and 1797."}],"sources":[{"t":"Wikipedia: Mission San Xavier del Bac","u":"https://en.wikipedia.org/wiki/Mission_San_Xavier_del_Bac"},{"t":"Wikipedia: Eusebio Kino","u":"https://en.wikipedia.org/wiki/Eusebio_Kino"}],"card":{"a":"1692","b":"1797","la":"Founded","lb":"Church finished"}},{"id":"depot","name":"Tucson Depot","short":"Depot","badge":"Depot","tag":"Stop 2 of 4","teaser":"A train depot that was restored to look like it did in 1941.","map":"Tucson Amtrak Station, 400 N Toole Ave, Tucson, AZ","clue":"Go to the downtown rail area at Toole Avenue. Look for a long, tan station building with a red tile roof.","safety":"Keep clear of the tracks, and watch for trains and the streetcar. Use crosswalks.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"What color are the roof tiles on the depot?","options":["Green","Blue","Gray","Red"],"answer":3,"hint":"Look at the roof and think of clay.","verify":"Wikipedia says the restored depot has red clay roof tiles. Check on site. Written from sources, not yet checked on site."},"then":{"yr":"1930s to 1940s","label":"The depot then","line":"A postcard of the depot, described as a beautiful Spanish-type depot.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"tu_dp_then","by":"Tichnor Brothers (Boston Public Library)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Beautiful_Spanish_type_Southern_Pacific_Depot,_Tucson,_Arizona_(73692).jpg","note":"resized"}},"now":{"yr":"2015","head":"Today","label":"The depot today","line":"A restored building beside the tracks at the depot.","ph":{"k":"tu_dp_now","by":"Tony the Marine","lic":"CC BY-SA 3.0","lu":"https://creativecommons.org/licenses/by-sa/3.0/","page":"https://commons.wikimedia.org/wiki/File:Tucson-Amtrak_Station-1907-1922-1.JPG","note":"resized"}},"story":["The Southern Pacific Railroad built the depot in 1907. Its architect, Daniel J. Patterson, also designed other depots in the era, including the station in San Antonio.","In 1998 the city bought the whole depot property from the Union Pacific Railroad, which had absorbed the Southern Pacific. Restoration was finished in 2004, bringing the main building and three others back to their 1941 Spanish Colonial Revival look.","The restored station has stuccoed brick walls, red clay roof tiles and colorful decorative tilework in the waiting room. The Southern Arizona Transportation Museum is in the old records vault, and the Old Pueblo Trolley reached the depot in 2009."],"fact":"It was restored to its 1941 look, not its 1907 look.","disputed":"Many people assume the depot looks the way it did when it was built. Wikipedia says it was restored to its 1941 modernized style.","claims":[{"t":"The Tucson depot was built in 1907.","a":0,"why":"Wikipedia: built in 1907 by the Southern Pacific."},{"t":"The Union Pacific built the depot.","a":2,"why":"The Southern Pacific built it. The Union Pacific absorbed the Southern Pacific later."}],"sources":[{"t":"Wikipedia: Tucson station","u":"https://en.wikipedia.org/wiki/Tucson_station"},{"t":"Wikipedia: Southern Pacific Railroad","u":"https://en.wikipedia.org/wiki/Southern_Pacific_Railroad"}],"card":{"a":"1907","b":"2004","la":"Built","lb":"Restored"}},{"id":"courthouse","name":"Pima County Courthouse","short":"Courthouse","badge":"Courthouse","tag":"Stop 3 of 4","teaser":"A courthouse with a tiled dome, now a visitor center.","map":"Pima County Courthouse, 115 N Church Ave, Tucson, AZ","clue":"Go downtown to the Presidio area on Church Avenue. Look for a big building with a round dome and arched walkways.","safety":"Downtown streets have light rail and traffic. Use crosswalks, and check hours before going in.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"The courthouse's big dome is covered in what?","options":["Plain concrete","Wood shingles","Colorful tiles","Grass"],"answer":2,"hint":"Look at the dome in the sunlight and notice how it shines.","verify":"The photos show a patterned dome. Check what it is made of on site. Written from sources, not yet checked on site."},"then":{"yr":"1930s to 1940s","label":"The courthouse then","line":"A postcard of the courthouse, with the Santa Catalina Mountains in the background.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"tu_cc_then","by":"Tichnor Brothers (Boston Public Library)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Pima_County_Court_House,_Tucson,_Arizona,_Santa_Catalina_Mountains_in_background-_portion_of_Old_City_of_Tucson_wall_in_foreground_(65323).jpg","note":"resized"}},"now":{"yr":"2003","head":"Today","label":"The courthouse today","line":"The domed courthouse, framed by palm trees.","ph":{"k":"tu_cc_now","by":"Gillfoto","lic":"CC BY-SA 3.0","lu":"https://creativecommons.org/licenses/by-sa/3.0/","page":"https://commons.wikimedia.org/wiki/File:Pima_County_Courthouse_10.JPG","note":"resized"}},"story":["Architect Roy Place designed the courthouse in 1928, in a blend of Mission Revival and Spanish Colonial Revival styles. It is listed on the National Register of Historic Places.","It housed the Pima County Superior Court from 1930 to 1977, and then the Pima County Consolidated Justice Court until 2015.","After the courts moved to newer buildings, the county planned to turn it into museum space. The University of Arizona Mineral Museum began moving in during 2020, and the building now holds the Southern Arizona Heritage and Visitor Center."],"fact":"It was a working courthouse for decades.","disputed":"Many people still call it the county courthouse. Wikipedia says the courts have moved out, and the building is now a visitor center.","claims":[{"t":"Roy Place designed the courthouse in 1928.","a":0,"why":"Wikipedia: designed by Roy Place in 1928."},{"t":"The courthouse still hosts trials today.","a":2,"why":"The courts moved out by 2015."}],"sources":[{"t":"Wikipedia: Pima County Courthouse","u":"https://en.wikipedia.org/wiki/Pima_County_Courthouse"},{"t":"Wikipedia: Roy Place","u":"https://en.wikipedia.org/wiki/Roy_Place"}],"card":{"a":"1928","b":"2015","la":"Designed","lb":"Courts move out"}},{"id":"oldmain","name":"Old Main, University of Arizona","short":"Old Main","badge":"Old Main","tag":"Stop 4 of 4","teaser":"The first building at a university that started with 32 students.","map":"Old Main, 1200 E University Blvd, Tucson, AZ","clue":"Go to the University of Arizona campus. Look for the brick building with two-story porches near the mall.","safety":"The campus has bikes and scooters. Stay on walkways, and check whether the building is open before you go in.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"What is Old Main mostly built from?","options":["Brick","Glass","Adobe","Logs"],"answer":0,"hint":"Look at the walls up close and think of fired clay.","verify":"The photos show a brick building. Check the walls on site. Written from sources, not yet checked on site."},"then":{"yr":"1938","label":"Old Main then","line":"A survey photo from January 1938, the year the city condemned the building.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"tu_om_then","by":"Frederick D. Nichols (Historic American Buildings Survey)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Historic_American_Buildings_Survey_Frederick_D._Nichols,_Photographer_January_1938_DETAIL_OF_WING._-_University_of_Arizona,_Old_Main,_University_of_Arizona_Campus,_Tucson,_HABS_ARIZ,10-TUCSO,14A-3.tif","note":"resized, cropped"}},"now":{"yr":"2015","head":"Today","label":"Old Main today","line":"The restored brick building with its two-story porches.","ph":{"k":"tu_om_now","by":"Tony the Marine","lic":"CC BY-SA 3.0","lu":"https://creativecommons.org/licenses/by-sa/3.0/","page":"https://commons.wikimedia.org/wiki/File:Tucson-Old_Main_University_of_Arizona_Building-1875.JPG","note":"resized"}},"story":["Construction began on October 27, 1887, and the money ran out before the roof was finished. Officials then discovered that federal loans were available for agricultural schools, so the building was renamed the School of Agriculture instead of the School of Mines.","Old Main opened for the first class on October 1, 1891. It held classrooms, a library, offices and dorms, and was the only building on campus. Six teachers taught 32 students.","The city condemned the building in 1938 because of neglect. The US Navy repaired it in 1942 for World War II, and it came back to campus use in 1945. A full renovation reopened it in 2014."],"fact":"The budget ran out before the roof was done.","disputed":"Many people assume Old Main was always meant to be a university hall. Wikipedia says it was planned as a School of Mines and renamed to get federal money.","claims":[{"t":"Old Main opened for classes in 1891.","a":0,"why":"Wikipedia: first class on October 1, 1891."},{"t":"Old Main was condemned in 1887.","a":2,"why":"Construction began in 1887. It was condemned in 1938."}],"sources":[{"t":"Wikipedia: Old Main, University of Arizona","u":"https://en.wikipedia.org/wiki/Old_Main,_University_of_Arizona"},{"t":"Wikipedia: University of Arizona","u":"https://en.wikipedia.org/wiki/University_of_Arizona"}],"card":{"a":"1887","b":"1891","la":"Construction begins","lb":"First class"}}],"heroKey":"tu_sx_now"}}};

      var locked=(k>=2&&!d);
      var ok=(k<cur.step)||(d&&k>=2&&k!==cur.step&&k<=2);
      var cls='step'+(k===cur.step?' cur':'')+(ok&&k!==cur.step?' ok':'');
      return '<button class="'+cls+'" data-a="step" data-n="'+k+'"'+(locked?' disabled':'')+(k===cur.step?' aria-current="step"':'')+'><span>'+n+'</span></button>';
    }).join('')+'</div>';
  }

  var streak=0;
  var FLAB=['Well documented','Disputed or unproven','Not true'];
  var FSUB=['Solid sources back it up','Historians disagree or cannot prove it','It is a myth or a mistake'];
  function nextPanel(){
    var n=STOPS.length, j=-1, k, t;
    for(k=1;k<n;k++){ t=(cur.i+k)%n; if(!S.done[t]){ j=t; break; } }
    var h='<section class="card nextstop"><p class="mono">What next</p>';
    if(j>=0){
      h+='<p>Stop done. Now go to <strong>'+STOPS[j].name+'</strong>, then check in there.</p><button class="btn" data-a="nextstop" data-i="'+j+'">Next stop: '+STOPS[j].name+'</button><button class="btn ghost" data-a="exit">Back to the trail</button>';
    } else {
      h+='<p>That is every stop in '+city().name+'. Nicely done.</p>';
      if(((DATA.boss||{})[cityId]||[]).length) h+='<button class="btn" data-a="bossgo">Take the final challenge</button>';
      h+='<button class="btn ghost" data-a="tab" data-t="rewards">See my passport</button><button class="btn ghost" data-a="exit">Back to the trail</button>';
    }
    return h+'</section>';
  }
  function factGame(st){
    var n=st.claims.length, next=-1, doneN=0;
    st.claims.forEach(function(c,ci){ if(S.claims[cur.i*2+ci]) doneN++; else if(next<0) next=ci; });
    var h='<section class="card fof"><p class="mono">Fact or Fiction</p>';
    h+='<div class="fdots" aria-label="'+doneN+' of '+n+' claims done">';
    for(var q=0;q<n;q++) h+='<i class="'+(q<doneN?'on':'')+'"></i>';
    h+='</div>';
    if(streak>1) h+='<p class="streak">Streak: '+streak+' in a row</p>';
    if(next<0){
      h+='<p><strong>All claims sorted.</strong> Here is what the sources say.</p>';
      st.claims.forEach(function(c){ h+='<div class="fdone"><p><strong>'+c.t+'</strong></p><p class="feedback good">'+FLAB[c.a]+'. <span class="why">'+c.why+'</span></p></div>'; });
      return nextPanel()+h+'</section>';
    }
    var c=st.claims[next];
    h+='<p class="why">Open book: the answers are in the story and sources you just read. Is this claim solid, disputed, or not true? Tap a label'+(('ontouchstart' in window)?', or swipe the card right for solid and left for not true':'')+'.</p>';
    h+='<div class="fcard'+(cur.fbad?' shake':'')+'" data-claim="'+next+'" tabindex="0"><p class="ftxt">'+c.t+'</p></div>';
    if(cur.fbad) h+='<p class="feedback bad" aria-live="polite">Not quite. Check the story and the sources, then try again.</p>';
    h+='<div class="fbtns" role="group" aria-label="Choose a label">'+FLAB.map(function(r,k){
      return '<button class="fbtn" data-a="fpick" data-c="'+next+'" data-k="'+k+'"><b>'+r+'</b><span>'+FSUB[k]+'</span></button>';
    }).join('')+'</div></section>';
    return h;
  }
  function factAnswer(ci,k){
    var st=STOPS[cur.i], c=st.claims[ci], gi=cur.i*2+ci;
    if(S.claims[gi]) return;
    if(k===c.a){
      S.claims[gi]=1; streak++; cur.fbad=false; save(); render();
      toast('Right. +25 XP'+(streak>1?' ('+streak+' in a row)':''));
    } else {
      streak=0; cur.fbad=true; render(); toast('Not quite. Try again.');
    }
  }
  (function(){ var x0=null,y0=null;
    document.addEventListener('touchstart',function(e){ var t=e.target.closest&&e.target.closest('.fcard'); if(!t){x0=null;return;} x0=e.touches[0].clientX; y0=e.touches[0].clientY; },{passive:true});
    document.addEventListener('touchend',function(e){ if(x0===null) return; var t=e.target.closest&&e.target.closest('.fcard'); var dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0; x0=null;
      if(!t||Math.abs(dx)<70||Math.abs(dx)<Math.abs(dy)*1.5) return; factAnswer(+t.getAttribute('data-claim'), dx>0?0:2); },{passive:true});
  })();
  function viewStop(){
    var st=STOPS[cur.i], d=S.done[cur.i];
    var h='<div class="stophead"><button class="link" data-a="exit">‹ '+(tab==='cards'?'Cards':'Trail')+'</button><span class="mono">'+st.tag+'</span></div>';
    h+='<h2 id="stopTitle" tabindex="-1">'+st.name+'</h2>';
    if(cur.demo) h+='<p class="demo-banner" role="status"><strong>Preview mode.</strong> You are trying this from home. No stamp, no points, nothing saved. The real thing needs you on the spot.</p>';
    h+=stepper();

    if(cur.step===0){
      h+='<div class="banner">'+visual(st,'now',st.name+' today')+'<span class="tagline">'+(hasPh(st,'now')?'Photo':'Illustration')+'</span></div><p class="credit">'+credit(st,'now')+'</p>';
      h+='<section class="card"><p class="mono">Find it</p><p>'+st.clue+'</p><div class="safety"><span class="mono">Safety</span><span>'+st.safety+'</span></div>'+vnote(st)
        +'<a class="btn ghost" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query='+encodeURIComponent(st.map)+'">Open in Maps</a>'
        +'<button class="btn" data-a="step" data-n="1">I am here. Show me the question</button>'+(d?'':'<button class="btn ghost" data-a="demo">Not there? Try it from home (preview)</button>')+'</section>';
    }
    if(cur.step===1){
      h+='<section class="card"><p class="mono">Check in</p>';
      h+='<fieldset class="opts"><legend>'+st.q.prompt+'</legend>'+st.q.options.map(function(o,k){
        var cls='opt'; var mark='';
        if(d && k===st.q.answer){cls+=' right'; mark='<em>Correct</em>';}
        else if(cur.wrong.indexOf(k)>-1){cls+=' wrong'; mark='<em>Not this one</em>';}
        return '<button type="button" class="'+cls+'" data-a="pick" data-k="'+k+'"'+(d?' disabled':'')+'><span>'+o+'</span>'+mark+'</button>';
      }).join('')+'</fieldset>';
      if(d){
        h+='<div class="earned pop"><div class="bbox lg">'+badge(st.id,true)+'</div><div><strong>'+(cur.demo?'Preview only: no stamp saved':'Badge earned')+'</strong><span>'+st.badge+'</span></div></div><button class="btn" data-a="step" data-n="2">Unlock the story</button>';
      } else {
        h+='<p class="feedback'+(cur.wrong.length?' bad':'')+'" aria-live="polite">'+(cur.wrong.length?'Not yet. '+st.q.hint:'Get it right to earn the '+st.badge+' badge and 100 XP.')+'</p>';
      }
      h+='</section>';
    }
    if(cur.step===2 && d){
      h+=compare(st);
      h+='<div class="pair"><div class="then">'+visual(st,'then',st.then.label+', '+st.then.yr)+'<div class="cap"><strong>Then, '+st.then.yr+': '+st.then.label+'</strong><br>'+st.then.line+'</div>'+credit(st,'then')+'<a target="_blank" rel="noopener" href="'+st.then.link.u+'">'+st.then.link.t+'</a></div>'
        +'<div class="now">'+visual(st,'now',st.now.label)+'<span class="mono">'+(st.now.head||'Now')+'</span><b class="yr">'+st.now.yr+'</b><div class="cap"><strong>'+st.now.label+'</strong><br>'+st.now.line+'</div>'+credit(st,'now')+'</div></div>';
      h+='<section class="card story">'+st.story.map(function(p){return '<p>'+p+'</p>';}).join('')+'</section>';
      if(st.disputed) h+='<aside class="argue" aria-label="Historians argue about this"><div class="argue-h"><span class="argue-ic" aria-hidden="true">?</span><span><b>Historians argue about this</b><em>Not everything here is settled.</em></span></div><p>'+st.disputed+'</p><p class="argue-go">Think you can tell solid from shaky? The Source check is next.</p></aside>';
      h+='<div class="fact"><span class="mono">Did you know</span><span>'+st.fact+'</span></div>';
      h+='<details class="card"><summary>Sources</summary><ul class="srcs">'+st.sources.map(function(s){return '<li><a target="_blank" rel="noopener" href="'+s.u+'">'+s.t+'</a></li>';}).join('')+'</ul></details>';
      h+='<button class="btn" data-a="step" data-n="3">Next: sort fact from fiction (up to 50 XP)</button>';
    }
    if(cur.step===3 && d){ h+=factGame(st); }
    h+='<p class="repline"><button class="link" data-a="report">Something wrong here? Tell us</button></p>';
    return h;
  }

  function viewCards(){
    var h='<p>Each stop you unlock adds a Time Card to your collection. Tap one to reopen its story.</p><div class="grid">';
    STOPS.forEach(function(s,i){
      if(S.done[i]){
        h+='<button class="tcard" data-a="open" data-i="'+i+'" data-s="2"><span class="mono">'+s.name+'</span>'
          +'<span class="mini">'+visual(s,'then','Then: '+s.card.la,' then-s').replace(/<div/g,'<span').replace(/<\/div>/g,'</span>')+visual(s,'now','Now: '+s.card.lb).replace(/<div/g,'<span').replace(/<\/div>/g,'</span>')+'</span><span class="credit-txt">Then: '+creditTxt(s,'then')+'. Now: '+creditTxt(s,'now')+'.</span>'
          +'<span class="years">'+s.card.a+' <i>→</i> '+s.card.b+'</span><span><strong>Then:</strong> '+s.card.la+'</span><span><strong>Now:</strong> '+s.card.lb+'</span></button>';
      } else {
        h+='<div class="tcard locked"><span class="mono">Locked</span><span class="years">? <i>→</i> ?</span><span>Find '+s.name+' to collect this card.</span></div>';
      }
    });
    return h+'</div>';
  }

  function viewRewards(){
    var x=xp(), r=rank(x);
    var h='<section class="card"><h3>Passport: '+city().name+'</h3><p class="why" style="margin:0 0 10px">Each stop you finish stamps a page.</p><div class="cases" style="--ink:'+INKS[Math.min(inkI,bestRank())].c+'">'+STOPS.map(function(s,i){
      return '<div class="case'+(S.done[i]?' got':'')+'"><div class="bbox lg">'+badge(s.id,S.done[i])+'</div><span class="nm">'+s.badge+'</span><span class="mono">'+(S.done[i]?'Stamped':'Blank page')+'</span></div>';
    }).join('')+'</div></section>';
    h+='<section class="card"><h3>'+city().explorer+'</h3><div class="master"><div class="bbox lg">'+badge('master',allDone())+'</div><p>'+(allDone()?'Earned. You found every stop in '+city().name+'.':'Earn all four badges to unlock it.')+'</p></div></section>';
    var br=bestRank();
    h+='<section class="card"><h3>Stamp ink</h3><p class="why" style="margin:0 0 8px">XP unlocks new inks for your stamps. Higher ranks in any town unlock more.</p><div class="inks" role="group" aria-label="Stamp ink">'+INKS.map(function(k,i){
      var open=i<=br;
      return '<button class="ink" data-a="ink" data-i="'+i+'" aria-pressed="'+(i===Math.min(inkI,br))+'"'+(open?'':' disabled')+' style="color:'+k.c+'"><i></i><span style="color:var(--ink)">'+(open?k.n:RANKS[i][0]+' XP')+'</span></button>';
    }).join('')+'</div></section>';
    h+='<section class="card"><h3>Rank</h3><ul class="ladder">'+RANKS.map(function(rk,i){
      return '<li class="'+(i<=r.i?'got':'')+'"><span>'+rk[1]+'</span><span class="mono">'+(i<=r.i?'Earned':rk[0]+' XP')+'</span></li>';
    }).join('')+'</ul></section>';
    h+='<section class="card"><h3>Save progress</h3><p>There are no accounts. To move your badges to another phone, copy this code there and paste it below.</p><div class="code"><input id="codeOut" readonly value="'+code()+'" aria-label="Progress code"><button class="btn small" data-a="copy">Copy</button></div>'
      +'<div class="code"><input id="codeIn" placeholder="Paste a code" aria-label="Paste a progress code" autocomplete="off" autocapitalize="characters" spellcheck="false"><button class="btn small ghost" data-a="restore">Restore</button></div><p id="codeMsg" class="why" aria-live="polite"></p></section>';
    h+='<section class="card"><h3>Start over</h3>'+(confirmReset?'<p>Erase every badge and all XP for '+city().name+' on this phone?</p><div class="row"><button class="btn" data-a="resetyes">Yes, erase</button><button class="btn ghost" data-a="resetno">Cancel</button></div>':'<button class="btn ghost" data-a="resetask">Reset progress</button>')+'</section>';
    return h;
  }

  function render(focusTitle){
    updateHeader();
    document.body.classList.toggle('ishome',atHome);
    var m=document.getElementById('main');
    m.setAttribute('aria-labelledby','tab-'+tab);
    if(boss&&(atHome||boss.pid!==cityId)) boss=null;
    if(boss) m.innerHTML=viewBoss();
    else if(atHome&&!cur) m.innerHTML=viewHome();
    else if(cur) m.innerHTML=viewStop();
    else if(tab==='trail') m.innerHTML=viewTrail();
    else if(tab==='cards') m.innerHTML=viewCards();
    else m.innerHTML=viewRewards();
    var bar=document.getElementById('bar');
    bar.hidden=!cur;
    document.body.classList.toggle('hasbar',!!cur);
    if(cur){
      var atRoot=cur.step<=cur.entry;
      document.getElementById('barBack').textContent='‹ Back';
      document.getElementById('barBack').setAttribute('aria-label',atRoot?('Back to '+(tab==='cards'?'Cards':'Trail')):'Back to previous step');
      document.getElementById('barExit').textContent=(tab==='cards'?'All cards':'All stops');
    }
    if(focusTitle){
      var t=document.getElementById('stopTitle');
      if(t) t.focus({preventScroll:true});
    }
  }

  /* ---------- navigation ---------- */
  function leave(){
    endDemo(); cur=null;
    if(pushed){
      pushed=false; ignorePop=true;
      try{ history.back(); }catch(e){ ignorePop=false; }
    }
  }
  function exitStop(){ leave(); render(); window.scrollTo(0,0); }
  function openStop(i,step){
    endDemo();
    var entry=(step!==undefined?step:(S.done[i]?2:0));
    cur={i:i,step:entry,entry:entry,wrong:[],picks:[],checked:false};
    if(!pushed){ try{ history.pushState({stop:1},'','#stop'); pushed=true; }catch(e){} }
    render(true); window.scrollTo(0,0);
  }
  function setStep(n){
    if(n>=2 && !S.done[cur.i]) return;
    cur.step=n; cur.checked=false; render(true); window.scrollTo(0,0);
  }
  function goBack(){
    if(!cur) return;
    if(cur.step>cur.entry) setStep(cur.step-1); else exitStop();
  }
  window.addEventListener('popstate',function(){
    if(ignorePop){ ignorePop=false; return; }
    if(cur){ pushed=false; cur=null; render(); window.scrollTo(0,0); }
  });

  document.addEventListener('click',function(e){
    var b=e.target.closest('[data-a]'); if(!b) return;
    var a=b.getAttribute('data-a');
    if(a==='home'){ goHome(); return; }
    if(a==='nextstop'){ openStop(+b.getAttribute('data-i'),0); return; }
    if(a==='bossgo'){ leave(); boss={pid:cityId,i:0,score:0,pick:null}; render(); window.scrollTo(0,0); return; }
    if(a==='boss'||a==='bossagain'){ boss={pid:cityId,i:0,score:0,pick:null}; render(); window.scrollTo(0,0); return; }
    if(a==='bossexit'){ boss=null; render(); window.scrollTo(0,0); return; }
    if(a==='bpick'){ if(boss&&boss.pick===null){ var qq=DATA.boss[boss.pid][boss.i], kk=+b.getAttribute('data-k'); boss.pick=kk; if(kk===qq.a){ boss.score++; boss.streak=(boss.streak||0)+1; } else boss.streak=0; render(); } return; }
    if(a==='bnext'){ if(boss){ boss.i++; boss.pick=null; if(boss.i>=DATA.boss[boss.pid].length) bossSave(boss.pid,boss.score); render(); window.scrollTo(0,0); } return; }
    if(a==='report'){ showReport(); return; }
    if(a==='repclose'){ closeReport(); return; }
    if(a==='repsend'){ sendReport(); return; }
    if(a==='tournext'){ if(tourI>=TOUR.length-1){ endTour(); } else { tourI++; showTour(); } return; }
    if(a==='tourskip'){ endTour(); return; }
    if(a==='celebclose'){ closeCeleb(); return; }
    if(a==='passport'){ closeCeleb(); goHome(); setTimeout(function(){ var p=document.getElementById('passport'); if(p&&p.scrollIntoView) p.scrollIntoView({behavior:'smooth',block:'start'}); },60); return; }
    if(a==='rregion'){ railRegion=b.getAttribute('data-r'); if(atHome) setHeroFocus({r:railRegion}); applyCity(); return; }
    if(a==='city'){ railRegion=null; setCity(b.getAttribute('data-c')); return; }
    if(a==='tab'){ boss=null; leave(); tab=b.getAttribute('data-t'); confirmReset=false; render(); window.scrollTo(0,0); return; }
    if(a==='open'){ var s=b.getAttribute('data-s'); openStop(+b.getAttribute('data-i'), s?+s:undefined); return; }
    if(a==='exit'){ exitStop(); return; }
    if(a==='goback'){ goBack(); return; }
    if(a==='demo'){ if(!S.done[cur.i]){ demoSnap={done:S.done.slice(),claims:S.claims.slice()}; demoC=S; cur.demo=1; cur.step=1; render(true); window.scrollTo(0,0);} return; }
    if(a==='step'){ setStep(+b.getAttribute('data-n')); return; }
    if(a==='pick'){
      var k=+b.getAttribute('data-k'), st=STOPS[cur.i];
      if(k===st.q.answer){
        if(cur.demo){ if(!S.done[cur.i]){ S.done[cur.i]=1; toast('Correct. Preview only, so no stamp is saved.'); } }
        else if(!S.done[cur.i]){ S.done[cur.i]=1; save(); toast('Badge earned: '+st.badge+'. +100 XP'); if(allDone()) setTimeout(celebrate,450); }
        cur.wrong=[]; render();
      } else {
        if(cur.wrong.indexOf(k)<0) cur.wrong.push(k);
        render();
      }
      return;
    }
    if(a==='ink'){ var ii=+b.getAttribute('data-i'); if(ii<=bestRank()){ inkI=ii; try{ localStorage.setItem('then-now-ink',String(ii)); }catch(e){} render(); } return; }
    if(a==='hpick'){ homeAnswer(+b.getAttribute('data-k')); return; }
    if(a==='fpick'){ factAnswer(+b.getAttribute('data-c'),+b.getAttribute('data-k')); return; }
    if(a==='cpick'){
      cur.picks[+b.getAttribute('data-c')]=+b.getAttribute('data-k'); cur.checked=false; render(); return;
    }
    if(a==='check'){
      var st2=STOPS[cur.i], gained=0, ok=0;
      st2.claims.forEach(function(c,ci){
        var gi=cur.i*2+ci;
        if(S.claims[gi]){ ok++; return; }
        if(cur.picks[ci]===c.a){ S.claims[gi]=1; gained+=25; ok++; }
      });
      cur.checked=true; save(); render();
      if(gained) toast('+'+gained+' XP');
      else if(ok<st2.claims.length) toast('Not yet. Try again.');
      return;
    }
    if(a==='copy'){
      var inp=document.getElementById('codeOut');
      var done=function(){ toast('Code copied'); };
      var fb=function(){ inp.focus(); inp.select(); toast('Code selected. Copy it manually.'); };
      try{ navigator.clipboard.writeText(code()).then(done,fb); }catch(err){ fb(); }
      return;
    }
    if(a==='restore'){
      var v=(document.getElementById('codeIn').value||'').trim().toUpperCase();
      var m1=/^TN1-([01]{4})([01]{8})$/.exec(v), m2=/^TN2-([01]{4})([01]{8})-([01]{4})([01]{8})$/.exec(v), m3=/^TN3-([01]{12}(?:-[01]{12})*)$/.exec(v), msg=document.getElementById('codeMsg');
      if(!m1 && !m2 && !m3){ msg.textContent='That code does not look right. It starts with TN3- (older TN1- and TN2- codes work too).'; return; }
      var arr=function(x){return x.split('').map(Number);};
      if(m1){ ALL.reno={done:arr(m1[1]),claims:arr(m1[2])}; }
      else if(m2){ ALL.reno={done:arr(m2[1]),claims:arr(m2[2])}; ALL.vc={done:arr(m2[3]),claims:arr(m2[4])}; }
      else {
        var segs=m3[1].split('-');
        if(segs.length>ORDER.length){ msg.textContent='That code has more towns than this version of the app. Update the app and try again.'; return; }
        segs.forEach(function(g,i){ ALL[ORDER[i]]={done:arr(g.slice(0,4)),claims:arr(g.slice(4))}; });
      }
      S=ALL[cityId]; save(); render(); toast('Progress restored'); return;
    }
    if(a==='resetask'){ confirmReset=true; render(); return; }
    if(a==='resetno'){ confirmReset=false; render(); return; }
    if(a==='resetyes'){ ALL[cityId]=blank(); S=ALL[cityId]; save(); confirmReset=false; render(); toast('Progress erased'); return; }
  });

  load(); applyCity(); render(); maybeTour();
})();
</script>
