once handled 58 trains a day.","map":"Union Station, 1000 W Broadway, Louisville, KY","clue":"Go to West Broadway, west of downtown. Look for the pale stone station with a tall clock tower, pointed turrets and a big round window.","safety":"Broadway is a busy road. Use crosswalks, and view the building from the public sidewalk. It is now a working office, so do not enter unless it is open.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"What kind of stone is the outside of the station made of?","options":["Limestone","Red brick","Marble","Granite"],"answer":0,"hint":"The stone came from quarries in Kentucky and Indiana.","verify":"Wikipedia says the exterior was limestone ashlar, mostly from Bowling Green, Kentucky. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"About 1906","label":"The station then","line":"A black-and-white view of the stone station with its tall clock tower and cobblestones and trolley wires in front.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"lv_us_then","by":"Detroit Publishing Co.","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Detroit_Publishing_-_Union_Station,_Louisville,_Ky..jpg","note":"resized"}},"now":{"yr":"2012","head":"Today","label":"The station today","line":"The same castle-like front in warm light, with the clock tower and turrets against a blue sky.","ph":{"k":"lv_us_now","by":"Nyttend","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Louisville_Union_Station.jpg","note":"resized"}},"story":["Louisville's Union Station was formally opened on September 7, 1891 by the Louisville and Nashville Railroad. At the time it was said to be the largest railroad station in the southern United States. Construction began in 1880 but ran over budget and was not finished until 1889 to 1891.","Architect Henry C. Wolters designed it in the Richardsonian Romanesque style, with a clock tower, smaller towers and turrets, and barrel-vaulted ceilings. Inside, the walls used marble from Georgia, plus oak and southern pine. A fire in July 1905 closed it until that December, and an 84-paneled stained glass skylight replaced the old rose-colored windows.","In the 1920s it served 58 trains a day, and special trains brought fans to the Kentucky Derby. Today it is no longer a train station. Since 1980 it has been offices for the city's transit agency, TARC."],"fact":"Derby fans took special trains straight to this station.","disputed":"Many people think old stations always stay train stations. Wikipedia says this one has been transit agency offices since 1980.","claims":[{"t":"Union Station opened in 1891.","a":0,"why":"Wikipedia: formally opened on September 7, 1891."},{"t":"Union Station is still Louisville's main passenger train station.","a":2,"why":"Wikipedia says it has served as TARC offices since 1980."}],"sources":[{"t":"Wikipedia: Union Station (Louisville, Kentucky)","u":"https://en.wikipedia.org/wiki/Union_Station_(Louisville,_Kentucky)"},{"t":"Wikipedia: Louisville and Nashville Railroad","u":"https://en.wikipedia.org/wiki/Louisville_and_Nashville_Railroad"}],"card":{"a":"1891","b":"1980","la":"Station opens","lb":"Becomes offices"}},{"id":"galt","name":"Galt House","short":"Galt House","badge":"Galt House","tag":"Stop 4 of 4","teaser":"A hotel name passed down through three buildings and one disputed meeting.","map":"Galt House Hotel, 140 N 4th Street, Louisville, KY","clue":"Go to the riverfront on Fourth Street, next to the Ohio River. Look for the two tall towers with a glass walkway between them and a big GALT sign.","safety":"The riverfront is busy with cars and walkers. Use crosswalks and stay back from the river's edge.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"Which famous novelist called the original Galt House a splendid hotel?","options":["Jane Austen","Herman Melville","Charles Dickens","Mark Twain"],"answer":2,"hint":"He wrote A Christmas Carol and Oliver Twist.","verify":"Wikipedia says Charles Dickens called the Galt House \"a splendid hotel\". Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"1891","label":"The old Galt House then","line":"An 1891 printed drawing of the large corner hotel with rows of windows. This is the second Galt House, which is no longer standing.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"lv_gh_then","by":"Unknown artist (1891 print)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:US-KY(1891)_p288_LOUISVILLE,_GALT_HOUSE.jpg","note":"resized, cropped"}},"now":{"yr":"2023","head":"Today","label":"The Galt House today","line":"The tall dark tower with GALT on top, rising beside a glass walkway and other riverfront buildings.","ph":{"k":"lv_gh_now","by":"Jeremy Thompson","lic":"CC BY 2.0","lu":"https://creativecommons.org/licenses/by/2.0/","page":"https://commons.wikimedia.org/wiki/File:Galt_House_2023.jpg","note":"resized"}},"story":["Three hotels have carried the Galt House name. The first opened in 1835 with 60 rooms and burned down in 1865. A larger second Galt House, designed by Henry Whitestone, opened in 1869 on First and Main and was the center of social life in Louisville. It closed in 1919 and was torn down in 1921.","Guests of the earlier hotels included Charles Dickens, who called it \"a splendid hotel\", and presidents Ulysses S. Grant and Theodore Roosevelt. The current Galt House was built in 1972 as part of the riverfront urban renewal project. It has a 25-story tower, an East Tower added in 1984 and 1,310 rooms, the most of any hotel in Kentucky.","A historical marker says that in March 1864, generals Grant and Sherman met at the original Galt House to plan a big campaign. Wikipedia says that as of 2014, that claim has fallen into dispute."],"fact":"The current Galt House is the only hotel in the city that sits on the Ohio River.","disputed":"Many people trust a historical marker as the final word. Wikipedia says the claim about Grant and Sherman meeting here has fallen into dispute.","claims":[{"t":"Charles Dickens stayed at the original Galt House.","a":0,"why":"Wikipedia: he was a noted guest of the original Galt House."},{"t":"The 1869 Galt House is still standing.","a":2,"why":"It was demolished in 1921."}],"sources":[{"t":"Wikipedia: Galt House","u":"https://en.wikipedia.org/wiki/Galt_House"},{"t":"Wikipedia: Louisville","u":"https://en.wikipedia.org/wiki/Louisville,_Kentucky"}],"card":{"a":"1835","b":"1972","la":"First Galt House opens","lb":"Current hotel opens"}}],"heroKey":"lv_cd_now"},"newport":{"id":"newport","name":"Newport","explorer":"Seaside Explorer","initials":"NPT","ranks":[[0,"Visitor"],[100,"Harbor Walker"],[250,"Landmark Hunter"],[450,"Newport Scholar"],[600,"Newport Historian"]],"heroAlt":"The Breakers mansion","heroLi":"<li>Header: UpstateNYer · CC BY-SA 3.0 · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:The_Breakers_Newport.jpg\">Source</a> · resized</li>","heroCredit":"Photo: UpstateNYer · <a target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by-sa/3.0/\">CC BY-SA 3.0</a> · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:The_Breakers_Newport.jpg\">Source</a>","mission":"Find four landmarks around Newport. At each one, check in to earn its badge, unlock its story, and collect a Time Card. Do them in any order. Everything stays on this phone.","afterDone":"All four badges earned. The rest of Newport is waiting.","safetyNote":"<li>Newport has narrow streets, summer traffic and a cliff path beside the sea. Stay on the marked path, keep well back from edges and wet rock, and skip the walk in rough weather.</li>","badgeMap":{"breakers":["nw_br_now","50% 45%"],"cliff":["nw_fs_now","50% 45%"],"casino":["nw_ca_now","50% 45%"],"mill":["nw_sm_now","50% 45%"]},"level":"Classics","region":"The East","stops":[{"id":"breakers","name":"The Breakers","short":"The Breakers","badge":"The Breakers","tag":"Stop 1 of 4","teaser":"A Gilded Age summer 'cottage' with a fireproof frame.","map":"The Breakers, Ochre Point Avenue, Newport, RI","clue":"Go to Ochre Point Avenue. Look for the huge stone mansion with red tile roofs and rows of arches facing a wide green lawn.","safety":"Ochre Point Avenue has traffic and no wide sidewalk in places. Use the public sidewalk, and do not go past the gates unless you have a ticket.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"What was the new mansion built to resist, after the old one burned down?","options":["Termites","Fire","Floods","Earthquakes"],"answer":1,"hint":"Think about what happened to the first house in 1892.","verify":"Wikipedia says the earlier mansion burned in November 1892 and the new one was built fireproof, with masonry and steel. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"About 1900","label":"The mansion then","line":"A colored postcard view of the broad stone mansion with a long green lawn in front of it.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"nw_br_then","by":"Detroit Publishing Company (NYPL scan)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Breakers,_Vanderbilt_Residence,_Newport,_R._I_(NYPL_b12647398-67507).tiff","note":"resized, cropped"}},"now":{"yr":"2009","head":"Today","label":"The mansion today","line":"The same stone mansion with red roofs and chimneys, in bright sun over a clipped lawn.","ph":{"k":"nw_br_now","by":"UpstateNYer","lic":"CC BY-SA 3.0","lu":"https://creativecommons.org/licenses/by-sa/3.0/","page":"https://commons.wikimedia.org/wiki/File:The_Breakers_Newport.jpg","note":"resized"}},"story":["The Breakers was built between 1893 and 1895 for Cornelius Vanderbilt II. Richard Morris Hunt designed it, and the family used it as a summer home.","The Vanderbilts had an earlier mansion on the site, but it burned on November 25, 1892. So the new house was built to be fireproof, using masonry and steel.","Today the house is owned by the Preservation Society of Newport County. It was listed on the National Register of Historic Places in 1971 and became a National Historic Landmark in 1994."],"fact":"The Breakers was built after the first mansion on the site burned in November 1892.","disputed":"Many people picture the mansion as a century-old cottage that was always here. Wikipedia says the first house on the site burned in 1892.","claims":[{"t":"The Breakers was designed by Richard Morris Hunt.","a":0,"why":"Wikipedia: designed by Richard Morris Hunt."},{"t":"The first mansion on the site is the one standing today.","a":2,"why":"Wikipedia says the earlier mansion burned on November 25, 1892."}],"sources":[{"t":"Wikipedia: The Breakers","u":"https://en.wikipedia.org/wiki/The_Breakers"},{"t":"Wikipedia: Newport, Rhode Island","u":"https://en.wikipedia.org/wiki/Newport,_Rhode_Island"}],"card":{"a":"1892","b":"1895","la":"The first house burns","lb":"The new Breakers is built"}},{"id":"cliff","name":"Cliff Walk","short":"Cliff Walk","badge":"Cliff Walk","tag":"Stop 2 of 4","teaser":"A public path along the sea that the mansion owners kept trying to block.","map":"Cliff Walk, Newport, RI","clue":"Go to the Forty Steps, a stone stairway that leads down toward the water from the Cliff Walk, near Narragansett Avenue. Look for the path along the cliff edge with the ocean on one side.","safety":"Parts of the path are rough, narrow and uneven, and sections have collapsed in storms. Stay on the marked path, keep back from the edge, and do not climb on the rocks.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"How long is the Cliff Walk?","options":["12 miles","40 feet","About 100 miles","3.5 miles"],"answer":3,"hint":"It is a walk, not a hike.","verify":"Wikipedia says the Cliff Walk is a 3.5-mile (5.6 km) public access walkway. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"About 1900","label":"The shore then","line":"A colored postcard of grassy cliffs and rocks beside calm water, with a path running along the edge.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"nw_fs_then","by":"Detroit Publishing Company (NYPL scan)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Forty_Steps,_Cliff_Walk,_Newport,_R._I_(NYPL_b12647398-66771).tiff","note":"resized, cropped"}},"now":{"yr":"2011","head":"Today","label":"The steps today","line":"A stone stairway running toward the water, with FORTY STEPS carved into the walkway.","ph":{"k":"nw_fs_now","by":"Darkshaed","lic":"CC BY-SA 4.0","lu":"https://creativecommons.org/licenses/by-sa/4.0/","page":"https://commons.wikimedia.org/wiki/File:Newport_Forty_Steps.jpg","note":"resized"}},"story":["The Newport Cliff Walk is a 3.5-mile (5.6 km) public path along the shore. It is a National Recreation Trail, the first in New England, and it gives views of mansions such as The Breakers and Marble House.","The right to walk the shore goes back to 1663, when the charter from King Charles II promised Rhode Island colonists the right to fish along the shoreline. Around 1880, mansion owners began building a simple path in sections.","Over the years, wealthy owners sometimes put up fences, boulders or walls to block the path. Storms have also damaged it: in October 2012, Hurricane Sandy washed away large sections, and it did not reopen until June 2014."],"fact":"The Cliff Walk was the first National Recreation Trail in New England.","disputed":"Many people think the mansion owners built the walk to welcome the public. Wikipedia says they sometimes put up fences, boulders and walls to block it.","claims":[{"t":"The Cliff Walk is a National Recreation Trail.","a":0,"why":"Wikipedia: the first in New England."},{"t":"Hurricane Sandy did no damage to the Cliff Walk.","a":2,"why":"Wikipedia says it washed away large sections in October 2012."}],"sources":[{"t":"Wikipedia: Newport Cliff Walk","u":"https://en.wikipedia.org/wiki/Newport_Cliff_Walk"},{"t":"Wikipedia: Newport, Rhode Island","u":"https://en.wikipedia.org/wiki/Newport,_Rhode_Island"}],"card":{"a":"1663","b":"2014","la":"Shore access promised","lb":"Walk reopens after Sandy"}},{"id":"casino","name":"Newport Casino","short":"Newport Casino","badge":"Newport Casino","tag":"Stop 3 of 4","teaser":"A shingled social club that hosted the first U.S. lawn tennis championships.","map":"Newport Casino, 180-200 Bellevue Avenue, Newport, RI","clue":"Go to Bellevue Avenue in the center of town. Look for the green and brown shingled building with striped awnings and a row of small shops at street level.","safety":"Bellevue Avenue is busy with cars and walkers. Use crosswalks, and view the building from the public sidewalk.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"Which sport's first U.S. championships were played at the Newport Casino?","options":["Lawn tennis","Baseball","Golf","Croquet"],"answer":0,"hint":"Today the site is home to a hall of fame for this sport.","verify":"Wikipedia says the Casino was the site of the first U.S. lawn tennis championships and is home to the International Tennis Hall of Fame. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"About 1900","label":"The Casino then","line":"A colored postcard of a grassy court surrounded by shingled buildings with balconies.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"nw_ca_then","by":"Detroit Publishing Company (NYPL scan)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Court_of_the_Casino,_Newport,_R._I_(NYPL_b12647398-68122).tiff","note":"resized, cropped"}},"now":{"yr":"2008","head":"Today","label":"The Casino today","line":"The shingled front with green trim, striped awnings and small shops, seen from across the street.","ph":{"k":"nw_ca_now","by":"Daniel Case","lic":"CC BY-SA 3.0","lu":"https://creativecommons.org/licenses/by-sa/3.0/","page":"https://commons.wikimedia.org/wiki/File:Newport_Casino.jpg","note":"resized"}},"story":["James Gordon Bennett Jr. had the Newport Casino built between 1879 and 1881 as a social club. The architects were McKim, Mead & White, and it opened in July 1880. It is a leading example of the Shingle style.","It was the site of the first U.S. lawn tennis championships, and the Tennis Hall of Fame has been here since 1954.","The Casino was designated a National Historic Landmark in 1987."],"fact":"The Newport Casino hosted the first U.S. lawn tennis championships.","disputed":"Many people hear 'casino' and picture slot machines. Wikipedia says this was a social club that opened in 1880.","claims":[{"t":"The Newport Casino opened in 1880.","a":0,"why":"Wikipedia: opened in July 1880."},{"t":"The Newport Casino was built as a gambling hall.","a":2,"why":"Wikipedia describes it as a social club for Newport's summer crowd."}],"sources":[{"t":"Wikipedia: Newport Casino","u":"https://en.wikipedia.org/wiki/Newport_Casino"},{"t":"Wikipedia: Newport, Rhode Island","u":"https://en.wikipedia.org/wiki/Newport,_Rhode_Island"}],"card":{"a":"1880","b":"1954","la":"Casino opens","lb":"Tennis Hall of Fame arrives"}},{"id":"mill","name":"Old Stone Mill","short":"Old Stone Mill","badge":"Old Stone Mill","tag":"Stop 4 of 4","teaser":"A round stone tower in a park that people have argued about for centuries.","map":"Touro Park, Newport, RI","clue":"Go to Touro Park, near Bellevue Avenue. Look for the round stone tower standing on arches in the middle of the park.","safety":"The tower is fenced, so look from the path. Do not climb on it or the fence.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"What is the best-supported explanation for what the tower was?","options":["A fort","A church","A windmill","A lighthouse"],"answer":2,"hint":"Look at the name people call it, then look at its shape.","verify":"Wikipedia says carbon-14 testing points to a 17th-century windmill. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"1895","label":"The tower then","line":"A black-and-white photo of the round stone tower on arches, behind an iron fence, with bare trees nearby.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"nw_sm_then","by":"Unknown author","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Newport-Tower-RI-1894.jpg","note":"resized"}},"now":{"yr":"2017","head":"Today","label":"The tower today","line":"The same round tower seen from below its arches, with a small building visible through the opening.","ph":{"k":"nw_sm_now","by":"Kacey Victoria","lic":"CC BY-SA 4.0","lu":"https://creativecommons.org/licenses/by-sa/4.0/","page":"https://commons.wikimedia.org/wiki/File:The_Old_Stone_Mill.jpg","note":"resized"}},"story":["The Old Stone Mill, also called the Newport Tower, stands in Touro Park. It is about 28 feet (8.5 m) tall and about 22 to 23 feet across.","For a long time people argued about who built it, and some guessed it was Viking. Wikipedia says carbon-14 testing indicates it is the remains of a 17th-century windmill.","A document from 1741 already calls it 'the old stone mill'. It is a good example of an old mystery with a well-tested answer."],"fact":"A document from 1741 already called the tower 'the old stone mill'.","disputed":"Many people repeat the Viking story. Wikipedia says carbon-14 testing indicates a 17th-century windmill.","claims":[{"t":"The tower stands in Touro Park.","a":0,"why":"Wikipedia: located in Touro Park."},{"t":"Scientific testing proved the tower was built by Vikings.","a":2,"why":"Wikipedia says carbon-14 testing points to a 17th-century windmill."}],"sources":[{"t":"Wikipedia: Newport Tower (Rhode Island)","u":"https://en.wikipedia.org/wiki/Newport_Tower_(Rhode_Island)"},{"t":"Wikipedia: Newport, Rhode Island","u":"https://en.wikipedia.org/wiki/Newport,_Rhode_Island"}],"card":{"a":"1741","b":"1895","la":"Called 'the old stone mill'","lb":"Photographed with an iron fence"}}],"heroKey":"nw_br_now"},"knoxville":{"id":"knoxville","name":"Knoxville","explorer":"Holston Explorer","initials":"TYS","ranks":[[0,"Visitor"],[100,"Street Walker"],[250,"Landmark Hunter"],[450,"Knoxville Scholar"],[600,"Knoxville Historian"]],"heroAlt":"Gay Street","heroLi":"<li>Header: Brian Stansberry · CC BY 3.0 · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:South-gay-street-knoxville-tn1.jpg\">Source</a> · resized</li>","heroCredit":"Photo: Brian Stansberry · <a target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by/3.0/\">CC BY 3.0</a> · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:South-gay-street-knoxville-tn1.jpg\">Source</a>","mission":"Find four landmarks around Knoxville. At each one, check in to earn its badge, unlock its story, and collect a Time Card. Do them in any order. Everything stays on this phone.","afterDone":"All four badges earned. The rest of Knoxville is waiting.","safetyNote":"<li>Downtown Knoxville has busy streets, rail crossings and a viaduct. Use crosswalks and sidewalks, and stay off the railroad tracks.</li>","badgeMap":{"station":["kx_st_now","50% 45%"],"gay":["kx_gy_now","50% 45%"],"blount":["kx_bm_now","50% 45%"],"customs":["kx_ch_now","50% 45%"]},"level":"Classics","region":"The South","stops":[{"id":"station","name":"Southern Terminal","short":"Southern Terminal","badge":"Southern Terminal","tag":"Stop 1 of 4","teaser":"A railroad station that sits 15 feet below the street.","map":"Southern Terminal, 306 W Depot Avenue, Knoxville, TN","clue":"Go to the corner of Gay Street and Depot Avenue. Look for the old station with stepped gables and a low roof, set below street level beside the tracks.","safety":"Active railroad tracks run beside the station. Stay on the sidewalk, never cross or walk on the tracks, and obey the crossing signals.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"Who built the Southern Terminal in 1903?","options":["A hotel chain","The federal government","Southern Railway","The city"],"answer":2,"hint":"The name of the railroad is part of the building's name.","verify":"Wikipedia says the complex was built in 1903 by the Southern Railway. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"About 1906","label":"The station then","line":"A black-and-white view of the station with a clock tower, a railing and the street's utility poles in the foreground.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"kx_st_then","by":"Detroit Publishing Company","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Knoxville-southern-railway-terminal-tn1906.jpg","note":"resized"}},"now":{"yr":"2010","head":"Today","label":"The station today","line":"The same station seen from the street, with stepped gables over its tan walls.","ph":{"k":"kx_st_now","by":"Brian Stansberry","lic":"CC BY 3.0","lu":"https://creativecommons.org/licenses/by/3.0/","page":"https://commons.wikimedia.org/wiki/File:Southern-terminal-ne-tn1.jpg","note":"resized"}},"story":["The Southern Terminal is a former railway complex at 306 West Depot Avenue. Southern Railway built it in 1903, and architect Frank Pierce Milburn designed both the terminal and the express depot.","It sits in a natural declivity about 15 feet (4.6 m) below the street levels. The railroad changed Knoxville: in the 1850s it helped turn a river town of just over 2,000 people into a major wholesale center.","In 1985 the terminal complex and dozens of nearby warehouses and storefronts were listed on the National Register of Historic Places."],"fact":"The Southern Terminal sits about 15 feet below the street levels around it.","disputed":"Many people think railroads only moved passengers. Wikipedia says they helped turn Knoxville into a wholesaling center.","claims":[{"t":"The Southern Terminal was designed by Frank Pierce Milburn.","a":0,"why":"Wikipedia: designed by noted station architect Frank Pierce Milburn."},{"t":"The railroad had no effect on Knoxville's growth.","a":2,"why":"Wikipedia says it transformed Knoxville from a small river town into a wholesaling center."}],"sources":[{"t":"Wikipedia: Southern Terminal (Knoxville, Tennessee)","u":"https://en.wikipedia.org/wiki/Southern_Terminal_(Knoxville,_Tennessee)"},{"t":"Wikipedia: Knoxville, Tennessee","u":"https://en.wikipedia.org/wiki/Knoxville,_Tennessee"}],"card":{"a":"1903","b":"1985","la":"Terminal is built","lb":"Historic district is listed"}},{"id":"gay","name":"Gay Street","short":"Gay Street","badge":"Gay Street","tag":"Stop 2 of 4","teaser":"The main street Knoxville has used since the 1790s.","map":"South Gay Street, Knoxville, TN","clue":"Go to South Gay Street, south of the railroad tracks. Look for rows of old brick buildings on both sides and the river valley beyond.","safety":"Gay Street is busy with cars and walkers. Use crosswalks and stay on the sidewalk.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"In 1854, what did Gay Street become in Knoxville?","options":["The first paved road","The first railroad","The first canal","The first bridge"],"answer":0,"hint":"Think about the street surface under a carriage.","verify":"Wikipedia says that in 1854 Gay Street became Knoxville's first paved road. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"About 1903","label":"The street then","line":"A black-and-white view down the street with tall brick storefronts on the left and poles with wires on the right.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"kx_gy_then","by":"Detroit Publishing Company","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Gay-street-knoxville-1903-tn1.jpg","note":"resized"}},"now":{"yr":"2010","head":"Today","label":"The street today","line":"The same street lined with brick buildings, with a modern glass tower and green hills at the far end.","ph":{"k":"kx_gy_now","by":"Brian Stansberry","lic":"CC BY 3.0","lu":"https://creativecommons.org/licenses/by/3.0/","page":"https://commons.wikimedia.org/wiki/File:South-gay-street-knoxville-tn1.jpg","note":"resized"}},"story":["Gay Street was part of Charles McClung's original 1791 plat of Knoxville. It has served as the city's main financial and commercial street since the 1790s.","By 1850 it held three-fourths of the city's commercial activity, and in 1854 it became Knoxville's first paved road. On the eve of the Civil War, both Union and Confederate recruiting rallies were held on it at the same time.","After the war the railroad brought an industrial boom. Buildings along the street include the Bijou Theatre (1909), the Riviera Theatre (1920) and the Tennessee Theatre (1928)."],"fact":"In 1854, Gay Street became Knoxville's first paved road.","disputed":"Many people think a street's name tells its story. Wikipedia lists this street's real milestones, like paving in 1854.","claims":[{"t":"Gay Street was part of the original 1791 plat of Knoxville.","a":0,"why":"Wikipedia: part of Charles McClung's 1791 plat."},{"t":"Gay Street was paved before 1800.","a":2,"why":"Wikipedia says paving came in 1854."}],"sources":[{"t":"Wikipedia: Gay Street (Knoxville)","u":"https://en.wikipedia.org/wiki/Gay_Street_(Knoxville)"},{"t":"Wikipedia: Knoxville, Tennessee","u":"https://en.wikipedia.org/wiki/Knoxville,_Tennessee"}],"card":{"a":"1791","b":"1854","la":"Original plat","lb":"First paved road"}},{"id":"blount","name":"Blount Mansion","short":"Blount Mansion","badge":"Blount Mansion","tag":"Stop 3 of 4","teaser":"A wooden house once slated to become a parking lot.","map":"Blount Mansion, 200 W Hill Avenue, Knoxville, TN","clue":"Go to West Hill Avenue, between Gay Street and State Street. Look for the white wooden house with a big brick chimney, set back on a lawn.","safety":"Hill Avenue has traffic. Use crosswalks, and enter only during museum hours.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"Which important document was largely drafted at the mansion in 1796?","options":["The Declaration of Independence","The Bill of Rights","The Emancipation Proclamation","The Tennessee Constitution"],"answer":3,"hint":"William Blount lived here as governor of a territory.","verify":"Wikipedia says much of the Tennessee Constitution was drafted in Governor Blount's office at the mansion. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"1934","label":"The house then","line":"A black-and-white survey photo of the white wooden house with a tall chimney and a bare yard.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"kx_bm_then","by":"R. J. Crisco (HABS)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Blount-mansion-1934-habs-tn1.jpg","note":"resized"}},"now":{"yr":"2008","head":"Today","label":"The house today","line":"The white house and chimney behind a garden path and bench, with red shutters on the windows.","ph":{"k":"kx_bm_now","by":"Brian Stansberry","lic":"CC BY 3.0","lu":"https://creativecommons.org/licenses/by/3.0/","page":"https://commons.wikimedia.org/wiki/File:Blount-mansion-knoxville-tn1.jpg","note":"resized"}},"story":["The Blount Mansion was the home of William Blount, the only territorial governor of the Southwest Territory, a signer of the U.S. Constitution and a U.S. senator from Tennessee. It served as the de facto capitol of the territory, and much of the Tennessee Constitution was drafted in his office here in 1796.","The house is a wood-frame home with wood siding, built with materials brought from North Carolina, in a time when most homes in Tennessee were log cabins. Blount lived there with his family and ten enslaved African-American people.","By 1925 the house had deteriorated, and a developer planned to demolish it for a parking lot for the new Andrew Johnson Hotel. A publicity campaign saved it, and the Blount Mansion Association bought it in 1930 and still runs it as a museum."],"fact":"Blount Mansion was built with materials brought from North Carolina, when most Tennessee homes were log cabins.","disputed":"Many people assume old landmarks were always protected. Wikipedia says this one was nearly demolished for a hotel parking lot in 1925.","claims":[{"t":"Blount Mansion was built with materials brought from North Carolina.","a":0,"why":"Wikipedia says so."},{"t":"The mansion was always protected from demolition.","a":2,"why":"Wikipedia says a developer planned to demolish it in 1925."}],"sources":[{"t":"Wikipedia: William Blount Mansion","u":"https://en.wikipedia.org/wiki/William_Blount_Mansion"},{"t":"Wikipedia: William Blount","u":"https://en.wikipedia.org/wiki/William_Blount"}],"card":{"a":"1796","b":"1930","la":"Constitution drafted here","lb":"Association buys the house"}},{"id":"customs","name":"Old Customs House","short":"Old Customs House","badge":"Old Customs House","tag":"Stop 4 of 4","teaser":"The city's first federal building, now a history center.","map":"Old Customs House, corner of Clinch Avenue and Market Street, Knoxville, TN","clue":"Go to the corner of Clinch Avenue and Market Street. Look for the pale three-story marble building with rows of arched windows and rough stone corners.","safety":"Use crosswalks at the busy intersection and view the building from the sidewalk. It is a museum, so enter only during opening hours.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"What kind of stone covers the outside of the Old Customs House?","options":["Concrete block","East Tennessee marble","Red brick","Wood siding"],"answer":1,"hint":"The stone comes from the same region as the building.","verify":"Wikipedia says the Italianate building is sheathed in East Tennessee marble. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"About 1906","label":"The building then","line":"A black-and-white photo of the three-story building with arched windows, with utility poles on both sides.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"kx_ch_then","by":"Detroit Publishing Company","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Customs-house-knoxville-tn1906.jpg","note":"resized"}},"now":{"yr":"2010","head":"Today","label":"The building today","line":"The same marble building with a rounded entrance, seen on a sunny corner with tall buildings behind.","ph":{"k":"kx_ch_now","by":"Brian Stansberry","lic":"CC BY 3.0","lu":"https://creativecommons.org/licenses/by/3.0/","page":"https://commons.wikimedia.org/wiki/File:Old-knoxville-post-office-custom-house-tn1.jpg","note":"resized"}},"story":["The Old Customs House, also called the Old Post Office, was completed in 1874 and was Knoxville's first federal building. It held federal courts, excise offices and the post office until 1933.","It is a three-story Italianate building sheathed in East Tennessee marble, designed by U.S. government chief architect Alfred B. Mullett. As the city's population quadrupled, the building became crowded and was enlarged in 1910.","From 1936 to 1976 it housed Tennessee Valley Authority offices. Since its 2004 expansion it has been home to the East Tennessee History Center."],"fact":"Knoxville's population quadrupled in the late 19th century, which is why the Customs House was enlarged in 1910.","disputed":"Many people picture a quiet small town. Wikipedia says Knoxville's population quadrupled in the late 19th century.","claims":[{"t":"The Old Customs House was completed in 1874.","a":0,"why":"Wikipedia: completed in 1874."},{"t":"It has always been a history center.","a":2,"why":"Wikipedia says it held courts and a post office, then TVA offices, before the history center."}],"sources":[{"t":"Wikipedia: Old Customs House (Knoxville, Tennessee)","u":"https://en.wikipedia.org/wiki/Old_Customs_House_(Knoxville,_Tennessee)"},{"t":"Wikipedia: Knoxville, Tennessee","u":"https://en.wikipedia.org/wiki/Knoxville,_Tennessee"}],"card":{"a":"1874","b":"2004","la":"Building completed","lb":"History center expansion"}}],"heroKey":"kx_gy_now"},"portlandme":{"id":"portlandme","name":"Portland, Maine","explorer":"Casco Bay Explorer","initials":"PWM","rank  Borglum","Franklin Simmons"],"answer":3,"hint":"He started the design in 1885, three years after the poet died.","verify":"Wikipedia says Franklin Simmons began the design in 1885. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"1906","label":"The square then","line":"A colored postcard of the statue at the left, with a church tower and trees across a dusty square.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"pm_lm_then","by":"Hugh C. Leighton","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Longfellow_Square,_Portland,_ME.jpg","note":"resized"}},"now":{"yr":"2010","head":"Today","label":"The statue today","line":"The seated bronze statue on its granite base, seen from below against a blue sky.","ph":{"k":"pm_lm_now","by":"Namiba","lic":"CC BY-SA 3.0","lu":"https://creativecommons.org/licenses/by-sa/3.0/","page":"https://commons.wikimedia.org/wiki/File:LongfellowMonument1.jpg","note":"resized"}},"story":["The Henry Wadsworth Longfellow Monument stands on a triangular plaza at Congress and State Streets, in Portland's West End. The intersection is called Longfellow Square.","Sculptor Franklin Simmons began the design in 1885, three years after Longfellow's death, and the pedestal was designed by Francis H. Fassett. The monument was unveiled on September 29, 1888.","The bronze statue is about 7 feet (2.1 m) tall. It shows the poet late in life, seated in a chair with lion-head arms and a stack of books beneath it. It was added to the National Register of Historic Places in 1990."],"fact":"The Longfellow statue shows the poet late in life, seated with a stack of books under his chair.","disputed":"Many people picture a famous poet as young. Wikipedia says the statue shows him as he looked late in life.","claims":[{"t":"The monument was unveiled in 1888.","a":0,"why":"Wikipedia: unveiled on September 29, 1888."},{"t":"The statue shows Longfellow as a young boy.","a":2,"why":"Wikipedia says it shows him late in life."}],"sources":[{"t":"Wikipedia: Henry Wadsworth Longfellow Monument","u":"https://en.wikipedia.org/wiki/Henry_Wadsworth_Longfellow_Monument"},{"t":"Wikipedia: Portland, Maine","u":"https://en.wikipedia.org/wiki/Portland,_Maine"}],"card":{"a":"1885","b":"1888","la":"Design begins","lb":"Monument unveiled"}},{"id":"observatory","name":"Portland Observatory","short":"Portland Observatory","badge":"Portland Observatory","tag":"Stop 2 of 4","teaser":"A seven-story wooden tower that helped ships talk to shore.","map":"Portland Observatory, 138 Congress Street, Portland, ME","clue":"Go to Munjoy Hill at the top of Congress Street. Look for the tall red eight-sided tower with a small cupola on top.","safety":"Congress Street has traffic. Use crosswalks, stay on the sidewalk, and enter only when it is open as a museum.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"What was the tower used for when it was built in 1807?","options":["Lighting a lighthouse beam","Spotting ships from the harbor","Sending mail","Storing grain"],"answer":1,"hint":"The harbor's ships were not visible from the wharfs.","verify":"Wikipedia says it let merchants see incoming ships with a telescope and signal flags. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"About 1910","label":"The tower then","line":"A black-and-white postcard view of the tall tower rising behind bare trees and houses.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"pm_ob_then","by":"Unknown photographer","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Observatory,_Portland,_ME.jpg","note":"resized"}},"now":{"yr":"2013","head":"Today","label":"The tower today","line":"The red tower beside a brick fire station, seen down a wide street.","ph":{"k":"pm_ob_now","by":"Magicpiano","lic":"CC BY-SA 4.0","lu":"https://creativecommons.org/licenses/by-sa/4.0/","page":"https://commons.wikimedia.org/wiki/File:PortlandME_MunjoyHillFireStation_and_Observatory.jpg","note":"resized"}},"story":["Ships entering Portland's harbor could not be seen directly from the wharfs, which made it hard for merchants to prepare for cargoes. In 1807, Captain Lemuel Moody organized the construction of an observatory on Munjoy Hill.","The tower is 86 feet (26 m) tall, has seven stories, and is octagonal to lessen wind pressure. Using a telescope and signal flags, people could talk to ships hours before they reached the docks. It is the only known surviving tower of its type in the United States.","It was designated a National Historic Landmark in 2006 and is now managed by Greater Portland Landmarks as a museum."],"fact":"The Portland Observatory is the only known surviving tower of its type in the United States.","disputed":"Many people assume an 'observatory' watches the sky. Wikipedia says this one watched ships.","claims":[{"t":"The Portland Observatory was built in 1807.","a":0,"why":"Wikipedia: built in 1807."},{"t":"The Observatory was built for studying stars.","a":2,"why":"Wikipedia calls it a maritime signal tower."}],"sources":[{"t":"Wikipedia: Portland Observatory","u":"https://en.wikipedia.org/wiki/Portland_Observatory"},{"t":"Wikipedia: Portland, Maine","u":"https://en.wikipedia.org/wiki/Portland,_Maine"}],"card":{"a":"1807","b":"2006","la":"Tower is built","lb":"National Historic Landmark"}},{"id":"house","name":"Wadsworth-Longfellow House","short":"Wadsworth-Longfellow House","badge":"Wadsworth-Longfellow House","tag":"Stop 3 of 4","teaser":"The oldest standing building on the peninsula, and a poet's childhood home.","map":"Wadsworth-Longfellow House, 489 Congress Street, Portland, ME","clue":"Go to 489 Congress Street. Look for the brick house with green shutters and a small columned porch, set close to the street.","safety":"Congress Street has traffic and a narrow sidewalk. Use crosswalks, and enter only when it is open as a museum.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"What was the house the first of in Portland?","options":["Wooden fort","Steel bridge","Wholly brick dwelling","Stone church"],"answer":2,"hint":"It was built by Peleg Wadsworth in 1785 and 1786.","verify":"Wikipedia says it was the first wholly brick dwelling in Portland. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"About 1905","label":"The house then","line":"A colored postcard of the red brick house among trees, with a round portrait of the poet in the corner.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"pm_wh_then","by":"Detroit Publishing Company (NYPL scan)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Wadsworth_Longfellow_House,_Portland,_Me_(NYPL_b12647398-69938).tiff","note":"resized, cropped"}},"now":{"yr":"2018","head":"Today","label":"The house today","line":"The front of the brick house with its columned porch, rows of windows and green shutters.","ph":{"k":"pm_wh_now","by":"Daderot","lic":"CC0","lu":"https://creativecommons.org/publicdomain/zero/1.0/","page":"https://commons.wikimedia.org/wiki/File:Wadsworth-Longfellow_House_-_Portland,_Maine_-_DSC03903.jpg","note":"resized"}},"story":["The Wadsworth-Longfellow House was built by Revolutionary War General Peleg Wadsworth between 1785 and 1786. It was the first wholly brick dwelling in Portland and is the oldest standing structure on the Portland peninsula.","Henry Wadsworth Longfellow was born in 1807 at his aunt's house nearby. He moved into this house at eight months old and spent the next 35 years there. The Longfellows added the third story in 1815.","Anne Longfellow Pierce, the last family member to live in the house, kept it much as it was. When she died in 1901, her will gave it to the Maine Historical Society, which opened it to the public the next year."],"fact":"The Wadsworth-Longfellow House is the oldest standing structure on the Portland peninsula.","disputed":"Many people assume a poet was born at the museum's address. Wikipedia says he was born at his aunt's house nearby.","claims":[{"t":"The house was built between 1785 and 1786.","a":0,"why":"Wikipedia: built by Peleg Wadsworth in those years."},{"t":"Longfellow was born in this house.","a":2,"why":"Wikipedia says he was born nearby at his aunt's house."}],"sources":[{"t":"Wikipedia: Wadsworth-Longfellow House","u":"https://en.wikipedia.org/wiki/Wadsworth-Longfellow_House"},{"t":"Wikipedia: Henry Wadsworth Longfellow","u":"https://en.wikipedia.org/wiki/Henry_Wadsworth_Longfellow"}],"card":{"a":"1785","b":"1902","la":"House is built","lb":"Opens to the public"}},{"id":"cityhall","name":"Portland City Hall","short":"City Hall","badge":"City Hall","tag":"Stop 4 of 4","teaser":"The fourth city hall, after the first three burned or were replaced.","map":"Portland City Hall, 389 Congress Street, Portland, ME","clue":"Go to 389 Congress Street, at the head of Exchange Street. Look for the granite building with a tall tower in the middle and two long wings.","safety":"Congress Street has traffic. Use crosswalks and enjoy the building from the public steps and sidewalk.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"Which famous organ is in the auditorium behind City Hall?","options":["Kotzschmar Memorial Organ","Wanamaker Organ","Mormon Tabernacle Organ","Spreckels Organ"],"answer":0,"hint":"It was the second-largest in the world in 1912.","verify":"Wikipedia says the Kotzschmar Memorial Organ was the second-largest in the world when it was built in 1912. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"About 1905","label":"The old hall then","line":"A colored postcard of the earlier City Hall, which burned in 1908, with a domed tower and a brick and stone front.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"pm_ch_then","by":"Detroit Publishing Company (NYPL scan)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:City_Hall,_Portland,_Me_(NYPL_b12647398-67679).tiff","note":"resized, cropped"}},"now":{"yr":"2018","head":"Today","label":"The hall today","line":"The granite hall with a tall tower and round-arched ground floor windows, seen from the front steps.","ph":{"k":"pm_ch_now","by":"Daderot","lic":"CC0","lu":"https://creativecommons.org/publicdomain/zero/1.0/","page":"https://commons.wikimedia.org/wiki/File:City_Hall_-_Portland,_Maine_-_DSC03876.jpg","note":"resized"}},"story":["Portland City Hall is the fourth city hall built in Portland. It was built between 1909 and 1912 and was listed on the National Register of Historic Places in 1973.","The earlier hall, designed by Francis H. Fassett and built in 1867, burned in 1908. The one before that, built in 1862, burned in the Great Fire of 1866. The new building was designed by New York firm Carrère & Hastings, with local help from John Calvin Stevens and John Howard Stevens.","Its granite tower is 200 feet (61 m) tall. John M. Carrère, who was inspired by New York City Hall, considered it one of his finest works. The addition on Myrtle Street includes Merrill Auditorium, home of the Kotzschmar Memorial Organ."],"fact":"Portland City Hall is the fourth city hall built in Portland.","disputed":"Many people assume a city hall is built once. Wikipedia says this is the fourth, after earlier ones burned.","claims":[{"t":"The current City Hall was built between 1909 and 1912.","a":0,"why":"Wikipedia: built between 1909 and 1912."},{"t":"The 1867 City Hall is the one standing today.","a":2,"why":"Wikipedia says it burned in 1908."}],"sources":[{"t":"Wikipedia: Portland City Hall (Maine)","u":"https://en.wikipedia.org/wiki/Portland_City_Hall_(Maine)"},{"t":"Wikipedia: Portland, Maine","u":"https://en.wikipedia.org/wiki/Portland,_Maine"}],"card":{"a":"1867","b":"1912","la":"Earlier hall is built","lb":"Current hall is finished"}}],"heroKey":"pm_ob_now"},"newhaven":{"id":"newhaven","name":"New Haven","explorer":"Elm City Explorer","initials":"HVN","ranks":[[0,"Visitor"],[100,"Green Walker"],[250,"Landmark Hunter"],[450,"New Haven Scholar"],[600,"New Haven Historian"]],"heroAlt":"Vanderbilt Hall at Yale","heroLi":"<li>Header: Nick Allen · CC BY-SA 3.0 · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:Vanderbilt_Hall_spring.JPG\">Source</a> · resized</li>","heroCredit":"Photo: Nick Allen · <a target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by-sa/3.0/\">CC BY-SA 3.0</a> · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:Vanderbilt_Hall_spring.JPG\">Source</a>","mission":"Find four landmarks around New Haven. At each one, check in to earn its badge, unlock its story, and collect a Time Card. Do them in any order. Everything stays on this phone.","afterDone":"All four badges earned. The rest of New Haven is waiting.","safetyNote":"<li>Downtown New Haven has busy streets and a lot of students. Use crosswalks, stay on public paths, and do not enter dorms or other private buildings.</li>","badgeMap":{"green":["nh_gr_now","50% 45%"],"campus":["nh_oc_now","50% 45%"],"vanderbilt":["nh_vh_now","50% 45%"],"dwight":["nh_dh_now","50% 45%"]},"level":"Classics","region":"The East","stops":[{"id":"green","name":"New Haven Green","short":"The Green","badge":"The Green","tag":"Stop 1 of 4","teaser":"A 16-acre park laid out in 1638 with thousands of people buried under it.","map":"New Haven Green, New Haven, CT","clue":"Go to the big park in the middle of downtown, bordered by College, Chapel, Church and Elm streets. Look for three old churches on one side and a lot of tall trees.","safety":"The Green is surrounded by busy streets. Use crosswalks, stay on the paths, and keep clear of events and crowds.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"What lies under the soil of the New Haven Green?","options":["An underground lake","A subway line","Thousands of old graves","A buried fort"],"answer":2,"hint":"The Green was used for a purpose that ended in 1821.","verify":"Wikipedia says the Green was the main burial ground for the first 150 years, and between 4,000 and 5,000 people are estimated to remain there. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"About 1850","label":"The Green then","line":"A painting from about 1850 of the Green seen from a raised path, with church spires and a tower in the warm light.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"nh_gr_then","by":"Thomas Prichard Rossiter (painting)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:New_Haven_Green.jpg","note":"resized"}},"now":{"yr":"2019","head":"Today","label":"The Green today","line":"Tall trees casting shade on the grass, with a brick church just visible through the branches.","ph":{"k":"nh_gr_now","by":"Dicklyon","lic":"CC BY-SA 4.0","lu":"https://creativecommons.org/licenses/by-sa/4.0/","page":"https://commons.wikimedia.org/wiki/File:New_Haven_Green_with_Center_Church.jpg","note":"resized"}},"story":["The New Haven Green is a 16-acre park that was completed in 1638. It is the central square of the nine-square plan that colonist John Brockett designed and surveyed for the Puritan settlers. In its early years it was called 'the marketplace' and held a watch house, a prison and a school.","For its first 150 years, the Green was the main burial ground for New Haven. The practice ended by 1821 and many headstones were moved to Grove Street Cemetery, but the remains were not. Between 4,000 and 5,000 people are estimated to still lie beneath the soil.","Three early 19th-century churches stand on the upper Green. They are the reason the Green was designated a National Historic Landmark District in 1970."],"fact":"The Puritans said to have sized the Green for 144,000 people.","disputed":"Many people say the Puritans designed the Green for the number they believed would be spared in the Second Coming of Christ. Wikipedia says they were 'said to' have done it, which is a legend, not a record.","claims":[{"t":"The Green was completed in 1638.","a":0,"why":"Wikipedia: completed in 1638."},{"t":"All the graves were moved off the Green.","a":2,"why":"Wikipedia says the headstones were moved but the remains were not."}],"sources":[{"t":"Wikipedia: New Haven Green","u":"https://en.wikipedia.org/wiki/New_Haven_Green"},{"t":"Wikipedia: New Haven, Connecticut","u":"https://en.wikipedia.org/wiki/New_Haven,_Connecticut"}],"card":{"a":"1638","b":"1970","la":"The Green is completed","lb":"Landmark district"}},{"id":"campus","name":"Yale Old Campus","short":"Old Campus","badge":"Old Campus","tag":"Stop 2 of 4","teaser":"The oldest part of Yale, entered through a gate from the Green.","map":"Old Campus, Yale University, New Haven, CT","clue":"Go to the Yale Old Campus, a four-acre courtyard on the edge of the Green, entered through Phelps Gate on College Street. Look for the red-brick dormitories around a big grassy yard.","safety":"It is a working campus with students living in the dorms. Stay on public paths, keep your voice down and do not enter any building.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"What was Yale's first building in New Haven, built in 1718?","options":["The College House","Connecticut Hall","Dwight Hall","Harkness Tower"],"answer":0,"hint":"Its name says what it was: a house for the college.","verify":"Wikipedia says Yale's first building in New Haven, the College House, was erected in 1718. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"1901","label":"The campus then","line":"A color-tinted photo of a brick dormitory with a small tower at the right, and a dirt path under big elm trees.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"nh_oc_then","by":"Detroit Publishing Co.","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Phelps_Hall_and_Lyceum,_Yale_College,_New_Haven,_Connecticut,_1901.jpg","note":"resized"}},"now":{"yr":"2012","head":"Today","label":"The campus today","line":"Red-brick dormitories at the edge of a grassy yard with bare trees, seen from the courtyard.","ph":{"k":"nh_oc_now","by":"Ad Meskens","lic":"CC BY-SA 3.0","lu":"https://creativecommons.org/licenses/by-sa/3.0/","page":"https://commons.wikimedia.org/wiki/File:Yale_University_Old_Campus_04.JPG","note":"resized"}},"story":["The Old Campus is the oldest part of the Yale University campus. It is a 4-acre (1.6 ha) courtyard with a main entrance from the New Haven Green known as Phelps Gate. Fourteen buildings surround it, including eight dormitories and two chapels.","Yale's first building here, the College House, went up in 1718. Connecticut Hall followed in 1750 and is Yale's only surviving building from the colonial era. A plan in 1792 called Old Brick Row was the first campus plan in the United States and became a template for many other American colleges.","After 1870, the Old Brick Row plan gave way to the current quadrangle. Architect Charles C. Haight finished Phelps Gate in 1895 and Phelps Hall in 1896."],"fact":"The first U.S. campus plan was drawn up here in 1792.","disputed":"Many people think old colleges just grew without a plan. Wikipedia says the 1792 Old Brick Row plan was the first campus plan in the United States.","claims":[{"t":"Connecticut Hall is Yale's only surviving building from the colonial era.","a":0,"why":"Wikipedia says so."},{"t":"The Old Brick Row plan from 1792 is still how the campus looks today.","a":2,"why":"Wikipedia says it gave way to the current quadrangle after 1870."}],"sources":[{"t":"Wikipedia: Old Campus","u":"https://en.wikipedia.org/wiki/Old_Campus"},{"t":"Wikipedia: Yale University","u":"https://en.wikipedia.org/wiki/Yale_University"}],"card":{"a":"1718","b":"1895","la":"College House built","lb":"Phelps Gate completed"}},{"id":"vanderbilt","name":"Vanderbilt Hall","short":"Vanderbilt Hall","badge":"Vanderbilt Hall","tag":"Stop 3 of 4","teaser":"A castle-like dorm at the corner of the Old Campus.","map":"Vanderbilt Hall, Yale Old Campus, New Haven, CT","clue":"Go to the corner of College Street and Chapel Street on the Old Campus. Look for the tall brick dormitory with turrets and an iron fence along the sidewalk.","safety":"Chapel Street is busy. Use crosswalks, view the building from the public sidewalk, and do not enter, since students live here.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"Which architect designed Vanderbilt Hall, finished in 1894?","options":["James Gamble Rogers","Henry Austin","Richard Morris Hunt","Charles C. Haight"],"answer":3,"hint":"He also designed most of the old Columbia College campus in New York.","verify":"Wikipedia lists Vanderbilt Hall among the Yale buildings by Charles C. Haight, completed in 1894. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"1901","label":"The hall then","line":"A tinted photo of the long dormitory with turrets and a fence, with a wide street and cobbles in front.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"nh_vh_then","by":"Detroit Publishing Co.","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Vanderbilt_Hall,_Yale_College-LCCN2008679555.jpg","note":"resized, cropped"}},"now":{"yr":"2014","head":"Today","label":"The hall today","line":"The same castle-like dormitory with a street lamp and a stone gate post, under a bright blue sky.","ph":{"k":"nh_vh_now","by":"Nick Allen","lic":"CC BY-SA 3.0","lu":"https://creativecommons.org/licenses/by-sa/3.0/","page":"https://commons.wikimedia.org/wiki/File:Vanderbilt_Hall_spring.JPG","note":"resized"}},"story":["Vanderbilt Hall on Yale's Old Campus was completed in 1894. It was designed by Charles Coolidge Haight, an architect from New York City who also designed most of the buildings at Columbia College's old campus on Madison Avenue.","Haight designed many buildings at Yale. Phelps Gate followed Vanderbilt Hall in 1895, and Phelps Hall in 1896. Yale's collegiate Gothic look is more often credited to the better-known James Gamble Rogers, but many of Haight's buildings survive.","This is a good place to see the contrast. The 1901 photo shows the tall dorm with a tinted sky and cobbles, and the modern photo shows a lamp post and a stone gate post where the old street scene was."],"fact":"Haight finished Phelps Gate in 1895, one year after Vanderbilt Hall.","disputed":"Many people think Yale's Gothic look is all by one architect. Wikipedia says Rogers is better known, but Haight designed many of the survivors.","claims":[{"t":"Vanderbilt Hall was completed in 1894.","a":0,"why":"Wikipedia's list of Haight's works says so."},{"t":"Yale's Gothic buildings were all designed by James Gamble Rogers.","a":2,"why":"Wikipedia says Haight designed numerous Yale buildings too."}], edia.org/wiki/File:DwightHallYale.jpg","note":"resized"}},"story":["The building at 67 High Street was built between 1842 and 1846 as the Yale College Library, the university's first freestanding library. Henry Austin designed it in the Gothic Revival style, with a two-story reading room under a hammer-beam ceiling.","A different Dwight Hall was built on the Old Campus in 1886 for the Yale YMCA. It was a brownstone building with a round tower, and it was torn down in 1926 so people could see the new Harkness Tower without anything in the way.","After that, the Dwight Hall organization moved into the old library and the name came with it. In 1930 and 1931 the reading room was turned into Dwight Chapel."],"fact":"The original Dwight Hall was demolished in 1926 for a better view of Harkness Tower.","disputed":"Many people assume a building's name always goes with its first use. Wikipedia says the name moved here from a demolished building.","claims":[{"t":"The building was Yale's first freestanding library.","a":0,"why":"Wikipedia: the university's first freestanding library building."},{"t":"The current Dwight Hall is the 1886 building.","a":2,"why":"Wikipedia says the 1886 Dwight Hall was demolished in 1926."}],"sources":[{"t":"Wikipedia: Dwight Hall at Yale","u":"https://en.wikipedia.org/wiki/Dwight_Hall_at_Yale"},{"t":"Wikipedia: Old Campus","u":"https://en.wikipedia.org/wiki/Old_Campus"}],"card":{"a":"1842","b":"1931","la":"Library is built","lb":"Becomes Dwight Hall and Chapel"}}],"heroKey":"nh_vh_now"},"burlington":{"id":"burlington","name":"Burlington","explorer":"Lake Champlain Explorer","initials":"BTV","ranks":[[0,"Visitor"],[100,"Lake Walker"],[250,"Landmark Hunter"],[450,"Burlington Scholar"],[600,"Burlington Historian"]],"heroAlt":"Old Mill at the University of Vermont","heroLi":"<li>Header: AlexiusHoratius · CC BY-SA 3.0 · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:Old_Mill_UVM_5.JPG\">Source</a> · resized</li>","heroCredit":"Photo: AlexiusHoratius · <a target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by-sa/3.0/\">CC BY-SA 3.0</a> · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:Old_Mill_UVM_5.JPG\">Source</a>","mission":"Find four landmarks around Burlington. At each one, check in to earn its badge, unlock its story, and collect a Time Card. Do them in any order. Everything stays on this phone.","afterDone":"All four badges earned. The rest of Burlington is waiting.","safetyNote":"<li>Downtown Burlington has busy streets and a hilltop park above the lake. Use crosswalks, stay on paths, and keep back from steep edges and the water.</li>","badgeMap":{"church":["bv_cs_now","50% 45%"],"battery":["bv_bp_now","50% 45%"],"mill":["bv_om_now","50% 45%"],"billings":["bv_bl_now","50% 45%"]},"level":"Classics","region":"The East","stops":[{"id":"church","name":"Church Street Marketplace","short":"Church Street","badge":"Church Street","tag":"Stop 1 of 4","teaser":"Four blocks of street that cars gave up in 1980.","map":"Church Street Marketplace, Burlington, VT","clue":"Go to Church Street between Main Street and Pearl Street. Look for a wide, car-free street with shops, outdoor tables and a church steeple at the top.","safety":"Bicycles and delivery vehicles may use the edges of the street. Stay out of any road, and keep an eye on little kids near cafe tables.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"What was built on these four blocks of Church Street in 1980 and 1981?","options":["A railroad yard","A pedestrian marketplace","A parking garage","A canal"],"answer":1,"hint":"Compare the old photo and the new one.","verify":"Wikipedia says the uncovered outdoor pedestrian mall was built in 1980 and 1981. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"About 1940","label":"The street then","line":"A color-tinted postcard of cars parked and driving along the street, with shop signs and a steeple in the distance.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"bv_cs_then","by":"Tichnor Quality Views (Riverside Paper Co.)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Church_Street,_Burlington,_Vermont_(67643).jpg","note":"resized"}},"now":{"yr":"2013","head":"Today","label":"The street today","line":"A car-free street full of walkers and cafe tables, with trees and a steeple beyond.","ph":{"k":"bv_cs_now","by":"Beyond My Ken","lic":"CC BY-SA 4.0","lu":"https://creativecommons.org/licenses/by-sa/4.0/","page":"https://commons.wikimedia.org/wiki/File:Church_Street_Marketplace_Burlington_Vermont_looking_north_from_Main_Street.jpg","note":"resized"}},"story":["The Church Street Marketplace is an uncovered outdoor pedestrian shopping and dining mall made of four blocks of Church Street, between Main and Pearl streets. The idea for it began in 1958 as part of urban renewal discussions.","In the summer of 1971, a one-day street fair on the four blocks drew about 15,000 people. A week-long fair followed in 1972, with traffic rerouted to the parallel streets. The mall was built in 1980 and 1981 to a design by Carr, Lynch Associates of Cambridge, Massachusetts.","It has about 86 storefronts. The American Planning Association named it one of America's Great Public Spaces for 2008."],"fact":"A one-day street fair in 1971 helped prove the mall could work.","disputed":"Many people think the mall was an overnight decision. Wikipedia says it took from 1958 to 1981, with trial street fairs along the way.","claims":[{"t":"The Church Street Marketplace was built in 1980 and 1981.","a":0,"why":"Wikipedia says so."},{"t":"The marketplace opened in 1958.","a":2,"why":"Wikipedia says the idea began in 1958."}],"sources":[{"t":"Wikipedia: Church Street Marketplace","u":"https://en.wikipedia.org/wiki/Church_Street_Marketplace"},{"t":"Wikipedia: Burlington, Vermont","u":"https://en.wikipedia.org/wiki/Burlington,_Vermont"}],"card":{"a":"1971","b":"1981","la":"First one-day street fair","lb":"Marketplace is built"}},{"id":"battery","name":"Battery Park","short":"Battery Park","badge":"Battery Park","tag":"Stop 2 of 4","teaser":"A park on a bluff named for guns that beat back a British squadron.","map":"Battery Park, Burlington, VT","clue":"Go to Battery Park at the west end of downtown, on the bluff above Lake Champlain. Look for the big lawn, the old trees and the wide view of the lake.","safety":"The bluff has steep drop-offs. Stay on the paths and behind any railings, and do not climb on walls or monuments.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"Where does Battery Park get its name?","options":["A battery factory","A row of lights","A sailing club","Artillery stationed here in 1812"],"answer":3,"hint":"Think about a war that took place on this lake.","verify":"Wikipedia says the park was named for the artillery stationed there by American forces during the War of 1812. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"About 1940","label":"The park then","line":"A color-tinted postcard of the park entrance, with a road curving past trees and lamp posts toward the lake.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"bv_bp_then","by":"Tichnor Quality Views (Riverside Paper Co.)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Entrance_to_Battery_Park,_Burlington,_Vermont_(67644).jpg","note":"resized"}},"now":{"yr":"2015","head":"Today","label":"The park today","line":"A wide lawn with bare trees and a path, and the lake and hills far in the distance.","ph":{"k":"bv_bp_now","by":"Niranjan Arminius","lic":"CC BY-SA 4.0","lu":"https://creativecommons.org/licenses/by-sa/4.0/","page":"https://commons.wikimedia.org/wiki/File:BTV_BatteryPark_20151118.jpg","note":"resized"}},"story":["Battery Park is a public park overlooking Lake Champlain at the western end of downtown Burlington. It was named for the artillery that American forces stationed there during the War of 1812.","On August 13, 1813, American gunners, helped by the USS President, defended the position against an attack by a British squadron led by Lt Colonel John Murray. The park land was deeded to the City of Burlington in 1870.","The park has a bandshell, a playground and monuments, including a bronze statue of Civil War veteran General William W. Wells and a red oak sculpture of Chief Gray Lock. It is a popular place to watch fireworks on the Fourth of July."],"fact":"The park was deeded to Burlington in 1870.","disputed":"Many people repeat that Rudyard Kipling called this one of the two finest sunset views in the world. Wikipedia reports it only as 'according to' Kipling, so treat it as a claim, not a record.","claims":[{"t":"Battery Park was named for artillery stationed here.","a":0,"why":"Wikipedia says so."},{"t":"The park land was deeded to the city in 1972.","a":2,"why":"Wikipedia says 1870. A 1972 extension was added to the south end."}],"sources":[{"t":"Wikipedia: Battery Park (Burlington, Vermont)","u":"https://en.wikipedia.org/wiki/Battery_Park_(Burlington,_Vermont)"},{"t":"Wikipedia: Burlington, Vermont","u":"https://en.wikipedia.org/wiki/Burlington,_Vermont"}],"card":{"a":"1813","b":"1870","la":"British squadron driven back","lb":"Land is deeded to the city"}},{"id":"mill","name":"Old Mill","short":"Old Mill","badge":"Old Mill","tag":"Stop 3 of 4","teaser":"The oldest building at the University of Vermont, rebuilt after a fire.","map":"Old Mill, University of Vermont, Burlington, VT","clue":"Go to the University of Vermont green, on the east side. Look for the long red-brick building with a tall central tower and spire.","safety":"It is a working campus. Stay on the public paths and do not enter unless a building is open to visitors.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"Who laid the cornerstone of South College in 1825?","options":["General Lafayette","George Washington","Ethan Allen","Abraham Lincoln"],"answer":0,"hint":"He was a French hero visiting the U.S. on a national tour.","verify":"Wikipedia says General Lafayette laid the cornerstone for South College on June 29, 1825, during his national tour. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"About 1900","label":"The college then","line":"A tinted postcard of the brick building with a small tower, behind tall trees on the green.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"bv_om_then","by":"Detroit Publishing Company (NYPL scan)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:University_of_Vermont,_Burlington,_Vt_(NYPL_b12647398-68377).tiff","note":"resized, cropped"}},"now":{"yr":"2012","head":"Today","label":"The building today","line":"The red-brick building with a tall central spire and a big evergreen in front, under a blue sky.","ph":{"k":"bv_om_now","by":"AlexiusHoratius","lic":"CC BY-SA 3.0","lu":"https://creativecommons.org/licenses/by-sa/3.0/","page":"https://commons.wikimedia.org/wiki/File:Old_Mill_UVM_5.JPG","note":"resized"}},"story":["Old Mill, historically known as the Main College Building, is the oldest campus building of the University of Vermont. The first Main College was built in 1801 and 1802 by John Johnson, but it burned down in 1824. Johnson also designed its replacement.","The cornerstone for North College was laid on April 26, 1825 by Vermont Governor Cornelius P. Van Ness. Two months later, on June 29, General Lafayette laid the cornerstone for South College during his tour. A third building, Middle College, was added in 1829.","Each of the buildings was built 7 to 8 feet apart to keep a fire from destroying the whole thing again. They were connected in 1846. The building was added to the National Register of Historic Places in 1975, as part of the University Green Historic District."],"fact":"The buildings were built 7 to 8 feet apart to stop a fire from spreading.","disputed":"Many people hear the name 'Old Mill' and think it ground grain. Wikipedia says it was the Main College Building.","claims":[{"t":"The first Main College building burned down in 1824.","a":0,"why":"Wikipedia: its predecessor burned down in 1824."},{"t":"The Old Mill building was a grain mill.","a":2,"why":"Wikipedia says it was historically called the Main College Building."}],"sources":[{"t":"Wikipedia: Old Mill (University of Vermont)","u":"https://en.wikipedia.org/wiki/Old_Mill_(University_of_Vermont)"},{"t":"Wikipedia: Burlington, Vermont","u":"https://en.wikipedia.org/wiki/Burlington,_Vermont"}],"card":{"a":"1825","b":"1846","la":"Rebuilt after fire","lb":"Buildings are connected"}},{"id":"billings","name":"Billings Library","short":"Billings Library","badge":"Billings Library","tag":"Stop 4 of 4","teaser":"A castle-like stone library by a famous architect, now home to special collections.","map":"Billings Library, University of Vermont, Burlington, VT","clue":"Go to the University of Vermont green. Look for the building made of red stone with a round tower, a gray roof and a big arched doorway.","safety":"It is a working campus. Look from the public path, and enter only if it is open to visitors.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"Which famous architect designed the Billings Library?","options":["Louis Sullivan","Stanford White","H. H. Richardson","Frank Lloyd Wright"],"answer":2,"hint": academic space after 2018.","claims":[{"t":"Billings Library was built in 1883.","a":0,"why":"Wikipedia says so."},{"t":"It has been used only as a library.","a":2,"why":"Wikipedia says it was a student center from 1963."}],"sources":[{"t":"Wikipedia: Billings Memorial Library","u":"https://en.wikipedia.org/wiki/Billings_Memorial_Library"},{"t":"Wikipedia: Burlington, Vermont","u":"https://en.wikipedia.org/wiki/Burlington,_Vermont"}],"card":{"a":"1883","b":"2018","la":"Built to Richardson's design","lb":"Renovation finishes"}}],"heroKey":"bv_om_now"}}};
