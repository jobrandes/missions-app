 electrical power plants, which served the whole town until the 1920s."],"fact":"It once powered the whole town.","disputed":"Many people think a huge old hotel must be brick or stone. Wikipedia says it is wood, the second-largest wooden building in the country.","claims":[{"t":"The Hotel del Coronado opened in 1888.","a":0,"why":"Wikipedia: opened in 1888."},{"t":"The hotel is made of brick.","a":2,"why":"It is a wooden Victorian beach resort."}],"sources":[{"t":"Wikipedia: Hotel del Coronado","u":"https://en.wikipedia.org/wiki/Hotel_del_Coronado"},{"t":"Wikipedia: Coronado, California","u":"https://en.wikipedia.org/wiki/Coronado,_California"}],"card":{"a":"1885","b":"1888","la":"Investors buy the land","lb":"Hotel opens"}},{"id":"mission","name":"Mission Basilica San Diego de Alcalá","short":"Mission","badge":"Mission","tag":"Stop 2 of 4","teaser":"California's first mission, burned once and rebuilt five times.","map":"Mission Basilica San Diego de Alcalá, San Diego, CA","clue":"Go to the mission in Mission Valley, in San Diego. Look for a white church with a tall wall of bells in front.","safety":"The mission is an active parish and museum. Check hours, be quiet and respectful, and be careful of the busy road.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"Who founded the mission in 1769?","options":["Junípero Serra","Juan Rodríguez Cabrillo","Sebastián Vizcaíno","Luis Jayme"],"answer":0,"hint":"He was a Franciscan friar from Spain.","verify":"Wikipedia says Spanish friar Junípero Serra founded it on July 16, 1769. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"After 1898","label":"The mission then","line":"A postcard of the mission church on a dry hillside with trees and agave plants.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"sd_mi_then","by":"Detroit Publishing Company (scan by NYPL)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Mission_San_Diego,_San_Diego,_Calif_(NYPL_b12647398-62097).tiff","note":"resized, cropped"}},"now":{"yr":"2013","head":"Today","label":"The mission today","line":"The white church front with its bell wall beside a tall tree.","ph":{"k":"sd_mi_now","by":"Bernard Gagnon","lic":"CC BY-SA 3.0","lu":"https://creativecommons.org/licenses/by-sa/3.0/","page":"https://commons.wikimedia.org/wiki/File:Mission_San_Diego_de_Alcal%C3%A1_-_church.jpg","note":"resized"}},"story":["Mission Basilica San Diego de Alcalá was the second Franciscan-founded mission in the Californias. Spanish friar Junípero Serra founded it on July 16, 1769, in an area that the Kumeyaay people had long inhabited. It is named for Saint Didacus of Alcalá, known in Spanish as San Diego.","It was the site of the first Christian burial in Alta California. The first mission burned in 1775 during an uprising by local people. Father Luis Jayme, killed in that uprising, lies beneath the chancel floor.","The church standing today was built in the early nineteenth century and is the fifth to stand on this location. The mission site is a National Historic Landmark."],"fact":"The church today is the fifth on this spot.","disputed":"Many people think the old church we see is the first. Wikipedia says it is the fifth to stand here.","claims":[{"t":"Mission San Diego de Alcalá was founded in 1769.","a":0,"why":"Wikipedia: founded on July 16, 1769."},{"t":"The church standing today is the first one built here.","a":2,"why":"It is the fifth church on this location."}],"sources":[{"t":"Wikipedia: Mission San Diego de Alcalá","u":"https://en.wikipedia.org/wiki/Mission_San_Diego_de_Alcal%C3%A1"},{"t":"Wikipedia: Junípero Serra","u":"https://en.wikipedia.org/wiki/Jun%C3%ADpero_Serra"}],"card":{"a":"1769","b":"1775","la":"Mission founded","lb":"First mission burns"}},{"id":"botanical","name":"Botanical Building","short":"Botanical Building","badge":"Botanical Building","tag":"Stop 3 of 4","teaser":"A giant garden house made of strips of wood, built for a fair.","map":"Botanical Building, Balboa Park, San Diego, CA","clue":"Go to the Prado in Balboa Park. Look for a long arched building made of thin strips, with a lily pond in front.","safety":"Balboa Park is big and has traffic. Stay on paths, do not wade into or lean over the pond, and check hours.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"What kind of structure is the Botanical Building, one of the largest in the world?","options":["A glass greenhouse","A stone castle","A steel bridge","A lath structure"],"answer":3,"hint":"Think thin wooden strips with gaps between them.","verify":"Wikipedia says it remains one of the largest lath structures in the world. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"1915","label":"The garden house then","line":"A colorized postcard looking across a long pond to the arched building, with people strolling on a path.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"sd_bp_then","by":"I. L. Eno","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Lagoon,_Botanical_Building_in_background,_Panama-California_Exposition,_San_Diego,_Cal._1915.jpg","note":"resized"}},"now":{"yr":"2019","head":"Today","label":"The garden house today","line":"The lily pond and the arched building behind flowers and a palm.","ph":{"k":"sd_bp_now","by":"Intrepid88","lic":"CC BY-SA 4.0","lu":"https://creativecommons.org/licenses/by-sa/4.0/","page":"https://commons.wikimedia.org/wiki/File:Balboa_Park_Botanical_Building_and_Lily_Pond.jpg","note":"resized"}},"story":["Balboa Park is a 1,200-acre historic park in San Diego. It hosted the 1915 to 1916 Panama-California Exposition and the 1935 to 1936 California Pacific International Exposition, and both left landmark buildings behind. The park was named a National Historic Landmark District in 1977.","The Botanical Building was built for the first exposition and remains one of the largest lath structures in the world. Alfred D. Robinson, founder of the San Diego Floral Society, suggested a lath house for the fair. A garden and lily pond were built in front of it in 1915.","During World War I and World War II the navy used the pond for swimming lessons. The building closed in 2021 for renovations and reopened in December 2024."],"fact":"The navy used the lily pond for swim lessons.","disputed":"Many people think an exposition building must be torn down afterward. Wikipedia says this one was built in 1915 and is still standing.","claims":[{"t":"The Botanical Building was built for the 1915 exposition.","a":0,"why":"Wikipedia: built for the 1915-16 Panama-California Exposition."},{"t":"The lily pond has only ever been for looking at.","a":2,"why":"The navy used it for swimming lessons during both world wars."}],"sources":[{"t":"Wikipedia: Botanical Building","u":"https://en.wikipedia.org/wiki/Botanical_Building"},{"t":"Wikipedia: Balboa Park (San Diego)","u":"https://en.wikipedia.org/wiki/Balboa_Park_(San_Diego)"}],"card":{"a":"1915","b":"2024","la":"Built for the exposition","lb":"Reopens after renovation"}},{"id":"estudillo","name":"Casa de Estudillo","short":"Casa de Estudillo","badge":"Casa de Estudillo","tag":"Stop 4 of 4","teaser":"An adobe house that a novel made famous 57 years after it was built.","map":"Casa de Estudillo, Old Town San Diego State Historic Park, San Diego, CA","clue":"Go to Old Town San Diego State Historic Park. Look for a long, low whitewashed adobe house shaped like a U, with a courtyard.","safety":"The park has walkways and visitors. Stay on the paths, do not touch the old walls, and use crosswalks.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"Which famous novel made the house popular with visitors?","options":["Tom Sawyer","Moby-Dick","Ramona","Treasure Island"],"answer":2,"hint":"A popular 1884 novel by Helen Hunt Jackson.","verify":"Wikipedia says the house gained prominence by association with Helen Hunt Jackson's 1884 novel Ramona. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"After 1898","label":"The house then","line":"A tinted postcard of the long, low adobe house with a tree beside a dirt road.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"sd_ce_then","by":"Detroit Publishing Company (scan by NYPL)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Ramona's_Marriage_Place,_San_Diego,_Calif_(NYPL_b12647398-62179).tiff","note":"resized, cropped"}},"now":{"yr":"2010","head":"Today","label":"The house today","line":"The whitewashed walls, a courtyard and big trees.","ph":{"k":"sd_ce_now","by":"Joe Mabel","lic":"CC BY-SA 3.0","lu":"https://creativecommons.org/licenses/by-sa/3.0/","page":"https://commons.wikimedia.org/wiki/File:Casa_de_Estudillo_01.jpg","note":"resized"}},"story":["The Casa de Estudillo was built in 1827 by José María Estudillo and his son José Antonio Estudillo, early settlers of San Diego. It was considered one of the finest houses in Mexican California. It stands in Old Town San Diego State Historic Park and is a National and California Historical Landmark.","The Spanish Colonial house is U-shaped, 113 feet across the front and 98 feet along each wing. Its 13 rooms connect only through a covered outdoor walkway, not inside halls. A cupola on top gave a view of the plaza for bullfights and festivals.","José Antonio died in 1852, and the family stayed until 1887. Helen Hunt Jackson's 1884 novel Ramona made Californio life famous nationwide, and the house became linked with the story. Old postcards called it Ramona's Marriage Place. A restoration in 1910 removed some walls to enlarge the chapel and schoolroom."],"fact":"The rooms connect only through an outdoor walkway.","disputed":"Many people think the house was built for the novel. Wikipedia says it was built in 1827, and the novel came out in 1884.","claims":[{"t":"The Casa de Estudillo was built in 1827.","a":0,"why":"Wikipedia: constructed in 1827."},{"t":"The house was built for the novel Ramona.","a":2,"why":"The house dates to 1827. The novel was published in 1884."}],"sources":[{"t":"Wikipedia: Casa de Estudillo","u":"https://en.wikipedia.org/wiki/Casa_de_Estudillo"},{"t":"Wikipedia: Ramona (novel)","u":"https://en.wikipedia.org/wiki/Ramona_(novel)"}],"card":{"a":"1827","b":"1884","la":"Built","lb":"Ramona published"}}],"heroKey":"sd_hd_now"},"portland":{"id":"portland","name":"Portland","explorer":"Rose City Explorer","initials":"PDX","ranks":[[0,"Visitor"],[100,"Willamette Walker"],[250,"Landmark Hunter"],[450,"Portland Scholar"],[600,"Portland Historian"]],"heroAlt":"Pioneer Courthouse in Portland","heroLi":"<li>Header: M.O. Stevens · CC BY-SA 3.0 · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:Pioneer_Courthouse_Portland.JPG\">Source</a> · resized</li>","heroCredit":"Photo: M.O. Stevens · <a target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by-sa/3.0/\">CC BY-SA 3.0</a> · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:Pioneer_Courthouse_Portland.JPG\">Source</a>","mission":"Find four landmarks around Portland. At each one, check in to earn its badge, unlock its story, and collect a Time Card. Do them in any order. Everything stays on this phone.","afterDone":"All four badges earned. The rest of Portland is waiting.","safetyNote":"<li>Downtown Portland has busy streets, light rail and streetcars. Use crosswalks, watch for trains and bikes, and visit in daylight.</li>","badgeMap":{"courthouse":["pd_pc_now","50% 45%"],"cityhall":["pd_ch_now","50% 45%"],"fountain":["pd_sf_now","50% 45%"],"station":["pd_us_now","50% 45%"]},"level":"Classics","region":"The West","stops":[{"id":"courthouse","name":"Pioneer Courthouse","short":"Pioneer Courthouse","badge":"Pioneer Courthouse","tag":"Stop 1 of 4","teaser":"The oldest federal building in the Pacific Northwest, nearly torn down for parking.","map":"Pioneer Courthouse, 700 SW Sixth Avenue, Portland, OR","clue":"Go to Pioneer Courthouse Square in the middle of downtown. Look for the stone building with a small cupola on top, facing the square.","safety":"The square is busy and light rail runs beside it. Use crosswalks, and remember this is a working courthouse, so stay outside unless you have business there.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"In 1933 a city engineer proposed tearing the building down to make room for what?","options":["A zoo","A bus station","A football field","A parking garage"],"answer":3,"hint":"Think of what downtown never has enough of.","verify":"Wikipedia says city engineer Olaf Laurgaard proposed tearing it down for a parking garage in 1933. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"About 1900","label":"The courthouse then","line":"A wide black-and-white view of the courthouse standing among bare trees.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"pd_pc_then","by":"Arthur C. Pillsbury","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Pioneer_Courthouse_on_700_block_of_SW_5th_Ave._in_Portland,_ca._1900_-_DPLA_-_efa45ffa2230ef5688fea17d9e17fa10.jpg","note":"resized, cropped"}},"now":{"yr":"2008","head":"Today","label":"The courthouse today","line":"The stone building with its small cupola, seen across a busy brick square under a blue sky.","ph":{"k":"pd_pc_now","by":"M.O. Stevens","lic":"CC BY-SA 3.0","lu":"https://creativecommons.org/licenses/by-sa/3.0/","page":"https://commons.wikimedia.org/wiki/File:Pioneer_Courthouse_Portland.JPG","note":"resized"}},"story":["Pioneer Courthouse is a federal courthouse in Portland. Construction began in 1869, and it is the oldest federal building in the Pacific Northwest and the second-oldest west of the Mississippi River. It was built in stages between 1869 and 1903. Judge Matthew Deady first used it in 1875, when it was called the United States Building.","People also call it the Pioneer Post Office, because a popular downtown post office was inside until 2005. It was added to the National Register of Historic Places in 1973 and became a National Historic Landmark in 1977.","It has survived several attempts to demolish it. In March 1933 city engineer Olaf Laurgaard proposed tearing it down for a parking garage. Architect A. E. Doyle and other local groups sharply opposed the idea, and the building stayed. Today it is one of four main places where the Ninth Circuit Court of Appeals hears oral arguments."],"fact":"The post office inside stayed open until 2005.","disputed":"Many people think old buildings are protected automatically. Wikipedia says this one survived several attempts to demolish it.","claims":[{"t":"Pioneer Courthouse is the oldest federal building in the Pacific Northwest.","a":0,"why":"Wikipedia: it is the oldest federal building in the Pacific Northwest."},{"t":"Nobody ever tried to tear the courthouse down.","a":2,"why":"Wikipedia says it survived several demolition attempts, including a 1933 proposal."}],"sources":[{"t":"Wikipedia: Pioneer Courthouse","u":"https://en.wikipedia.org/wiki/Pioneer_Courthouse"},{"t":"Wikipedia: Portland, Oregon","u":"https://en.wikipedia.org/wiki/Portland,_Oregon"}],"card":{"a":"1869","b":"1903","la":"Construction begins","lb":"Final stage built"}},{"id":"cityhall","name":"Portland City Hall","short":"City Hall","badge":"City Hall","tag":"Stop 2 of 4","teaser":"A city hall that had its first design thrown out and its basement torn up.","map":"Portland City Hall, 1221 SW 4th Avenue, Portland, OR","clue":"Go to the block between Fourth and Fifth Avenues at Madison and Jefferson Streets. Look for a four-story stone building with a rounded front.","safety":"Downtown streets are busy. Use crosswalks, and view the building from the public sidewalk.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"A first design for City Hall was scrapped. What was it said to be modeled on?","options":["A lighthouse","The Kremlin","A Scottish castle","A Greek temple"],"answer":1,"hint":"A famous walled government complex in a faraway capital.","verify":"Wikipedia says the first design appeared to be modeled on the Kremlin. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"After 1898","label":"City Hall then","line":"A tinted postcard of the building on a corner, with a dirt road and a tree.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"pd_ch_then","by":"Detroit Publishing Company (scan by NYPL)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:City_Hall,_Portland,_Ore_(NYPL_b12647398-68887).tiff","note":"resized, cropped"}},"now":{"yr":"2010","head":"Today","label":"City Hall today","line":"The curved front and tall windows of the stone building across the street.","ph":{"k":"pd_ch_now","by":"M.O. Stevens","lic":"CC BY-SA 3.0","lu":"https://creativecommons.org/licenses/by-sa/3.0/","page":"https://commons.wikimedia.org/wiki/File:City_Hall_front_pan_-_Portland,_Oregon.JPG","note":"resized"}},"story":["Portland City Hall is the home of the city's government, and the Italian Renaissance-style building was completed in 1895. It sits on a whole city block along Fourth and Fifth Avenues. The original building cost $600,000. A big renovation in 1996 to 1998 cost $29 million.","The city bought the block in 1890. Henry J. Hefty designed a huge, showy building that looked like the Kremlin, and construction began in 1892. People did not like it, so the new City Hall Commission cancelled the contract and tore out the basement and first floor at a cost of $125,000.","The city then hired the firm of Whidden and Lewis, who were in town for the Portland Hotel project. Their design is the City Hall you see today. It was added to the National Register of Historic Places in 1974."],"fact":"The first basement was torn out and redone.","disputed":"Many people think the first design is always the one that gets built. Wikipedia says this one was thrown out after the foundation was built.","claims":[{"t":"Portland City Hall was completed in 1895.","a":0,"why":"Wikipedia: completed in 1895."},{"t":"The first design was built exactly as planned.","a":2,"why":"Wikipedia says the contract was cancelled and the work torn out."}],"sources":[{"t":"Wikipedia: Portland City Hall (Oregon)","u":"https://en.wikipedia.org/wiki/Portland_City_Hall_(Oregon)"},{"t":"Wikipedia: Portland, Oregon","u":"https://en.wikipedia.org/wiki/Portland,_Oregon"}],"card":{"a":"1892","b":"1895","la":"Construction first begins","lb":"Completed"}},{"id":"fountain","name":"Skidmore Fountain","short":"Skidmore Fountain","badge":"Skidmore Fountain","tag":"Stop 3 of 4","teaser":"A fountain meant for horses, men and dogs to drink from.","map":"Skidmore Fountain, SW First Avenue and Ankeny Street, Portland, OR","clue":"Go to the west end of the Burnside Bridge in Old Town, at First and Ankeny. Look for a big stone fountain with a bronze figure, next to an open plaza.","safety":"This area can be busy and rough at night. Visit in daylight, stay on the sidewalks and stay with your group. Do not climb on the fountain.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"The fountain was made for horses, men and which animal to drink from?","options":["Dogs","Cats","Goats","Chickens"],"answer":0,"hint":"A very common pet.","verify":"Wikipedia says it was intended for \"horses, men and dogs\" to drink from. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"1890","label":"The fountain then","line":"A sepia photo of the fountain standing in floodwater, with two men beside it and tall stone buildings behind.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"pd_sf_then","by":"Unknown author","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Skidmore_Fountain_with_flooded_street.JPG","note":"resized"}},"now":{"yr":"2015","head":"Today","label":"The fountain today","line":"The stone fountain in a sunny plaza, with a pillared arch and trees beside it.","ph":{"k":"pd_sf_now","by":"Steve Morgan","lic":"CC BY-SA 3.0","lu":"https://creativecommons.org/licenses/by-sa/3.0/","page":"https://commons.wikimedia.org/wiki/File:Skidmore_Fountain_in_2015.jpg","note":"resized"}},"story":["Skidmore Fountain was dedicated on September 22, 1888. It honors Stephen G. Skidmore, a wealthy Portland druggist who died in 1883. His will helped pay for it. Sculptor Olin Levi Warner designed it for $18,000, all of which was donated.","It was styled after fountains Skidmore saw at Versailles during his visit to the 1878 Paris Exposition, and it was meant for horses, men and dogs to drink from. At the dedication, Henry Weinhard offered to pump beer into it.","It is Portland's oldest piece of public art, and it gives its name to the Skidmore/Old Town Historic District. It was restored in 2005."],"fact":"A brewer offered to pump beer into it.","disputed":"Many people think a fountain is only for looks. Wikipedia says this one was built for drinking, for horses, men and dogs.","claims":[{"t":"Skidmore Fountain was dedicated in 1888.","a":0,"why":"Wikipedia: dedicated September 22, 1888."},{"t":"The fountain was meant only for people to drink from.","a":2,"why":"Wikipedia says it was meant for horses, men and dogs."}],"sources":[{"t":"Wikipedia: Skidmore Fountain","u":"https://en.wikipedia.org/wiki/Skidmore_Fountain"},{"t":"Wikipedia: Portland, Oregon","u":"https://en.wikipedia.org/wiki/Portland,_Oregon"}],"card":{"a":"1888","b":"2005","la":"Dedicated","lb":"Restored"}},{"id":"station","name":"Portland Union Station","short":"Union Station","badge":"Union Station","tag":"Stop 4 of 4","teaser":"A train station with a 150-foot clock tower wound by hand every week.","map":"Union Station, 800 NW 6th Avenue, Portland, OR","clue":"Go to Union Station near the west bank of the Willamette River in Old Town Chinatown. Look for a red-roofed brick station with a tall clock tower.","safety":"The station and its streets are busy. Use crosswalks, stay out of the tracks and driveways, and be careful around buses.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"How tall is the station's clock tower?","options":["400 feet","1,000 feet","150 feet","50 feet"],"answer":2,"hint":"Taller than most trees, shorter than a skyscraper.","verify":"Wikipedia says the Romanesque Revival clock tower is 150 feet tall. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"Mid-1900s","label":"The station then","line":"A colorized postcard of the red station with its tall clock tower, with cars parked in front.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"pd_us_then","by":"Angelus Commercial Studio","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:The_Union_Station,_Portland,_Oregon_(74160).jpg","note":"resized, cropped"}},"now":{"yr":"2012","head":"Today","label":"The station today","line":"The red brick wall and tiled roof of the station, with green awnings over the windows.","ph":{"k":"pd_us_now","by":"Another Believer","lic":"CC BY-SA 3.0","lu":"https://creativecommons.org/licenses/by-sa/3.0/","page":"https://commons.wikimedia.org/wiki/File:Union_Station,_Portland,_OR_2012_-_exterior.JPG","note":"resized"}},"story":["Portland Union Station opened on February 14, 1896. The first design, from McKim, Mead & White in 1882, would have been the largest train station in the world. A smaller plan by Van Brunt & Howe was accepted in 1885, and construction began in 1890. It cost $300,000.","The station has bright red metal roof tiles, red pressed brick and gray sandstone trim. Its signature piece is the 150-foot Romanesque Revival clock tower. The four-sided Seth Thomas clock dates to 1898. Each face is 12 feet across, and the clock has a 14-foot pendulum and a counterweight of about 1,000 pounds that drops almost 50 feet in a week.","The clock is wound every seven days. Neon signs reading Go by Train were added to the tower in 1948. The station joined the National Register of Historic Places in 1975, and Amtrak trains still stop there."],"fact":"The clock is wound by hand every seven days.","disputed":"Many people think big station clocks run on electricity. Wikipedia says this one has a pendulum and a counterweight that has to be wound every seven days.","claims":[{"t":"Portland Union Station opened in 1896.","a":0,"why":"Wikipedia: opened February 14, 1896."},{"t":"The tower clock runs on batteries.","a":2,"why":"Wikipedia says it has a pendulum and a weight, and it is wound every seven days."}],"sources":[{"t":"Wikipedia: Portland Union Station","u":"https://en.wikipedia.org/wiki/Union_Station_(Portland,_Oregon)"},{"t":"Wikipedia: Portland, Oregon","u":"https://en.wikipedia.org/wiki/Portland,_Oregon"}],"card":{"a":"1890","b":"1896","la":"Construction begins","lb":"Station opens"}}],"heroKey":"pd_pc_now"},"milwaukee":{"id":"milwaukee","name":"Milwaukee","explorer":"Brew City Explorer","initials":"MKE","ranks":[[0,"Visitor"],[100,"Lakefront Walker"],[250,"Landmark Hunter"],[450,"Milwaukee Scholar"],[600,"Milwaukee Historian"]],"heroAlt":"The Milwaukee Theatre","heroLi":"<li>Header: Royalbroil · CC BY-SA 3.0 · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:Milwaukee_Theatre_September_2012.jpg\">Source</a> · resized</li>","heroCredit":"Photo: Royalbroil · <a target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by-sa/3.0/\">CC BY-SA 3.0</a> · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:Milwaukee_Theatre_September_2012.jpg\">Source</a>","mission":"Find four landmarks around Milwaukee. At each one, check in to earn its badge, unlock its story, and collect a Time Card. Do them in any order. Everything stays on this phone.","afterDone":"All four badges earned. The rest of Milwaukee is waiting.","safetyNote":"<li>Downtown Milwaukee has busy streets, bridges and streetcars. Use crosswalks, watch for the streetcar and bikes, and dress for the wind.</li>","badgeMap":{"cityhall":["mk_ch_now","50% 45%"],"mitchell":["mk_mb_now","50% 45%"],"soldiers":["mk_sh_now","50% 45%"],"auditorium":["mk_au_now","50% 45%"]},"level":"Classics","region":"The Midwest","stops":[{"id":"cityhall","name":"Milwaukee City Hall","short":"City Hall","badge":"City Hall","tag":"Stop 1 of 4","teaser":"A tower with four beer-stein turrets that once was the symbol of the city.","map":"Milwaukee City Hall, 200 E Wells Street, Milwaukee, WI","clue":"Go to Wells Street near Water Street downtown. Look for a brick-and-stone building with a tall clock tower and a copper spire.","safety":"Downtown streets are busy and the streetcar runs nearby. Use crosswalks and view the tower from the sidewalk.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"What do the four turrets around the clock tower look like?","options":["Bells","Beer steins","Cannons","Candles"],"answer":1,"hint":"Think of the drink Milwaukee is famous for.","verify":"Wikipedia says the clock faces are flanked by four beer stein turrets. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"Undated","label":"City Hall then","line":"A black-and-white photo of the tall tower on a street with trolley wires and a muddy road.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"mk_ch_then","by":"Unknown author","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Milwaukee_City_Hall_Old_Public_Domain_Photo.jpg","note":"resized, cropped"}},"now":{"yr":"2022","head":"Today","label":"City Hall today","line":"The brick clock tower and spire against a blue sky with clouds.","ph":{"k":"mk_ch_now","by":"Michael Barera","lic":"CC BY-SA 4.0","lu":"https://creativecommons.org/licenses/by-sa/4.0/","page":"https://commons.wikimedia.org/wiki/File:Milwaukee_June_2022_19_(Milwaukee_City_Hall).jpg","note":"resized"}},"story":["Milwaukee City Hall was finished in 1895 and was the city's tallest building until 1973. Henry C. Koch designed it in the Flemish Renaissance Revival style, based on city halls in Germany and on local buildings. It became a National Historic Landmark in 2005.","It stands on 2,584 white pine piles driven into marshy ground. The main block rises eight stories, and the tower reaches 350 feet, with clock faces flanked by four beer stein turrets. A fire in October 1929 damaged the upper tower, which was rebuilt.","The tower holds a 22,500-pound bell named for Solomon Juneau, Milwaukee's first mayor, which was hoisted up in 1896. The tower's lighted marquee appeared in the opening of the TV show Laverne & Shirley, and it was removed in 1988."],"fact":"It stands on 2,584 wooden piles.","disputed":"Many people think a tall old building must sit on solid rock. Wikipedia says this one stands on thousands of wooden piles in marshy ground.","claims":[{"t":"Milwaukee City Hall was finished in 1895.","a":0,"why":"Wikipedia: finished in 1895."},{"t":"The tower has never been damaged by fire.","a":2,"why":"Wikipedia says a fire in October 1929 damaged the upper tower, which was rebuilt."}],"sources":[{"t":"Wikipedia: Milwaukee City Hall","u":"https://en.wikipedia.org/wiki/Milwaukee_City_Hall"},{"t":"Wikipedia: Milwaukee","u":"https://en.wikipedia.org/wiki/Milwaukee"}],"card":{"a":"1895","b":"2005","la":"Finished","lb":"National Historic Landmark"}},{"id":"mitchell","name":"Mitchell Building","short":"Mitchell Building","badge":"Mitchell Building","tag":"Stop 2 of 4","teaser":"A fancy bank and insurance building on the spot of a founder's house.","map":"Mitchell Building, 207 E Michigan Street, Milwaukee, WI","clue":"Go to East Michigan Street downtown. Look for an ornate stone building with a mansard roof and a decorated tower in the middle.","safety":"Downtown streets are busy. Use crosswalks, and look at the building from the public sidewalk.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"Whose home is the Mitchell Building believed to sit on?","options":["Joseph Schlitz","Henry Koch","Solomon Juneau","Frederick Pabst"],"answer":2,"hint":"He is considered the founder of Milwaukee.","verify":"Wikipedia says the building is believed to sit on the site of the home of Solomon Juneau, who founded Milwaukee. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"Undated","label":"The building then","line":"A sepia photo of the five-story building with its mansard roof and railroad tracks in the street.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"mk_mb_then","by":"W. H. Sherman (file by James Steakley)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Milwaukee_Mitchell_Building.jpg","note":"resized"}},"now":{"yr":"2009","head":"Today","label":"The building today","line":"The carved stone front with its many windows and a fancy roof.","ph":{"k":"mk_mb_now","by":"James Steakley","lic":"CC BY-SA 3.0","lu":"https://creativecommons.org/licenses/by-sa/3.0/","page":"https://commons.wikimedia.org/wiki/File:Mitchell_Building_Milwaukee.jpg","note":"resized"}},"story":["The Mitchell Building is a five-story bank and insurance building in the Second Empire style. It was built in 1876 and was added to the National Register of Historic Places in 1973.","Alexander Mitchell was a Scottish immigrant who came to the United States in 1839. He led an insurance company, a railroad and a bank, and he served two terms in the U.S. House. He hired architect E. Townsend Mix to design the building. Its first-floor walls are gray Minnesota granite and the upper walls are limestone, with a mansard roof and an ornate central tower.","It is believed to stand on the site of the home of Solomon Juneau, who founded Milwaukee in the 1830s. Mitchell's bank stayed there until 1930. The exterior remains highly intact, though much of the fancy interior has disappeared with remodeling."],"fact":"Its first-floor walls are Minnesota granite.","disputed":"Many people think fancy old banks were rebuilt long ago. Wikipedia says the exterior of this one remains highly intact.","claims":[{"t":"The Mitchell Building was built in 1876.","a":0,"why":"Wikipedia: built in 1876."},{"t":"The Mitchell Building was always a hotel.","a":2,"why":"It was built as a bank and insurance building."}],"sources":[{"t":"Wikipedia: Mitchell Building","u":"https://en.wikipedia.org/wiki/Mitchell_Building"},{"t":"Wikipedia: Milwaukee","u":"https://en.wikipedia.org/wiki/Milwaukee"}],"card":{"a":"1839","b":"1930","la":"Mitchell comes to America","lb":"Bank leaves the building"}},{"id":"soldiers","name":"Soldiers Home (Old Main)","short":"Old Main","badge":"Old Main","tag":"Stop 3 of 4","teaser":"A Civil War soldiers' home that was nearly torn down.","map":"Milwaukee Soldiers Home (Old Main), Milwaukee, WI","clue":"Look for the old soldiers' home grounds in Milwaukee. Find a big yellow-brick Gothic building with a tall tower and steep roofs.","safety":"The building is being restored and may be fenced. View it from public paths and do not go inside.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"Old Main was built to help soldiers from which war?","options":["The Revolutionary War","The War of 1812","The Spanish-American War","The Civil War"],"answer":3,"hint":"It was completed in 1867.","verify":"Wikipedia says it was built for the rehabilitation of Civil War soldiers. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"1885","label":"The home then","line":"An 1885 engraving of the whole soldiers' home, with its buildings, paths and trees.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"mk_sh_then","by":"James E. Heg (1885 Wisconsin Blue Book)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Milwaukee_Soldiers_Home.jpeg","note":"resized"}},"now":{"yr":"2009","head":"Today","label":"The home today","line":"The yellow-brick Gothic building with its tall tower and steep roofs under a blue sky.","ph":{"k":"mk_sh_now","by":"James Steakley","lic":"CC BY-SA 3.0","lu":"https://creativecommons.org/licenses/by-sa/3.0/","page":"https://commons.wikimedia.org/wiki/File:Soldiers_Home_Milwaukee.jpg","note":"resized"}},"story":["Milwaukee Soldiers Home, known as Old Main, is one of three soldiers homes that have survived in the United States. It was built to help Civil War soldiers recover. It was completed in 1867 and went by several names, including National Asylum for Disabled Soldiers.","There are 24 other buildings on the grounds, and together they form the Northwestern Branch, National Home for Disabled Volunteer Soldiers Historic District. Old Main was unoccupied from 1989, fell into disrepair and was scheduled for demolition.","A 2011 campaign succeeded in getting it designated a National Historic Landmark. In 2019 a company was hired to update the building, and the Wisconsin Housing and Economic Development Authority helped finance the restoration."],"fact":"It was scheduled for demolition, then saved.","disputed":"Many people think old landmarks are always preserved. Wikipedia says this one was scheduled to be demolished until a campaign saved it.","claims":[{"t":"Old Main was completed in 1867.","a":0,"why":"Wikipedia: completed in 1867."},{"t":"Old Main has been in use ever since it was built.","a":2,"why":"Wikipedia says it was unoccupied from 1989."}],"sources":[{"t":"Wikipedia: Milwaukee Soldiers Home (Old Main)","u":"https://en.wikipedia.org/wiki/Milwaukee_Soldiers_Home_(Old_Main)"},{"t":"Wikipedia: Old soldiers' home","u":"https://en.wikipedia.org/wiki/Old_soldiers%27_home"}],"card":{"a":"1867","b":"2011","la":"Completed","lb":"Named a National Historic Landmark"}},{"id":"auditorium","name":"Milwaukee Auditorium","short":"Auditorium","badge":"Auditorium","tag":"Stop 4 of 4","teaser":"A giant hall built on the ashes of an exposition building.","map":"Milwaukee Theatre (Milwaukee Auditorium), 500 W Kilbourn Avenue, Milwaukee, WI","clue":"Go to West Kilbourn Avenue downtown. Look for a long brick building with big arched windows and a sign that says Milwaukee Theatre.","safety":"Downtown streets are busy. Use crosswalks, and view the building from the public sidewalk.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"What building stood on this spot before it was destroyed by fire in 1905?","options":["The Milwaukee Industrial Exposition Building","The old City Hall","A brewery","A railroad station"],"answer":0,"hint":"It was a big hall for showing off new products.","verify":"Wikipedia says the auditorium replaced the Milwaukee Industrial Exposition Building, destroyed by fire in 1905. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"1908","label":"The auditorium then","line":"A colorized print of the new hall with a long front and horse carriages and early cars out front.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"mk_au_then","by":"Library of Congress (Miscellaneous Items in High Demand)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:The_new_auditorium,_Milwaukee_LCCN2013646928.jpg","note":"resized, cropped"}},"now":{"yr":"2012","head":"Today","label":"The auditorium today","line":"The long brick front with its big windows and the Milwaukee Theatre sign.","ph":{"k":"mk_au_now","by":"Royalbroil","lic":"CC BY-SA 3.0","lu":"https://creativecommons.org/licenses/by-sa/3.0/","page":"https://commons.wikimedia.org/wiki/File:Milwaukee_Theatre_September_2012.jpg","note":"resized"}},"story":["The Milwaukee Auditorium was built in 1909 where the Milwaukee Industrial Exposition Building had stood before a fire destroyed it in 1905. The cornerstone was laid on August 1, 1908, and the building was dedicated on September 21, 1909.","It held 13,520 people and had almost 105,000 square feet of exhibition space. Elizabeth Plankinton donated a pipe organ. It hosted concerts, circuses, political rallies and sports events, from John Philip Sousa and Enrico Caruso to modern stars, and sitting presidents from Taft to Clinton gave speeches there.","A renovation from 2001 to 2003 changed its name to the Milwaukee Theatre. A naming rights deal changed it to the Miller High Life Theatre in 2017. Today it seats 4,086 people."],"fact":"Presidents from Taft to Clinton spoke here.","disputed":"Many people think the Milwaukee Theatre has always had that name. Wikipedia says it was originally the Milwaukee Auditorium.","claims":[{"t":"The Milwaukee Auditorium was dedicated in 1909.","a":0,"why":"Wikipedia: dedicated on September 21, 1909."},{"t":"The building has always been called the Milwaukee Theatre.","a":2,"why":"It was originally the Milwaukee Auditorium."}],"sources":[{"t":"Wikipedia: Miller High Life Theatre","u":"https://en.wikipedia.org/wiki/Miller_High_Life_Theatre"},{"t":"Wikipedia: Milwaukee","u":"https://en.wikipedia.org/wiki/Milwaukee"}],"card":{"a":"1908","b":"2003","la":"Cornerstone laid","lb":"Renovation finishes"}}],"heroKey":"mk_au_now"},"columbus":{"id":"columbus","name":"Columbus","explorer":"Capital City Explorer","initials":"CMH","ranks":[[0,"Visitor"],[100,"High Street Walker"],[250,"Landmark Hunter"],[450,"Columbus Scholar"],[600,"Columbus Historian"]],"heroAlt":"The Ohio Statehouse","heroLi":"<li>Header: Warren LeMay · CC0 · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:Ohio_State_House,_Columbus,_OH_-_48310705042.jpg\">Source</a> · resized</li>","heroCredit":"Photo: Warren LeMay · <a target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/publicdomain/zero/1.0/\">CC0</a> · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:Ohio_State_House,_Columbus,_OH_-_48310705042.jpg\">Source</a>","mission":"Find four landmarks around Columbus. At each one, check in to earn its badge, unlock its story, and collect a Time Card. Do them in any order. Everything stays on this phone.","afterDone":"All four badges earned. The rest of Columbus is waiting.","safetyNote":"<li>Downtown Columbus has busy streets, bike lanes and construction. Use crosswalks, and keep off the Statehouse lawn when it is fenced for an event.</li>","badgeMap":{"statehouse":["cb_sh_now","50% 45%"],"union":["cb_us_now","50% 45%"],"leveque":["cb_lq_now","50% 45%"],"ohiotheatre":["cb_ot_now","50% 45%"]},"level":"Classics","region":"The Midwest","stops":[{"id":"statehouse","name":"Ohio Statehouse","short":"Statehouse","badge":"Statehouse","tag":"Stop 1 of 4","teaser":"A capitol with no dome, just a low cone where one should be.","map":"Ohio Statehouse, Capitol Square, Columbus, OH","clue":"Go to Capitol Square in the middle of downtown, at Broad and High Streets. Look for the big Greek-style building with tall columns and a low, cone-shaped roof over the middle.","safety":"Capitol Square is busy and sits between busy streets. Use crosswalks, stay on the sidewalks, and follow any posted signs about events or fenced areas.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"What sits on top of the Statehouse where many people expect to see a dome?","options":["A flat roof","A clock tower","A low conical roof","A round dome"],"answer":2,"hint":"Look up. The designers argued about this for years.","verify":"Wikipedia says the designers replaced the rounded dome with a low conical roof. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"1900 to 1910","label":"The Statehouse then","line":"A black-and-white view from High Street down a path to a statue, with the big columned building and its low cupola behind.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"cb_sh_then","by":"Unknown author (Library of Congress)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Columbus,_Ohio_10a.jpg","note":"resized"}},"now":{"yr":"Today","head":"Today","label":"The Statehouse today","line":"The tall columns and carved roofline of the Statehouse, with a row of flags in front and a skyscraper behind.","ph":{"k":"cb_sh_now","by":"Warren LeMay","lic":"CC0","lu":"https://creativecommons.org/publicdomain/zero/1.0/","page":"https://commons.wikimedia.org/wiki/File:Ohio_State_House,_Columbus,_OH_-_48310705042.jpg","note":"resized"}},"story":["The Ohio Statehouse is where Ohio's lawmakers meet in Columbus. It was built between 1839 and 1861, which makes it one of the oldest working statehouses in the United States. The cornerstone was laid on July 4, 1839, before the commission had even agreed on a final design.","The most striking choice was to leave off the rounded dome that earlier designers had suggested. Instead, a low conical roof sits on top of the cupola over the rotunda, right where many visitors expect a dome. Fire destroyed the old two-story capitol building in 1852, and the exact cause is still a mystery.","Inside, the rotunda floor is made of almost 5,000 individual pieces of marble, all cut and fitted by hand. President Abraham Lincoln visited the building on three different occasions."],"fact":"The cause of the 1852 fire in the old capitol was never found.","disputed":"Many people assume every state capitol has a dome. Wikipedia says this one dropped the dome on purpose, for a low conical roof.","claims":[{"t":"The Ohio Statehouse was built between 1839 and 1861.","a":0,"why":"Wikipedia: built between 1839 and 1861."},{"t":"The Statehouse has a rounded dome on top.","a":2,"why":"Wikipedia says it has a low conical roof where many viewers expect a dome."}],"sources":[{"t":"Wikipedia: Ohio Statehouse","u":"https://en.wikipedia.org/wiki/Ohio_Statehouse"},{"t":"Wikipedia: Columbus, Ohio","u":"https://en.wikipedia.org/wiki/Columbus,_Ohio"}],"card":{"a":"1839","b":"1861","la":"Cornerstone laid","lb":"Built"}},{"id":"union","name":"Columbus Union Station arch","short":"Union Station Arch","badge":"Union Station Arch","tag":"Stop 2 of 4","teaser":"A grand station torn down in 1976, except for one big arch.","map":"Union Station Arch, McFerson Commons, Arena District, Columbus, OH","clue":"Go to McFerson Commons park in the Arena District, just north of downtown. Look for a tall stone arch standing by itself, with columns on each side.","safety":"Stay on the park paths, use crosswalks to reach the park, and do not climb on the arch.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"Almost all of Union Station was demolished. What survives today?","options":["One of the arches","The clock tower","The ticket hall","The train platform"],"answer":0,"hint":"Most of the building was torn down in the 1970s, but a piece was saved for a park.","verify":"Wikipedia says a portion of the arcade, the Union Station arch, was saved and is now the focal point of McFerson Commons. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"Early 1900s","label":"The station then","line":"A black-and-white view of the arched station front, with smoke in the sky and a quiet cobbled street.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"cb_us_then","by":"Detroit Publishing Company","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Columbus_Union_Station_facade_from_the_north_(cropped).jpg","note":"resized"}},"now":{"yr":"2016","head":"Today","label":"The arch today","line":"The lone stone arch with its columns, in a park with trees and a brick plaza.","ph":{"k":"cb_us_now","by":"Pi.1415926535","lic":"CC BY-SA 3.0","lu":"https://creativecommons.org/licenses/by-sa/3.0/","page":"https://commons.wikimedia.org/wiki/File:Front_of_Columbus_Union_Station_arch,_September_2016.JPG","note":"resized"}},"story":["The first station on this site, built in 1851, was the first union station in the world, meaning several railroads shared one building. A bigger replacement went up in 1873 to 1875.","In 1893 Daniel Burnham, one of the main architects of the 1893 World's Columbian Exposition, began planning a new station. It opened in 1897, and its arcade along High Street was finished in 1899. The station's arches were framed by fluted columns, carved angels and decorative eagle medallions.","Passenger service fell sharply from the 1950s to the 1970s. The arcade was torn down in 1976 for a new convention center, even though it had been added to the National Register of Historic Places two years earlier. Train service stopped on April 28, 1977, and the rest of the station was demolished in 1979. One arch was saved, and it now stands in McFerson Commons."],"fact":"The first building here was the first union station in the world.","disputed":"Many people think a listed historic building can't be torn down. Wikipedia says this one was on the National Register in 1974 and the arcade was demolished in 1976 anyway.","claims":[{"t":"Daniel Burnham designed Columbus Union Station.","a":0,"why":"Wikipedia: Union Station was designed by Daniel Burnham."},{"t":"The whole arcade still stands along High Street.","a":2,"why":"It was demolished in 1976, and only one arch was saved."}],"sources":[{"t":"Wikipedia: Union Station (Columbus, Ohio)","u":"https://en.wikipedia.org/wiki/Union_Station_(Columbus,_Ohio)"},{"t":"Wikipedia: Daniel Burnham","u":"https://en.wikipedia.org/wiki/Daniel_Burnham"}],"card":{"a":"1897","b":"1976","la":"Station opens","lb":"Arcade demolished"}},{"id":"leveque","name":"LeVeque Tower","short":"LeVeque Tower","badge":"LeVeque Tower","tag":"Stop 3 of 4","teaser":"A 47-story skyscraper built five inches taller than the Washington Monument.","map":"LeVeque Tower, 50 W Broad Street, Columbus, OH","clue":"Go to West Broad Street near the Scioto River. Look for the tall cream-colored tower with a stepped top and decorated crown.","safety":"Broad Street is busy. Use crosswalks and look up from the sidewalk. The tower is now a hotel and offices, so stay out of private areas.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"The tower was built five inches taller than which famous monument?","options":["The Statue of Liberty","The Eiffel Tower","The Lincoln Memorial","The Washington Monument"],"answer":3,"hint":"It is a tall stone obelisk in the nation's capital.","verify":"Wikipedia says the tower was set 5 inches taller than the Washington Monument. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"1926","label":"The tower then","line":"An aerial view of the tower going up among low city blocks, with its main shaft already tall.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"cb_lq_then","by":"Mayfield Photos, Dayton","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Leveque_Tower_aerial.tif","note":"resized"}},"now":{"yr":"2017","head":"Today","label":"The tower today","line":"The slim cream-colored tower rising over lower buildings and trees under a cloudy sky.","ph":{"k":"cb_lq_now","by":"Sixflashphoto","lic":"CC BY-SA 4.0","lu":"https://creativecommons.org/licenses/by-sa/4.0/","page":"https://commons.wikimedia.org/wiki/File:LeVeque_Tower_NW_1.jpg","note":"resized"}},"story":["The LeVeque Tower has 47 stories and stands 555 feet 5 inches tall. It was Columbus's tallest building from 1927 to 1974, and it is still the second tallest. When it opened it was the fifth tallest building in the world.","It was built as the American Insurance Union Citadel, headquarters for a fraternal insurance group. C. Howard Crane designed it in the Art Deco style, covered in cream-colored terracotta and inspired by Byzantine architecture. It cost $8.7 million.","The insurance group went bankrupt in the Great Depression. The building was renamed the Lincoln-LeVeque Tower in 1946 and the LeVeque Tower in 1977. After a long renovation, it reopened in 2017 as a mix of hotel, apartments, condos, offices and a restaurant."],"fact":"It was made exactly 5 inches taller than the Washington Monument on purpose.","disputed":"Many people think the tower has always carried the LeVeque name. Wikipedia says it opened as the American Insurance Union Citadel.","claims":[{"t":"The LeVeque Tower opened in 1927.","a":0,"why":"Wikipedia: completed in 1927."},{"t":"It has always been called the LeVeque Tower.","a":2,"why":"It opened as the American Insurance Union Citadel and was renamed twice."}],"sources":[{"t":"Wikipedia: LeVeque Tower","u":"https://en.wikipedia.org/wiki/LeVeque_Tower"},{"t":"Wikipedia: Columbus, Ohio","u":"https://en.wikipedia.org/wiki/Columbus,_Ohio"}],"card":{"a":"1927","b":"2017","la":"Tower opens","lb":"Reopens after renovation"}},{"id":"ohiotheatre","name":"Ohio Theatre","short":"Ohio Theatre","badge":"Ohio Theatre","tag":"Stop 4 of 4","teaser":"A movie palace saved from demolition and still the state's official theater.","map":"Ohio Theatre, Capitol Square, Columbus, OH","clue":"Go to Capitol Square, across from the Statehouse. Look for the tall cream-colored building with arched windows and a marquee.","safety":"The streets here are busy. Use crosswalks and view the building from the public sidewalk.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"Which film star was in the first movie shown at Loew's Ohio in 1928?","options":["Mary Pickford","Greta Garbo","Charlie Chaplin","Judy Garland"],"answer":1,"hint":"The film was a silent picture called The Divine Woman.","verify":"Wikipedia says the first film shown was The Divine Woman, a silent film with Greta Garbo. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"About 1936 to 1940","label":"The theater then","line":"A night view of the building with a glowing OHIO THEATRE sign above its columns and a field gun in the foreground.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"cb_ot_then","by":"Ohio Federal Writers' Project","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Ohio_Theatre_photograph.png","note":"resized"}},"now":{"yr":"2019","head":"Today","label":"The theater today","line":"The cream-colored front with tall arched windows and a marquee, with towers behind.","ph":{"k":"cb_ot_now","by":"Warren LeMay","lic":"CC0","lu":"https://creativecommons.org/publicdomain/zero/1.0/","page":"https://commons.wikimedia.org/wiki/File:Ohio_Theatre,_Columbus,_OH.jpg","note":"resized"}},"story":["The Ohio Theatre stands on Capitol Square on the site of the old Columbus City Hall. Thomas W. Lamb, a famous theater architect, designed it, and he called it one of his most successful. Inside, it was built to feel like a luxurious fantasy world, with rooms decorated in different themes.","It opened on March 17, 1928 as Loew's Ohio, a Spanish Baroque movie palace seating more than 3,000. The first film was The Divine Woman, a silent movie. The theater had its own orchestra and a Robert Morton organ that is still in use today.","Movie attendance fell in the 1950s and 1960s, and the theater was nearly demolished. A group formed in 1969 to save it, and it was later completely restored. It was declared a National Historic Landmark in 1977, and it is known as the Official Theatre of the State of Ohio."],"fact":"The theater's original organ still plays.","disputed":"Many people think a historic movie palace has always been a concert hall. Wikipedia says the Ohio opened as a movie palace and later became a performing arts center.","claims":[{"t":"The Ohio Theatre opened in 1928.","a":0,"why":"Wikipedia: it opened on March 17, 1928."},{"t":"The Ohio Theatre was built as a concert hall for live shows only.","a":2,"why":"It opened as Loew's Ohio, a movie palace."}],"sources":[{"t":"Wikipedia: Ohio Theatre (Columbus, Ohio)","u":"https://en.wikipedia.org/wiki/Ohio_Theatre_(Columbus,_Ohio)"},{"t":"Wikipedia: Thomas W. Lamb","u":"https://en.wikipedia.org/wiki/Thomas_W._Lamb"}],"card":{"a":"1928","b":"1977","la":"Opens as a movie palace","lb":"National Historic Landmark"}}],"heroKey":"cb_sh_now"},"gettysburg":{"id":"gettysburg","name":"Gettysburg","explorer":"Remembrance Explorer","initials":"GBG","ranks":[[0,"Visitor"],[100,"Town Walker"],[250,"Landmark Hunter"],[450,"Gettysburg Scholar"],[600,"Gettysburg Historian"]],"heroAlt":"Pennsylvania Hall at Gettysburg College","heroLi":"<li>Header: Smb51095 · CC BY-SA 4.0 · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:Pennsylvania_Hall_in_the_spring.jpg\">Source</a> · resized</li>","heroCredit":"Photo: Smb51095 · <a target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by-sa/4.0/\">CC BY-SA 4.0</a> · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:Pennsylvania_Hall_in_the_spring.jpg\">Source</a>","mission":"Find four landmarks around Gettysburg. At each one, check in to earn its badge, unlock its story, and collect a Time Card. Do them in any order. Everything stays on this phone.","afterDone":"All four badges earned. The rest of Gettysburg is waiting.","safetyNote":"<li>Gettysburg is a small town with busy roads and tour traffic. Use crosswalks, be quiet and respectful in the cemetery, and never climb on monuments or walls.</li>","badgeMap":{"wills":["gb_wh_now","50% 45%"],"penn":["gb_ph_now","50% 45%"],"monument":["gb_sm_now","50% 45%"],"cemetery":["gb_nc_now","50% 45%"]},"level":"Classics","region":"The East","stops":[{"id":"wills","name":"David Wills House","short":"Wills House","badge":"Wills House","tag":"Stop 1 of 4","teaser":"The house where Lincoln finished the Gettysburg Address.","map":"David Wills House, Lincoln Square, Gettysburg, PA","clue":"Go to Lincoln Square, the town's central circle. Look for a three-story brick house with green shutters on the corner.","safety":"Lincoln Square is busy with cars and tour groups. Use crosswalks and view the house from the sidewalk.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"Who was Lincoln's host in Gettysburg?","options":["David McConaughy","David Wills","Thaddeus Stevens","Andrew Curtin"],"answer":1,"hint":"He was a local lawyer who suggested the soldiers' cemetery.","verify":"Wikipedia says Wills was Lincoln's host in Gettysburg. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"About 1930 to 1945","label":"The house then","line":"A colored postcard of the three-story brick house with green shutters, small trees and a horse and buggy out front.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"gb_wh_then","by":"L. E. Smith, Wholesale Distributor (postcard)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:The_Will's_House,_where_Lincoln_wrote_his_Gettysburg_address,_Gettysburg,_Pa_(64226).jpg","note":"resized"}},"now":{"yr":"2013","head":"Today","label":"The house today","line":"A restored upstairs bedroom inside the house museum, with a wooden bed, a washstand and a green armchair.","ph":{"k":"gb_wh_now","by":"Ron Cogswell","lic":"CC BY 2.0","lu":"https://creativecommons.org/licenses/by/2.0/","page":"https://commons.wikimedia.org/wiki/File:The_David_Wills_House_Gettysburg_(PA)_2013_(9387972956).jpg","note":"resized"}},"story":["David Wills was a Gettysburg lawyer. After the Battle of Gettysburg he suggested a national cemetery for the soldiers to Governor Andrew Curtin, who then made him the state's agent to organize it. Because of his work, Abraham Lincoln came to Gettysburg to speak.","Wills invited Lincoln to stay at his house. On November 18, 1863, the night before the ceremony, Lincoln wrote the final draft of the Gettysburg Address in the large upstairs bedroom he was using. During the battle, local people had sheltered in Wills' cellar.","Today the Wills House is a historic house museum operated for visitors."],"fact":"Lincoln finished the speech the night before he gave it.","disputed":"Many people picture Lincoln scribbling the speech in a rush. Wikipedia says he completed the final draft here, in the Wills House, on November 18.","claims":[{"t":"Lincoln wrote the final draft of the Gettysburg Address in the Wills House.","a":0,"why":"Wikipedia: the final draft was written in the Wills House on November 18, 1863."},{"t":"Lincoln gave the speech from the steps of the Wills House.","a":2,"why":"He delivered it the next afternoon at the Soldiers' National Cemetery."}],"sources":[{"t":"Wikipedia: David Wills (Gettysburg)","u":"https://en.wikipedia.org/wiki/David_Wills_(Gettysburg)"},{"t":"Wikipedia: Gettysburg Address","u":"https://en.wikipedia.org/wiki/Gettysburg_Address"}],"card":{"a":"1863","b":"2013","la":"Final draft written","lb":"Museum open"}},{"id":"penn","name":"Pennsylvania Hall","short":"Old Dorm","badge":"Old Dorm","tag":"Stop 2 of 4","teaser":"A college building that became a hospital in 1863.","map":"Pennsylvania Hall, Gettysburg College, Gettysburg, PA","clue":"Go to the Gettysburg College campus, north of downtown. Look for the white building with four tall columns and a small cupola on top.","safety":"Stay on the campus paths and public lawns, use crosswalks to reach the campus, and be quiet around any classes.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"What was Pennsylvania Hall used for after the Battle of Gettysburg began?","options":["A hotel","A courthouse","A train station","A hospital"],"answer":3,"hint":"Many people needed care in the days after the fighting.","verify":"Wikipedia says it was used as a hospital for wounded troops of both armies. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"1950","label":"The hall then","line":"A black-and-white view of the white building with its four columns, wide steps and a small cupola.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"gb_ph_then","by":"Frederick Tilberg","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Pennsylvania_Hall,_Gettysburg_College.jpg","note":"resized"}},"now":{"yr":"2015","head":"Today","label":"The hall today","line":"The columned white building on a sunny lawn, with banners hung between the columns and a path beside it.","ph":{"k":"gb_ph_now","by":"Smb51095","lic":"CC BY-SA 4.0","lu":"https://creativecommons.org/licenses/by-sa/4.0/","page":"https://commons.wikimedia.org/wiki/File:Pennsylvania_Hall_in_the_spring.jpg","note":"resized"}},"story":["Pennsylvania Hall, also called Old Dorm, is the central administration building at Gettysburg College and the college's oldest building. John Cresson Trautwine designed it in 1835, and it was built in 1838 in a temple style with four columns in the portico. At first it held students' rooms, offices and classrooms.","When the battle came in July 1863, it was the largest building in town. Union signal officers used its cupola on June 30, and on July 1 a professor led officers up to look out over the area. Soldiers of both armies were treated in the building, nearly 700 of them, until about July 29.","Classes started again on September 24, 1863. The hall was renovated in 1869 and 1870, 1889, and 1928. It is still used for the college's opening and graduation traditions."],"fact":"It was the largest building in town in 1863.","disputed":"Many people think the whole college was a battlefield only. Wikipedia says this building was used as a hospital for both armies.","claims":[{"t":"Pennsylvania Hall is the oldest building at Gettysburg College.","a":0,"why":"Wikipedia: it is the college's oldest building."},{"t":"Only Union soldiers were treated in the building.","a":2,"why":"Soldiers of both armies were treated there."}],"sources":[{"t":"Wikipedia: Pennsylvania Hall (Gettysburg, Pennsylvania)","u":"https://en.wikipedia.org/wiki/Pennsylvania_Hall_(Gettysburg,_Pennsylvania)"},{"t":"Wikipedia: Gettysburg College","u":"https://en.wikipedia.org/wiki/Gettysburg_College"}],"card":{"a":"1838","b":"1863","la":"Built","lb":"Hospital"}},{"id":"monument","name":"Soldiers' National Monument","short":"Soldiers' Monument","badge":"Soldiers' Monument","tag":"Stop 3 of 4","teaser":"A 60-foot monument that people often think marks the spot of the speech.","map":"Soldiers' National Monument, Gettysburg National Cemetery, Gettysburg, PA","clue":"Go to Gettysburg National Cemetery on Cemetery Hill, just south of downtown. Look for the tall granite monument at the center, with graves in curved rows around it.","safety":"This is a cemetery. Be quiet and respectful, stay on the paths, and never climb on the monument or step on the graves.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"What do the 18 bronze stars around the base stand for?","options":["The Union states with soldiers buried here","The generals in the battle","The years of the war","The regiments in the battle"],"answer":0,"hint":"They stand for something that is also divided into sections in the cemetery.","verify":"Wikipedia says the stars represent the eighteen Union states with buried dead. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"1865","label":"The cornerstone then","line":"An 1865 magazine print of men in sashes standing around the cornerstone in a crowd. This is the cornerstone ceremony, before the monument was built.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"gb_sm_then","by":"Harper's Weekly","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Masonic_Conescecration_of_Solder_Monument_Gettysburg_PA.jpg","note":"resized, cropped"}},"now":{"yr":"2017","head":"Today","label":"The monument today","line":"The tall white granite monument with its statues at the base, against a blue sky.","ph":{"k":"gb_sm_now","by":"Farragutful","lic":"CC BY-SA 4.0","lu":"https://creativecommons.org/licenses/by-sa/4.0/","page":"https://commons.wikimedia.org/wiki/File:Soldiers'_National_Monument_-_Gettysburg_National_Cemetery.jpg","note":"resized"}},"story":["Soldiers' National Monument stands at the central point of Gettysburg National Cemetery. The monument is 60 feet tall, made of granite, and designed by sculptor Randolph Rogers and architect George Keller. The last four lines of the Gettysburg Address are written on it.","A statue of the Genius of Liberty stands on top, and eighteen bronze stars circle the pedestal, one for each Union state with buried dead. Four statues at the corners are War, History, Peace and Plenty, and together they tell a story of peace and plenty after a hard struggle.","The cornerstone was laid on July 4, 1865, and the monument was dedicated in 1869. Many people think it marks where Lincoln gave his speech. Wikipedia says it does not: scholars place the speech about 40 yards east of the monument."],"fact":"The Genius of Liberty statue was carved in Rome.","disputed":"Many people think the monument stands on the exact spot of the Gettysburg Address. Wikipedia says it does not.","claims":[{"t":"The monument was dedicated in 1869.","a":0,"why":"Wikipedia: dedicated in 1869."},{"t":"The monument stands on the exact spot where Lincoln gave the Gettysburg Address.","a":2,"why":"Wikipedia says that is a popular belief but not true."}],"sources":[{"t":"Wikipedia: Soldiers' National Monument","u":"https://en.wikipedia.org/wiki/Soldiers%27_National_Monument"},{"t":"Wikipedia: Gettysburg National Cemetery","u":"https://en.wikipedia.org/wiki/Gettysburg_National_Cemetery"}],"card":{"a":"1865","b":"1869","la":"Cornerstone laid","lb":"Dedicated"}},{"id":"cemetery","name":"Gettysburg National Cemetery","short":"National Cemetery","badge":"National Cemetery","tag":"Stop 4 of 4","teaser":"Where Lincoln gave a speech of 271 words in under two minutes.","map":"Gettysburg National Cemetery, Gettysburg, PA","clue":"Go to Cemetery Hill, just south of downtown. Look for the iron gate and the grassy hillside with curved rows of graves.","safety":"This is a cemetery. Be quiet and respectful, stay on the paths, and do not step on graves. Dress for weather, since the hill is open and windy.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"How many words is the Gettysburg Address?","options":["1,000","2,700","271","27"],"answer":2,"hint":"It is famous for how short it is.","verify":"Wikipedia says the speech has only 271 words. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"November 19, 1863","label":"The dedication then","line":"A crowd of people in dark coats and hats, packed close together at the dedication.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"gb_nc_then","by":"David Bachrach","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Lincoln's_Gettysburg_Address,_Gettysburg.jpg","note":"resized"}},"now":{"yr":"2019","head":"Today","label":"The cemetery today","line":"Curved rows of graves on a green hill with the tall monument in the distance under a blue sky.","ph":{"k":"gb_nc_now","by":"P. Hughes","lic":"CC BY-SA 4.0","lu":"https://creativecommons.org/licenses/by-sa/4.0/","page":"https://commons.wikimedia.org/wiki/File:Gettysburg_National_Cemetery_(2019).jpg","note":"resized"}},"story":["Gettysburg National Cemetery was originally called Soldiers' National Cemetery. It was created for Union soldiers who died in the Battle of Gettysburg, which was fought July 1 to 3, 1863. It has 3,512 Civil War burials, including 979 unknowns, and later sections for veterans of other wars. In all it holds more than 6,000 burials.","On November 19, 1863, four and a half months after the battle, Abraham Lincoln came here to take part in the consecration of the cemetery. His speech has only 271 words, and he read it in less than two minutes to about 15,000 people.","Every year the day of the speech is marked in town as Remembrance Day, with a parade and ceremonies."],"fact":"The speech was shorter than most of the day's other talks.","disputed":"Many people think a famous speech must have been long. Wikipedia says this one has only 271 words and took less than two minutes.","claims":[{"t":"The Gettysburg Address has 271 words.","a":0,"why":"Wikipedia: only 271 words."},{"t":"Lincoln spoke for more than an hour.","a":2,"why":"Wikipedia says it was read in less than two minutes."}],"sources":[{"t":"Wikipedia: Gettysburg National Cemetery","u":"https://en.wikipedia.org/wiki/Gettysburg_National_Cemetery"},{"t":"Wikipedia: Gettysburg Address","u":"https://en.wikipedia.org/wiki/Gettysburg_Address"}],"card":{"a":"1863","b":"1863","la":"Battle in July","lb":"Speech in November"}}],"heroKey":"gb_ph_now"},"louisville":{"id":"louisville","name":"Louisville","explorer":"Derby City Explorer","initials":"SDF","ranks":[[0,"Visitor"],[100,"River Walker"],[250,"Landmark Hunter"],[450,"Louisville Scholar"],[600,"Louisville Historian"]],"heroAlt":"The twin spires of Churchill Downs","heroLi":"<li>Header: JazzyJoeyD · CC BY-SA 4.0 · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:Twin_Spires_at_Churchill_Downs.jpg\">Source</a> · resized</li>","heroCredit":"Photo: JazzyJoeyD · <a target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by-sa/4.0/\">CC BY-SA 4.0</a> · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:Twin_Spires_at_Churchill_Downs.jpg\">Source</a>","mission":"Find four landmarks around Louisville. At each one, check in to earn its badge, unlock its story, and collect a Time Card. Do them in any order. Everything stays on this phone.","afterDone":"All four badges earned. The rest of Louisville is waiting.","safetyNote":"<li>Downtown Louisville has busy one-way streets and bike lanes. Use crosswalks, stay clear of the riverbank, and be extra careful around Churchill Downs on race days.</li>","badgeMap":{"churchill":["lv_cd_now","50% 45%"],"seelbach":["lv_sb_now","50% 45%"],"union":["lv_us_now","50% 45%"],"galt":["lv_gh_now","50% 45%"]},"level":"Classics","region":"The South","stops":[{"id":"churchill","name":"Churchill Downs","short":"Churchill Downs","badge":"Churchill Downs","tag":"Stop 1 of 4","teaser":"The racetrack with two spires that crowns the Kentucky Derby winner in roses.","map":"Churchill Downs, Louisville, KY","clue":"Go to Churchill Downs, the racetrack south of downtown. Look for the huge grandstand with two pointed spires on top.","safety":"Race days are very crowded and traffic is heavy. Use crosswalks, stay on public sidewalks, and do not enter the track or stable areas.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"In 1896, Derby winners began getting what draped over them?","options":["A silver horseshoe","A garland of roses","A gold cup","A blanket of tulips"],"answer":1,"hint":"It is a flower, and the Derby is known by it.","verify":"Wikipedia says adorning the winner with a garland of roses began in 1896. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"1901","label":"The track then","line":"A black-and-white view of the long grandstand with two spires, beside the empty dirt track.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"lv_cd_then","by":"Unknown author","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Churchill_Downs_1901.jpg","note":"resized"}},"now":{"yr":"2024","head":"Today","label":"The spires today","line":"One of the two spires up close, with the roof and grandstand behind it under a cloudy sky.","ph":{"k":"lv_cd_now","by":"JazzyJoeyD","lic":"CC BY-SA 4.0","lu":"https://creativecommons.org/licenses/by-sa/4.0/","page":"https://commons.wikimedia.org/wiki/File:Twin_Spires_at_Churchill_Downs.jpg","note":"resized"}},"story":["Churchill Downs has hosted the Kentucky Derby every year since it opened in 1875. It is named for the Churchill family, who leased 80 acres to their nephew, Colonel Meriwether Lewis Clark Jr., a grandson of the explorer William Clark. He wanted a fancy track like Epsom Downs in England.","In 1894 a new group bought the track. It commissioned the twin spire grandstand in 1895, cut the Derby down to its modern length of 1 and a quarter miles in 1896, and began giving the winner a garland of roses that same year. The twin spires, designed by D.X. Murphy & Bro., are now the symbol of the track.","Churchill Downs was designated a National Historic Landmark in 1986. With the infield open on Derby day, it can hold roughly 170,000 people."],"fact":"The Derby was shortened to its modern length in 1896.","disputed":"Many people think the Derby has always been the same race. Wikipedia says it was shortened to 1 and a quarter miles in 1896.","claims":[{"t":"The twin spire grandstand was commissioned in 1895.","a":0,"why":"Wikipedia: commissioned in 1895."},{"t":"The Derby has always been 1 and a quarter miles long.","a":2,"why":"Wikipedia says it was shortened to that length in 1896."}],"sources":[{"t":"Wikipedia: Churchill Downs","u":"https://en.wikipedia.org/wiki/Churchill_Downs"},{"t":"Wikipedia: Kentucky Derby","u":"https://en.wikipedia.org/wiki/Kentucky_Derby"}],"card":{"a":"1875","b":"1896","la":"Track opens","lb":"Roses and a shorter Derby"}},{"id":"seelbach","name":"Seelbach Hotel","short":"Seelbach Hotel","badge":"Seelbach Hotel","tag":"Stop 2 of 4","teaser":"A hotel with nine U.S. presidents on its guest list and a spot in a famous novel.","map":"Seelbach Hotel, 4th Street and Muhammad Ali Boulevard, Louisville, KY","clue":"Go to the corner of Fourth Street and Muhammad Ali Boulevard, which used to be called Walnut Street. Look for the tall, stone-and-brick hotel with a curved awning at the door.","safety":"Downtown streets are busy. Use crosswalks, and be polite in the lobby, since it is a working hotel.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"Which writer took inspiration from the Seelbach for a hotel in The Great Gatsby?","options":["Ernest Hemingway","Mark Twain","Charles Dickens","F. Scott Fitzgerald"],"answer":3,"hint":"He wrote about the Jazz Age in the 1920s.","verify":"Wikipedia says F. Scott Fitzgerald took inspiration from the Seelbach for a hotel in The Great Gatsby. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"About 1905","label":"The hotel then","line":"A black-and-white photo of the tall hotel on a street corner with trolley wires overhead and people crossing.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"lv_sb_then","by":"Detroit Publishing Co.","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Seelbach_circa_1905.jpg","note":"resized, cropped"}},"now":{"yr":"2010","head":"Today","label":"The hotel today","line":"The stone arches and curved awning over the hotel's front door, with flags above.","ph":{"k":"lv_sb_now","by":"local louisville","lic":"CC BY 2.0","lu":"https://creativecommons.org/licenses/by/2.0/","page":"https://commons.wikimedia.org/wiki/File:Seelbach_Hotel,_Louisville.jpg","note":"resized"}},"story":["Louis and Otto Seelbach were brothers from Bavaria who wanted Louisville's first grand hotel, modeled on old-world hotels in cities like Vienna and Paris. They broke ground in December 1903, and the Seelbach opened on May 1, 1905, just in time for the Kentucky Derby. More than 25,000 people visited on opening day.","It was built in a French Renaissance style, with marble from Italy, Germany and France and wood from the West Indies and Europe. A second phase opened on January 1, 1907 and raised the number of rooms from 150 to 500.","When the brothers proposed the site, the mayor said, \"No one will come to a hotel so far away.\" He was wrong: the hotel became the center of a busy shopping district. Nine U.S. presidents have stayed here, from William Howard Taft in 1911 to George W. Bush in 2002."],"fact":"On opening day, every one of the 150 rooms had a dinner party.","disputed":"Many people assume leaders always back a big project. Wikipedia says the mayor told the brothers no one would come to a hotel so far away.","claims":[{"t":"The Seelbach opened in 1905.","a":0,"why":"Wikipedia: opened May 1, 1905."},{"t":"The mayor of Louisville said the hotel would be a huge success.","a":2,"why":"Wikipedia says he said no one would come to a hotel so far away."}],"sources":[{"t":"Wikipedia: Seelbach Hotel","u":"https://en.wikipedia.org/wiki/Seelbach_Hotel"},{"t":"Wikipedia: Louisville","u":"https://en.wikipedia.org/wiki/Louisville,_Kentucky"}],"card":{"a":"1905","b":"1907","la":"Opens with 150 rooms","lb":"Grows to 500"}},{"id":"union","name":"Louisville Union Station","short":"Union Station","badge":"Union Station","tag":"Stop 3 of 4","teaser":"A castle-style train station that
