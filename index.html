media.org/wiki/File:C_and_O_Rly_Station,_Richmond,_Va._(16836345651).jpg","note":"resized, cropped"}},"now":{"yr":"2025","head":"Today","label":"The station today","line":"The station's clock tower and red-tile roof, with a highway overpass beside it.","ph":{"k":"rm_st_now","by":"Schützenpanzer","lic":"CC BY-SA 4.0","lu":"https://creativecommons.org/licenses/by-sa/4.0/","page":"https://commons.wikimedia.org/wiki/File:Richmond_Main_Street_Station.jpg","note":"resized"}},"story":["Main Street Station was built in 1901 by two railroads, the Seaboard Air Line and the Chesapeake and Ohio, which had each used separate stations before. The Philadelphia firm of Wilson, Harris, and Richards designed it in the Second Renaissance Revival style. The people of Richmond call it The Clock Tower.","It became a National Historic Landmark in 1976. In 1972, Hurricane Agnes flooded the station so badly that Amtrak moved most of its Richmond stops to a smaller station in the suburbs in 1975. Fires hit the building in 1976 and 1983.","After the 1983 fire it was renovated and reopened as a shopping mall in 1985, but the mall closed in 1986. Amtrak serves the station today, and it is also a stop on the GRTC Pulse bus line."],"fact":"Locals call it The Clock Tower.","disputed":"Many people think a station this old must always have been used for trains. Wikipedia says it was a shopping mall for a short time in the 1980s.","claims":[{"t":"Main Street Station was built in 1901.","a":0,"why":"Wikipedia: built in 1901."},{"t":"The station was a mall for more than thirty years.","a":2,"why":"The mall opened in 1985 and closed in 1986."}],"sources":[{"t":"Wikipedia: Richmond Main Street Station","u":"https://en.wikipedia.org/wiki/Richmond_Main_Street_Station"},{"t":"Wikipedia: Hurricane Agnes","u":"https://en.wikipedia.org/wiki/Hurricane_Agnes"}],"card":{"a":"1901","b":"1976","la":"Built","lb":"National Historic Landmark"}}],"heroKey":"rm_cap_now"},"charleston":{"id":"charleston","name":"Charleston","explorer":"Holy City Explorer","initials":"CHS","ranks":[[0,"Visitor"],[100,"Battery Walker"],[250,"Landmark Hunter"],[450,"Charleston Scholar"],[600,"Charleston Historian"]],"heroAlt":"Rainbow Row in Charleston","heroLi":"<li>Header: Thomson200 · CC0 · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:Rainbow_Row_Charleston_July_2024_1.jpg\">Source</a> · resized</li>","heroCredit":"Photo: Thomson200 · <a target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/publicdomain/zero/1.0/\">CC0</a> · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:Rainbow_Row_Charleston_July_2024_1.jpg\">Source</a>","mission":"Find four landmarks around Charleston. At each one, check in to earn its badge, unlock its story, and collect a Time Card. Do them in any order. Everything stays on this phone.","afterDone":"All four badges earned. The rest of Charleston is waiting.","safetyNote":"<li>Downtown Charleston has narrow streets, horse carriages, uneven sidewalks and sudden rain. Use crosswalks, watch for carriages and bikes, and keep back from the water by the Battery.</li>","badgeMap":{"rainbow":["ch_rb_now","50% 45%"],"exchange":["ch_ex_now","50% 45%"],"garden":["ch_ga_now","50% 45%"],"church":["ch_ch_now","50% 45%"]},"level":"Classics","region":"The South","stops":[{"id":"rainbow","name":"Rainbow Row","short":"Rainbow Row","badge":"Rainbow Row","tag":"Stop 1 of 4","teaser":"Thirteen houses painted in pastel colors that were once nearly a slum.","map":"Rainbow Row, 79-107 East Bay St, Charleston, SC","clue":"Go to East Bay Street, north of Tradd Street. Look for a long row of connected houses in pink, blue, green and yellow.","safety":"East Bay Street has traffic and parked cars. Use crosswalks and look from the sidewalk. These houses are private homes, so do not knock or step onto the porches.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"In which decades were the pastel colors first painted on the houses?","options":["The 1730s and 1740s","The 1830s and 1840s","The 1930s and 1940s","The 1980s and 1990s"],"answer":2,"hint":"It happened when the houses were being restored, long after the Civil War.","verify":"Wikipedia says the name came from the pastel colors painted as the houses were restored in the 1930s and 1940s. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"1902","label":"The row then","line":"A faded photo of East Bay Street from April 1902, with a man standing in the road and a telegraph pole.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"ch_rb_then","by":"Unknown author","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Rainbow_Row_(Apr_5_1902).jpg","note":"resized, cropped"}},"now":{"yr":"2024","head":"Today","label":"The row today","line":"The pink and pastel houses lined up along East Bay Street, with palm trees and parked cars.","ph":{"k":"ch_rb_now","by":"Thomson200","lic":"CC0","lu":"https://creativecommons.org/publicdomain/zero/1.0/","page":"https://commons.wikimedia.org/wiki/File:Rainbow_Row_Charleston_July_2024_1.jpg","note":"resized"}},"story":["Rainbow Row is a series of thirteen historic houses at 79 to 107 East Bay Street. It originally fronted the Cooper River, but the land was filled in later. Merchants built stores on the ground floor and homes above.","A fire in 1778 destroyed much of the neighborhood. After the Civil War the area slid into near slum conditions. In the 1920s, Susan Pringle Frost, who founded the Society for the Preservation of Old Dwellings, bought six of the buildings.","In 1931, Dorothy Haskell Porcher Legge bought 99 through 101 East Bay and painted them pink, based on a colonial Caribbean color scheme. Other owners followed. By 1945 most of the houses had been restored."],"fact":"A pink house started the rainbow.","disputed":"Some stories say the colors helped drunk sailors find their house. Wikipedia lists that as a common myth.","claims":[{"t":"Rainbow Row has thirteen houses.","a":0,"why":"Wikipedia: thirteen colorful historic houses."},{"t":"The pastel colors date from the 1700s.","a":2,"why":"They date from the 1930s and 1940s restorations."}],"sources":[{"t":"Wikipedia: Rainbow Row","u":"https://en.wikipedia.org/wiki/Rainbow_Row"},{"t":"Wikipedia: Charleston, South Carolina","u":"https://en.wikipedia.org/wiki/Charleston,_South_Carolina"}],"card":{"a":"1778","b":"1931","la":"Fire destroys the area","lb":"First house painted pink"}},{"id":"exchange","name":"Old Exchange","short":"Old Exchange","badge":"Old Exchange","tag":"Stop 2 of 4","teaser":"A colonial building that was a prison, a post office and a tea warehouse.","map":"Old Exchange & Provost Dungeon, 122 E Bay St, Charleston, SC","clue":"Go to the corner of East Bay and Broad Streets. Look for a two-story building with three round arches at the bottom and a little cupola on the roof.","safety":"East Bay and Broad Streets are busy. Use crosswalks, and check the museum's hours before going inside.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"In 1913, who was granted the Old Exchange and has preserved it ever since?","options":["The Boy Scouts","The Daughters of the American Revolution","The U.S. Navy","The Charleston Fire Department"],"answer":1,"hint":"The group's name is about the American Revolution.","verify":"Wikipedia says the building was granted to the Daughters of the American Revolution in 1913. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"About 1906","label":"The Exchange then","line":"A hand-colored postcard of the Exchange with telegraph poles and wires in front.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"ch_ex_then","by":"Unknown author","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Charleston_-_The_Old_Exchange.jpg","note":"resized, cropped"}},"now":{"yr":"2019","head":"Today","label":"The Exchange today","line":"The building with its round arches and cupola, with traffic on the street.","ph":{"k":"ch_ex_now","by":"Warren LeMay","lic":"CC0","lu":"https://creativecommons.org/publicdomain/zero/1.0/","page":"https://commons.wikimedia.org/wiki/File:Old_Exchange_Building,_French_Quarter,_Charleston,_SC_(49431763253).jpg","note":"resized"}},"story":["The Old Exchange was built between 1767 and 1771 by South Carolina's provincial government. It served as a custom house, a public market, a meeting place and a jail. In 1774, confiscated tea was stored here.","After the British captured the city in 1780, they used it as a barracks and put prisoners in the basement. A 2012 study documented at least 120 prisoners held there. In 1788 the building hosted the South Carolina convention that voted to ratify the United States Constitution.","It later served as a post office. Wikipedia also notes that enslaved people were sold in front of and north of the building for many years. The building became a National Historic Landmark in 1973 and is now a museum."],"fact":"George Washington greeted a crowd from its balcony.","disputed":"Many people think the dungeon was only for rebels. Wikipedia says some British soldiers were held there too.","claims":[{"t":"The Old Exchange was built between 1767 and 1771.","a":0,"why":"Wikipedia: built from 1767 to 1771."},{"t":"The Old Exchange was only ever a museum.","a":2,"why":"It was also a custom house, market, jail, barracks and post office."}],"sources":[{"t":"Wikipedia: Exchange and Provost","u":"https://en.wikipedia.org/wiki/Exchange_and_Provost"},{"t":"Wikipedia: Charleston, South Carolina","u":"https://en.wikipedia.org/wiki/Charleston,_South_Carolina"}],"card":{"a":"1771","b":"1913","la":"Built","lb":"Daughters of the American Revolution take over"}},{"id":"garden","name":"White Point Garden","short":"White Point Garden","badge":"White Point Garden","tag":"Stop 3 of 4","teaser":"A seaside park full of cannons and mortars at the tip of the city.","map":"White Point Garden, Murray Blvd, Charleston, SC","clue":"Go to the very southern tip of Charleston, where East Battery meets South Battery. Look for a big green park with oak trees, old cannons and a monument.","safety":"Stay back from the seawall and the water. Watch for horse carriages and bikes, and do not climb on the cannons or the monuments.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"How much does each of the 13-inch Union mortars in the park weigh?","options":["170 pounds","1,700 pounds","17,000 pounds","170,000 pounds"],"answer":2,"hint":"It is as heavy as several cars.","verify":"Wikipedia says the four 13-inch Union mortars weigh 17,000 pounds each. Look for the plaques on site. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"About 1905","label":"The garden then","line":"A postcard of a stone monument on a pedestal under big oak trees, labeled South Battery.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"ch_ga_then","by":"Hugh C. Leighton Co.","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Charleston_-_South_Battery_showing_Jasper_Monument.jpg","note":"resized, cropped"}},"now":{"yr":"2022","head":"Today","label":"The garden today","line":"Tall wooden homes with porches beside the garden, under palm trees.","ph":{"k":"ch_ga_now","by":"P. Hughes","lic":"CC BY-SA 4.0","lu":"https://creativecommons.org/licenses/by-sa/4.0/","page":"https://commons.wikimedia.org/wiki/File:Charleston_-_Mansions_next_to_White_Point_Garden.jpg","note":"resized"}},"story":["White Point Garden is a 5.7-acre park at the tip of the Charleston peninsula. It is the southern end of the Battery, a defensive seawall and promenade. The tip used to be called Oyster Point, and landfill later shaped the sharp point.","From about 1840 to 1881 a public bathing house stood at the end of King Street, with a cake and ice cream parlor on the top floor. It was removed in 1881 as the garden and waterfront were filled in.","The garden has a largely military theme. Two guns from the USS Keokuk were installed in 1900. Keokuk was sunk by Charleston's forts in April 1863. Along East Battery is an 11-inch Dahlgren gun from the Keokuk that fired shells at Fort Sumter in 1863."],"fact":"It used to have a bathing house with an ice cream parlor.","disputed":"Many people think the park has always been on solid land. Wikipedia says the tip of the peninsula was shaped by landfill.","claims":[{"t":"White Point Garden is about 5.7 acres.","a":0,"why":"Wikipedia: a 5.7 acre public park."},{"t":"A bathing house stood here until 1981.","a":2,"why":"It was removed in 1881."}],"sources":[{"t":"Wikipedia: White Point Garden","u":"https://en.wikipedia.org/wiki/White_Point_Garden"},{"t":"Wikipedia: USS Keokuk (1862)","u":"https://en.wikipedia.org/wiki/USS_Keokuk_(1862)"}],"card":{"a":"1840","b":"1881","la":"Bathing house built","lb":"Bathing house removed"}},{"id":"church","name":"St. Michael's Church","short":"St. Michael's","badge":"St. Michael's","tag":"Stop 4 of 4","teaser":"The oldest surviving church in Charleston, with a steeple that guided sailors.","map":"St. Michael's Church, 80 Meeting St, Charleston, SC","clue":"Go to the corner of Broad and Meeting Streets. Look for a white church with a columned front porch and a tall, tiered steeple.","safety":"Broad and Meeting Streets are busy. Use crosswalks, be respectful because it is an active church, and check the hours before going inside.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"St. Michael's is the oldest what in Charleston?","options":["Surviving religious structure","Library","Lighthouse","School"],"answer":0,"hint":"Wikipedia says it was built between 1751 and 1761.","verify":"Wikipedia calls it the oldest surviving religious structure in Charleston. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"About 1905","label":"The church then","line":"A colorized postcard of the steeple rising above Meeting Street, with a bare tree out front.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"ch_ch_then","by":"The American News Co., New York City","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Charleston_-_St._Michael's_Church_04.jpg","note":"resized, cropped"}},"now":{"yr":"Today","head":"Today","label":"The church today","line":"The white steeple and columned front, in a black-and-white photo.","ph":{"k":"ch_ch_now","by":"P. Hughes","lic":"CC BY-SA 4.0","lu":"https://creativecommons.org/licenses/by-sa/4.0/","page":"https://commons.wikimedia.org/wiki/File:Charleston_-_St._Michael's_Church_(2022).jpg","note":"resized"}},"story":["St. Michael's was built between 1751 and 1761 at the corner of Broad and Meeting Streets, by order of the South Carolina Assembly. It stands on the site of an original wooden church from 1681. It is the oldest surviving religious structure in Charleston.","It sits on one of the Four Corners of Law and represents ecclesiastical law. Its two-story porch was the first of its size in colonial America, and has Tuscan columns. No one knows who designed it, but it shows the influence of St Martin-in-the-Fields in London.","George Washington worshipped in pew number 43 during his 1791 visit. The church has a window made by Tiffany Studios in 1898. In 1865 shells from the Civil War damaged the wall. It became a National Historic Landmark in 1961."],"fact":"Washington sat in pew 43.","disputed":"Many people think the designer is well known. Wikipedia says it is not known who designed St. Michael's.","claims":[{"t":"St. Michael's was built in the 1750s and 1760s.","a":0,"why":"Wikipedia: built between 1751 and 1761."},{"t":"The architect of St. Michael's is well documented.","a":2,"why":"Wikipedia: it is not known who designed it."}],"sources":[{"t":"Wikipedia: St. Michael's Anglican Church (Charleston, South Carolina)","u":"https://en.wikipedia.org/wiki/St._Michael%27s_Anglican_Church_(Charleston,_South_Carolina)"},{"t":"Wikipedia: Charleston, South Carolina","u":"https://en.wikipedia.org/wiki/Charleston,_South_Carolina"}],"card":{"a":"1751","b":"1961","la":"Construction begins","lb":"National Historic Landmark"}}],"heroKey":"ch_rb_now"},"houston":{"id":"houston","name":"Houston","explorer":"Space City Explorer","initials":"HOU","ranks":[[0,"Visitor"],[100,"Bayou Walker"],[250,"Landmark Hunter"],[450,"Houston Scholar"],[600,"Houston Historian"]],"heroAlt":"The Rice Hotel building in downtown Houston","heroLi":"<li>Header: Ed Uthman · CC BY 3.0 · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:Rice_Hotel_Downtown_Houston_(HDR).jpg\">Source</a> · resized</li>","heroCredit":"Photo: Ed Uthman · <a target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by/3.0/\">CC BY 3.0</a> · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:Rice_Hotel_Downtown_Houston_(HDR).jpg\">Source</a>","mission":"Find four landmarks around Houston. At each one, check in to earn its badge, unlock its story, and collect a Time Card. Do them in any order. Everything stays on this phone.","afterDone":"All four badges earned. The rest of Houston is waiting.","safetyNote":"<li>Downtown Houston is hot, humid and full of traffic and light rail. Use crosswalks, watch for trains on the tracks, and drink water.</li>","badgeMap":{"rice":["hx_ri_now","50% 45%"],"square":["hx_sq_now","50% 45%"],"station":["hx_us_now","50% 45%"],"exchange":["hx_ce_now","50% 45%"]},"level":"Classics","region":"The South","stops":[{"id":"rice","name":"The Rice (Rice Hotel)","short":"The Rice","badge":"The Rice","tag":"Stop 1 of 4","teaser":"A hotel built on the spot where Texas once had its capitol.","map":"The Rice, 909 Texas Ave, Houston, TX","clue":"Go to Texas Avenue between Travis and Main Streets. Look for the tall, tan building made of two tall wings, with a flat top.","safety":"Texas Avenue has traffic and light rail. Use crosswalks, and remember this is now an apartment building, so stay on the sidewalk.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"What stood on this spot before the hotels were built?","options":["A railroad station","A jail","A cotton mill","The Capitol of the Republic of Texas"],"answer":3,"hint":"Texas used to be its own country, with its own capital.","verify":"Wikipedia says the building was completed in 1913 on the site of the former Capitol of the Republic of Texas. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"1910s","label":"The hotel then","line":"A colorized postcard of the tall double-towered hotel at the street corner.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"hx_ri_then","by":"S. H. Kress & Co.","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Rice_Hotel,_Houston,_Texas.jpg","note":"resized, cropped"}},"now":{"yr":"2010","head":"Today","label":"The hotel today","line":"The building from across the street, with its tall tan wings against a blue sky.","ph":{"k":"hx_ri_now","by":"Ed Uthman","lic":"CC BY 3.0","lu":"https://creativecommons.org/licenses/by/3.0/","page":"https://commons.wikimedia.org/wiki/File:Rice_Hotel_Downtown_Houston_(HDR).jpg","note":"resized"}},"story":["The Rice stands at 909 Texas Avenue in downtown Houston, and it is the third building on its site. The Republic of Texas used the first building as its capitol from 1837 to 1839, and again from 1842 to 1845. It then became the Capitol Hotel.","In 1881 a five-story hotel replaced it. William Marsh Rice bought it in 1886, and after he died in 1900 it passed to the Rice Institute. Jesse H. Jones built the current seventeen-story, double-winged building in 1913 at a cost of about $3.5 million.","In 1922 the hotel's cafeteria became the first public room in Houston with air-conditioning. The hotel closed in 1977, stood empty for twenty-one years, and reopened in 1998 as apartments called the Post Rice Lofts. Since 2014 it has been called simply The Rice."],"fact":"It had Houston's first air-conditioned public room.","disputed":"Many people think a hotel building is only ever a hotel. Wikipedia says this one began as a government capitol.","claims":[{"t":"The current Rice Hotel building was completed in 1913.","a":0,"why":"Wikipedia: completed in 1913."},{"t":"The hotel has always been a hotel and nothing else.","a":2,"why":"It was a capitol first, then a hotel, and today it is apartments."}],"sources":[{"t":"Wikipedia: The Rice (Houston)","u":"https://en.wikipedia.org/wiki/The_Rice_(Houston)"},{"t":"Wikipedia: William Marsh Rice","u":"https://en.wikipedia.org/wiki/William_Marsh_Rice"}],"card":{"a":"1913","b":"1998","la":"Current building opens","lb":"Reopens as apartments"}},{"id":"square","name":"Market Square","short":"Market Square","badge":"Market Square","tag":"Stop 2 of 4","teaser":"A park where four different city halls and markets used to stand.","map":"Market Square Park, Congress Ave and Travis St, Houston, TX","clue":"Go to the park bounded by Travis and Milam Streets and Congress and Preston Avenues. Look for a green square with oak trees, a brick path and a tall metal sculpture.","safety":"Downtown streets are busy. Use crosswalks, stay on the paths, and watch for bikes and dogs.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"How many market house and city hall buildings did the city build on the square?","options":["Ten","One","Two","Four"],"answer":3,"hint":"Fires destroyed several of them.","verify":"Wikipedia says the city built four different market house and city hall buildings here. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"1895","label":"The square then","line":"A black-and-white photo of the city hall and market house on a snowy day in February 1895.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"hx_sq_then","by":"George Fuermann \"Texas and Houston\" Collection (University of Houston)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Houston_Market_Square_on_Valentine's_Day_1895.jpg","note":"resized"}},"now":{"yr":"2010","head":"Today","label":"The square today","line":"The park today, with oak trees, a brick path and a metal sculpture.","ph":{"k":"hx_sq_now","by":"Ed Uthman","lic":"CC BY 3.0","lu":"https://creativecommons.org/licenses/by/3.0/","page":"https://commons.wikimedia.org/wiki/File:Market_Square_Houston_(HDR).jpg","note":"resized"}},"story":["The square was first called Congress Square in the original survey of Houston. It was renamed Market Square in 1837. The city commissioned its first market house and city hall here in 1840, and both were finished in 1841.","In 1854 Augustus Allen donated the square to the city, which used it as an open-air produce market. Several city halls rose and fell here, mostly because of fires. The fourth one, designed by George E. Dickey, was built in 1904 after a fire in 1901.","Today the square is a public park surrounded by nineteenth-century buildings and modern towers, with restaurants and bars. Market Square Tower, a 43-floor tower, opened in 2017."],"fact":"Fires kept destroying the city halls.","disputed":"Many people think a city hall is built once. Wikipedia says four were built here, and several were destroyed by fire.","claims":[{"t":"The first market house on the square was finished in 1841.","a":0,"why":"Wikipedia: both buildings were completed the year after the 1840 commission, in 1841."},{"t":"The square has always been a park.","a":2,"why":"It was a marketplace and the site of city halls."}],"sources":[{"t":"Wikipedia: Market Square Park","u":"https://en.wikipedia.org/wiki/Market_Square_Park"},{"t":"Wikipedia: Houston City Hall","u":"https://en.wikipedia.org/wiki/Houston_City_Hall"}],"card":{"a":"1840","b":"1904","la":"First market house","lb":"Fourth city hall"}},{"id":"station","name":"Union Station","short":"Union Station","badge":"Union Station","tag":"Stop 3 of 4","teaser":"A grand 1911 train station that now sits inside a baseball park.","map":"Union Station, 501 Crawford St, Houston, TX","clue":"Go to the baseball park downtown, at Crawford and Texas Streets. Look for the old brick-and-stone station building attached to it.","safety":"This is a busy district, especially on game days. Use crosswalks, stay out of the traffic, and check hours before going in.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"Which New York firm designed the station?","options":["Warren and Wetmore","McKim, Mead and White","Carrère and Hastings","Adler and Sullivan"],"answer":0,"hint":"The firm was based in New York City and named for its two partners.","verify":"Wikipedia says the New York architects Warren and Wetmore were commissioned in 1909. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"About 1911","label":"The station then","line":"A colorized postcard of the new station, with a car parked out front.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"hx_us_then","by":"University of Houston Digital Library","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Union_Station,_Houston,_Texas.jpg","note":"resized"}},"now":{"yr":"2010","head":"Today","label":"The station today","line":"The brick and stone station building seen from the corner, with trees in front.","ph":{"k":"hx_us_now","by":"Ed Uthman","lic":"CC BY 3.0","lu":"https://creativecommons.org/licenses/by/3.0/","page":"https://commons.wikimedia.org/wiki/File:Union_Station_Houston_Texas_(HDR).jpg","note":"resized"}},"story":["In 1909 the Houston Belt and Terminal Railway Company hired Warren and Wetmore to design a new union station. Several buildings had to be torn down to make room, including a house and a synagogue.","It was meant to cost $1 million, and it ended up costing about five times that. The outside is granite, limestone and terracotta, and the inside used a lot of marble. It was dedicated in March 1911, and two more floors were added the next year.","At the time Houston, with seventeen railways, was considered the main railroad hub of the southern United States. Today the building is a cornerstone of the baseball park, and Houston's Amtrak station has replaced it."],"fact":"The station cost five times more than planned.","disputed":"Many people think the station is still used for trains. Wikipedia says it has been superseded by Houston's Amtrak station.","claims":[{"t":"Union Station was dedicated in 1911.","a":0,"why":"Wikipedia: dedicated on March 2, 1911."},{"t":"Union Station was built to cost about $5 million.","a":2,"why":"The estimate was $1 million. The real cost was about five times that."}],"sources":[{"t":"Wikipedia: Union Station (Houston)","u":"https://en.wikipedia.org/wiki/Union_Station_(Houston)"},{"t":"Wikipedia: Warren and Wetmore","u":"https://en.wikipedia.org/wiki/Warren_and_Wetmore"}],"card":{"a":"1909","b":"1911","la":"Design commissioned","lb":"Dedicated"}},{"id":"exchange","name":"Cotton Exchange Building","short":"Cotton Exchange","badge":"Cotton Exchange","tag":"Stop 4 of 4","teaser":"A red-brick building where cotton prices were decided.","map":"Cotton Exchange Building, 202 Travis St, Houston, TX","clue":"Go to the corner of Travis and Franklin Streets. Look for an ornate red-brick building with lots of decorative brick and an arched entrance.","safety":"Downtown streets are busy. Use crosswalks, and view the building from the public sidewalk.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"In 1907 the building was remodeled. What was added?","options":["A swimming pool","A dome","A fourth floor","A clock tower"],"answer":2,"hint":"It was built with three stories in 1884.","verify":"Wikipedia says the building was remodeled in 1907 and a fourth floor was added. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"1907","label":"The exchange then","line":"A hand-colored postcard of the building after its 1907 remodel, with a street and shops beside it.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"hx_ce_then","by":"Rotograph Co.","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Cotton_Exchange_Building,_Houston,_Texas_(1907).jpg","note":"resized, cropped"}},"now":{"yr":"2010","head":"Today","label":"The exchange today","line":"The red-brick building with its decorative brick and big trees beside it.","ph":{"k":"hx_ce_now","by":"Ed Uthman","lic":"CC BY 3.0","lu":"https://creativecommons.org/licenses/by/3.0/","page":"https://commons.wikimedia.org/wiki/File:1884_Houston_Cotton_Exchange.jpg","note":"resized"}},"story":["The Houston Cotton Exchange and Board of Trade hired local architect Eugene Heiner to design a three-story building at the corner of Travis and Franklin. It was built in 1884.","In 1907 the building was remodeled and a fourth floor was added. The Houston Cotton Exchange kept using it until 1924, when it moved to a new building at Prairie and Caroline.","In 1973 John Hannah and Jesse Edmundson III bought the building and restored it. They sold it in 1983. The building is listed on the National Register of Historic Places."],"fact":"The exchange moved out in 1924.","disputed":"Many people think the building has always had four floors. Wikipedia says it began with three.","claims":[{"t":"The Cotton Exchange Building was built in 1884.","a":0,"why":"Wikipedia: built in 1884."},{"t":"The building has always had four floors.","a":2,"why":"The fourth floor was added in 1907."}],"sources":[{"t":"Wikipedia: Houston Cotton Exchange Building","u":"https://en.wikipedia.org/wiki/Houston_Cotton_Exchange_Building"},{"t":"Wikipedia: Eugene T. Heiner","u":"https://en.wikipedia.org/wiki/Eugene_T._Heiner"}],"card":{"a":"1884","b":"1924","la":"Built","lb":"Exchange moves out"}}],"heroKey":"hx_ri_now"},"nashville":{"id":"nashville","name":"Nashville","explorer":"Music City Explorer","initials":"NSH","ranks":[[0,"Visitor"],[100,"Broadway Walker"],[250,"Landmark Hunter"],[450,"Nashville Scholar"],[600,"Nashville Historian"]],"heroAlt":"The Parthenon in Nashville","heroLi":"<li>Header: Aaron Archuleta · CC BY-SA 3.0 · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:The_Parthenon,_Nashville,_Tennessee.jpg\">Source</a> · resized</li>","heroCredit":"Photo: Aaron Archuleta · <a target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by-sa/3.0/\">CC BY-SA 3.0</a> · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:The_Parthenon,_Nashville,_Tennessee.jpg\">Source</a>","mission":"Find four landmarks around Nashville. At each one, check in to earn its badge, unlock its story, and collect a Time Card. Do them in any order. Everything stays on this phone.","afterDone":"All four badges earned. The rest of Nashville is waiting.","safetyNote":"<li>Downtown Nashville has busy streets, hills and crowds. Use crosswalks, watch for scooters and traffic, and take the hills slowly.</li>","badgeMap":{"capitol":["na_cp_now","50% 45%"],"union":["na_us_now","50% 45%"],"fort":["na_fn_now","50% 45%"],"parthenon":["na_pa_now","50% 45%"]},"level":"Classics","region":"The South","stops":[{"id":"capitol","name":"Tennessee State Capitol","short":"State Capitol","badge":"State Capitol","tag":"Stop 1 of 4","teaser":"A capitol with no dome, built partly with iron, and an architect buried in its walls.","map":"Tennessee State Capitol, 600 Dr Martin L King Jr Blvd, Nashville, TN","clue":"Go to the hill in downtown Nashville. Look for the limestone building shaped like a Greek temple, with a tall tower on top.","safety":"Stay on the paths on the hillside, use crosswalks on the streets around it, and check visiting hours and security rules before going in.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"Who is entombed within the capitol's walls?","options":["The architect William Strickland","Andrew Jackson","The first governor","A railroad engineer"],"answer":0,"hint":"He did not live to see it finished.","verify":"Wikipedia says Strickland and Samuel Morgan are entombed within the building's walls. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"After 1898","label":"The capitol then","line":"A colorized postcard of the capitol on its hill, with trees and a stone wall in front.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"na_cp_then","by":"Detroit Publishing Company (scan by NYPL)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:State_Capitol,_Nashville,_Tenn_(NYPL_b12647398-62431).tiff","note":"resized, cropped"}},"now":{"yr":"2009","head":"Today","label":"The capitol today","line":"The temple-style front and tower of the capitol under a bright sky.","ph":{"k":"na_cp_now","by":"Kaldari","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Tennessee_State_Capitol_2009.jpg","note":"resized"}},"story":["Architect William Strickland of Philadelphia designed the capitol and thought it was his greatest achievement. It was built between 1845 and 1859 by skilled artisans and by convict and slave labor. It has been used continuously since 1853.","It was built mostly of limestone quarried nearby, and it was one of the first buildings in the United States to use iron as a structural element. It is one of eleven state capitols with no dome. When it was completed it was the tallest building in the southeastern United States. Its cupola is modeled on the Choragic Monument of Lysicrates.","During the Civil War the building was a camp for Union troops, a hospital and a lookout. Strickland, who died before it was finished, and Samuel Morgan, who oversaw construction, are entombed in its walls. The tombs of President James K. Polk and his wife are on the grounds."],"fact":"It is one of eleven capitols with no dome.","disputed":"Many people think every statehouse has a dome. Wikipedia says eleven do not, including this one.","claims":[{"t":"The Tennessee State Capitol has been used continuously since 1853.","a":0,"why":"Wikipedia: used continuously since 1853."},{"t":"The capitol has a large dome.","a":2,"why":"It is one of eleven state capitols with no dome."}],"sources":[{"t":"Wikipedia: Tennessee State Capitol","u":"https://en.wikipedia.org/wiki/Tennessee_State_Capitol"},{"t":"Wikipedia: William Strickland","u":"https://en.wikipedia.org/wiki/William_Strickland_(architect)"}],"card":{"a":"1845","b":"1859","la":"Construction begins","lb":"Construction ends"}},{"id":"union","name":"Union Station","short":"Union Station","badge":"Union Station","tag":"Stop 2 of 4","teaser":"A train station shaped like a castle, which is now a hotel.","map":"Union Station Hotel, 1001 Broadway, Nashville, TN","clue":"Go to Broadway at 10th Avenue, just west of downtown. Look for a stone building with a tall clock tower and a steep roof, like a castle.","safety":"Broadway is a busy road. Use crosswalks, and be polite in the lobby, since it is a working hotel.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"What does Union Station serve as today?","options":["A museum of trains","A bank","A hotel","A prison"],"answer":2,"hint":"You can book a room there.","verify":"Wikipedia says it reopened as the Union Station Hotel in 1986. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"About 1900","label":"The station then","line":"A black-and-white photo of the station with its clock tower, from down the street, with telegraph wires overhead.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"na_us_then","by":"Detroit Publishing Company","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Detroit_Publishing_-_Union_Station,_Nashville,_Tenn..jpg","note":"resized"}},"now":{"yr":"2012","head":"Today","label":"The station today","line":"The clock tower and steep roofs against a blue sky, with a car passing in front.","ph":{"k":"na_us_now","by":"Mayur Phadtare","lic":"CC BY-SA 3.0","lu":"https://creativecommons.org/licenses/by-sa/3.0/","page":"https://commons.wikimedia.org/wiki/File:Union_Station,_Nashville.JPG","note":"resized"}},"story":["Nashville's Union Station was built starting in 1898 and opened on October 9, 1900. Henry Hobson Richardson and Richard Montfort are credited with the design. Montfort was an engineer for the Louisville and Nashville Railroad and spent several years planning the building.","The building is Romanesque Revival, a look that stood out among train stations of the time. It was built west of downtown and next to a viaduct. Streetcars used it too, until streetcars ended in Nashville in 1941. It became a National Historic Landmark in 1975.","The last passenger trains left in the late 1970s. After it was abandoned for several years, the station reopened in 1986 as the Union Station Hotel. In 2012 it became a Marriott Autograph Collection hotel."],"fact":"It reopened as a hotel in 1986.","disputed":"Many people think a station this old must be a ruin or a museum. Wikipedia says it is a working hotel.","claims":[{"t":"Union Station opened in 1900.","a":0,"why":"Wikipedia: opened October 9, 1900."},{"t":"Union Station is still used for passenger trains.","a":2,"why":"The last passenger trains left in the late 1970s."}],"sources":[{"t":"Wikipedia: Union Station (Nashville)","u":"https://en.wikipedia.org/wiki/Union_Station_(Nashville)"},{"t":"Wikipedia: Louisville and Nashville Railroad","u":"https://en.wikipedia.org/wiki/Louisville_and_Nashville_Railroad"}],"card":{"a":"1900","b":"1986","la":"Opens as a station","lb":"Reopens as a hotel"}},{"id":"fort","name":"Fort Nashborough","short":"Fort Nashborough","badge":"Fort Nashborough","tag":"Stop 3 of 4","teaser":"The log fort that started the city, rebuilt after being torn down.","map":"Fort Nashborough History Center, 170 First Ave N, Nashville, TN","clue":"Go to First Avenue North near Church Street, along the Cumberland River. Look for log cabins and a log wall in a small walkway.","safety":"First Avenue is busy. Use crosswalks, stay on the walkways, and do not climb on the logs.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"How many log cabins did the original fort contain?","options":["8","20","200","2"],"answer":1,"hint":"It covered two acres and held a whole settlement.","verify":"Wikipedia says the stockade contained 20 log cabins. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"1930s to 1940s","label":"The fort then","line":"A colorized postcard of the 1930s replica, with a flag, log cabins and a river behind it.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"na_fn_then","by":"Southern Latex Co. (published postcard)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Fort_Nashborough,_First_Ave._and_Church_St.,_Nashville,_Tenn_(74048).jpg","note":"resized"}},"now":{"yr":"2022","head":"Today","label":"The fort today","line":"The new fort's log cabins on a brick walkway, with a tall chimney behind.","ph":{"k":"na_fn_now","by":"Antony-22","lic":"CC BY-SA 4.0","lu":"https://creativecommons.org/licenses/by-sa/4.0/","page":"https://commons.wikimedia.org/wiki/File:Fort_Nashborough_History_Center_2022.jpg","note":"resized"}},"story":["Fort Nashborough was a log stockade set up in early 1779 in the French Lick area of the Cumberland River valley. It was the forerunner of the settlement that became Nashville. James Robertson and John Donelson are considered the founders.","The fort was not a military garrison. It was square, covered two acres and had 20 log cabins to protect settlers from wild animals and attackers. It was abandoned in 1794.","A small replica of the fort was built in the 1930s, a few hundred meters from the original site. It fell apart and was demolished in 2015. A new Fort Nashborough History Center had its ribbon-cutting on July 13, 2017."],"fact":"The replica was torn down in 2015.","disputed":"Many people think the log fort in town is the original. Wikipedia says the earlier replica was built in the 1930s and demolished in 2015.","claims":[{"t":"The original fort was set up in 1779.","a":0,"why":"Wikipedia: established in early 1779."},{"t":"The fort was a big military base.","a":2,"why":"Wikipedia says it was not a military garrison."}],"sources":[{"t":"Wikipedia: Fort Nashborough","u":"https://en.wikipedia.org/wiki/Fort_Nashborough"},{"t":"Wikipedia: Nashville, Tennessee","u":"https://en.wikipedia.org/wiki/Nashville,_Tennessee"}],"card":{"a":"1779","b":"2017","la":"Fort established","lb":"History Center ribbon-cutting"}},{"id":"parthenon","name":"The Parthenon","short":"Parthenon","badge":"Parthenon","tag":"Stop 4 of 4","teaser":"A full-size copy of the Parthenon in Athens, in the middle of Tennessee.","map":"The Parthenon, 2500 West End Ave, Nashville, TN","clue":"Go to Centennial Park, west of downtown. Look for a huge Greek temple with a double row of columns.","safety":"Stay on the park paths, watch for bikes, and check hours before going inside. Do not climb on the steps or columns.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"Which nickname for Nashville inspired the building?","options":["Windy City","Athens of the South","Gateway to the West","The Big Easy"],"answer":1,"hint":"Nashville was known for its colleges and learning.","verify":"Wikipedia says the nickname \"Athens of the South\" influenced the choice. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"1921","label":"The Parthenon then","line":"A 1921 photo from the air of Centennial Park, with the Parthenon small among the trees and paths.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"na_pa_then","by":"105th Observation Squadron","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Centennial_Park_1921.jpg","note":"resized"}},"now":{"yr":"2012","head":"Today","label":"The Parthenon today","line":"The columns and roof of the full-size replica, rising above the lawn.","ph":{"k":"na_pa_now","by":"Aaron Archuleta","lic":"CC BY-SA 3.0","lu":"https://creativecommons.org/licenses/by-sa/3.0/","page":"https://commons.wikimedia.org/wiki/File:The_Parthenon,_Nashville,_Tennessee.jpg","note":"resized"}},"story":["The Parthenon in Centennial Park is a full-scale replica of the Parthenon in Athens. William Crawford Smith designed it, and it was built in 1897 for the Tennessee Centennial Exposition. Nashville's nickname, the \"Athens of the South,\" influenced the choice.","Wikipedia says it was the only building at the Exposition that was an exact reproduction. It was built of plaster, wood and brick and was not meant to last, but it was so popular that it was left standing. After weather damaged it, it was rebuilt in concrete, with the exterior finished in 1925 and the interior in 1931.","Inside, Alan LeQuire's 1990 re-creation of the Athena Parthenos statue is the focus of the building. It is now an art museum."],"fact":"The first one was made of plaster.","disputed":"Many people think the building is ancient or even made of marble. Wikipedia says the first was plaster, wood and brick, and the current one is concrete.","claims":[{"t":"The Parthenon was built in 1897.","a":0,"why":"Wikipedia: built in 1897 for the Centennial Exposition."},{"t":"The Nashville Parthenon is a small model.","a":2,"why":"It is a full-scale replica."}],"sources":[{"t":"Wikipedia: Parthenon (Nashville)","u":"https://en.wikipedia.org/wiki/Parthenon_(Nashville)"},{"t":"Wikipedia: Tennessee Centennial Exposition","u":"https://en.wikipedia.org/wiki/Tennessee_Centennial_and_International_Exposition"}],"card":{"a":"1897","b":"1931","la":"Built for the Exposition","lb":"Rebuilt interior finished"}}],"heroKey":"na_pa_now"},"providence":{"id":"providence","name":"Providence","explorer":"Rhode Island Explorer","initials":"PVD","ranks":[[0,"Visitor"],[100,"College Hill Walker"],[250,"Landmark Hunter"],[450,"Providence Scholar"],[600,"Providence Historian"]],"heroAlt":"The Rhode Island State House in Providence","heroLi":"<li>Header: Kumar Appaiah · CC BY-SA 2.0 · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:Rhode_Island_State_House_2.jpg\">Source</a> · resized</li>","heroCredit":"Photo: Kumar Appaiah · <a target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by-sa/2.0/\">CC BY-SA 2.0</a> · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:Rhode_Island_State_House_2.jpg\">Source</a>","mission":"Find four landmarks around Providence. At each one, check in to earn its badge, unlock its story, and collect a Time Card. Do them in any order. Everything stays on this phone.","afterDone":"All four badges earned. The rest of Providence is waiting.","safetyNote":"<li>Downtown Providence has busy streets, hills and brick sidewalks. Use crosswalks, watch for cars and bikes, and take College Hill slowly.</li>","badgeMap":{"statehouse":["pv_sh_now","50% 45%"],"cathedral":["pv_cs_now","50% 45%"],"gates":["pv_vw_now","50% 45%"],"arcade":["pv_ar_now","50% 45%"]},"level":"Classics","region":"The East","stops":[{"id":"statehouse","name":"Rhode Island State House","short":"State House","badge":"State House","tag":"Stop 1 of 4","teaser":"A marble capitol with a golden statue on top that was first named Hope.","map":"Rhode Island State House, 82 Smith Street, Providence, RI","clue":"Go to Smith Hill, just north of downtown. Look for a white marble building with a huge dome and a small golden figure at the very top.","safety":"This is a working government building. Check visiting hours and security rules, stay on the paths and lawn edges, and use crosswalks on Smith Street.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"What stands on top of the State House dome?","options":["A gilded statue called The Independent Man","A bronze eagle","A copper weather vane","A large flag pole only"],"answer":0,"hint":"Look up, way up. It is shiny and shaped like a person.","verify":"Wikipedia says a gold-covered bronze statue known as The Independent Man stands on the dome. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"After 1898","label":"The State House then","line":"A tinted postcard of the white-domed State House with a lawn and bare trees in front.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"pv_sh_then","by":"Detroit Publishing Company (scan by NYPL)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:State_House,_Providence,_R._I_(NYPL_b12647398-66797).tiff","note":"resized, cropped"}},"now":{"yr":"2013","head":"Today","label":"The State House today","line":"The marble front with its columns and dome under a clear sky.","ph":{"k":"pv_sh_now","by":"Kumar Appaiah","lic":"CC BY-SA 2.0","lu":"https://creativecommons.org/licenses/by-sa/2.0/","page":"https://commons.wikimedia.org/wiki/File:Rhode_Island_State_House_2.jpg","note":"resized"}},"story":["The Rhode Island State House stands at 82 Smith Street, just below the crest of Smith Hill. It is Rhode Island's seventh state house and the second in Providence. McKim, Mead & White, a well-known New York firm, designed it, and it was built from 1891 to 1901.","The building uses 327,000 cubic feet of white Georgia marble, 15 million bricks and about 1,309 short tons of iron floor beams. Its dome is described as the fourth largest self-supported marble dome in the world. It was also one of the first public buildings to use electricity.","On top of the dome stands a gold-covered bronze statue, The Independent Man. It was first named Hope. George Brewster designed it, the Gorham Manufacturing Company cast it, and it was installed in 1899. It weighs more than 500 pounds. Inside, the State Room holds a full-length portrait of George Washington by Gilbert Stuart."],"fact":"The statue on top was first named Hope.","disputed":"Many people think the dome is the biggest marble dome in the world. Wikipedia calls it the fourth largest self-supported marble dome.","claims":[{"t":"The State House was built between 1891 and 1901.","a":0,"why":"Wikipedia: constructed from 1891 to 1901."},{"t":"The State House dome is the largest marble dome in the world.","a":2,"why":"Wikipedia calls it the fourth largest self-supported marble dome in the world."}],"sources":[{"t":"Wikipedia: Rhode Island State House","u":"https://en.wikipedia.org/wiki/Rhode_Island_State_House"},{"t":"Wikipedia: McKim, Mead & White","u":"https://en.wikipedia.org/wiki/McKim,_Mead_%26_White"}],"card":{"a":"1891","b":"1901","la":"Construction begins","lb":"Construction ends"}},{"id":"cathedral","name":"Cathedral of Saints Peter and Paul","short":"Cathedral","badge":"Cathedral","tag":"Stop 2 of 4","teaser":"A big stone church paid for one $10,000 chunk at a time.","map":"Cathedral of Saints Peter and Paul, Cathedral Square, Providence, RI","clue":"Go to Cathedral Square in Providence. Look for a large brown stone church with two tall square towers and a round window in the middle.","safety":"This is an active church. Be quiet and respectful, stay on the public sidewalk, and use crosswalks.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"Who designed the cathedral in 1873?","options":["Russell Warren","Patrick Keely","William Strickland","Richard Montfort"],"answer":1,"hint":"He was an architect known for Catholic churches.","verify":"Wikipedia says Bishop Hendricken selected church architect Patrick Keely in 1873. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"After 1898","label":"The cathedral then","line":"A tinted postcard of the church with its two towers and a statue on the corner.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"pv_cs_then","by":"Detroit Publishing Company (scan by NYPL)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Saints_Peter_and_Paul_Cathedral,_Providence,_R._I_(NYPL_b12647398-63175).tiff","note":"resized, cropped"}},"now":{"yr":"2019","head":"Today","label":"The cathedral today","line":"The brown stone towers and round window against a blue sky with a few clouds.","ph":{"k":"pv_cs_now","by":"Farragutful","lic":"CC BY-SA 4.0","lu":"https://creativecommons.org/licenses/by-sa/4.0/","page":"https://commons.wikimedia.org/wiki/File:Cathedral_of_Saints_Peter_and_Paul_-_Providence_01.jpg","note":"resized"}},"story":["The Cathedral of Saints Peter and Paul is the mother church of the Diocese of Providence. Pope Pius IX created the diocese in 1872, and its first bishop, Thomas Francis Hendricken, decided to build a new cathedral because the first one was too small.","In 1873 Hendricken chose church architect Patrick Keely to draw the plans. The cornerstone was laid in 1878. Hendricken refused to borrow money for the project, so he set aside $10,000 each year and ran fundraising campaigns to keep construction going.","By 1882 the contractors had finished the roof and began the interior. Hendricken died in 1886. The Neo-Romanesque church was added to the National Register of Historic Places in 1975."],"fact":"The bishop refused to borrow money.","disputed":"Many people think big cathedrals are built with big loans. Wikipedia says the bishop refused to borrow.","claims":[{"t":"The cathedral's cornerstone was laid in 1878.","a":0,"why":"Wikipedia: the cornerstone was laid in 1878."},{"t":"The bishop paid for the cathedral with a huge bank loan.","a":2,"why":"Wikipedia says he refused to borrow money."}],"sources":[{"t":"Wikipedia: Cathedral of Saints Peter and Paul (Providence)","u":"https://en.wikipedia.org/wiki/Cathedral_of_Saints_Peter_and_Paul_(Providence,_Rhode_Island)"},{"t":"Wikipedia: Patrick Keely","u":"https://en.wikipedia.org/wiki/Patrick_Keely"}],"card":{"a":"1873","b":"1882","la":"Keely chosen","lb":"Roof finished"}},{"id":"gates","name":"Van Wickle Gates","short":"Van Wickle Gates","badge":"Van Wickle Gates","tag":"Stop 3 of 4","teaser":"Iron gates with a spooky rule: walk through the middle twice and you may not graduate.","map":"Van Wickle Gates, College Street at Prospect Street, Providence, RI","clue":"Go to the top of College Hill, where College Street meets Prospect Street. Look for tall iron gates between brick and stone posts.","safety":"This is a college campus entrance. Stay on the sidewalk, do not climb the gates or posts, and watch for people and bikes.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"What does campus superstition say about passing through the center gate more than twice?","options":["You will win a prize","You will hear the bell","You will not graduate","You will get lost"],"answer":2,"hint":"Band members hop on one foot and walk in backwards to dodge it.","verify":"Wikipedia says campus superstition holds that students who pass through the center gate more than twice will not graduate. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"1900","label":"The gates then","line":"A black-and-white print of the iron gates with brick buildings and bare trees behind.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"pv_vw_then","by":"L.H. Nelson Company (Views of Providence)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Van_Wickle_Gates_from_Views_of_Providence_(1900).jpg","note":"resized, cropped"}},"now":{"yr":"2012","head":"Today","label":"The gates today","line":"The tall iron center gate between brick posts, with a campus building behind.","ph":{"k":"pv_vw_now","by":"John W. Schulze","lic":"CC BY 2.0","lu":"https://creativecommons.org/licenses/by/2.0/","page":"https://commons.wikimedia.org/wiki/File:Van_Wickle_Gates,_Brown_University.jpg","note":"resized"}},"story":["The Van Wickle Gates are the ornamental entrance to Brown University's main campus, at the crest of College Hill. They were paid for by the bequest of Augustus Stout Van Wickle, Class of 1876, a bank president who died in 1898. He also paid for a set of gates at Princeton University.","Hoppin & Ely and Hoppin & Koen designed them in wrought iron with brick and stone piers. The Brown coat of arms crowns the gate, and the piers carry the seals of Rhode Island and Providence. The sides carry inscriptions by Cicero. They were dedicated on June 18, 1901.","The two small side gates stay open all year. The big center gates open only on special days: inward at the start of the school year and the start of spring semester, and outward for the Commencement procession."],"fact":"The center gates open only on three days a year.","disputed":"Many people think the big gates are always open. Wikipedia says only the side gates are, and the center opens on three annual occasions.","claims":[{"t":"The Van Wickle Gates were dedicated in 1901.","a":0,"why":"Wikipedia: dedicated on June 18, 1901."},{"t":"The big center gates stay open all year.","a":2,"why":"Only the smaller side gates stay open all year."}],"sources":[{"t":"Wikipedia: Van Wickle Gates","u":"https://en.wikipedia.org/wiki/Van_Wickle_Gates"},{"t":"Wikipedia: Brown University","u":"https://en.wikipedia.org/wiki/Brown_University"}],"card":{"a":"1898","b":"1901","la":"Van Wickle dies and leaves the money","lb":"Gates dedicated"}},{"id":"arcade","name":"The Arcade","short":"The Arcade","badge":"The Arcade","tag":"Stop 4 of 4","teaser":"The first enclosed shopping mall in America, nicknamed a folly.","map":"The Arcade (Westminster Arcade), 130 Westminster Street, Providence, RI","clue":"Go to Westminster Street downtown. Look for a stone building with tall columns on the front and a long hall with a glass roof inside.","safety":"Downtown streets are busy. Use crosswalks, and be polite inside, since people live and work here.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"What nickname did people give the Arcade because it was slow to attract customers?","options":["The Glass Palace","Cheapside Castle","The Empty Hall","Butler's Folly"],"answer":3,"hint":"People thought it was a silly idea at first.","verify":"Wikipedia says it was known as Butler's Folly for many years. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"1958","label":"The Arcade then","line":"A black-and-white survey photo of the stone front with tall columns, taken in April 1958.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"pv_ar_then","by":"Laurence E. Tilley (Historic American Buildings Survey)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Historic_American_Buildings_Survey,_Laurence_E._Tilley,_Photographer_April,_1958_SOUTHEAST_FRONT_ON_WEYBOSSET_STREET._-_The_Arcade,_130_Westminster_Street,_Providence,_Providence_HABS_RI,4-PROV,106-1.tif","note":"resized, cropped"}},"now":{"yr":"2019","head":"Today","label":"The Arcade today","line":"The long glass-roofed hall inside, with shops on both sides.","ph":{"k":"pv_ar_now","by":"Karlunun","lic":"CC BY-SA 4.0","lu":"https://creativecommons.org/licenses/by-sa/4.0/","page":"https://commons.wikimedia.org/wiki/File:Providence_The_Arcade_110_Westminster_NW_9403_20190428.jpg","note":"resized"}},"story":["The Westminster Arcade was erected in 1828 at 130 Westminster Street and 65 Weybosset Street. It is notable as the first enclosed shopping mall in the United States, and it is a fine example of commercial Greek Revival architecture. It became a National Historic Landmark in 1976.","Cyrus Butler developed it, and Russell Warren and Tallman & Bucklin designed it, with a lane of shops lit by skylights, like similar buildings in Europe. At first it was far from the shopping areas, so few customers came and it was known as Butler's Folly for many years. In June 1843 President John Tyler toured it and reportedly shook 5,000 hands.","It declined late in the twentieth century and was rehabilitated and reopened in 1980. It closed again in 2008 and reopened in October 2013 as shops plus small apartments called micro-lofts."],"fact":"It was first called a folly.","disputed":"Many people think the first mall must be a modern idea. Wikipedia says this one was erected in 1828.","claims":[{"t":"The Arcade was erected in 1828.","a":0,"why":"Wikipedia: erected in 1828."},{"t":"The Arcade was busy with shoppers from its first day.","a":2,"why":"Wikipedia says it was slow to attract customers and known as Butler's Folly."}],"sources":[{"t":"Wikipedia: Westminster Arcade","u":"https://en.wikipedia.org/wiki/Westminster_Arcade"},{"t":"Wikipedia: Providence, Rhode Island","u":"https://en.wikipedia.org/wiki/Providence,_Rhode_Island"}],"card":{"a":"1828","b":"2013","la":"Erected","lb":"Reopens with apartments"}}],"heroKey":"pv_sh_now"},"saltlake":{"id":"saltlake","name":"Salt Lake City","explorer":"Beehive State Explorer","initials":"SLC","ranks":[[0,"Visitor"],[100,"Temple Square Walker"],[250,"Landmark Hunter"],[450,"Salt Lake Scholar"],[600,"Salt Lake Historian"]],"heroAlt":"The Salt Lake Temple","heroLi":"<li>Header: Acroterion · CC BY-SA 4.0 · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:Salt_Lake_Temple_UT1.jpg\">Source</a> · resized</li>","heroCredit":"Photo: Acroterion · <a target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by-sa/4.0/\">CC BY-SA 4.0</a> · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:Salt_Lake_Temple_UT1.jpg\">Source</a>","mission":"Find four landmarks around Salt Lake City. At each one, check in to earn its badge, unlock its story, and collect a Time Card. Do them in any order. Everything stays on this phone.","afterDone":"All four badges earned. The rest of Salt Lake City is waiting.","safetyNote":"<li>Downtown Salt Lake City has wide streets, long blocks and light rail. Use crosswalks, watch for trains and cars, and bring water in summer.</li>","badgeMap":{"temple":["sk_tp_now","50% 45%"],"beehive":["sk_bh_now","50% 45%"],"lion":["sk_lh_now","50% 45%"],"eagle":["sk_eg_now","50% 45%"]},"level":"Classics","region":"The West","stops":[{"id":"temple","name":"Salt Lake Temple","short":"Temple","badge":"Temple","tag":"Stop 1 of 4","teaser":"A temple that took 40 years to build and has been closed for fixing.","map":"Salt Lake Temple, Temple Square, Salt Lake City, UT","clue":"Go to Temple Square in downtown Salt Lake City. Look for a huge granite building with six tall spires.","safety":"Temple Square is a busy downtown block. Use crosswalks. The temple is closed for renovation, so check what is open before you go and stay on public sidewalks.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"About how many years did it take to build the Salt Lake Temple?","options":["14","400","40","4"],"answer":2,"hint":"More than a few decades, but less than a century.","verify":"Wikipedia says it was constructed over a period of 40 years and dedicated in 1893. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"1899","label":"The temple then","line":"A colorized view from above of the temple, the round-roofed hall beside it and tree-lined paths.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"sk_tp_then","by":"William Henry Jackson","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Temple_Square,_Salt_Lake_City,_1899.jpg","note":"resized, cropped"}},"now":{"yr":"2010","head":"Today","label":"The temple today","line":"The tall white spires against a clear blue sky.","ph":{"k":"sk_tp_now","by":"Acroterion","lic":"CC BY-SA 4.0","lu":"https://creativecommons.org/licenses/by-sa/4.0/","page":"https://commons.wikimedia.org/wiki/File:Salt_Lake_Temple_UT1.jpg","note":"resized"}},"story":["The Salt Lake Temple is a temple of the Church of Jesus Christ of Latter-day Saints, on Temple Square in Salt Lake City. It was dedicated in 1893 after being constructed over a period of 40 years. At 382,207 square feet, it is the largest Latter-day Saint temple by floor area.","The center pinnacle rises 210 feet to the base of the angel Moroni statue. The large baptismal font is mounted on the backs of twelve oxen, like the Molten Sea in Solomon's Temple. Latter-day Saints consider the temple sacred, and a temple recommend is required to enter, so there are no public tours inside.","The first public photographs of the interior were published in 1912. The temple closed in 2019 for remodeling, including a seismic retrofit. The church plans public open house tours in 2027, after which it will be re-dedicated."],"fact":"The font rests on the backs of twelve oxen.","disputed":"Many people think any famous landmark can be toured inside. Wikipedia says a temple recommend is required, so there are no public tours of the interior.","claims":[{"t":"The Salt Lake Temple was dedicated in 1893.","a":0,"why":"Wikipedia: dedicated in 1893."},{"t":"Anyone can take a tour inside the temple.","a":2,"why":"A temple recommend is required, so there are no public tours inside."}],"sources":[{"t":"Wikipedia: Salt Lake Temple","u":"https://en.wikipedia.org/wiki/Salt_Lake_Temple"},{"t":"Wikipedia: Temple Square","u":"https://en.wikipedia.org/wiki/Temple_Square"}],"card":{"a":"1893","b":"2027","la":"Dedicated","lb":"Open house planned"}},{"id":"beehive","name":"Beehive House","short":"Beehive House","badge":"Beehive House","tag":"Stop 2 of 4","teaser":"A pioneer mansion named for a sculpture of bees' home on its roof.","map":"Beehive House, 67 East South Temple, Salt Lake City, UT","clue":"Go to South Temple Street, one block east of Temple Square. Look for a pale house with green shutters and a small tower on the roof.","safety":"South Temple is a busy street. Use crosswalks. The house is closed for renovation, so view it from the public sidewalk.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"Why is it called the Beehive House?","options":["Bees lived in the attic","A beekeeper built it","The roof is shaped like a hive","A beehive sculpture sits on top"],"answer":3,"hint":"Early settlers liked what bees stood for: hard work together.","verify":"Wikipedia says the name comes from the beehive sculpture atop the house. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"1894","label":"The house then","line":"A black-and-white print of the house and Eagle Gate, with a bare yard and a tall tree.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"sk_bh_then","by":"Probably Pavel Albieri","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Eagle_Gate_and_Beehive_House_SLC_1894_Albieri.jpg","note":"resized, cropped"}},"now":{"yr":"2020","head":"Today","label":"The house today","line":"The pale house with its columned porch and a small tower, behind a street lamp and trees.","ph":{"k":"sk_bh_now","by":"Beneathtimp","lic":"CC0","lu":"https://creativecommons.org/publicdomain/zero/1.0/","page":"https://commons.wikimedia.org/wiki/File:Beehive_House_-_Salt_Lake_City,_Utah_-_2_May_2020.jpg","note":"resized"}},"story":["The Beehive House was built in 1854 and was one of the residences of Brigham Young, the second president of the Church of Jesus Christ of Latter-day Saints. Its name comes from the beehive sculpture on top. Early Mormons used honeybees to symbolize industry and cooperation.","Truman O. Angell, Young's brother-in-law and the architect of the Salt Lake Temple, designed it. It is built of adobe and sandstone. It served as the executive mansion of Utah Territory. A suite of rooms connects it to the neighboring Lion House, and Young died in his bedroom there in 1877.","After Young's death it passed through disputes among his heirs and later served as a boarding house for women. It is normally a historic house museum, but it has been closed for renovation since 2023, with a reopening expected in 2027."],"fact":"Young died in the house in 1877.","disputed":"Many people think the name means real bees lived here. Wikipedia says the name comes from the sculpture on the roof.","claims":[{"t":"The Beehive House was built in 1854.","a":0,"why":"Wikipedia: constructed in 1854."},{"t":"The Beehive House is built of brick and was never used for anything but a museum.","a":2,"why":"It is adobe and sandstone, and it was also a women's boarding house."}],"sources":[{"t":"Wikipedia: Beehive House","u":"https://en.wikipedia.org/wiki/Beehive_House"},{"t":"Wikipedia: Brigham Young","u":"https://en.wikipedia.org/wiki/Brigham_Young"}],"card":{"a":"1854","b":"2027","la":"Built","lb":"Reopening expected"}},{"id":"lion","name":"Lion House","short":"Lion House","badge":"Lion House","tag":"Stop 3 of 4","teaser":"A house with 20 gables and a stone lion over the door.","map":"Lion House, 63 East South Temple, Salt Lake City, UT","clue":"Go to South Temple Street, one block east of Temple Square, next to the Beehive House. Look for a Gothic-looking house with many pointed roof peaks and a statue of a lion over the front door.","safety":"South Temple is a busy street. Use crosswalks. The house is closed for restoration, so view it from the public sidewalk.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"How many gables does the Lion House have?","options":["20","4","12","50"],"answer":0,"hint":"Count the pointed roof peaks along the front.","verify":"Wikipedia says it is a Gothic Revival mansion with 20 gables for 20 small bedrooms. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"1900","label":"The house then","line":"A colorized view down the sidewalk toward the pink house with its pointed gables and a fence in front.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"sk_lh_then","by":"Detroit Publishing Company","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:The_Lion_House,_Salt_Lake_City-LCCN2008678282.jpg","note":"resized"}},"now":{"yr":"2009","head":"Today","label":"The house today","line":"The front porch with its stone lion above the door and tall buildings behind.","ph":{"k":"sk_lh_now","by":"Bobjgalindo","lic":"CC BY-SA 4.0","lu":"https://creativecommons.org/licenses/by-sa/4.0/","page":"https://commons.wikimedia.org/wiki/File:Lion_House_Brigham_Young.jpg","note":"resized"}},"story":["Brigham Young built the Lion House in 1856, two years after the Beehive House. Truman Osborn Angell was involved in the design. It is a Gothic Revival mansion with 20 gables for 20 small bedrooms.","It is named for a statue of a lion, sculpted by William Ward III, above the front entrance. Lion of the Lord was a nickname for Young. It is joined to the Beehive House by a series of rooms that Young used as offices, and it housed many of his wives and children.","Later it held the domestic science department of LDS University in the 1920s and became a social center in the 1930s. It closed in 2020 and is being restored, with reopening expected in spring 2027."],"fact":"It has one gable for each small bedroom.","disputed":"Many people think the house is named for a real lion. Wikipedia says it is named for a statue above the entrance.","claims":[{"t":"The Lion House was built in 1856.","a":0,"why":"Wikipedia: built in 1856."},{"t":"The Lion House is named for a live lion kept in the yard.","a":2,"why":"It is named for a lion statue above the front entrance."}],"sources":[{"t":"Wikipedia: Lion House (Salt Lake City)","u":"https://en.wikipedia.org/wiki/Lion_House_(Salt_Lake_City)"},{"t":"Wikipedia: Truman O. Angell","u":"https://en.wikipedia.org/wiki/Truman_O._Angell"}],"card":{"a":"1856","b":"2027","la":"Built","lb":"Reopening expected"}},{"id":"eagle","name":"Eagle Gate","short":"Eagle Gate","badge":"Eagle Gate","tag":"Stop 4 of 4","teaser":"An arch over a street, topped with an eagle sitting on a beehive.","map":"Eagle Gate, State Street at South Temple, Salt Lake City, UT","clue":"Go to the corner of State Street and South Temple. Look for a big arch over the street with a bird on top.","safety":"The gate spans a busy street. Use crosswalks and view it from the sidewalk. Never stand in the road.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"What sits on top of the Eagle Gate arch?","options":["A golden angel","An eagle perched on a beehive","A lion on a rock","A bell"],"answer":1,"hint":"Think of Utah's nickname.","verify":"Wikipedia says the monument is topped by a sculpture of an eagle perched on a beehive. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"About 1900","label":"The gate then","line":"A colorized view of the arch with its eagle, down a dusty street lined with tall trees.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"sk_eg_then","by":"Detroit Photographic Company","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Detroit_Photographic_Company_(0820)_-_Eagle_Gate,_Salt_Lake_City.jpg","note":"resized"}},"now":{"yr":"2016","head":"Today","label":"The gate today","line":"The steel arch and its eagle over State Street, with tall buildings behind.","ph":{"k":"sk_eg_now","by":"Beneathtimp","lic":"CC0","lu":"https://creativecommons.org/publicdomain/zero/1.0/","page":"https://commons.wikimedia.org/wiki/File:Eagle_Gate,_north_side_-_Salt_Lake_City,_Utah_-_5_September_2016.jpg","note":"resized"}},"story":["The Eagle Gate is an arch across State Street at its intersection with South Temple. It honors Brigham Young's 1859 gate, which was an entrance to his property and the City Creek Canyon road. The tolls for hauling wood from the canyon could be paid by giving Young every fifth load.","After the road was opened to the public and the gates removed, the arch with its eagle and beehive stayed. The structure has been rebuilt twice, in the 1890s and the 1960s.","The current bronze eagle was made in the early 1960s and has a wingspan of 20 feet. It weighs 4,000 pounds. The arches and pillars are a steel frame covered in metal panels, and Wikipedia calls the design one of the city's finest examples of mid-century modern."],"fact":"The eagle weighs 4,000 pounds.","disputed":"Many people think the gate is the original wooden one. Wikipedia says it has been rebuilt twice.","claims":[{"t":"The Eagle Gate has been rebuilt twice.","a":0,"why":"Wikipedia: rebuilt in the 1890s and again in the 1960s."},{"t":"The Eagle Gate today is made of carved wood.","a":2,"why":"The arches are steel covered in metal panels, and the eagle is bronze alloy."}],"sources":[{"t":"Wikipedia: Eagle Gate","u":"https://en.wikipedia.org/wiki/Eagle_Gate"},{"t":"Wikipedia: Salt Lake City","u":"https://en.wikipedia.org/wiki/Salt_Lake_City"}],"card":{"a":"1859","b":"1960s","la":"First gate","lb":"Current eagle made"}}],"heroKey":"sk_tp_now"},"sandiego":{"id":"sandiego","name":"San Diego","explorer":"Sunshine Explorer","initials":"SAN","ranks":[[0,"Visitor"],[100,"Bay Walker"],[250,"Landmark Hunter"],[450,"San Diego Scholar"],[600,"San Diego Historian"]],"heroAlt":"The Hotel del Coronado","heroLi":"<li>Header: Ctorbann · CC BY-SA 3.0 · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:Hotel_Del_Coronado_01.JPG\">Source</a> · resized</li>","heroCredit":"Photo: Ctorbann · <a target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by-sa/3.0/\">CC BY-SA 3.0</a> · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:Hotel_Del_Coronado_01.JPG\">Source</a>","mission":"Find four landmarks around San Diego. At each one, check in to earn its badge, unlock its story, and collect a Time Card. Do them in any order. Everything stays on this phone.","afterDone":"All four badges earned. The rest of San Diego is waiting.","safetyNote":"<li>These places are spread across town, with beach, park and city streets. Use crosswalks, watch for cars and bikes, and bring water and sun protection.</li>","badgeMap":{"hotel":["sd_hd_now","50% 45%"],"mission":["sd_mi_now","50% 45%"],"botanical":["sd_bp_now","50% 45%"],"estudillo":["sd_ce_now","50% 45%"]},"level":"Classics","region":"The West","stops":[{"id":"hotel","name":"Hotel del Coronado","short":"Hotel del Coronado","badge":"Hotel del Coronado","tag":"Stop 1 of 4","teaser":"A giant wooden hotel by the beach, built in a land boom.","map":"Hotel del Coronado, Coronado, CA","clue":"Go to Coronado, across San Diego Bay from downtown. Look for a huge white hotel with red roofs and a tall red tower, right by the beach.","safety":"This is a working resort. Stay on public paths, respect guests, and be careful of soft sand, waves and traffic.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"What is the Hotel del Coronado mostly built from?","options":["Steel","Wood","Brick","Adobe"],"answer":1,"hint":"It is the second-largest structure of its kind in the United States.","verify":"Wikipedia says it is a wooden Victorian beach resort and the second-largest wooden structure in the United States. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"About 1900","label":"The hotel then","line":"A colorized photograph of the red-roofed hotel across a tennis court and lawn.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"sd_hd_then","by":"William Henry Jackson","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Hotel_Del_c1900b.jpg","note":"resized"}},"now":{"yr":"2007","head":"Today","label":"The hotel today","line":"The red roofs and tower rising above palm trees and sand.","ph":{"k":"sd_hd_now","by":"Ctorbann","lic":"CC BY-SA 3.0","lu":"https://creativecommons.org/licenses/by-sa/3.0/","page":"https://commons.wikimedia.org/wiki/File:Hotel_Del_Coronado_01.JPG","note":"resized"}},"story":["The Hotel del Coronado, also called The Del, is a beachfront hotel in Coronado, across San Diego Bay from San Diego. It is a rare surviving wooden Victorian beach resort. It became a California Historical Landmark in 1970 and a National Historic Landmark in 1977.","In November 1885 five investors bought Coronado and North Island, about 4,000 acres, for $110,000. E. S. Babcock and Hampton L. Story created the Coronado Beach Company and hired architect James W. Reid. When the hotel opened in 1888, it was the largest resort hotel in the world.","The company also ran ferries, piped fresh water under the bay and built a railroad. The hotel had one of the state's largest
