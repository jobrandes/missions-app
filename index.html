<title>Then &amp; Now</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: one phone-width column. A skyline hero carries rank and progress. Each stop has a badge, a Now scene, a Then scene, and a sticky Back bar. */
:root{
  --font-display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --font-body:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --bg:#EDF0F3; --surface:#FFFFFF; --surface-2:#E1E7EC; --ink:#13202C; --muted:#53626F; --line:#C9D1D9;
  --accent:#1B58B8; --accent-ink:#FFFFFF; --bulb:#F2B01E; --bulb-off:#B4BEC8;
  --good:#1E7A4C; --warn:#9A5A08; --bad:#B3322B;
  --mat:#F7F4EE; --mat-ink:#3A3226;
  /* scene palette: "now" scenes */
  --sky1:#8EC1EE; --sky2:#F6DDB0; --hill:#6C88A3; --hill2:#8AA2B8; --bldg:#3C5167; --bldg2:#52697F;
  --water:#4C93C9; --steel:#2D3C4B; --lamp:#FFD25A; --tree:#47875B; --road:#56626E; --wood:#8A6A45;
  --stone:#BAC4CD; --grass:#6FA45C;
  /* scene palette: "then" scenes (sepia print) */
  --p1:#E3D7BC; --p2:#C9B999; --p3:#A08E70; --p4:#6E5E47; --p5:#3A2F21;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D141B; --surface:#16202A; --surface-2:#1E2B37; --ink:#E9EFF4; --muted:#9AAAB8; --line:#2B3946;
    --accent:#7BB0FF; --accent-ink:#0B1722; --bulb:#FFC83D; --bulb-off:#3F4E5B;
    --good:#59C58E; --warn:#F0A957; --bad:#FF8A80;
    --mat:#2B2823; --mat-ink:#E4DAC8;
    --sky1:#0F2238; --sky2:#40506B; --hill:#20374D; --hill2:#2B465E; --bldg:#101C28; --bldg2:#1B2C3C;
    --water:#1F5E8C; --steel:#9AB1C6; --lamp:#FFC83D; --tree:#2D6C48; --road:#252F39; --wood:#6B5236;
    --stone:#6F7C88; --grass:#3C6B49;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D141B; --surface:#16202A; --surface-2:#1E2B37; --ink:#E9EFF4; --muted:#9AAAB8; --line:#2B3946;
  --accent:#7BB0FF; --accent-ink:#0B1722; --bulb:#FFC83D; --bulb-off:#3F4E5B;
  --good:#59C58E; --warn:#F0A957; --bad:#FF8A80;
  --mat:#2B2823; --mat-ink:#E4DAC8;
  --sky1:#0F2238; --sky2:#40506B; --hill:#20374D; --hill2:#2B465E; --bldg:#101C28; --bldg2:#1B2C3C;
  --water:#1F5E8C; --steel:#9AB1C6; --lamp:#FFC83D; --tree:#2D6C48; --road:#252F39; --wood:#6B5236;
  --stone:#6F7C88; --grass:#3C6B49;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--font-body);
  padding-block:16px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%;
}
body.hasbar{padding-bottom:112px}
.app{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--font-display);font-weight:800;margin:0;text-wrap:balance;text-transform:uppercase;letter-spacing:.015em;line-height:1}
h1{font-size:clamp(56px,16vw,88px)}
h2{font-size:34px}
h3{font-size:22px;font-weight:700}
p{margin:0;max-width:65ch}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mono{font:500 12px/1.3 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
button{font-family:inherit}

/* hero: city skyline backdrop */
.hero{position:relative;overflow:hidden;border-radius:16px;color:#fff;padding:18px 16px 14px;display:flex;flex-direction:column;gap:10px;min-height:360px;justify-content:flex-end;isolation:isolate;background:#12263F}
.hero > img.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 55%;z-index:-2}
.cities{display:flex;gap:8px;flex-wrap:wrap}
.city{min-height:44px;padding:8px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:15px;cursor:pointer}
.city[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.city[disabled]{opacity:.55;border-style:dashed;cursor:default}
.hero.nophoto{background:linear-gradient(180deg,#0E2238 0%,#2A4A6E 62%,#6B5A44 100%)}
.hero.nophoto > img.art{display:none}
.hero h1.long{font-size:clamp(44px,12.5vw,72px)}
.bimg.plain{display:flex;align-items:center;justify-content:center;border-radius:50%;border:3px solid var(--bulb-off);color:var(--muted);font:800 20px var(--font-display);letter-spacing:.04em}
.bimg.plain.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--bulb);color:var(--ink);background:var(--surface-2)}
.bbox.lg .bimg.plain{font-size:30px}
.hero-credit{font:500 11px var(--font-mono);letter-spacing:.04em;color:rgba(255,255,255,.8)}
.hero-credit a{color:#fff}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(6,14,24,.72) 0%,rgba(6,14,24,.38) 48%,rgba(6,14,24,.12) 72%,rgba(6,14,24,.4) 100%)}
.hero h1{color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.45)}
.hero .mono{color:rgba(255,255,255,.82)}
.rank-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
#rankName{font:700 20px var(--font-display);text-transform:uppercase;letter-spacing:.03em;text-shadow:0 1px 8px rgba(0,0,0,.7)}
#xpText{text-shadow:0 1px 6px rgba(0,0,0,.8)}
.xp{height:10px;border-radius:999px;background:rgba(255,255,255,.25);overflow:hidden}
#xpFill{height:100%;width:0;background:#FFC83D;border-radius:999px}
.bulbs{display:grid;grid-template-columns:repeat(4,1fr);position:relative;background:rgba(6,14,24,.62);border-radius:12px;padding:10px 4px 8px}
.bulbs::before{content:"";position:absolute;left:12.5%;right:12.5%;top:22px;height:2px;background:rgba(255,255,255,.28)}
.bulb{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px}
.bulb i{width:24px;height:24px;border-radius:50%;background:#3F4E5B;border:2px solid #0E1A27}
.bulb.on i{background:#FFC83D;box-shadow:0 0 14px 2px #FFC83D}
.bulb span{font:500 11px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.75);text-align:center}
.bulb.on span{color:#fff}

/* tabs */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;background:var(--surface-2);border-radius:12px}
.tab{border:0;background:transparent;color:var(--muted);font-weight:600;font-size:15px;min-height:44px;border-radius:9px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.18)}

/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.view{display:flex;flex-direction:column;gap:16px}
.btn{display:block;width:100%;min-height:52px;padding:12px 16px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:16px;cursor:pointer;text-align:center;text-decoration:none;line-height:1.3}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn.small{min-height:44px;width:auto;display:inline-block;font-size:15px}
.link{background:none;border:0;color:var(--accent);font-weight:600;font-size:15px;cursor:pointer;padding:8px 0;min-height:44px}
.note{border:1.5px dashed var(--warn);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.note .mono{color:var(--warn)}
.safety{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface-2);display:flex;flex-direction:column;gap:4px;font-size:15px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > *{flex:1 1 160px;min-width:0}

/* scenes + badges */
.scene{aspect-ratio:4/3;max-width:100%;overflow:hidden;border-radius:10px;background:var(--surface-2)}
.scene svg{display:block;width:100%;height:100%}
.banner{position:relative}
.banner .tagline{position:absolute;left:10px;bottom:8px;font:500 11px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:#fff;background:rgba(6,14,24,.6);padding:3px 8px;border-radius:999px}
.bimg{display:block;width:100%;height:100%}
.bimg img{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover;filter:grayscale(1) brightness(.62) contrast(.9);box-shadow:0 0 0 3px var(--bulb-off)}
.bimg.on img{filter:none;box-shadow:0 0 0 3px var(--bulb),0 0 0 6px var(--accent),0 2px 10px rgba(0,0,0,.3)}
.bbox{width:60px;height:60px;flex:none;padding:6px}
.bbox.lg{width:92px;height:92px;padding:8px}

/* trail */
.stops{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.stop{display:grid;grid-template-columns:60px minmax(0,1fr) auto;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;color:inherit;font:inherit;cursor:pointer;min-height:80px}
.stop h3{margin-bottom:4px}
.stop .sub{font-size:14px;color:var(--muted)}
.stop .chev{font-size:26px;color:var(--muted)}
.status{display:inline-block;margin-top:6px;font:500 11px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.status.ok{color:var(--good);border-color:var(--good)}
.soon{opacity:.6;border-style:dashed}

/* stop */
.stophead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.step{background:none;border:0;padding:0;cursor:pointer;display:flex;flex-direction:column;gap:6px;text-align:left;min-height:44px;justify-content:flex-end}
.step::before{content:"";height:6px;border-radius:999px;background:var(--surface-2)}
.step.cur::before{background:var(--accent)}
.step.ok::before{background:var(--bulb)}
.step span{font:500 11px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.step.cur span{color:var(--ink)}
.step[disabled]{cursor:default;opacity:.55}
.opts{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;border:0}
.opts legend{padding:0;margin-bottom:10px;font-weight:600;font-size:18px;line-height:1.4}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;min-height:52px;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font-weight:500;font-size:16px;cursor:pointer}
.opt.wrong{border-color:var(--bad);opacity:.75}
.opt.right{border-color:var(--good);box-shadow:inset 0 0 0 1px var(--good)}
.opt em{font:500 12px var(--font-mono);font-style:normal;letter-spacing:.06em;text-transform:uppercase}
.opt.wrong em{color:var(--bad)}
.opt.right em{color:var(--good)}
.feedback{min-height:1.5em;font-weight:500}
.feedback.bad{color:var(--bad)}
.feedback.good{color:var(--good)}
.earned{display:flex;gap:14px;align-items:center;border:1.5px solid var(--good);border-radius:12px;padding:12px}
.earned strong{font:800 24px/1 var(--font-display);text-transform:uppercase;letter-spacing:.02em;display:block}
.pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;align-items:start}
.then{background:var(--mat);color:var(--mat-ink);padding:10px 10px 12px;border-radius:4px;box-shadow:0 6px 18px rgba(0,0,0,.2);display:flex;flex-direction:column;gap:10px;min-width:0}
.then .scene{border-radius:2px;position:relative}
.scene.pend{display:flex;align-items:center;justify-content:center;padding:14px;text-align:center;font-size:13px;line-height:1.4;color:var(--muted);border:1.5px dashed var(--line);background:transparent}
.then .scene.pend{color:var(--mat-ink);border-color:var(--mat-ink);opacity:.75}
.scene img{display:block;width:100%;height:100%;object-fit:cover}
.credit{font-size:12px;line-height:1.45;opacity:.85}
.then .credit a{font-size:12px}
.then .cap{font-size:14px}
.then .fine{font-size:12px;opacity:.8}
.then a{color:var(--mat-ink);font-weight:600;font-size:14px}
.now{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:10px 10px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.now .cap{font-size:14px}
.now b.yr{font:800 40px/1 var(--font-display);color:var(--accent)}
.story{display:flex;flex-direction:column;gap:12px}
.fact{border-radius:10px;background:var(--surface-2);padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.claim{display:flex;flex-direction:column;gap:10px;padding-top:14px;border-top:1px solid var(--line)}
.claim:first-of-type{border-top:0;padding-top:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-weight:500;font-size:15px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.why{font-size:15px;color:var(--muted)}
.srcs{margin:0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:4px}
details summary{cursor:pointer;font-weight:600;min-height:44px;display:flex;align-items:center}
details ul{margin:0 0 4px;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:15px}

/* cards + rewards */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.tcard{border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:12px;display:flex;flex-direction:column;gap:8px;text-align:left;color:inherit;font:inherit;min-width:0;cursor:pointer}
.tcard.locked{border-style:dashed;background:transparent;color:var(--muted);cursor:default;padding:16px}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mini .scene{border-radius:6px}
.credit-txt{font-size:12px;color:var(--muted);line-height:1.4}
.years{font:800 34px/1 var(--font-display);display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.years i{font-style:normal;color:var(--accent);font-size:26px}
.ladder{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ladder li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.ladder li.got{border-color:var(--good)}
.ladder li.got .mono{color:var(--good)}
.cases{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.case{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:12px 8px;border:1px solid var(--line);border-radius:12px}
.case.got{border-color:var(--accent)}
.case .nm{font:700 18px var(--font-display);text-transform:uppercase;letter-spacing:.03em;line-height:1.05}
.master{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.code{display:flex;gap:8px;flex-wrap:wrap}
.code input{flex:1 1 180px;min-width:0;min-height:48px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:500 16px var(--font-mono)}
.done-banner{border-radius:14px;padding:16px;background:var(--accent);color:var(--accent-ink);display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.done-banner .bbox{color:var(--accent-ink)}
.done-banner h2{color:inherit}
.done-banner p{font-size:15px}

/* sticky back bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bar-in{max-width:600px;margin:0 auto;display:flex;gap:10px}
.bar-in .btn{flex:1 1 0;width:auto;min-height:48px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:15px;opacity:0;pointer-events:none;max-width:calc(100% - 32px);text-align:center;z-index:20}
.toast.show{opacity:1}
@media (prefers-reduced-motion:no-preference){
  .toast{transition:opacity .2s}
  .bulb.on i{animation:glow 2.8s ease-in-out infinite}
  .pop{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
  #xpFill{transition:width .5s ease}
  @keyframes pop{from{transform:scale(1.4) rotate(-6deg);opacity:0}to{transform:none;opacity:1}}
  @keyframes glow{50%{box-shadow:0 0 6px 1px #FFC83D}}
}
</style>

<div class="app">
  <nav class="cities" id="cities" aria-label="Towns"></nav>
  <header class="hero" id="hero">
    <img class="art" id="heroImg" alt="">
    <p class="mono">Then &amp; Now</p>
    <h1 id="cityName">Reno</h1>
    <div class="rank-row">
      <span id="rankName"></span>
      <span id="xpText" class="mono"></span>
    </div>
    <div class="xp" role="progressbar" aria-label="Experience points" id="xpBar" aria-valuemin="0" aria-valuemax="600"><div id="xpFill"></div></div>
    <div class="bulbs" id="bulbs" aria-label="Badges earned"></div>
    <p class="hero-credit" id="heroCredit"></p>
  </header>

  <nav class="tabs" role="tablist" aria-label="Sections">
    <button class="tab" role="tab" data-a="tab" data-t="trail" id="tab-trail">Trail</button>
    <button class="tab" role="tab" data-a="tab" data-t="cards" id="tab-cards">Cards</button>
    <button class="tab" role="tab" data-a="tab" data-t="rewards" id="tab-rewards">Rewards</button>
  </nav>

  <main id="main" class="view" role="tabpanel"></main>
</div>

<div class="bar" id="bar" hidden>
  <div class="bar-in">
    <button class="btn ghost" data-a="goback" id="barBack">‹ Back</button>
    <button class="btn ghost" data-a="exit" id="barExit">Trail</button>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  /* ---------- scene + badge drawing ---------- */
  var BMAP={arch:['arch_now','50% 28%'],oldarch:['oldarch_b','50% 40%'],bridge:['bridge_1910','55% 70%'],park:['park_a','50% 62%']};
  function mono(id){
    if(id==='master') return city().initials;
    var t='?'; STOPS.forEach(function(st){ if(st.id===id) t=st.short.replace(/[^A-Za-z]/g,'').slice(0,2).toUpperCase(); });
    return t;
  }
  function badge(id,on){
    var m=(id==='master')?(city().heroKey&&PHOTOS[city().heroKey]?[city().heroKey,'50% 60%']:null):BMAP[id];
    if(m&&PHOTOS[m[0]]) return '<span class="bimg'+(on?' on':'')+'"><img src="'+PHOTOS[m[0]]+'" alt="" style="object-position:'+m[1]+'"></span>';

      });
      h+='<button class="btn" data-a="check">Check my answers</button></section>';
    }
    return h;
  }

  function viewCards(){
    var h='<p>Each stop you unlock adds a Time Card to your collection. Tap one to reopen its story.</p><div class="grid">';
    STOPS.forEach(function(s,i){
      if(S.done[i]){
        h+='<button class="tcard" data-a="open" data-i="'+i+'" data-s="2"><span class="mono">'+s.name+'</span>'
          +'<span class="mini">'+visual(s,'then','Then: '+s.card.la,' then-s').replace(/<div/g,'<span').replace(/<\/div>/g,'</span>')+visual(s,'now','Now: '+s.card.lb).replace(/<div/g,'<span').replace(/<\/div>/g,'</span>')+'</span><span class="credit-txt">Then: '+creditTxt(s,'then')+'. Now: '+creditTxt(s,'now')+'.</span>'
          +'<span class="years">'+s.card.a+' <i>→</i> '+s.card.b+'</span><span><strong>Then:</strong> '+s.card.la+'</span><span><strong>Now:</strong> '+s.card.lb+'</span></button>';
      } else {
        h+='<div class="tcard locked"><span class="mono">Locked</span><span class="years">? <i>→</i> ?</span><span>Find '+s.name+' to collect this card.</span></div>';
      }
    });
    return h+'</div>';
  }

  function viewRewards(){
    var x=xp(), r=rank(x);
    var h='<section class="card"><h3>Badges</h3><div class="cases">'+STOPS.map(function(s,i){
      return '<div class="case'+(S.done[i]?' got':'')+'"><div class="bbox lg">'+badge(s.id,S.done[i])+'</div><span class="nm">'+s.badge+'</span><span class="mono">'+(S.done[i]?'Earned':'Locked')+'</span></div>';
    }).join('')+'</div></section>';
    h+='<section class="card"><h3>'+city().explorer+'</h3><div class="master"><div class="bbox lg">'+badge('master',allDone())+'</div><p>'+(allDone()?'Earned. You found every stop in '+city().name+'.':'Earn all four badges to unlock it.')+'</p></div></section>';
    h+='<section class="card"><h3>Rank</h3><ul class="ladder">'+RANKS.map(function(rk,i){
      return '<li class="'+(i<=r.i?'got':'')+'"><span>'+rk[1]+'</span><span class="mono">'+(i<=r.i?'Earned':rk[0]+' XP')+'</span></li>';
    }).join('')+'</ul></section>';
    h+='<section class="card"><h3>Save progress</h3><p>There are no accounts. To move your badges to another phone, copy this code there and paste it below.</p><div class="code"><input id="codeOut" readonly value="'+code()+'" aria-label="Progress code"><button class="btn small" data-a="copy">Copy</button></div>'
      +'<div class="code"><input id="codeIn" placeholder="Paste a code" aria-label="Paste a progress code" autocomplete="off" autocapitalize="characters" spellcheck="false"><button class="btn small ghost" data-a="restore">Restore</button></div><p id="codeMsg" class="why" aria-live="polite"></p></section>';
    h+='<section class="card"><h3>Start over</h3>'+(confirmReset?'<p>Erase every badge and all XP for '+city().name+' on this phone?</p><div class="row"><button class="btn" data-a="resetyes">Yes, erase</button><button class="btn ghost" data-a="resetno">Cancel</button></div>':'<button class="btn ghost" data-a="resetask">Reset progress</button>')+'</section>';
    return h;
  }

  function render(focusTitle){
    updateHeader();
    var m=document.getElementById('main');
    m.setAttribute('aria-labelledby','tab-'+tab);
    if(cur) m.innerHTML=viewStop();
    else if(tab==='trail') m.innerHTML=viewTrail();
    else if(tab==='cards') m.innerHTML=viewCards();
    else m.innerHTML=viewRewards();
    var bar=document.getElementById('bar');
    bar.hidden=!cur;
    document.body.classList.toggle('hasbar',!!cur);
    if(cur){
      var atRoot=cur.step<=cur.entry;
      document.getElementById('barBack').textContent='‹ Back';
      document.getElementById('barBack').setAttribute('aria-label',atRoot?('Back to '+(tab==='cards'?'Cards':'Trail')):'Back to previous step');
      document.getElementById('barExit').textContent=(tab==='cards'?'All cards':'All stops');
    }
    if(focusTitle){
      var t=document.getElementById('stopTitle');
      if(t) t.focus({preventScroll:true});
    }
  }

  /* ---------- navigation ---------- */
  function leave(){
    cur=null;
    if(pushed){
      pushed=false; ignorePop=true;
      try{ history.back(); }catch(e){ ignorePop=false; }
    }
  }
  function exitStop(){ leave(); render(); window.scrollTo(0,0); }
  function openStop(i,step){
    var entry=(step!==undefined?step:(S.done[i]?2:0));
    cur={i:i,step:entry,entry:entry,wrong:[],picks:[],checked:false};
    if(!pushed){ try{ history.pushState({stop:1},'','#stop'); pushed=true; }catch(e){} }
    render(true); window.scrollTo(0,0);
  }
  function setStep(n){
    if(n>=2 && !S.done[cur.i]) return;
    cur.step=n; cur.checked=false; render(true); window.scrollTo(0,0);
  }
  function goBack(){
    if(!cur) return;
    if(cur.step>cur.entry) setStep(cur.step-1); else exitStop();
  }
  window.addEventListener('popstate',function(){
    if(ignorePop){ ignorePop=false; return; }
    if(cur){ pushed=false; cur=null; render(); window.scrollTo(0,0); }
  });

  document.addEventListener('click',function(e){
    var b=e.target.closest('[data-a]'); if(!b) return;
    var a=b.getAttribute('data-a');
    if(a==='city'){ setCity(b.getAttribute('data-c')); return; }
    if(a==='tab'){ leave(); tab=b.getAttribute('data-t'); confirmReset=false; render(); window.scrollTo(0,0); return; }
    if(a==='open'){ var s=b.getAttribute('data-s'); openStop(+b.getAttribute('data-i'), s?+s:undefined); return; }
    if(a==='exit'){ exitStop(); return; }
    if(a==='goback'){ goBack(); return; }
    if(a==='step'){ setStep(+b.getAttribute('data-n')); return; }
    if(a==='pick'){
      var k=+b.getAttribute('data-k'), st=STOPS[cur.i];
      if(k===st.q.answer){
        if(!S.done[cur.i]){ S.done[cur.i]=1; save(); toast('Badge earned: '+st.badge+'. +100 XP'); }
        cur.wrong=[]; render();
      } else {
        if(cur.wrong.indexOf(k)<0) cur.wrong.push(k);
        render();
      }
      return;
    }
    if(a==='cpick'){
      cur.picks[+b.getAttribute('data-c')]=+b.getAttribute('data-k'); cur.checked=false; render(); return;
    }
    if(a==='check'){
      var st2=STOPS[cur.i], gained=0, ok=0;
      st2.claims.forEach(function(c,ci){
        var gi=cur.i*2+ci;
        if(S.claims[gi]){ ok++; return; }
        if(cur.picks[ci]===c.a){ S.claims[gi]=1; gained+=25; ok++; }
      });
      cur.checked=true; save(); render();
      if(gained) toast('+'+gained+' XP');
      else if(ok<st2.claims.length) toast('Not yet. Try again.');
      return;
    }
    if(a==='copy'){
      var inp=document.getElementById('codeOut');
      var done=function(){ toast('Code copied'); };
      var fb=function(){ inp.focus(); inp.select(); toast('Code selected. Copy it manually.'); };
      try{ navigator.clipboard.writeText(code()).then(done,fb); }catch(err){ fb(); }
      return;
    }
    if(a==='restore'){
      var v=(document.getElementById('codeIn').value||'').trim().toUpperCase();
      var m1=/^TN1-([01]{4})([01]{8})$/.exec(v), m2=/^TN2-([01]{4})([01]{8})-([01]{4})([01]{8})$/.exec(v), msg=document.getElementById('codeMsg');
      if(!m1 && !m2){ msg.textContent='That code does not look right. It starts with TN2- (or TN1- for older Reno codes).'; return; }
      var arr=function(x){return x.split('').map(Number);};
      if(m1){ ALL.reno={done:arr(m1[1]),claims:arr(m1[2])}; }
      else { ALL.reno={done:arr(m2[1]),claims:arr(m2[2])}; ALL.vc={done:arr(m2[3]),claims:arr(m2[4])}; }
      S=ALL[cityId]; save(); render(); toast('Progress restored'); return;
    }
    if(a==='resetask'){ confirmReset=true; render(); return; }
    if(a==='resetno'){ confirmReset=false; render(); return; }
    if(a==='resetyes'){ ALL[cityId]=blank(); S=ALL[cityId]; save(); confirmReset=false; render(); toast('Progress erased'); return; }
  });

  load(); applyCity(); render();
})();
</script>
