It is open to the public free of charge, and the original plan to put a statue in the center of the square lost out to the railroad companies, who claimed the busy intersection for streetcar lines."],"fact":"A streetcar fight moved the monument.","disputed":"Many people think the monument stands in the center of Public Square. Wikipedia says it was built in the southeast quadrant, because streetcar companies claimed the center intersection.","claims":[{"t":"The monument was dedicated in 1894.","a":0,"why":"Wikipedia: dedicated July 4, 1894."},{"t":"The monument honors soldiers from the Revolutionary War.","a":2,"why":"It honors Union soldiers and sailors of the Civil War."}],"sources":[{"t":"Wikipedia: Soldiers' and Sailors' Monument (Cleveland)","u":"https://en.wikipedia.org/wiki/Soldiers%27_and_Sailors%27_Monument_(Cleveland)"},{"t":"Wikipedia: Public Square (Cleveland)","u":"https://en.wikipedia.org/wiki/Public_Square_(Cleveland)"}],"card":{"a":"1879","b":"1894","la":"First meeting","lb":"Dedicated"}},{"id":"church","name":"Old Stone Church","short":"Stone Church","badge":"Stone Church","tag":"Stop 3 of 4","teaser":"The oldest building on Public Square, which has lost its steeple and gotten it back.","map":"Old Stone Church, 91 Public Square, Cleveland, OH","clue":"Stay on Public Square. Look for a dark stone church with a pointed steeple, squeezed between modern office buildings.","safety":"The church is a working congregation, so check visiting hours before going in. Keep off the steps during services and use crosswalks.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"What kind of stone is the church built from?","options":["Marble","Granite","Sandstone","Limestone"],"answer":2,"hint":"The stone turned black from air pollution before it was cleaned.","verify":"Wikipedia says the church is built of local sandstone, and the black Berea sandstone was cleaned in 1999. Look at the walls on site. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"Before 1923","label":"The church then","line":"A postcard of the church from before 1923, with no steeple, beside the old courthouse and other buildings.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"cl_os_then","by":"Unknown author","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Cleveland_OH_Old_Stone_Church_PHS857.jpg","note":"resized, cropped"}},"now":{"yr":"2010","head":"Today","label":"The church today","line":"The dark stone church with its spire among the modern towers.","ph":{"k":"cl_os_now","by":"Eli Pousson","lic":"CC BY-SA 2.0","lu":"https://creativecommons.org/licenses/by-sa/2.0/","page":"https://commons.wikimedia.org/wiki/File:Old_Stone_Church,_Downtown_Cleveland.jpg","note":"resized"}},"story":["The first church on this spot was built in 1834 from gray sandstone, and people started calling it the Old Stone Church. By 1853 it was too small, so it was torn down. The larger Romanesque Revival church was dedicated on August 12, 1855.","On March 7, 1857, a fire struck, and the 250-foot steeple crashed onto Ontario Street. Another fire gutted the interior on January 5, 1884. The congregation decided to rebuild on the same spot, and the church was dedicated again on October 19, 1884.","The only big change since is the steeple. A copy of the original was added in 1999, as part of a $2.4 million renovation that also cleaned the sandstone. It is the oldest building on Public Square."],"fact":"The steeple you see now was added in 1999.","disputed":"Many people think the steeple has always been there. Wikipedia says the original came down in a fire in 1857, and a replica was added in 1999.","claims":[{"t":"The Old Stone Church is the oldest building on Public Square.","a":0,"why":"Wikipedia says so."},{"t":"The church's steeple has stood since 1855 without a break.","a":2,"why":"The steeple fell in 1857, and a replica was added in 1999."}],"sources":[{"t":"Wikipedia: Old Stone Church (Cleveland)","u":"https://en.wikipedia.org/wiki/Old_Stone_Church_(Cleveland)"},{"t":"Wikipedia: Public Square (Cleveland)","u":"https://en.wikipedia.org/wiki/Public_Square_(Cleveland)"}],"card":{"a":"1855","b":"1999","la":"Church dedicated","lb":"New steeple"}},{"id":"arcade","name":"Cleveland Arcade","short":"Arcade","badge":"Arcade","tag":"Stop 4 of 4","teaser":"A glass-roofed shopping street from 1890 that was in a Superman movie.","map":"Cleveland Arcade, 401 Euclid Ave, Cleveland, OH","clue":"Go to Euclid Avenue downtown. Look for a big entrance with a hotel sign that leads into a long hall with a glass roof.","safety":"Euclid Avenue has buses and a lot of foot traffic. Use crosswalks, and remember that the upper floors are a hotel, so be quiet inside.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"What lets light into the Arcade from above?","options":["A glass skylight","A wooden roof","A tent","An open hole"],"answer":0,"hint":"Look up when you step inside.","verify":"Wikipedia says a glass skylight spans more than 300 feet over the balconies. Look up on site. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"1906","label":"The Arcade then","line":"A postcard of the Arcade's interior in 1906, with its balconies and glass roof.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"cl_ar_then","by":"Unknown author (via DPLA)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Interior_of_Euclid_Arcade,_Cleveland,_Ohio._-_DPLA_-_9aa0bcd1489c1b10cee0fa5ad471969c_(page_1).jpg","note":"resized, cropped"}},"now":{"yr":"2015","head":"Today","label":"The Arcade today","line":"The atrium, with its balconies and a glass skylight overhead.","ph":{"k":"cl_ar_now","by":"Michael Barera","lic":"CC BY-SA 4.0","lu":"https://creativecommons.org/licenses/by-sa/4.0/","page":"https://commons.wikimedia.org/wiki/File:Cleveland_August_2015_16_(The_Arcade).jpg","note":"resized"}},"story":["The Arcade opened on Memorial Day, May 30, 1890, and it cost $867,000. It is one of the earliest indoor shopping arcades in the United States. Wealthy Clevelanders including John D. Rockefeller helped pay for it.","It was modeled after the Galleria Vittorio Emanuele II in Milan. Two nine-story buildings face Euclid and Superior Avenues, joined by a five-story glass-roofed court more than 300 feet long and ringed with four levels of balconies. The skylight has 1,800 panes of glass.","It became a National Historic Landmark in 1975. In 2001 it was redeveloped into a Hyatt Regency hotel, and the skylight was replaced. In 2024 a scene in the movie Superman was filmed inside it."],"fact":"It copied a famous arcade in Milan.","disputed":"Many people think the Arcade is still a shopping mall. Wikipedia says the towers are now a hotel, and only the two lower floors hold shops and a food court.","claims":[{"t":"The Arcade opened in 1890.","a":0,"why":"Wikipedia: opened on May 30, 1890."},{"t":"The Arcade was built in the 1920s.","a":2,"why":"It was erected in 1890."}],"sources":[{"t":"Wikipedia: Cleveland Arcade","u":"https://en.wikipedia.org/wiki/Cleveland_Arcade"},{"t":"Wikipedia: Galleria Vittorio Emanuele II","u":"https://en.wikipedia.org/wiki/Galleria_Vittorio_Emanuele_II"}],"card":{"a":"1890","b":"2001","la":"Opened","lb":"Hotel opens"}}],"heroKey":"cl_ss_now"},"stlouis":{"id":"stlouis","name":"St. Louis","explorer":"Gateway Explorer","initials":"STL","ranks":[[0,"Visitor"],[100,"Riverfront Walker"],[250,"Landmark Hunter"],[450,"St. Louis Scholar"],[600,"St. Louis Historian"]],"heroAlt":"The Gateway Arch in St. Louis","heroLi":"<li>Header: Warren LeMay · CC BY-SA 2.0 · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:Gateway_Arch,_Gateway_Arch_National_Park,_St._Louis,_MO.jpg\">Source</a> · resized</li>","heroCredit":"Photo: Warren LeMay · <a target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by-sa/2.0/\">CC BY-SA 2.0</a> · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:Gateway_Arch,_Gateway_Arch_National_Park,_St._Louis,_MO.jpg\">Source</a>","mission":"Find four landmarks around St. Louis. At each one, check in to earn its badge, unlock its story, and collect a Time Card. Do them in any order. Everything stays on this phone.","afterDone":"All four badges earned. The rest of St. Louis is waiting.","safetyNote":"<li>Downtown St. Louis has busy streets and a riverfront with steep steps and wet stones. Use crosswalks, stay off the Eads Bridge roadway, and check opening hours before you plan to go inside anywhere.</li>","badgeMap":{"arch":["sl_ga_now","50% 45%"],"bridge":["sl_eb_now","50% 45%"],"station":["sl_us_now","50% 45%"],"wainwright":["sl_wb_now","50% 45%"]},"level":"Classics","region":"The Midwest","stops":[{"id":"arch","name":"Gateway Arch","short":"The Arch","badge":"The Arch","tag":"Stop 1 of 4","teaser":"A stainless-steel arch that took more than two years to build, and nobody has been able to out-tall it.","map":"Gateway Arch National Park, 11 N 4th St, St. Louis, MO","clue":"Go to the Mississippi riverfront downtown. Look for a huge shiny arch with its legs on the grass, high above the park.","safety":"The park has a lot of steps and open lawns. Stay on paths, mind the traffic near the park roads, and check the tram and tower schedule if you plan to go up.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"About how tall is the Gateway Arch?","options":["63 feet","630 feet","1,630 feet","300 feet"],"answer":1,"hint":"It is more than 600 feet, and under 1,000.","verify":"Wikipedia says the Arch is 630 feet tall. Look at the sign or the height on site. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"September 1965","label":"The Arch then","line":"The two legs of the Arch nearly joined, with construction cranes on top, in September 1965.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"sl_ga_then","by":"Rwietlake","lic":"CC BY-SA 4.0","lu":"https://creativecommons.org/licenses/by-sa/4.0/","page":"https://commons.wikimedia.org/wiki/File:Arch_Construction_September_1965.jpg","note":"resized"}},"now":{"yr":"2023","head":"Today","label":"The Arch today","line":"The Arch seen from the long lawn of the park, between rows of bare trees.","ph":{"k":"sl_ga_now","by":"Warren LeMay","lic":"CC BY-SA 2.0","lu":"https://creativecommons.org/licenses/by-sa/2.0/","page":"https://commons.wikimedia.org/wiki/File:Gateway_Arch,_Gateway_Arch_National_Park,_St._Louis,_MO.jpg","note":"resized"}},"story":["Finnish-American architect Eero Saarinen designed the Arch in 1947. The idea came from civic leader Luther Ely Smith, who proposed a memorial on the riverfront in 1933. Construction began on February 12, 1963, and was finished on October 28, 1965.","The Arch is 630 feet tall, clad in stainless steel and shaped as a weighted catenary arch. It is the world's tallest arch. It cost $13 million and opened to the public on June 10, 1967.","It stands at the 1764 site of the founding of St. Louis, and honors the westward expansion of the United States. It is nicknamed the Gateway to the West."],"fact":"The finished Arch opened to visitors in 1967.","disputed":"Many people think the Arch opened when its last piece went in. Wikipedia says it was completed on October 28, 1965, and opened to the public on June 10, 1967.","claims":[{"t":"The Gateway Arch is the world's tallest arch.","a":0,"why":"Wikipedia: it is the world's tallest arch."},{"t":"The Arch was designed in 1963.","a":2,"why":"Saarinen designed it in 1947. Construction began in 1963."}],"sources":[{"t":"Wikipedia: Gateway Arch","u":"https://en.wikipedia.org/wiki/Gateway_Arch"},{"t":"Wikipedia: Eero Saarinen","u":"https://en.wikipedia.org/wiki/Eero_Saarinen"}],"card":{"a":"1963","b":"1965","la":"Construction begins","lb":"Completed"}},{"id":"bridge","name":"Eads Bridge","short":"Eads Bridge","badge":"Eads Bridge","tag":"Stop 2 of 4","teaser":"The oldest bridge on the Mississippi, and the first to lean on steel.","map":"Eads Bridge, St. Louis, MO","clue":"Go to the riverfront just north of the Arch. Look for a long bridge with three big arches over the water and a stone pier on the shore.","safety":"The roadway and rail lines share the bridge. Use the sidewalk, watch for trains and bikes, and stay behind the rail.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"Which material did the Eads Bridge pioneer on a large scale?","options":["Wood","Plastic","Steel","Rope"],"answer":2,"hint":"Think of what skyscrapers and cars are made of.","verify":"Wikipedia says the bridge pioneered the large-scale use of steel as a structural material. Look at the arches on site. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"About 1900","label":"The bridge then","line":"A colored postcard of the bridge, with steamboats at the levee in front.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"sl_eb_then","by":"Detroit Photographic Company (credited on the card)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Eads_Bridge_(NBY_1245).jpg","note":"resized, cropped"}},"now":{"yr":"2010","head":"Today","label":"The bridge today","line":"A big steel arch from the shore, with another bridge behind it.","ph":{"k":"sl_eb_now","by":"Chuck Morris","lic":"CC BY-SA 3.0","lu":"https://creativecommons.org/licenses/by-sa/3.0/","page":"https://commons.wikimedia.org/wiki/File:Eads_Bridge_20100821.JPG","note":"resized"}},"story":["The bridge is named for James Buchanan Eads, who designed and built it. Work began in 1867 and ended in 1874. Eads had no experience building bridges. It was the first bridge across the Mississippi south of the Missouri River, and it is the oldest bridge on the river.","The foundations went more than 100 feet below the water, deeper than anything built underwater before. They used pneumatic caissons, the largest ever built at the time. The center arch is 520 feet long, the longest rigid span in the world then.","The highway deck was closed to cars from 1991 to 2003 and now carries cars and people again. The old railroad deck carries the MetroLink light rail."],"fact":"Its foundations are more than 100 feet below the river.","disputed":"Many people credit the Brooklyn Bridge with pioneering these methods. Wikipedia says the Eads Bridge pioneered them, and its work began in 1867, three years before the Brooklyn Bridge.","claims":[{"t":"The Eads Bridge was completed in 1874.","a":0,"why":"Wikipedia: work began in 1867 and ended in 1874."},{"t":"James Eads had built many bridges before this one.","a":2,"why":"He had no experience building bridges."}],"sources":[{"t":"Wikipedia: Eads Bridge","u":"https://en.wikipedia.org/wiki/Eads_Bridge"},{"t":"Wikipedia: James B. Eads","u":"https://en.wikipedia.org/wiki/James_Buchanan_Eads"}],"card":{"a":"1867","b":"1874","la":"Work begins","lb":"Completed"}},{"id":"station","name":"St. Louis Union Station","short":"Union Station","badge":"Union Station","tag":"Stop 3 of 4","teaser":"A train station that was once the busiest in the world, and now is a hotel.","map":"St. Louis Union Station, 1820 Market St, St. Louis, MO","clue":"Go to Market Street west of downtown. Look for a huge stone building with a tall clock tower and a big arched entrance.","safety":"Market Street has traffic and light rail. Use crosswalks, and remember that it is now a hotel and entertainment center, so check the hours for what you want to see.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"How tall is the station's clock tower?","options":["30 feet","130 feet","330 feet","230 feet"],"answer":3,"hint":"It is more than 200 feet, and under 300.","verify":"Wikipedia says the clock tower is 230 feet high. Look at it from the street on site. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"1906","label":"The station then","line":"A 1906 view from above of the station, with its clock tower and rail yard stretching out beside it.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"sl_us_then","by":"Unknown author","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Union_Station_(St._Louis)_(from_a_book_published_in_1906).png","note":"resized"}},"now":{"yr":"2023","head":"Today","label":"The Grand Hall today","line":"The curved ceiling of the Grand Hall, now part of a hotel and shops.","ph":{"k":"sl_us_now","by":"Warren LeMay","lic":"CC BY-SA 2.0","lu":"https://creativecommons.org/licenses/by-sa/2.0/","page":"https://commons.wikimedia.org/wiki/File:Grand_Hall,_St._Louis_Union_Station,_Market_Street,_St._Louis,_MO.jpg","note":"resized"}},"story":["The station opened on September 1, 1894. Theodore Link designed it, and George Pegram designed its 11.5-acre train shed. It was the world's largest and busiest railroad station when it opened, and its shed had the largest roof span in the world.","The Grand Hall has gold leaf, Romanesque arches and a barrel-vaulted ceiling 65 feet high. It was enlarged in 1903 for the 1904 World's Fair. At its peak in the 1940s, it handled 100,000 passengers a day.","The last Amtrak passenger train left in 1978. In the 1980s the building was renovated as a hotel, shopping center and entertainment complex."],"fact":"It once served 22 different railroads.","disputed":"Many people do not know where the famous photo of Truman holding the wrong \"Dewey Defeats Truman\" headline was taken. Wikipedia says it was shot at this station in 1948.","claims":[{"t":"Union Station opened in 1894.","a":0,"why":"Wikipedia: opened September 1, 1894."},{"t":"Amtrak trains still use Union Station today.","a":2,"why":"The last Amtrak passenger train left in 1978."}],"sources":[{"t":"Wikipedia: St. Louis Union Station","u":"https://en.wikipedia.org/wiki/St._Louis_Union_Station"},{"t":"Wikipedia: Dewey Defeats Truman","u":"https://en.wikipedia.org/wiki/Dewey_Defeats_Truman"}],"card":{"a":"1894","b":"1978","la":"Opened","lb":"Last Amtrak train"}},{"id":"wainwright","name":"Wainwright Building","short":"Wainwright","badge":"Wainwright","tag":"Stop 4 of 4","teaser":"One of the first skyscrapers that looked like a skyscraper.","map":"Wainwright Building, 709 Chestnut St, St. Louis, MO","clue":"Go to Chestnut Street downtown, near the Arch. Look for a dark red building, 10 stories tall, with tall vertical lines and decorated edges.","safety":"Chestnut Street has traffic and parking garages nearby. Use crosswalks, and note it is a state office building with security at the door.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"What material covers the Wainwright Building's decorated walls?","options":["Glass","Terra cotta","Marble","Wood"],"answer":1,"hint":"Think of a flowerpot's color and material, but fancier.","verify":"Wikipedia calls it a terra cotta office building. Look at the walls up close on site. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"1907","label":"The building then","line":"A 1907 photograph of the building at a street corner, with a tall tower beyond.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"sl_wb_then","by":"Emil Boehl","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Wainwright_Building,_709_Chestnut_Street._Adler,_Sullivan,_and_Ramsey,_Architects.jpg","note":"resized, cropped"}},"now":{"yr":"Today","head":"Today","label":"The building today","line":"The red building seen from the street, with newer towers behind it.","ph":{"k":"sl_wb_now","by":"Unknown author","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Wainwright_building_st_louis_USA.jpg","note":"resized"}},"story":["Brewer Ellis Wainwright commissioned the building because he needed offices for the St. Louis Brewers Association. Dankmar Adler and Louis Sullivan designed it, and it was built from 1890 to 1891. It is 10 stories and 135 feet tall.","Architect Frank Lloyd Wright called it \"the very first human expression of a tall steel office-building as Architecture.\" In 2013 it was named one of the \"10 Buildings That Changed America\" in a PBS series. Sullivan is sometimes called the Father of Skyscrapers.","The building became a National Historic Landmark in 1968. The National Trust for Historic Preservation rescued it from demolition, and Missouri later bought it as part of a state office complex."],"fact":"A brewer paid for it.","disputed":"Many people assume the building was always a state office building. Wikipedia says it was built for Ellis Wainwright, a brewer, to house the St. Louis Brewers Association.","claims":[{"t":"The Wainwright Building was designed by Adler and Sullivan.","a":0,"why":"Wikipedia: designed by Dankmar Adler and Louis Sullivan."},{"t":"The Wainwright Building was built in the 1920s.","a":2,"why":"It was built between 1890 and 1891."}],"sources":[{"t":"Wikipedia: Wainwright Building","u":"https://en.wikipedia.org/wiki/Wainwright_Building"},{"t":"Wikipedia: Louis Sullivan","u":"https://en.wikipedia.org/wiki/Louis_Sullivan"}],"card":{"a":"1890","b":"1968","la":"Construction begins","lb":"National Historic Landmark"}}],"heroKey":"sl_ga_now"},"cincinnati":{"id":"cincinnati","name":"Cincinnati","explorer":"Queen City Explorer","initials":"CIN","ranks":[[0,"Visitor"],[100,"River Walker"],[250,"Landmark Hunter"],[450,"Cincinnati Scholar"],[600,"Cincinnati Historian"]],"heroAlt":"The Roebling Suspension Bridge at night in Cincinnati","heroLi":"<li>Header: Derek Jensen (Tysto) · Public domain · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:Cincinnati-roebling-suspension-bridge.jpg\">Source</a> · resized</li>","heroCredit":"Photo: Derek Jensen (Tysto) · <a target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/publicdomain/mark/1.0/\">Public domain</a> · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:Cincinnati-roebling-suspension-bridge.jpg\">Source</a>","mission":"Find four landmarks around Cincinnati. At each one, check in to earn its badge, unlock its story, and collect a Time Card. Do them in any order. Everything stays on this phone.","afterDone":"All four badges earned. The rest of Cincinnati is waiting.","safetyNote":"<li>Downtown Cincinnati has busy streets, streetcar tracks and a riverfront with steep drops. Use crosswalks, watch for the streetcar, and stay on the paths by the river.</li>","badgeMap":{"bridge":["ci_rb_now","50% 45%"],"fountain":["ci_fs_now","50% 45%"],"music":["ci_mh_now","50% 45%"],"carew":["ci_ct_now","50% 45%"]},"level":"Classics","region":"The Midwest","stops":[{"id":"bridge","name":"Roebling Suspension Bridge","short":"Roebling Bridge","badge":"Roebling Bridge","tag":"Stop 1 of 4","teaser":"A bridge that was the longest in the world, built by the man who later did Brooklyn.","map":"John A. Roebling Suspension Bridge, Cincinnati, OH","clue":"Go to the Ohio River waterfront in downtown Cincinnati. Look for the long suspension bridge with two tall stone towers and cables that swoop down to the deck.","safety":"Stay on the waterfront paths and keep back from the edge of the river. Walk on the bridge's sidewalk only, and stay out of the traffic lanes.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"When the bridge opened in 1867, what record did it hold?","options":["Tallest bridge in America","First bridge ever built over a river","Widest bridge in Ohio","Longest suspension bridge in the world"],"answer":3,"hint":"The main span was 1,057 feet.","verify":"Wikipedia says that when it opened on January 1, 1867, it was the longest suspension bridge in the world. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"About 1900","label":"The bridge then","line":"A colorized postcard from after 1898, looking across the Ohio River at the stone towers and cables.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"ci_rb_then","by":"Detroit Publishing Company","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Suspension_Bridge,_Cincinnati,_Ohio_(NYPL_b12647398-62905).tiff","note":"resized, cropped"}},"now":{"yr":"2005","head":"Today","label":"The bridge today","line":"The bridge lit up at night, with the towers glowing over the river.","ph":{"k":"ci_rb_now","by":"Derek Jensen (Tysto)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Cincinnati-roebling-suspension-bridge.jpg","note":"resized"}},"story":["The bridge crosses the Ohio River between Cincinnati, Ohio, and Covington, Kentucky. It opened to traffic on January 1, 1867, with a main span of 1,057 feet. That made it the longest suspension bridge in the world at the time.","John A. Roebling designed it. The planning took years: Steamboat and ferry owners lobbied against the bridge, and the Ohio legislature refused a charter at first. The bridge was built almost entirely in Kentucky, because the state line follows the north bank of the river.","The tower foundations on the Covington side went smoothly. On the Cincinnati side, Roebling got stuck with water in the pit, so he designed his own wooden pumps from three-inch pine planks and built them in about forty-eight hours. His most famous design, the Brooklyn Bridge, opened in 1883."],"fact":"He built his own pumps from pine planks.","disputed":"Many people say the Brooklyn Bridge came first. Wikipedia says the Cincinnati bridge opened in 1867, sixteen years before Brooklyn in 1883.","claims":[{"t":"The Roebling bridge opened on January 1, 1867.","a":0,"why":"Wikipedia: opened to traffic on January 1, 1867."},{"t":"The bridge was finished after the Brooklyn Bridge.","a":2,"why":"Brooklyn opened in 1883, sixteen years later."}],"sources":[{"t":"Wikipedia: John A. Roebling Suspension Bridge","u":"https://en.wikipedia.org/wiki/John_A._Roebling_Suspension_Bridge"},{"t":"Wikipedia: John A. Roebling","u":"https://en.wikipedia.org/wiki/John_A._Roebling"}],"card":{"a":"1867","b":"1883","la":"Cincinnati bridge opens","lb":"Brooklyn Bridge opens"}},{"id":"fountain","name":"Tyler Davidson Fountain","short":"Fountain Square","badge":"Fountain Square","tag":"Stop 2 of 4","teaser":"A bronze fountain with a lady who pours rain from her fingertips.","map":"Fountain Square, 520 Vine St, Cincinnati, OH","clue":"Go to Fifth and Vine Streets in downtown Cincinnati. Look for the big bronze fountain on a green granite base, with a tall woman at the top holding her arms out.","safety":"Fountain Square is a busy plaza. Stay out of the water and off the fountain's base, and use crosswalks at Fifth and Vine.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"What do the words on the fountain's base say?","options":["To the People of Cincinnati","Welcome to the Queen City","Drink and Be Merry","In Memory of the River"],"answer":0,"hint":"The inscription is a gift message, aimed at the whole city.","verify":"Wikipedia says the inscription on the base reads \"To the People of Cincinnati\". Read it on site. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"Early 1900s","label":"The fountain then","line":"A postcard of the fountain in the middle of the street, with horse-era buildings around it.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"ci_fs_then","by":"Unknown author","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Fountain_Square_and_Tyler-Davidson_Fountain_(NBY_8113).jpg","note":"resized, cropped"}},"now":{"yr":"2011","head":"Today","label":"The fountain today","line":"The fountain on its plaza, with downtown towers rising behind it.","ph":{"k":"ci_fs_now","by":"Niagara66","lic":"CC BY-SA 4.0","lu":"https://creativecommons.org/licenses/by-sa/4.0/","page":"https://commons.wikimedia.org/wiki/File:Cincinnati_Tyler_Davidson_Fountain_2.jpg","note":"resized"}},"story":["The Tyler Davidson Fountain, also called The Genius of Water, was dedicated in 1871. It is the centerpiece of Fountain Square, at the corner of Fifth and Vine Streets, and the city's symbol.","The fountain is 43 feet tall and cast in bronze on a green granite base. The central figure, the Genius of Water, is nine feet high and weighs two tons. She pours water from hundreds of jets pierced in her outstretched fingers. The panels at the bottom show four uses of water: steam, water-power, navigation and the fisheries.","For more than 130 years it stood in the middle of Fifth Street. In 2006, during a renovation of the square, it was taken away and later put back in a wider space near the north end of the plaza, away from the traffic."],"fact":"It moved in 2006.","disputed":"Some people think it has always stood where it does today. Wikipedia says that for more than 130 years it stood in the middle of Fifth Street, and it was moved in the 2006 renovation.","claims":[{"t":"The fountain was dedicated in 1871.","a":0,"why":"Wikipedia: dedicated in 1871."},{"t":"The fountain is made of stone.","a":2,"why":"It is cast in bronze, on a granite base."}],"sources":[{"t":"Wikipedia: Tyler Davidson Fountain","u":"https://en.wikipedia.org/wiki/Tyler_Davidson_Fountain"},{"t":"Wikipedia: Fountain Square (Cincinnati)","u":"https://en.wikipedia.org/wiki/Fountain_Square_(Cincinnati)"}],"card":{"a":"1871","b":"2006","la":"Dedicated","lb":"Moved and reinstalled"}},{"id":"music","name":"Cincinnati Music Hall","short":"Music Hall","badge":"Music Hall","tag":"Stop 3 of 4","teaser":"A red-brick concert hall that is said to be built on top of a cemetery.","map":"Music Hall, 1241 Elm St, Cincinnati, OH","clue":"Go to Elm Street in Over-the-Rhine, across from Washington Park. Look for the huge red-brick building with pointed towers and a big round window.","safety":"Elm Street has streetcar tracks and traffic. Use crosswalks, check performance times before going in, and be quiet around the doors during shows.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"Wikipedia says Music Hall was built over what?","options":["A castle","A pauper's cemetery","A swamp","A railroad yard"],"answer":1,"hint":"That fact is why it has a reputation as one of the most haunted places in America.","verify":"Wikipedia says Music Hall was built over a pauper's cemetery. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"After 1898","label":"The hall then","line":"A postcard of the red-brick hall across the park, with trees in front.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"ci_mh_then","by":"Detroit Publishing Company","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Music_Hall,_Cincinnati,_Ohio_(NYPL_b12647398-62900).tiff","note":"resized, cropped"}},"now":{"yr":"2013","head":"Today","label":"The hall today","line":"The brick facade and towers of the hall seen from Elm Street.","ph":{"k":"ci_mh_now","by":"Ohio Redevelopment Projects - ODSA","lic":"CC BY 2.0","lu":"https://creativecommons.org/licenses/by/2.0/","page":"https://commons.wikimedia.org/wiki/File:Cincinnati-Music_Hall_(OHPTC).jpg","note":"resized"}},"story":["Music Hall was completed in 1878. It was designed for two jobs: music in the central auditorium and industrial exhibitions in the side wings. It sits across from Washington Park in Over-the-Rhine.","The building is in the Venetian Gothic style, and it became a National Historic Landmark in January 1975. It is home to the Cincinnati Symphony Orchestra, the Pops, the Ballet and the Opera.","Springer Auditorium has a Czechoslovak chandelier that weighs about 1,500 pounds, is 21 feet wide and has 96 candles. After more than a year closed for a $143 million renovation, the hall reopened in 2017."],"fact":"The chandelier has 96 candles.","disputed":"Many people think a famous hall like this was built on empty land. Wikipedia says it was built over a pauper's cemetery.","claims":[{"t":"Music Hall was completed in 1878.","a":0,"why":"Wikipedia: completed in 1878."},{"t":"Music Hall is built in a plain, modern style.","a":2,"why":"Wikipedia calls it Venetian Gothic."}],"sources":[{"t":"Wikipedia: Cincinnati Music Hall","u":"https://en.wikipedia.org/wiki/Cincinnati_Music_Hall"},{"t":"Wikipedia: Over-the-Rhine","u":"https://en.wikipedia.org/wiki/Over-the-Rhine"}],"card":{"a":"1878","b":"2017","la":"Completed","lb":"Reopened after renovation"}},{"id":"carew","name":"Carew Tower","short":"Carew Tower","badge":"Carew Tower","tag":"Stop 4 of 4","teaser":"A 49-story Art Deco tower that was the tallest in the city for over 80 years.","map":"Carew Tower, 441 Vine St, Cincinnati, OH","clue":"Go to Fifth and Vine, right beside Fountain Square. Look up for the tall stepped tower with straight vertical lines and a pointed top.","safety":"The sidewalks around the tower are busy. Use crosswalks, check hours if you want to go into the arcade, and look up only when you are standing still.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"How many stories does the Carew Tower have?","options":["72","100","29","49"],"answer":3,"hint":"It is a little less than fifty.","verify":"Wikipedia calls it a 49-story Art Deco skyscraper. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"1930","label":"The tower then","line":"A newspaper photo from January 1930 looking across the excavation for the tower's foundation.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"ci_ct_then","by":"Unknown author","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Carew_Tower_excavation_1930.jpg","note":"resized"}},"now":{"yr":"2007","head":"Today","label":"The tower today","line":"The finished tower and its neighbor rising over the downtown buildings.","ph":{"k":"ci_ct_now","by":"Keith Lanser","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Carew_Tower_Cincinnati.JPG","note":"resized"}},"story":["The Carew Tower is a 49-story, 574-foot Art Deco skyscraper in downtown Cincinnati. It was the tallest building in the city from 1930 until 2011.","Industrialist John J. Emery wanted a \"city within a city\" with offices, shops, a hotel and a parking garage. It was announced shortly before the Great Depression began, but work kept going. The office tower topped out in July 1930, and the entire complex was done by early 1931 at a cost of $33 million.","The hotel opened as the St. Nicholas Plaza in 1931. The tower was named a National Historic Landmark in 1994. The National Park Service called it one of the finest examples of skyscraper modernism in America."],"fact":"It was built during the Great Depression.","disputed":"Many people think the tower was built after the Depression. Wikipedia says work continued through the poor economy, with the tower topped out in July 1930.","claims":[{"t":"The Carew Tower was the tallest building in Cincinnati until 2011.","a":0,"why":"Wikipedia: tallest from 1930 until 2011."},{"t":"The Carew Tower has 29 floors.","a":2,"why":"It has 49 stories."}],"sources":[{"t":"Wikipedia: Carew Tower","u":"https://en.wikipedia.org/wiki/Carew_Tower"},{"t":"Wikipedia: Art Deco","u":"https://en.wikipedia.org/wiki/Art_Deco"}],"card":{"a":"1930","b":"1994","la":"Topped out","lb":"National Historic Landmark"}}],"heroKey":"ci_rb_now"},"indianapolis":{"id":"indianapolis","name":"Indianapolis","explorer":"Hoosier Explorer","initials":"IND","ranks":[[0,"Visitor"],[100,"Circle Walker"],[250,"Landmark Hunter"],[450,"Indy Scholar"],[600,"Indy Historian"]],"heroAlt":"The Indiana Statehouse in Indianapolis","heroLi":"<li>Header: Daniel Schwen (derivative: Massimo Catarinella) · CC BY-SA 3.0 · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:StateCapitolIndiana.jpg\">Source</a> · resized</li>","heroCredit":"Photo: Daniel Schwen (derivative: Massimo Catarinella) · <a target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by-sa/3.0/\">CC BY-SA 3.0</a> · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:StateCapitolIndiana.jpg\">Source</a>","mission":"Find four landmarks around Indianapolis. At each one, check in to earn its badge, unlock its story, and collect a Time Card. Do them in any order. Everything stays on this phone.","afterDone":"All four badges earned. The rest of Indianapolis is waiting.","safetyNote":"<li>Downtown Indianapolis has busy streets, rail lines and a lot of events. Use crosswalks, watch for traffic around the circle, and stay out of the fountains.</li>","badgeMap":{"monument":["in_sm_now","50% 45%"],"statehouse":["in_sh_now","50% 45%"],"union":["in_us_now","50% 45%"],"memorial":["in_wm_now","50% 45%"]},"level":"Classics","region":"The Midwest","stops":[{"id":"monument","name":"Soldiers' and Sailors' Monument","short":"Monument Circle","badge":"Monument Circle","tag":"Stop 1 of 4","teaser":"A giant limestone monument in the middle of a traffic circle.","map":"Soldiers' and Sailors' Monument, Monument Circle, Indianapolis, IN","clue":"Go to the center of downtown Indianapolis. Look for the huge limestone obelisk rising from a circular, brick-paved street.","safety":"Cars circle the monument, so stay on the sidewalks and use crosswalks. The pools and fountains are wet and slippery, so keep out.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"What do the words above the doors say about Indiana's soldiers?","options":["In God We Trust","Forever Indiana","To Indiana's Silent Victors","Remember the Alamo"],"answer":2,"hint":"The words honor people who did not make speeches or pose for statues.","verify":"Wikipedia says the inscription reads \"To Indiana's Silent Victors\". Read it on site. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"About 1907","label":"The monument then","line":"A black-and-white view of Monument Circle about 1907, with the tall column in the middle.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"in_sm_then","by":"Detroit Photographic Company","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Monument_Circle,_Indianapolis,_1907.jpg","note":"resized"}},"now":{"yr":"2009","head":"Today","label":"The monument today","line":"The monument lit up at night, with new towers around it.","ph":{"k":"in_sm_now","by":"vxla","lic":"CC BY 2.0","lu":"https://creativecommons.org/licenses/by/2.0/","page":"https://commons.wikimedia.org/wiki/File:Soldiers_and_Sailors_Monument_at_Monument_Circle.jpg","note":"resized"}},"story":["The monument is 284 feet, 6 inches tall and stands on Monument Circle, a circular, brick-paved street. It was built from 1888 to 1901 and dedicated on May 15, 1902. German architect Bruno Schmitz designed it.","It was meant to honor Hoosiers who were Civil War veterans, but it also honors soldiers from earlier wars. It was the first monument in the United States dedicated to the common soldier. It is built of oolitic limestone from Owen County, Indiana.","When it was dedicated it cost $598,318. Wikipedia says a similar structure would cost more than $500 million today. It has an observation deck reached by stairs or an elevator."],"fact":"It was the first in the US for the common soldier.","disputed":"Many people think a monument is only for famous generals. Wikipedia says this was the first in the United States dedicated to the common soldier.","claims":[{"t":"The monument was dedicated in 1902.","a":0,"why":"Wikipedia: dedicated on May 15, 1902."},{"t":"The monument is made of marble from Italy.","a":2,"why":"It is built of oolitic limestone from Owen County, Indiana."}],"sources":[{"t":"Wikipedia: Soldiers' and Sailors' Monument (Indianapolis)","u":"https://en.wikipedia.org/wiki/Soldiers%27_and_Sailors%27_Monument_(Indianapolis)"},{"t":"Wikipedia: Monument Circle","u":"https://en.wikipedia.org/wiki/Monument_Circle"}],"card":{"a":"1888","b":"1902","la":"Construction begins","lb":"Dedicated"}},{"id":"statehouse","name":"Indiana Statehouse","short":"Statehouse","badge":"Statehouse","tag":"Stop 2 of 4","teaser":"A domed capitol that replaced one copied from the Parthenon.","map":"Indiana Statehouse, 200 W Washington St, Indianapolis, IN","clue":"Go to Washington Street, a few blocks west of the monument. Look for the big stone capitol building with a green dome in the middle.","safety":"Washington Street is busy. Use crosswalks, and remember this is a working government building, so check visiting hours and security rules before going in.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"The statehouse before this one was inspired by which ancient building?","options":["The Colosseum","The Great Pyramid","The Pantheon","The Parthenon"],"answer":3,"hint":"It is a famous temple in Athens, Greece.","verify":"Wikipedia says the earlier building was inspired by the ancient Greek Parthenon. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"1901","label":"The statehouse then","line":"A framed print marked 1901, showing the capitol with its dome from across the street.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"in_sh_then","by":"Unknown author (via DPLA)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Indiana_State_House_-_DPLA_-_7009868dee11b5c8ae1e048ec16a3103.jpg","note":"resized, cropped"}},"now":{"yr":"2008","head":"Today","label":"The statehouse today","line":"The Statehouse from above, with its green dome and tall columns.","ph":{"k":"in_sh_now","by":"Daniel Schwen (derivative: Massimo Catarinella)","lic":"CC BY-SA 3.0","lu":"https://creativecommons.org/licenses/by-sa/3.0/","page":"https://commons.wikimedia.org/wiki/File:StateCapitolIndiana.jpg","note":"resized"}},"story":["The Indiana Statehouse was built in 1888 and is the fourth building to house state government. The first, in Corydon, still stands as a state historic site.","In 1824 the whole state government moved to Indianapolis. It took more than a month, and a caravan had to cut a path through the winter forest, carrying the state treasury, library and records. The first meeting of the General Assembly there was in January 1825.","A later statehouse, designed by Ithiel Town and Alexander Jackson Davis, was inspired by the Parthenon, but with a large central dome. It was condemned in 1877 because of structural defects, and torn down so the current building could take its place."],"fact":"A caravan hauled the government north.","disputed":"Many people think the capitol was always in the same place. Wikipedia says the first was in Corydon, and the government moved to Indianapolis in 1824.","claims":[{"t":"The current Indiana Statehouse was built in 1888.","a":0,"why":"Wikipedia: built in 1888."},{"t":"The Statehouse is the first building to hold Indiana's government.","a":2,"why":"It is the fourth. The first stands in Corydon."}],"sources":[{"t":"Wikipedia: Indiana Statehouse","u":"https://en.wikipedia.org/wiki/Indiana_Statehouse"},{"t":"Wikipedia: Corydon Capitol State Historic Site","u":"https://en.wikipedia.org/wiki/Corydon_Capitol_State_Historic_Site"}],"card":{"a":"1824","b":"1888","la":"Government moves to Indianapolis","lb":"Current building"}},{"id":"union","name":"Indianapolis Union Station","short":"Union Station","badge":"Union Station","tag":"Stop 3 of 4","teaser":"The first union station in the world, with a clock tower and a giant round window.","map":"Indianapolis Union Station, 39 W Jackson Pl, Indianapolis, IN","clue":"Go to the south end of downtown, near Illinois Street and Jackson Place. Look for the red-brown station with a tall clock tower and a big round window.","safety":"Rail tracks and busy streets are close by. Use crosswalks, do not step onto the tracks or platforms, and check hours before going inside.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"What style is the 1888 station, named after a famous architect?","options":["Richardsonian Romanesque","Greek Revival","Art Deco","Modern"],"answer":0,"hint":"It is named for Henry Hobson Richardson.","verify":"Wikipedia says Thomas Rodd's design shows the influence of Henry Hobson Richardson. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"1970","label":"The station then","line":"A survey photograph from August 1970 looking at the clock tower and arched windows from the northeast.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"in_us_then","by":"Jack E. Boucher (HABS, Library of Congress)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:August_1970_GENERAL_VIEW_OF_BUILDING_FROM_NORTHEAST_-_Union_Station,_Jackson_Place_and_Illinois_Street,_Indianapolis,_Marion_County,_IN_HABS_IND,49-IND,20-3.tif","note":"resized, cropped"}},"now":{"yr":"2024","head":"Today","label":"The station today","line":"The head house with its clock tower, rose window and fir trees out front.","ph":{"k":"in_us_now","by":"Warren LeMay","lic":"CC BY-SA 2.0","lu":"https://creativecommons.org/licenses/by-sa/2.0/","page":"https://commons.wikimedia.org/wiki/File:Head_House,_Indianapolis_Union_Station,_Louisiana_Street_and_Illinois_Street,_Indianapolis,_IN.jpg","note":"resized"}},"story":["Wikipedia says Indianapolis created the world's first union station in 1848. That means one shared station for several railroads instead of one for each. The station building opened on September 20, 1853.","The larger station you see today opened in September 1888. Pittsburgh architect Thomas Rodd designed it in the Richardsonian Romanesque style. It is built of granite and brick, trimmed with Hummelstown brownstone, and it has an enormous rose window and a soaring 185-foot clock tower.","The head house and clock tower of this second station still stand. Amtrak's Cardinal line serves the station today, from a waiting area beneath the train shed."],"fact":"The tower is 185 feet tall.","disputed":"Many people think the 1853 building is the one standing. Wikipedia says the larger station replaced it and opened in 1888.","claims":[{"t":"The current station opened in 1888.","a":0,"why":"Wikipedia: opened in September 1888."},{"t":"The station was designed by Louis Sullivan.","a":2,"why":"Thomas Rodd of Pittsburgh designed it."}],"sources":[{"t":"Wikipedia: Indianapolis Union Station","u":"https://en.wikipedia.org/wiki/Indianapolis_Union_Station"},{"t":"Wikipedia: Henry Hobson Richardson","u":"https://en.wikipedia.org/wiki/Henry_Hobson_Richardson"}],"card":{"a":"1853","b":"1888","la":"First station building","lb":"Current station"}},{"id":"memorial","name":"Indiana World War Memorial","short":"War Memorial","badge":"War Memorial","tag":"Stop 4 of 4","teaser":"A giant temple that was copied from a tomb in ancient Turkey.","map":"Indiana World War Memorial, 431 N Meridian St, Indianapolis, IN","clue":"Go to the north end of downtown, along Meridian Street. Look for a huge limestone building shaped like a stepped pyramid on top of a temple.","safety":"Meridian Street is busy. Use crosswalks, stay off the steps if they are wet, and check hours before going inside.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"The memorial is modeled after the Mausoleum at where?","options":["Babylon","Halicarnassus","Alexandria","Rome"],"answer":1,"hint":"It is one of the Seven Wonders of the Ancient World.","verify":"Wikipedia says it is modeled after the Mausoleum of Halicarnassus. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"1930s to 1940s","label":"The memorial then","line":"A colorful postcard of the memorial's pyramid roof over a stone base.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"in_wm_then","by":"Tichnor Brothers","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Indiana_World_War_Memorial,_Indianapolis,_Indiana_(63612).jpg","note":"resized, cropped"}},"now":{"yr":"2008","head":"Today","label":"The memorial today","line":"The memorial's tall stone columns and steps, seen from the corner.","ph":{"k":"in_wm_now","by":"Daniel Schwen","lic":"CC BY-SA 4.0","lu":"https://creativecommons.org/licenses/by-sa/4.0/","page":"https://commons.wikimedia.org/wiki/File:Indiana_World_War_Memorial.jpg","note":"resized"}},"story":["The memorial came from a 1919 attempt by Indianapolis to lure the new American Legion, which was then in New York City, to base its national headquarters in the city.","The original plaza is five blocks long. The focal point, the Indiana World War Memorial, sits on the fourth block and is modeled after the Mausoleum of Halicarnassus. It houses a military museum and an auditorium.","In 1994 the plaza became a National Historic Landmark District. In 2016 the district was expanded to include the Soldiers' and Sailors' Monument. Together it covers 24 acres, which Wikipedia says makes it the largest war memorial project in the United States."],"fact":"It was built to lure the Legion to town.","disputed":"Many people think the plaza was always a monument. Wikipedia says it started as a plan to attract the American Legion's headquarters.","claims":[{"t":"The plaza was designated a National Historic Landmark District in 1994.","a":0,"why":"Wikipedia: designated on October 11, 1994."},{"t":"The memorial was built to honor Civil War veterans.","a":2,"why":"It was built to honor World War I veterans."}],"sources":[{"t":"Wikipedia: Indiana World War Memorial Plaza","u":"https://en.wikipedia.org/wiki/Indiana_World_War_Memorial_Plaza"},{"t":"Wikipedia: Mausoleum at Halicarnassus","u":"https://en.wikipedia.org/wiki/Mausoleum_at_Halicarnassus"}],"card":{"a":"1919","b":"1994","la":"Plan begins","lb":"National Historic Landmark District"}}],"heroKey":"in_sh_now"},"buffalo":{"id":"buffalo","name":"Buffalo","explorer":"Good Neighbor Explorer","initials":"BUF","ranks":[[0,"Visitor"],[100,"Niagara Square Walker"],[250,"Landmark Hunter"],[450,"Buffalo Scholar"],[600,"Buffalo Historian"]],"heroAlt":"The Old Post Office in Buffalo","heroLi":"<li>Header: Pubdog · Public domain · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:Old_Post_Office_Buffalo_NY_Full_View_Dec_09.JPG\">Source</a> · resized</li>","heroCredit":"Photo: Pubdog · <a target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/publicdomain/mark/1.0/\">Public domain</a> · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:Old_Post_Office_Buffalo_NY_Full_View_Dec_09.JPG\">Source</a>","mission":"Find four landmarks around Buffalo. At each one, check in to earn its badge, unlock its story, and collect a Time Card. Do them in any order. Everything stays on this phone.","afterDone":"All four badges earned. The rest of Buffalo is waiting.","safetyNote":"<li>Downtown Buffalo has busy streets, lake winds and, in winter, snow and ice. Use crosswalks, dress warmly in cold months, and watch for slippery sidewalks.</li>","badgeMap":{"cityhall":["bf_ch_now","50% 45%"],"ellicott":["bf_es_now","50% 45%"],"postoffice":["bf_po_now","50% 45%"],"museum":["bf_hm_now","50% 45%"]},"level":"Classics","region":"The East","stops":[{"id":"cityhall","name":"Buffalo City Hall","short":"City Hall","badge":"City Hall","tag":"Stop 1 of 4","teaser":"A 32-story Art Deco tower where every window opens inward.","map":"Buffalo City Hall, 65 Niagara Square, Buffalo, NY","clue":"Go to Niagara Square in downtown Buffalo. Look for a very tall stone tower with stepped sides and colorful patterns near the top.","safety":"Niagara Square is a busy traffic circle. Use crosswalks, and check opening hours if you want to visit the lobby, since it is a working government building.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"Which way do all the windows on City Hall open?","options":["They do not open","Inward","Outward","Sideways"],"answer":1,"hint":"That means the window washers can stay inside.","verify":"Wikipedia says all the windows open inward, making window washers unnecessary. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"About 1937","label":"The tower then","line":"A floodlit night photo of the tower from about 1937, glowing against the dark.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"bf_ch_then","by":"Unknown author","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Buffalo_City_Hall_-_Judges_and_Police_Executives_Conference.jpg","note":"resized"}},"now":{"yr":"2024","head":"Today","label":"The tower today","line":"The stepped tower seen in daylight across the Niagara Square streets.","ph":{"k":"bf_ch_now","by":"Michael Barera","lic":"CC BY-SA 4.0","lu":"https://creativecommons.org/licenses/by-sa/4.0/","page":"https://commons.wikimedia.org/wiki/File:Buffalo_December_2024_47_(Buffalo_City_Hall).jpg","note":"resized"}},"story":["Buffalo City Hall is a 32-story Art Deco skyscraper at 65 Niagara Square. It is 398 feet tall and was completed on November 10, 1931. It was dedicated on July 1, 1932, to mark the city's Centennial.","The building cost $6,851,546.85 including the architect's fees, which made it one of the costliest city halls in the country. It has 1,520 windows on the first 25 floors, and all of them open inward, so there is no need for window washers outside.","The architects were Dietel, Wade & Jones. The friezes were sculpted by Albert Stewart and carried out by Rene Paul Chambellan. Near the top are polychrome terra cotta chevrons, and the walls are covered in Ohio sandstone and gray Minnesota limestone."],"fact":"The architect called the style \"Americanesque.\"","disputed":"Many people think the style is simply Art Deco. Wikipedia says architect John Wade called it \"Americanesque\" and sometimes Babylonian.","claims":[{"t":"City Hall was completed in 1931.","a":0,"why":"Wikipedia: completed November 10, 1931."},{"t":"City Hall's windows open outward.","a":2,"why":"All of them open inward."}],"sources":[{"t":"Wikipedia: Buffalo City Hall","u":"https://en.wikipedia.org/wiki/Buffalo_City_Hall"},{"t":"Wikipedia: Art Deco","u":"https://en.wikipedia.org/wiki/Art_Deco"}],"card":{"a":"1931","b":"1932","la":"Completed","lb":"Dedicated"}},{"id":"ellicott","name":"Ellicott Square Building","short":"Ellicott Square","badge":"Ellicott Square","tag":"Stop 2 of 4","teaser":"Once the largest office building in the world, with a movie theater inside.","map":"Ellicott Square Building, 295 Main St, Buffalo, NY","clue":"Go to Main Street in downtown Buffalo. Look for a huge gray-brick building that fills a whole block with rows and rows of windows.","safety":"Main Street has traffic and light rail. Use crosswalks, and check opening hours before you go into the lobby court.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"In 1896 and 1897, the building held what, believed to be the first of its kind?","options":["A train station","A skating rink","A dedicated movie theater","A zoo"],"answer":2,"hint":"It showed moving pictures on a Vitascope.","verify":"Wikipedia says it was the site of the Vitascope Theater, the earliest known dedicated motion picture theater in the world. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"After 1898","label":"The building then","line":"A colorized postcard of the long gray building, with older brick shops next to it.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"bf_es_then","by":"Detroit Publishing Company","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Ellicott_Square_Building,_Buffalo,_N._Y_(NYPL_b12647398-62751).tiff","note":"resized, cropped"}},"now":{"yr":"2008","head":"Today","label":"The building today","line":"The same gray facade seen from above, with newer towers behind.","ph":{"k":"bf_es_now","by":"TonyTheTiger","lic":"CC BY-SA 3.0","lu":"https://creativecommons.org/licenses/by-sa/3.0/","page":"https://commons.wikimedia.org/wiki/File:Ellicott_Square_Building.JPG","note":"resized"}},"story":["The Ellicott Square Building was designed by Charles Atwood of D. H. Burnham & Company, and finished in May 1896. It was built in less than a year for $3.5 million.","It had 10 stories and 447,000 square feet, which made it the largest office building in the world by floor area until 1908. Daniel Burnham's mantra was \"make no little plans.\" The building is named after Joseph Ellicott, who laid out Buffalo.","Inside is a courtyard with a glass roof and a marble mosaic floor with 23 million pieces of marble, showing sun symbols from civilizations around the world. In 1896 and 1897 the building also housed the Vitascope Theater."],"fact":"The floor has 23 million pieces.","disputed":"Many people think a movie theater of this age was in New York or Paris. Wikipedia says the earliest known dedicated motion picture theater in the world was here in Buffalo.","claims":[{"t":"Ellicott Square was completed in 1896.","a":0,"why":"Wikipedia: completed in May 1896."},{"t":"It was the tallest building in the world.","a":2,"why":"It was the largest by floor area, not the tallest."}],"sources":[{"t":"Wikipedia: Ellicott Square Building","u":"https://en.wikipedia.org/wiki/Ellicott_Square_Building"},{"t":"Wikipedia: Joseph Ellicott","u":"https://en.wikipedia.org/wiki/Joseph_Ellicott"}],"card":{"a":"1896","b":"1908","la":"Completed","lb":"Overtaken as largest"}},{"id":"postoffice","name":"Old Post Office","short":"Old Post Office","badge":"Old Post Office","tag":"Stop 3 of 4","teaser":"A Gothic castle-like post office with a 244-foot tower that is now a college.","map":"Old Post Office, 121 Ellicott St, Buffalo, NY","clue":"Go to Ellicott Street near Church Street. Look for a stone building with a tall corner tower and steep roofs, like a castle.","safety":"Ellicott Street is a busy road. Use crosswalks, and remember this is a working college campus, so stay on the sidewalks outside.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"Since 1981, the Old Post Office has been home to what?","options":["A hospital","A brewery","A hotel","A college campus"],"answer":3,"hint":"Students walk through it every day.","verify":"Wikipedia says it has housed the city campus of Erie Community College since 1981. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"1900 to 1906","label":"The post office then","line":"A black-and-white photo of the building from a corner, shot from high above the street.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"bf_po_then","by":"Detroit Publishing Company","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Old_Post_Office_Building_Buffalo.jpg","note":"resized, cropped"}},"now":{"yr":"2009","head":"Today","label":"The post office today","line":"The building and tower across a wide street in winter.","ph":{"k":"bf_po_now","by":"Pubdog","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Old_Post_Office_Buffalo_NY_Full_View_Dec_09.JPG","note":"resized"}},"story":["The Old Post Office is at 121 Ellicott Street. The Office of the Supervising Architect, with Jeremiah O'Rourke, designed it, and construction started in 1897. It opened in 1901 and cost $1.5 million.","It was Buffalo's central post office until 1963, and it was the tallest building in the city from 1901 to 1912. Wikipedia describes it as a four-story Gothic Revival building with a 244-foot tower over the central entrance and a roofed courtyard.","After the post office moved out, federal offices used the building. Since 1981 it has been home to the city campus of Erie Community College."],"fact":"The tower is 244 feet tall.","disputed":"Many people think a post office is a small building. Wikipedia says this one was the tallest in the city for 11 years.","claims":[{"t":"The Old Post Office opened in 1901.","a":0,"why":"Wikipedia: opened in 1901."},{"t":"It has been a college since the 1930s.","a":2,"why":"Wikipedia: it has housed Erie Community College since 1981."}],"sources":[{"t":"Wikipedia: Old Post Office (Buffalo, New York)","u":"https://en.wikipedia.org/wiki/Old_Post_Office_(Buffalo,_New_York)"},{"t":"Wikipedia: Architecture of Buffalo, New York","u":"https://en.wikipedia.org/wiki/Architecture_of_Buffalo,_New_York"}],"card":{"a":"1901","b":"1981","la":"Opens","lb":"Becomes a college"}},{"id":"museum","name":"Buffalo History Museum","short":"History Museum","badge":"History Museum","tag":"Stop 4 of 4","teaser":"The only building left from a world's fair, with columns like the Parthenon.","map":"Buffalo History Museum, 1 Museum Ct, Buffalo, NY","clue":"Go to Delaware Park in northwest Buffalo, east of Elmwood Avenue. Look for a white marble building with a row of columns facing the lake.","safety":"Stay on the park paths and keep back from the water's edge. Check opening hours if you want to go inside.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"Who was the first president of the Buffalo Historical Society?","options":["Millard Fillmore","Grover Cleveland","Abraham Lincoln","Theodore Roosevelt"],"answer":0,"hint":"He was the 13th president of the United States.","verify":"Wikipedia says the society's first president was Millard Fillmore. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"1901","label":"The building then","line":"A dark 1901 photo of the pavilion across the water, with flags on top.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"bf_hm_then","by":"C. D. Arnold","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Pan-American_Exposition_-_New_York_State_Building.jpg","note":"resized"}},"now":{"yr":"2006","head":"Today","label":"The building today","line":"The white building and its columns seen from the park.","ph":{"k":"bf_hm_now","by":"Dave Pape","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Buffalo_and_Erie_County_Historical_Society.jpg","note":"resized"}},"story":["The Buffalo History Museum building was built in 1901 as the New York State pavilion for the Pan-American Exposition. It is the only permanent structure from the Exposition that still stands. George Cary, a Buffalo architect, designed it.","Its south portico is meant to evoke the Parthenon in Athens. It was listed on the National Register of Historic Places in 1980 and designated a National Historic Landmark in 1987.","The society was founded in 1862, and its first president was Millard Fillmore. It has hosted observances of Lincoln's Birthday for over a century. In 1960 the name changed to the Buffalo and Erie County Historical Society, and it is now the Buffalo History Museum."],"fact":"It is the Expo's only survivor.","disputed":"Many people think the whole Pan-American Exposition is long gone. Wikipedia says this building is the one permanent structure that survives.","claims":[{"t":"The museum building was built in 1901.","a":0,"why":"Wikipedia: constructed in 1901 for the Pan-American Exposition."},{"t":"Many Exposition buildings still stand in Delaware Park.","a":2,"why":"This is the sole surviving permanent structure."}],"sources":[{"t":"Wikipedia: Buffalo History Museum","u":"https://en.wikipedia.org/wiki/Buffalo_History_Museum"},{"t":"Wikipedia: Pan-American Exposition","u":"https://en.wikipedia.org/wiki/Pan-American_Exposition"}],"card":{"a":"1862","b":"1901","la":"Society founded","lb":"Building constructed"}}],"heroKey":"bf_po_now"},"richmond":{"id":"richmond","name":"Richmond","explorer":"River City Explorer","initials":"RVA","ranks":[[0,"Visitor"],[100,"River City Walker"],[250,"Landmark Hunter"],[450,"Richmond Scholar"],[600,"Richmond Historian"]],"heroAlt":"The Virginia State Capitol in Richmond","heroLi":"<li>Header: Ron Cogswell · CC BY 2.0 · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:State_Capitol_of_the_Commonwealth_of_Virginia_(7358972234).jpg\">Source</a> · resized</li>","heroCredit":"Photo: Ron Cogswell · <a target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by/2.0/\">CC BY 2.0</a> · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:State_Capitol_of_the_Commonwealth_of_Virginia_(7358972234).jpg\">Source</a>","mission":"Find four landmarks around Richmond. At each one, check in to earn its badge, unlock its story, and collect a Time Card. Do them in any order. Everything stays on this phone.","afterDone":"All four badges earned. The rest of Richmond is waiting.","safetyNote":"<li>Downtown Richmond has busy streets, steep hills and highway overpasses. Use crosswalks, watch for traffic near the train station, and take the hills slowly.</li>","badgeMap":{"capitol":["rm_cap_now","50% 45%"],"church":["rm_ch_now","50% 45%"],"hotel":["rm_ho_now","50% 45%"],"station":["rm_st_now","50% 45%"]},"level":"Classics","region":"The South","stops":[{"id":"capitol","name":"Virginia State Capitol","short":"State Capitol","badge":"State Capitol","tag":"Stop 1 of 4","teaser":"A government building copied from a Roman temple in France, designed by Thomas Jefferson.","map":"Virginia State Capitol, 1000 Bank St, Richmond, VA","clue":"Go to Capitol Square in downtown Richmond. Look for the white building with a row of tall columns and a triangle-shaped roof over the front, like a temple.","safety":"Capitol Square is a working government site. Stay on the paths, use crosswalks, and check visiting hours and security rules before going inside.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"A Roman temple in France was the model for the Capitol. What is it called?","options":["The Pantheon","The Maison Carrée","The Parthenon","The Colosseum"],"answer":1,"hint":"It is in the city of Nîmes.","verify":"Wikipedia says the design was modeled after the Maison Carrée at Nîmes in southern France. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"After 1898","label":"The Capitol then","line":"A colorized postcard from after 1898 showing the temple front with its two side wings and people on the lawn.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"rm_cap_then","by":"Detroit Publishing Company (scan by NYPL)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:State_Capitol,_Richmond,_Va_(NYPL_b12647398-68100).tiff","note":"resized, cropped"}},"now":{"yr":"2012","head":"Today","label":"The Capitol today","line":"The columns and triangular roof seen from the front steps, with lamp posts and red flowers.","ph":{"k":"rm_cap_now","by":"Ron Cogswell","lic":"CC BY 2.0","lu":"https://creativecommons.org/licenses/by/2.0/","page":"https://commons.wikimedia.org/wiki/File:State_Capitol_of_the_Commonwealth_of_Virginia_(7358972234).jpg","note":"resized"}},"story":["The Virginia State Capitol houses the General Assembly, which traces back to the House of Burgesses first meeting in 1619. Wikipedia calls it the oldest elected legislative body in North America.","Thomas Jefferson is credited with the overall design, together with French architect Charles-Louis Clérisseau. It is modeled after the Maison Carrée, an ancient Roman temple in Nîmes. Construction began in 1785 and was completed in 1788. This is the eighth building to serve as Virginia's statehouse, mostly because of fires.","From 1861 to 1865 the building was the capitol of the Confederate States of America. In the early 20th century two wings were added, which gave the building its present appearance. It became a National Historic Landmark in 1960."],"fact":"It is the eighth Virginia statehouse.","disputed":"Many people think the Capitol has always had wings on each side. Wikipedia says the two wings were added in the early 20th century.","claims":[{"t":"Construction on the Capitol began in 1785.","a":0,"why":"Wikipedia: construction began in 1785 and was completed in 1788."},{"t":"The Capitol was designed by a team of Roman architects.","a":2,"why":"Jefferson and French architect Clérisseau designed it, modeled on a Roman temple."}],"sources":[{"t":"Wikipedia: Virginia State Capitol","u":"https://en.wikipedia.org/wiki/Virginia_State_Capitol"},{"t":"Wikipedia: Thomas Jefferson","u":"https://en.wikipedia.org/wiki/Thomas_Jefferson"}],"card":{"a":"1785","b":"1788","la":"Construction begins","lb":"Completed"}},{"id":"church","name":"St. John's Church","short":"St. John's","badge":"St. John's","tag":"Stop 2 of 4","teaser":"The church where Patrick Henry gave a famous speech about liberty or death.","map":"St. John's Episcopal Church, 2401 E Broad St, Richmond, VA","clue":"Go to East Broad Street on Church Hill. Look for a white wooden church with a small tower and a graveyard around it.","safety":"The churchyard is a burial ground. Stay on the paths, be quiet and respectful, and check visiting hours before going inside.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"What famous demand did Patrick Henry make in a speech here?","options":["\"Remember the Alamo!\"","\"Don't tread on me!\"","\"I have not yet begun to fight!\"","\"Give me liberty or give me death!\""],"answer":3,"hint":"It is one of the most quoted lines of the American Revolution.","verify":"Wikipedia says Patrick Henry gave his speech here at the Second Virginia Convention, closing with \"Give me liberty or give me death!\" Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"1901","label":"The church then","line":"A color print from 1901 of the white church among bare trees and graves.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"rm_ch_then","by":"Detroit Publishing Company (Library of Congress)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:St._John's_Church,_Richmond,_Virginia-LCCN2008679545.jpg","note":"resized, cropped"}},"now":{"yr":"2011","head":"Today","label":"The church today","line":"The white church and its tower seen from the front, with trees all around.","ph":{"k":"rm_ch_now","by":"Billy Hathorn","lic":"CC BY-SA 3.0","lu":"https://creativecommons.org/licenses/by-sa/3.0/","page":"https://commons.wikimedia.org/wiki/File:St._John's_Church_in_Richmond,_VA_(2011)_IMG_4046.JPG","note":"resized"}},"story":["St. John's is the oldest church in the city of Richmond. It was built in 1741 by Colonel Richard Randolph, and the Church Hill neighborhood was named for it. It stands at 2401 East Broad Street and is a National Historic Landmark.","The church was the site of two important conventions in the years before the American Revolution. It is famous as the place where Founding Father Patrick Henry gave his speech at the Second Virginia Convention.","The parish grew out of earlier ones. The first, Henrico Parish Church, was at Henricus in 1611. Henricus was destroyed in 1622 and was never rebuilt."],"fact":"The hill is named for the church.","disputed":"Many people assume the church was built in the 1770s, when the speech was given. Wikipedia says it was built in 1741.","claims":[{"t":"St. John's Church was built in 1741.","a":0,"why":"Wikipedia: built in 1741 by Colonel Richard Randolph."},{"t":"Church Hill was named before the church existed.","a":2,"why":"Wikipedia says the Church Hill district was named for the church."}],"sources":[{"t":"Wikipedia: St. John's Episcopal Church (Richmond, Virginia)","u":"https://en.wikipedia.org/wiki/St._John%27s_Episcopal_Church_(Richmond,_Virginia)"},{"t":"Wikipedia: Patrick Henry","u":"https://en.wikipedia.org/wiki/Patrick_Henry"}],"card":{"a":"1741","b":"1775","la":"Church built","lb":"Patrick Henry's speech"}},{"id":"hotel","name":"Jefferson Hotel","short":"Jefferson Hotel","badge":"Jefferson Hotel","tag":"Stop 3 of 4","teaser":"A grand hotel that once had alligators swimming in the lobby.","map":"The Jefferson Hotel, 101 W Franklin St, Richmond, VA","clue":"Go to Franklin Street at Adams Street, in downtown Richmond. Look for the big hotel with a tall clock tower and a rich, cream-colored front.","safety":"Franklin Street has traffic. Use crosswalks, and be polite in the lobby, since it is a working hotel.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"Which animals once swam in the marble pools of the hotel's lobby?","options":["Goldfish","Alligators","Penguins","Turtles"],"answer":1,"hint":"Actor David Niven noticed one when he was signing the guest book.","verify":"Wikipedia says alligators lived in the marble pools of the Palm Court. Look for the bronze alligators. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"After 1898","label":"The hotel then","line":"A colorized postcard of the hotel with its clock tower and a street of horse-era traffic.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"rm_ho_then","by":"Detroit Publishing Company (scan by NYPL)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Jefferson_Hotel,_Richmond,_Va_(NYPL_b12647398-73903).tiff","note":"resized, cropped"}},"now":{"yr":"2011","head":"Today","label":"The hotel today","line":"The clock tower rising over the hotel and a blue sky.","ph":{"k":"rm_ho_now","by":"Billy Hathorn","lic":"CC BY-SA 3.0","lu":"https://creativecommons.org/licenses/by-sa/3.0/","page":"https://commons.wikimedia.org/wiki/File:Jefferson_Hotel,_Richmond,_VA_IMG_4050.JPG","note":"resized"}},"story":["Tobacco baron Lewis Ginter planned the hotel as a top property for the city. Carrère and Hastings, the New York architects who later designed the New York Public Library, designed it in the Spanish Baroque style. It opened on October 31, 1895.","On March 29, 1901, a fire destroyed three-fifths of the hotel. The marble statue of Thomas Jefferson was carried to safety, but its head broke off in the rescue. It was repaired later. The hotel reopened in 1907.","The actor David Niven wrote that he saw a full-sized alligator swimming in a pool near the reception desk. Old Pompey, the last alligator in the Palm Court pools, lived until 1948. Today bronze alligators decorate the hotel."],"fact":"The last alligator was named Old Pompey.","disputed":"Many people think the alligators are still there. Wikipedia says the last one lived until 1948, and now there are bronze statues of them.","claims":[{"t":"The Jefferson Hotel opened in 1895.","a":0,"why":"Wikipedia: opened on October 31, 1895."},{"t":"The hotel's lobby still has live alligators.","a":2,"why":"Old Pompey, the last one, lived until 1948."}],"sources":[{"t":"Wikipedia: Jefferson Hotel (Richmond, Virginia)","u":"https://en.wikipedia.org/wiki/Jefferson_Hotel_(Richmond,_Virginia)"},{"t":"Wikipedia: Carrère and Hastings","u":"https://en.wikipedia.org/wiki/Carr%C3%A8re_and_Hastings"}],"card":{"a":"1895","b":"1907","la":"Opened","lb":"Reopened after the fire"}},{"id":"station","name":"Main Street Station","short":"Main Street Station","badge":"Main Street Station","tag":"Stop 4 of 4","teaser":"A train station with a clock tower that was flooded, burned and brought back.","map":"Main Street Station, 1500 E Main St, Richmond, VA","clue":"Go to East Main Street at 15th Street, in the Shockoe Bottom neighborhood. Look for the red-brick station with a clock tower and a steep red-tile roof.","safety":"Trains and highway traffic are close by. Stay off the tracks and platforms unless you are boarding, and use crosswalks.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"Which storm flooded the station in 1972?","options":["Hurricane Hazel","Hurricane Andrew","Hurricane Agnes","Hurricane Camille"],"answer":2,"hint":"It was a hurricane that caused huge floods in 1972 along the James River.","verify":"Wikipedia says Hurricane Agnes caused the James River to flood the station in 1972. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"Undated","label":"The station then","line":"An old brown-toned photograph of the station's arches and tower from the street.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"rm_st_then","by":"Unknown author (VCU Libraries Commons)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wiki
