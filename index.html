walkways and follow park ranger directions.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"Look up at the central tower facing Chestnut Street. What is set into it?","options":["A cannon","A large clock","A statue of Washington","A giant eagle"],"answer":1,"hint":"Time is the clue.","verify":"The central tower has a clock facing the street. Check on site. Written from sources, not yet checked on site."},"then":{"yr":"about 1900","label":"A century later","line":"A color-tinted photo of Independence Hall from around 1900, held by the Library of Congress.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"ph_ih_then","by":"Library of Congress","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Independence_Hall,_Philadelphia-LCCN2008679522.jpg","note":"resized"}},"now":{"yr":"2013","head":"Today","label":"The hall today","line":"Independence Hall and its clock tower seen across the park. Photo from 2013.","ph":{"k":"ph_ih_now","by":"Kwdavids","lic":"CC BY-SA 3.0","lu":"https://creativecommons.org/licenses/by-sa/3.0/","page":"https://commons.wikimedia.org/wiki/File:Independence_Hall,_Philadelphia_PA.JPG","note":"resized"}},"story":["The building was built from 1732 to 1753 as the Pennsylvania State House. Edmund Woolley and Andrew Hamilton designed it.","The Declaration of Independence was adopted here on July 4, 1776. The U.S. Constitution was drafted here at the Constitutional Convention from May 25 to September 17, 1787, in the Assembly Room.","The original wooden steeple rotted and was removed in 1781. A new, more elaborate steeple by William Strickland was added in 1828. The site became a UNESCO World Heritage Site in 1979."],"fact":"Two of the country's founding documents were created in one room.","disputed":"Nothing big is disputed here. The common mistake is thinking the steeple is the original.","claims":[{"t":"The Declaration of Independence was adopted at Independence Hall in 1776.","a":0,"why":"Wikipedia: adopted there on July 4, 1776."},{"t":"The steeple on Independence Hall today is the original from the 1700s.","a":2,"why":"The original wooden steeple was removed in 1781. A new one was added in 1828."}],"sources":[{"t":"Wikipedia: Independence Hall","u":"https://en.wikipedia.org/wiki/Independence_Hall"},{"t":"National Park Service: Independence Hall","u":"https://www.nps.gov/articles/000/independence-hall-world-heritage-site.htm"}],"card":{"a":"1776","b":"1787","la":"Declaration adopted","lb":"Constitution drafted"}},{"id":"libertybell","name":"Liberty Bell","short":"Liberty Bell","badge":"Liberty Bell","tag":"Stop 2 of 4","teaser":"A cracked bell with a myth bigger than its crack.","map":"Liberty Bell Center, 526 Market St, Philadelphia, PA","clue":"Look across from Independence Hall for the Liberty Bell Center. Inside is a large bell with a big crack.","safety":"Expect a security line and crowds. The exhibit is indoors and the bell is behind a barrier, so look but do not touch.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"Read the lettering on the bell. Which word is in capital letters?","options":["PROCLAIM","JUSTICE","FREEDOM","LIBERTY"],"answer":3,"hint":"The bell is named for it.","verify":"Wikipedia gives the inscription as \"Proclaim LIBERTY Throughout all the Land,\" from Leviticus 25:10. Check the lettering on site. Written from sources, not yet checked on site."},"then":{"yr":"1951","label":"The bell in 1951","line":"A crowd gathered around the Liberty Bell on July 3, 1951.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"ph_lb_then","by":"Abbie Rowe, National Park Service","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Crowd_around_the_Liberty_Bell,_1951_-_cropped.jpg","note":"resized"}},"now":{"yr":"2019","head":"Today","label":"The bell today","line":"The Liberty Bell in the Liberty Bell Center, with Independence Hall behind it. Photo from 2019.","ph":{"k":"ph_lb_now","by":"Mys 721tx","lic":"CC BY-SA 3.0","lu":"https://creativecommons.org/licenses/by-sa/3.0/","page":"https://commons.wikimedia.org/wiki/File:Liberty_Bell,_Aug_2019.jpg","note":"resized"}},"story":["The bell was cast in 1752 in London by Lester and Pack, later the Whitechapel Bell Foundry. It cracked on its first strike in Philadelphia. John Pass and John Stow recast it in 1752 and 1753, adding copper. The first recast sounded bad, so they did it again.","It weighs 2,080 pounds. The inscription comes from Leviticus 25:10. The famous crack formed between 1817 and 1846, most likely near the end of that span.","Abolitionists called it the Liberty Bell in the 1830s. It moved to the Liberty Bell Center in October 2003."],"fact":"The \"Liberty Bell\" name came from abolitionists, not the Founders.","disputed":"The legend that the bell rang for the Declaration on July 4, 1776 lacks evidence. It most likely rang on July 8, when the Declaration was first read publicly, but no account from the time confirms it.","claims":[{"t":"The words on the Liberty Bell come from the Bible, from Leviticus.","a":0,"why":"Wikipedia: the inscription is from Leviticus 25:10."},{"t":"The Liberty Bell cracked while tolling for Chief Justice John Marshall's death in 1835.","a":1,"why":"A common story, but the evidence is thin. The crack formed sometime between 1817 and 1846."}],"sources":[{"t":"Wikipedia: Liberty Bell","u":"https://en.wikipedia.org/wiki/Liberty_Bell"},{"t":"National Park Service: The Liberty Bell","u":"https://www.nps.gov/inde/learn/historyculture/stories-libertybell.htm"}],"card":{"a":"1752","b":"2003","la":"Cast in London","lb":"Moved to its current home"}},{"id":"betsyross","name":"Betsy Ross House","short":"Betsy Ross","badge":"Betsy Ross","tag":"Stop 3 of 4","teaser":"A small house with a famous story that historians argue about.","map":"Betsy Ross House, 239 Arch St, Philadelphia, PA","clue":"In Old City, find a small brick house on Arch Street with a flag out front.","safety":"Arch Street sidewalks are narrow and busy. Keep to the sidewalk, and note the house is a small museum with limited space.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"What street is the house on?","options":["Market Street","Arch Street","Chestnut Street","Walnut Street"],"answer":1,"hint":"Not the main shopping streets.","verify":"The house is at 239 Arch Street. Check the street sign on site. Written from sources, not yet checked on site."},"then":{"yr":"1903","label":"Birthplace of Old Glory","line":"The house in 1903, when a sign on the front called it the \"Birthplace of Old Glory.\"","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"ph_br_then","by":"Not credited","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Birthplace_of_Old_Glory_Betsy_Ross_House_Philadelphia_Pa_1903.jpg","note":"resized"}},"now":{"yr":"2012","head":"Today","label":"The house today","line":"The Betsy Ross House on Arch Street. Photo from 2012.","ph":{"k":"ph_br_now","by":"Beyond My Ken","lic":"CC BY-SA 4.0","lu":"https://creativecommons.org/licenses/by-sa/4.0/","page":"https://commons.wikimedia.org/wiki/File:Betsy_Ross_House_239_Arch_Street.jpg","note":"resized"}},"story":["The front of the house was built around 1740. The stair hall and back section were added 10 to 20 years later.","Betsy Ross may have lived here from 1776, after her first husband John Ross died, until about 1779. But her living here is disputed. The best archival evidence suggests she lived in the house next door, which was later torn down.","The story that she designed and sewed the first flag traces to her relatives, especially her grandsons William and George Canby, and to the 1876 Centennial. Historians call these claims controversial. The house was restored in 1937 and given to the city in 1941."],"fact":"The famous story is mostly a family legend from after her death.","disputed":"Whether she lived here or sewed the first flag is disputed. The house is real. The story is the argument.","claims":[{"t":"The front of the Betsy Ross House was built around 1740.","a":0,"why":"Wikipedia: the front part dates to about 1740."},{"t":"Betsy Ross sewed the first American flag in this house.","a":1,"why":"Historians call it controversial. The story comes from relatives, and she may have lived next door."}],"sources":[{"t":"Wikipedia: Betsy Ross House","u":"https://en.wikipedia.org/wiki/Betsy_Ross_House"},{"t":"ushistory.org: Betsy Ross","u":"https://ushistory.org/betsy/flaghome.html"}],"card":{"a":"1740","b":"1941","la":"Front built (about)","lb":"Given to the city"}},{"id":"carpenters","name":"Carpenters' Hall","short":"Carpenters' Hall","badge":"Carpenters' Hall","tag":"Stop 4 of 4","teaser":"Where the First Continental Congress met in 1774, in a guild's meeting hall.","map":"Carpenters' Hall, 320 Chestnut St, Philadelphia, PA","clue":"Walk to Independence National Historical Park and find the red-brick hall with a small cupola, tucked down a passage off Chestnut Street.","safety":"The street is busy. Use crosswalks. Check the hall's visiting hours, because it is a working guild building.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"Which Congress met in Carpenters' Hall in September 1774?","options":["Second Continental Congress","Constitutional Convention","First Continental Congress","Confederation Congress"],"answer":2,"hint":"The earliest one.","verify":"Wikipedia says the First Continental Congress met there from September 5 to October 26, 1774. Written from sources, not yet checked on site."},"then":{"yr":"Old plans","label":"The hall on paper","line":"An old measured drawing of the hall: front elevation and floor plan.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"ph_ch_then","by":"New York Public Library (scan)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Carpenter's_Hall,_Phil_(NYPL_NYPG94-F149-419968).jpg","note":"resized"}},"now":{"yr":"Today","head":"Today","label":"The hall today","line":"The red-brick hall stands in a courtyard off Chestnut Street.","ph":{"k":"ph_ch_now","by":"Pbjamesphoto","lic":"CC BY-SA 4.0","lu":"https://creativecommons.org/licenses/by-sa/4.0/","page":"https://commons.wikimedia.org/wiki/File:Carpenters'_Hall,_Philadelphia,_U.S.,_May_2015.jpg","note":"resized"}},"story":["Carpenters' Hall is owned by the Carpenters' Company of the City and County of Philadelphia. The land was bought in 1768. The company decided to build on January 30, 1770, and construction was completed in August 1774. Robert Smith designed it, in Georgian style, but did not supervise construction.","The First Continental Congress met there from September 5 to October 26, 1774. The Pennsylvania Provincial Conference met there in June 1776. During the Revolution it served as a hospital for British and American troops.","It also housed the Library Company, the American Philosophical Society and the First and Second Banks of the United States. It was a Federal Custom House from 1802 to 1819. It is a National Historic Landmark and admission is free."],"fact":"It is still owned by the carpenters' guild.","disputed":"Wikipedia gives two completion years, 1774 and 1775, and two descriptions of the British occupation of the hall. Check the hall's own timeline before repeating either.","claims":[{"t":"The First Continental Congress met at Carpenters' Hall in 1774.","a":0,"why":"Wikipedia: September 5 to October 26, 1774."},{"t":"The Declaration of Independence was signed at Carpenters' Hall.","a":2,"why":"It was signed at Independence Hall."}],"sources":[{"t":"Wikipedia: Carpenters' Hall","u":"https://en.wikipedia.org/wiki/Carpenters%27_Hall"},{"t":"Carpenters' Hall: Timeline","u":"https://www.carpentershall.org/timeline"}],"card":{"a":"1774","b":"1970","la":"Congress met","lb":"Landmark status"}}],"heroKey":"ph_ih_now"},"la":{"id":"la","name":"Los Angeles","explorer":"City of Angels Explorer","initials":"LA","ranks":[[0,"Visitor"],[100,"Boulevard Walker"],[250,"Landmark Hunter"],[450,"Studio Scholar"],[600,"Los Angeles Historian"]],"heroAlt":"The glass-roofed court inside the Bradbury Building","heroLi":"<li>Header: Stephen Weissberger · CC BY-SA 4.0 · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:Bradbury_Atrium.jpg\">Source</a> · resized</li>","heroCredit":"Photo: Stephen Weissberger · <a target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by-sa/4.0/\">CC BY-SA 4.0</a> · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:Bradbury_Atrium.jpg\">Source</a>","mission":"Find four landmarks around Los Angeles. At each one, check in to earn its badge, unlock its story, and collect a Time Card. Do them in any order. Everything stays on this phone.","afterDone":"All four badges earned. The rest of LA is waiting.","safetyNote":"<li>Los Angeles is spread out and traffic is heavy. Plan your rides, bring water, and cross only at crosswalks. Do not climb or hike to restricted areas.</li>","badgeMap":{"hollywoodsign":["la_hs_now","50% 50%"],"bradbury":["la_br_now","50% 45%"],"angelsflight":["la_af_now","50% 45%"],"olvera":["la_ol_now","50% 45%"]},"level":"Classics","region":"The West","stops":[{"id":"bradbury","name":"Bradbury Building","short":"Bradbury","badge":"Bradbury","tag":"Stop 1 of 4","teaser":"A plain brick box hiding a five-story glass court and open-cage elevators.","map":"Bradbury Building, 304 S Broadway, Los Angeles, CA","clue":"Go downtown to Broadway and 3rd Street and find the plain-looking brick building with an arched entrance. Step inside the lobby court if it is open.","safety":"Downtown is busy. Use crosswalks. The building has offices, so be quiet and follow posted visiting rules.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"Look up in the central court. How many stories does the open atrium rise?","options":["3","5","7","10"],"answer":1,"hint":"Not quite as many as a skyscraper.","verify":"Wikipedia says the court rises five stories. Count on site. Written from sources, not yet checked on site."},"then":{"yr":"1894","label":"The building then","line":"The Bradbury Building in 1894, the year it was finished.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"la_br_then","by":"Unknown","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Bradbury_Building_1894.jpg","note":"resized"}},"now":{"yr":"Today","head":"Today","label":"The court today","line":"The glass-roofed court is lit by daylight.","ph":{"k":"la_br_now","by":"Stephen Weissberger","lic":"CC BY-SA 4.0","lu":"https://creativecommons.org/licenses/by-sa/4.0/","page":"https://commons.wikimedia.org/wiki/File:Bradbury_Atrium.jpg","note":"resized"}},"story":["The Bradbury Building was built in 1893 and finished in 1894 at a cost of $500,000, about three times its original $175,000 budget. Lewis L. Bradbury, a mining and real estate millionaire, began planning it in 1892 and died that year, some months before it opened.","Bradbury first hired Sumner Hunt, then dismissed his design and hired George Wyman, a draftsman who earned $5 a week and had no formal architecture training. Wikipedia says there is no concrete evidence that Wyman changed Hunt's design, which is why some people dispute who the true architect was.","The five-story central court has a skylight, open bird-cage elevators, wrought-iron grillwork made in France and shown at the 1893 Chicago World's Fair, and yellow and pink brick. It was a National Historic Landmark in 1977 and appears in Blade Runner (1982)."],"fact":"Blade Runner filmed here in 1982.","disputed":"Who is the true architect is a long argument. Hunt drew the plans, but Wyman built it and Wikipedia says it is unclear what he changed.","claims":[{"t":"The Bradbury Building was completed in the 1890s.","a":0,"why":"Wikipedia: built 1893 and completed 1894."},{"t":"George Wyman was a famous architect when he got the job.","a":2,"why":"He was a draftsman earning $5 a week with no formal training."}],"sources":[{"t":"Wikipedia: Bradbury Building","u":"https://en.wikipedia.org/wiki/Bradbury_Building"},{"t":"SAH Archipedia: Bradbury Building","u":"https://sah-archipedia.org/node/7962"}],"card":{"a":"1893","b":"1977","la":"Built","lb":"Landmark status"}},{"id":"hollywoodsign","name":"Hollywood Sign","short":"Hollywood Sign","badge":"Hollywood Sign","tag":"Stop 2 of 4","teaser":"A giant real estate ad that became a symbol.","map":"Lake Hollywood Park, Los Angeles, CA","clue":"Find a public viewing spot, such as Lake Hollywood Park or an overlook in Griffith Park, where you can see the white letters on the hillside. Do not try to climb to the sign.","safety":"The sign is on a protected hillside and hiking up to it is not allowed. View it from a distance. Park legally, stay quiet near homes and do not block narrow residential streets.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"Look at the sign on the hillside. How many letters are in it?","options":["7","8","9","11"],"answer":2,"hint":"It spells the neighborhood name.","verify":"The sign spells HOLLYWOOD, which has 9 letters (Hollywood Sign Trust). Check from the viewing spot. Written from sources, not yet checked on site."},"then":{"yr":"1920s","label":"Hollywoodland","line":"The sign when it still read HOLLYWOODLAND.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"la_hs_then","by":"Unknown author","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Hollywoodland_Sign_1920s.jpg","note":"resized"}},"now":{"yr":"2015","head":"Today","label":"The sign today","line":"The white letters on the hillside above Hollywood. Photo from 2015.","ph":{"k":"la_hs_now","by":"Thomas Wolf","lic":"CC BY-SA 3.0","lu":"https://creativecommons.org/licenses/by-sa/3.0/","page":"https://commons.wikimedia.org/wiki/File:Hollywood_Sign_(Zuschnitt).jpg","note":"resized"}},"story":["The sign was built in 1923. It originally read \"Hollywoodland.\" Los Angeles Times publisher Harry Chandler built it as a billboard advertising his upscale Hollywoodland real estate development.","Each letter was about 43 feet tall and 30 feet wide. The original sign was lit by 4,000 20-watt light bulbs spaced 8 inches apart.","It was never meant to last. It became a symbol of the film industry that grew up around it."],"fact":"The original sign had 4,000 light bulbs.","disputed":"Nothing big is disputed here. The popular guess is that it was built for the movie business, but it was built to sell houses.","claims":[{"t":"The Hollywood Sign was first built as an advertisement for a housing development.","a":0,"why":"The Hollywood Sign Trust: Harry Chandler built it in 1923 to advertise Hollywoodland."},{"t":"The Hollywood Sign was built to honor the film industry.","a":2,"why":"It was a real estate billboard. Its meaning came later."}],"sources":[{"t":"Hollywood Sign Trust: A sign is born","u":"https://www.hollywoodsign.org/history/a-sign-is-born"},{"t":"UCLA Library: 1923 landmarks","u":"https://www.library.ucla.edu/about/news/100-years-ago-in-los-angeles-the-1923-debut-of-historic-landmarks"}],"card":{"a":"1923","b":"Today","la":"Hollywoodland","lb":"Hollywood"}},{"id":"angelsflight","name":"Angels Flight","short":"Angels Flight","badge":"Angels Flight","tag":"Stop 3 of 4","teaser":"The world's shortest railway, with two cars named Olivet and Sinai.","map":"Angels Flight Railway, 351 S Hill St, Los Angeles, CA","clue":"Go downtown to Hill Street near Grand Central Market and find the tiny orange-and-black funicular with two cars.","safety":"Hill Street is busy. Use crosswalks. Check the funicular's status first, because it has closed many times.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"What are the two cars named?","options":["Olivet and Sinai","Faith and Hope","Sun and Moon","Hill and Dale"],"answer":0,"hint":"Names from the Bible.","verify":"Wikipedia says the cars are named Olivet and Sinai. Read the cars on site. Written from sources, not yet checked on site."},"then":{"yr":"1960","label":"The funicular then","line":"The funicular on October 2, 1960, nine years before it closed.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"la_af_then","by":"Jack Boucher (Historic American Buildings Survey)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:AngelsFlight.jpg","note":"resized"}},"now":{"yr":"Today","head":"Today","label":"The funicular today","line":"The two cars run on a short track on Hill Street.","ph":{"k":"la_af_now","by":"Difference engine","lic":"CC BY-SA 4.0","lu":"https://creativecommons.org/licenses/by-sa/4.0/","page":"https://commons.wikimedia.org/wiki/File:Angels_Flight_after_reopening_in_September_2017.jpg","note":"resized"}},"story":["Angels Flight opened in 1901 as the Los Angeles Incline Railway, financed by Colonel J. W. Eddy. It has about 298 feet of track with a 96-foot rise, a grade of about 33 percent. The two cars, Olivet and Sinai, run in opposite directions on a shared cable.","The railway closed in May 1969 for Bunker Hill redevelopment, and the cars sat in storage for 27 years. It reopened on February 24, 1996 at a new site half a block south.","On February 1, 2001, the car Sinai rolled downhill uncontrolled and hit Olivet. One 83-year-old man died and eight others were hurt. The NTSB blamed improper design and construction of the drive system. It reopened in 2010, closed again, and reopened in 2017."],"fact":"It is Los Angeles Historic-Cultural Monument No. 4.","disputed":"\"World's shortest railway\" is a plaque's wording: \"said to be the world's shortest incorporated railway.\" Treat it as a claim.","claims":[{"t":"Angels Flight opened in 1901.","a":0,"why":"Wikipedia: opened in 1901."},{"t":"Angels Flight has always stayed at its original site.","a":2,"why":"It closed in 1969 and reopened in 1996 half a block south."}],"sources":[{"t":"Wikipedia: Angels Flight","u":"https://en.wikipedia.org/wiki/Angels_Flight"},{"t":"Los Angeles Public Library: Angels Flight","u":"https://lapl.org/node/43072"}],"card":{"a":"1901","b":"1996","la":"Opened","lb":"Reopened"}},{"id":"olvera","name":"Olvera Street","short":"Olvera Street","badge":"Olvera Street","tag":"Stop 4 of 4","teaser":"The oldest part of Los Angeles, with the oldest house still standing.","map":"Olvera Street, Los Angeles, CA","clue":"Walk across from Union Station to the brick-paved marketplace street beside the old Plaza.","safety":"The street is crowded and has uneven bricks. Use crosswalks to cross Main and Alameda, and watch for kids and carts.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"Find the Avila Adobe at 10 Olvera Street. It is the oldest surviving what in Los Angeles?","options":["Church","School","Residence","Store"],"answer":2,"hint":"Someone lived there.","verify":"Wikipedia says the Avila Adobe is the oldest surviving residence in Los Angeles. Written from sources, not yet checked on site."},"then":{"yr":"1868","label":"The Plaza then","line":"The old Plaza in about 1868.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"la_ol_then","by":"Unknown","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:LosAngeles-Plaza-1869.jpg","note":"resized"}},"now":{"yr":"Today","head":"Today","label":"The street today","line":"Shops and stalls line the brick street.","ph":{"k":"la_ol_now","by":"Visitor7","lic":"CC BY-SA 3.0","lu":"https://creativecommons.org/licenses/by-sa/3.0/","page":"https://commons.wikimedia.org/wiki/File:Olvera_Street,_Los_Angeles-4.jpg","note":"resized"}},"story":["Spanish settlers founded Los Angeles in 1781: 11 families, 44 people, plus a few soldiers, on a site southeast of today's Olvera Street. The street's early names included Placita Olvera and Wine Street. In 1877 a City Council ordinance renamed Wine Street for Agustín Olvera, the first Superior Court judge of Los Angeles County.","The Avila Adobe was built in 1818 by Francisco Ávila at 10 Olvera Street. It is described as the oldest surviving residence in Los Angeles. Christine Sterling began her campaign to save the area in 1926, and the street opened on Easter Sunday 1930 as Paseo de Los Angeles.","David Siqueiros's mural América Tropical was unveiled above the street in 1932 and soon covered up because of its politics. The Getty Conservation Institute began conservation work in 2010, and an interpretive center opened in 2012. The area is El Pueblo de Los Ángeles Historical Monument."],"fact":"The Avila Adobe was built in 1818.","disputed":"Some critics call the street a sanitized tourist version of Mexican culture, and Wikipedia says so. The oldest brick house claim for the Pelanconi House also lists two different dates.","claims":[{"t":"The Avila Adobe is the oldest surviving residence in Los Angeles.","a":0,"why":"Wikipedia: built in 1818."},{"t":"Olvera Street was built by the original 1781 settlers as a market.","a":2,"why":"It opened as a marketplace on Easter Sunday 1930."}],"sources":[{"t":"Wikipedia: Olvera Street","u":"https://en.wikipedia.org/wiki/Olvera_Street"},{"t":"Wikipedia: Avila Adobe","u":"https://en.wikipedia.org/wiki/Avila_Adobe"}],"card":{"a":"1781","b":"1930","la":"Founded","lb":"Opened as a market"}}],"heroKey":"la_br_now"},"seattle":{"id":"seattle","name":"Seattle","explorer":"Emerald City Explorer","initials":"SEA","ranks":[[0,"Visitor"],[100,"Waterfront Walker"],[250,"Landmark Hunter"],[450,"Puget Scholar"],[600,"Seattle Historian"]],"heroAlt":"The Space Needle against the sky","heroLi":"<li>Header: Dietmar Rabich · CC BY-SA 4.0 · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:Seattle_(WA,_USA),_Space_Needle_--_2022_--_1498.jpg\">Source</a> · resized</li>","heroCredit":"Photo: Dietmar Rabich · <a target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by-sa/4.0/\">CC BY-SA 4.0</a> · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:Seattle_(WA,_USA),_Space_Needle_--_2022_--_1498.jpg\">Source</a>","mission":"Find four landmarks around Seattle. At each one, check in to earn its badge, unlock its story, and collect a Time Card. Do them in any order. Everything stays on this phone.","afterDone":"All four badges earned. The rest of Seattle is waiting.","safetyNote":"<li>Seattle is hilly and often rainy. Wear good shoes, bring a jacket, and take care on wet pavement and steep streets.</li>","badgeMap":{"spaceneedle":["sea_sn_now","50% 40%"],"pikeplace":["sea_pp_now","50% 50%"],"smithtower":["sea_st_now","50% 30%"],"pioneersq":["se_ps_now","50% 45%"]},"level":"Classics","region":"The West","stops":[{"id":"spaceneedle","name":"Space Needle","short":"Space Needle","badge":"Space Needle","tag":"Stop 1 of 4","teaser":"A flying saucer on a tripod, built in about 8 months.","map":"Space Needle, 400 Broad St, Seattle, WA","clue":"Go to Seattle Center and look up at the tall tower with a saucer-shaped top.","safety":"Seattle Center is busy. Stay on walkways and crossings, and note that the observation deck needs a ticket. Check the weather first.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"Look at the base of the tower. How many legs does it stand on?","options":["2","3","4","6"],"answer":1,"hint":"Think tripod.","verify":"Wikipedia credits Victor Steinbrueck with the tripod design. Count the legs on site. Written from sources, not yet checked on site."},"then":{"yr":"1961","label":"Under construction","line":"An aerial photo of the Space Needle under construction in 1961.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"sea_sn_then","by":"Seattle Municipal Archives","lic":"CC BY 2.0","lu":"https://creativecommons.org/licenses/by/2.0/","page":"https://commons.wikimedia.org/wiki/File:Aerial_photo_of_Space_Needle_under_construction,_1961.jpg","note":"resized"}},"now":{"yr":"2022","head":"Today","label":"The tower today","line":"The Space Needle against the sky. Photo from 2022.","ph":{"k":"sea_sn_now","by":"Dietmar Rabich","lic":"CC BY-SA 4.0","lu":"https://creativecommons.org/licenses/by-sa/4.0/","page":"https://commons.wikimedia.org/wiki/File:Seattle_(WA,_USA),_Space_Needle_--_2022_--_1498.jpg","note":"resized"}},"story":["Construction began on April 17, 1961. The tower opened on April 21, 1962 for the 1962 World's Fair, called Century 21. It stands 605 feet tall to the top of the spire.","Edward E. Carlson's concept was a giant tethered balloon, sketched on a napkin. John Graham's concept was a flying saucer holding the restaurant and observation deck. Victor Steinbrueck added the hourglass profile and tripod design.","The revolving restaurant stopped turning on March 27, 1964, after the Alaska earthquake. A $100 million renovation reopened in August 2018, with a revolving glass floor called the Loupe."],"fact":"The original paint names were Orbital Olive, Astronaut White, Re-entry Red and Galaxy Gold.","disputed":"Nothing big is disputed. The most common mistake is thinking the restaurant has always rotated.","claims":[{"t":"The Space Needle was built for the 1962 World's Fair.","a":0,"why":"Wikipedia: it opened April 21, 1962 for the Century 21 Exposition."},{"t":"The Space Needle's restaurant has rotated nonstop since 1962.","a":2,"why":"It stopped rotating on March 27, 1964, after the Alaska earthquake."}],"sources":[{"t":"Wikipedia: Space Needle","u":"https://en.wikipedia.org/wiki/Space_Needle"},{"t":"The Clio: Space Needle","u":"https://theclio.com/tour/193/4"}],"card":{"a":"1961","b":"1962","la":"Construction began","lb":"Opened"}},{"id":"pikeplace","name":"Pike Place Market","short":"Pike Place","badge":"Pike Place","tag":"Stop 2 of 4","teaser":"A market where fish fly and a bronze pig keeps the money.","map":"Pike Place Market, 85 Pike St, Seattle, WA","clue":"Walk to the market on Pike Place near the waterfront. Find the big bronze pig near the \"Public Market Center\" sign.","safety":"The market is very crowded. Watch for delivery carts, wet floors near fish counters, and traffic on the cobbled street.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"Find the large bronze pig near the Public Market Center sign. What is its name?","options":["Wilbur","Penny","Rachel","Pearl"],"answer":2,"hint":"Check the plaque near the statue.","verify":"Wikipedia says the 550-pound bronze piggy bank is named Rachel. Written from sources, not yet checked on site."},"then":{"yr":"about 1907","label":"The early market","line":"Vendors gathering on Pike Place around the time the market opened in 1907.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"sea_pp_then","by":"Digital Public Library of America","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Market_vendors_gathering_on_Pike_Place,_ca._1907_-_DPLA_-_f62ac740d22b6ca81f281666c4c52882_(page_1).jpg","note":"resized"}},"now":{"yr":"2017","head":"Today","label":"The Public Market sign","line":"The Public Market Center sign at Pike Place Market. Photo from 2017.","ph":{"k":"sea_pp_now","by":"Madi Fawcett","lic":"CC BY-SA 4.0","lu":"https://creativecommons.org/licenses/by-sa/4.0/","page":"https://commons.wikimedia.org/wiki/File:Public_Market_sign_at_Pike_Place_Market,_2017.jpg","note":"resized"}},"story":["Pike Place Market opened on August 17, 1907. Its goal was to let consumers \"Meet the Producer.\" Frank Goodwin and his brothers developed most of the core buildings and kept the decoration minimal so the focus stayed on products and low prices.","In 1971, voters passed a historic preservation initiative on November 2 by a 2-to-1 margin. It created a historic district and kept the market in public hands.","Rachel is a 550-pound bronze piggy bank by Georgia Gerber, in place since 1986. It collects roughly $6,000 to $9,000 a year for the Market Foundation's social services."],"fact":"Employees throw fish, such as three-foot salmon, across the counter instead of handing them over.","disputed":"Wikipedia calls it \"one of the older continuously operated public farmers' markets,\" not the oldest, so be wary of bigger claims.","claims":[{"t":"Pike Place Market opened in 1907.","a":0,"why":"Wikipedia: opened August 17, 1907."},{"t":"The Starbucks at Pike Place Market is still in its original 1971 location.","a":2,"why":"The first Starbucks opened in 1971 at 2000 Western Avenue and moved in 1977 to 1912 Pike Place."}],"sources":[{"t":"Wikipedia: Pike Place Market","u":"https://en.wikipedia.org/wiki/Pike_Place_Market"},{"t":"HistoryLink: Pike Place Market","u":"https://www.historylink.org/file/1602"}],"card":{"a":"1907","b":"1971","la":"Opened","lb":"Preservation vote"}},{"id":"smithtower","name":"Smith Tower","short":"Smith Tower","badge":"Smith Tower","tag":"Stop 3 of 4","teaser":"A skyscraper built by a typewriter fortune.","map":"Smith Tower, 506 2nd Ave, Seattle, WA","clue":"Go to Pioneer Square and look for the white terra-cotta tower with a pointed roof.","safety":"Pioneer Square sidewalks are busy and uneven. Watch for traffic and stay on crossings.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"Look at the very top of the tower. What shape is the roof?","options":["A pyramid","A dome","Flat","A clock tower"],"answer":0,"hint":"Think Egypt.","verify":"Sources describe the tower topped by a pyramid. Check on site. Written from sources, not yet checked on site."},"then":{"yr":"1914","label":"Newly built","line":"Smith Tower with Mount Rainier behind it, in 1914.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"sea_st_then","by":"Frank H. Nowell","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:LC_Smith_Tower_and_Mt_Rainier,_1914_(SEATTLE_3137).jpg","note":"resized"}},"now":{"yr":"2007","head":"Today","label":"The tower today","line":"Smith Tower rising over Pioneer Square. Photo from 2007.","ph":{"k":"sea_st_now","by":"Joe Mabel","lic":"CC BY-SA 3.0","lu":"https://creativecommons.org/licenses/by-sa/3.0/","page":"https://commons.wikimedia.org/wiki/File:Seattle_-_Smith_Tower_01.jpg","note":"resized"}},"story":["Smith Tower was completed in 1914 and opened to the public on July 4, 1914. It is named for Lyman Cornelius Smith, a New York industrialist known for firearms and typewriters. He died in 1910, before construction began, and his son Burns Lyman Smith oversaw it. Gaggin & Gaggin of Syracuse, New York designed it.","It was the tallest building west of the Mississippi River until the Kansas City Power & Light Building was finished in 1931.","On the top floor, the Chinese Room has a carved teak ceiling and blackwood furniture said to be furnished by Empress Cixi. The tower kept elevator operators longer than most West Coast buildings. Elevators were automated starting in 2017."],"fact":"The tower was one of the last on the West Coast to use elevator operators.","disputed":"The tower's height is quoted differently in different sources, and the Wishing Chair story is a legend.","claims":[{"t":"Smith Tower was the tallest building west of the Mississippi River when it was finished.","a":0,"why":"Wikipedia: it held that title until 1931."},{"t":"Sitting in the Wishing Chair in the Chinese Room will bring marriage within a year.","a":1,"why":"It is a legend. Smith's daughter married in the room, but nobody can prove the chair works."}],"sources":[{"t":"Wikipedia: Smith Tower","u":"https://en.wikipedia.org/wiki/Smith_Tower"},{"t":"HistoryLink: Smith Tower","u":"https://www.historylink.org/File/4310"}],"card":{"a":"1914","b":"1931","la":"Opened","lb":"Lost tallest-west title"}},{"id":"pioneersq","name":"Pioneer Square","short":"Pioneer Square","badge":"Pioneer Square","tag":"Stop 4 of 4","teaser":"Seattle's original downtown, rebuilt in brick after a fire.","map":"Pioneer Square, 1st Ave S and Yesler Way, Seattle, WA","clue":"Walk to Occidental Park and Pioneer Place, where Yesler Way meets 1st Avenue, and find the iron-and-glass pergola.","safety":"The area is busy, with traffic and light rail nearby. Use crosswalks and watch for uneven brick sidewalks.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"Find the old iron and glass pergola in the small park. In what year was it added?","options":["1889","1909","1929","1962"],"answer":1,"hint":"About 20 years after the great fire.","verify":"Wikipedia says an iron and glass pergola designed by Julian F. Everett was added in 1909. Written from sources, not yet checked on site."},"then":{"yr":"1901","label":"The street then","line":"First Avenue South in Pioneer Square in 1901.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"se_ps_then","by":"Asahel Curtis","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:1st_Ave_S,_Pioneer_Square_district,_Seattle,_1901_(CURTIS_2044).jpeg","note":"resized"}},"now":{"yr":"Today","head":"Today","label":"The park today","line":"The pergola stands beside the totem pole.","ph":{"k":"se_ps_now","by":"Joe Mabel","lic":"CC BY-SA 3.0","lu":"https://creativecommons.org/licenses/by-sa/3.0/","page":"https://commons.wikimedia.org/wiki/File:Pioneer_Square_Pergola_01.jpg","note":"resized"}},"story":["Seattle's founders settled at Pioneer Square in 1852. Henry Yesler built a sawmill at the foot of what is now Yesler Way. The neighborhood was once known as Skid Road and Skid Row.","The Great Seattle Fire of June 6, 1889 destroyed Pioneer Square. By the end of 1890, dozens of brick and stone buildings in the Richardsonian Romanesque style had replaced the wood ones. The Seattle Underground Tour shows old storefronts buried when streets were raised.","In 1899, citizens stole a Tlingit totem pole and set it in Pioneer Place Park. They paid a $500 settlement. After an arsonist damaged it in 1938, a replacement was installed in 1940. The Pioneer Square-Skid Road Historic District was added to the National Register on June 22, 1970."],"fact":"Citizens stole a totem pole in 1899 and paid a $500 settlement.","disputed":"The Wikipedia page for the neighborhood does not explain where the term Skid Road came from, so do not repeat popular origin stories without a source.","claims":[{"t":"A fire destroyed Pioneer Square in 1889.","a":0,"why":"Wikipedia: June 6, 1889."},{"t":"Henry Yesler's sawmill was built after the 1889 fire.","a":2,"why":"Yesler chose the site in 1852, before the fire."}],"sources":[{"t":"Wikipedia: Pioneer Square, Seattle","u":"https://en.wikipedia.org/wiki/Pioneer_Square,_Seattle"},{"t":"HistoryLink: Pioneer Square","u":"https://www.historylink.org/"}],"card":{"a":"1852","b":"1970","la":"Founded","lb":"Historic district"}}],"heroKey":"sea_sn_now"},"nola":{"id":"nola","name":"New Orleans","explorer":"French Quarter Explorer","initials":"NOLA","ranks":[[0,"Visitor"],[100,"Quarter Walker"],[250,"Landmark Hunter"],[450,"Crescent Scholar"],[600,"New Orleans Historian"]],"heroAlt":"Jackson Square in the French Quarter","heroLi":"<li>Header: Diego Delso · CC BY-SA 3.0 · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:Jackson_Square,_New_Orleans,_USA1.jpg\">Source</a> · resized</li>","heroCredit":"Photo: Diego Delso · <a target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by-sa/3.0/\">CC BY-SA 3.0</a> · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:Jackson_Square,_New_Orleans,_USA1.jpg\">Source</a>","mission":"Find four landmarks in the French Quarter. At each one, check in to earn its badge, unlock its story, and collect a Time Card. Do them in any order. Everything stays on this phone.","afterDone":"All four badges earned. The rest of New Orleans is waiting.","safetyNote":"<li>The French Quarter is hot, humid and crowded, with uneven sidewalks and traffic. Bring water, watch your step and stay aware of your surroundings.</li>","badgeMap":{"jacksonsq":["no_js_now","50% 50%"],"cathedral":["no_ca_now","50% 40%"],"cabildo":["no_cb_now","50% 50%"],"frenchmarket":["no_fm_now","50% 50%"]},"level":"Classics","region":"The South","stops":[{"id":"jacksonsq","name":"Jackson Square","short":"Jackson Square","badge":"Jackson Square","tag":"Stop 1 of 4","teaser":"A parade ground with a man on a rearing horse.","map":"Jackson Square, 700 Decatur St, New Orleans, LA","clue":"In the French Quarter, find the park with a bronze statue of a rider on a rearing horse, in front of a big church.","safety":"The square is crowded with performers and tourists. Watch your belongings, the uneven sidewalks and the heat.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"Whose statue stands in the center of the square?","options":["Robert E. Lee","George Washington","Andrew Jackson","Marquis de Lafayette"],"answer":2,"hint":"The square is named for him.","verify":"The square is named for Andrew Jackson, whose statue was erected in 1851 (National Park Service). Written from sources, not yet checked on site."},"then":{"yr":"1885","label":"The square then","line":"A view of Jackson Square from above in 1885, with the statue at the center.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"no_js_then","by":"W. P. Snyder","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Jackson_Square,_New_Orleans.jpg","note":"resized"}},"now":{"yr":"2008","head":"Today","label":"The square today","line":"Jackson Square in the French Quarter. Photo from 2008.","ph":{"k":"no_js_now","by":"Diego Delso","lic":"CC BY-SA 3.0","lu":"https://creativecommons.org/licenses/by-sa/3.0/","page":"https://commons.wikimedia.org/wiki/File:Jackson_Square,_New_Orleans,_USA1.jpg","note":"resized"}},"story":["In the 19th century the square was the Place d'Armes, the traditional site of important ceremonies and parades.","On December 18, 1814, Andrew Jackson reviewed about 6,000 troops there. His speech, translated by Edward Livingston, urged unity against a common enemy. The Americans then won the Battle of New Orleans.","The square kept the Place d'Armes name until 1851, when the current Andrew Jackson statue was erected and it became Jackson Square. It is a National Historic Landmark."],"fact":"Jackson used the square to muster troops before the Battle of New Orleans.","disputed":"Nothing big is disputed here. The mistake is thinking the square always had Jackson's name.","claims":[{"t":"Jackson Square was originally called the Place d'Armes.","a":0,"why":"The National Park Service: it kept that name until 1851."},{"t":"Jackson Square was named for Andrew Jackson from the day it was laid out.","a":2,"why":"It was the Place d'Armes until the statue was erected in 1851."}],"sources":[{"t":"National Park Service: Place d'Armes","u":"https://www.nps.gov/places/places-darmes.htm"},{"t":"TCLF: Jackson Square","u":"https://www.tclf.org/landscapes/jackson-square"}],"card":{"a":"1814","b":"1851","la":"Troops reviewed","lb":"Renamed"}},{"id":"cathedral","name":"St. Louis Cathedral","short":"Cathedral","badge":"Cathedral","tag":"Stop 2 of 4","teaser":"A church rebuilt after a Good Friday fire.","map":"St. Louis Cathedral, 615 Pere Antoine Alley, New Orleans, LA","clue":"Stand in Jackson Square and face the big white church with tall spires.","safety":"Respect worship times and quiet inside. Watch for crowds and carriage traffic around the square.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"Count the tall spires on the front of the cathedral. How many?","options":["2","3","4","5"],"answer":1,"hint":"Count the pointed towers.","verify":"The cathedral has three spires (Wikipedia photo caption). Count on site. Written from sources, not yet checked on site."},"then":{"yr":"about 1900","label":"The cathedral then","line":"St. Louis Cathedral and the Jackson Square statue around 1900, in a Detroit Photographic Co. photo.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"no_ca_then","by":"Detroit Photographic Co.","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Jackson_Square_&_Cathedral_of_St._Louis,_New_Orleans_LCCN2017658694.jpg","note":"resized"}},"now":{"yr":"2022","head":"Today","label":"Inside the cathedral","line":"The nave, with flags hanging from the balconies. Photo from 2022.","ph":{"k":"no_ca_now","by":"APK","lic":"CC BY-SA 4.0","lu":"https://creativecommons.org/licenses/by-sa/4.0/","page":"https://commons.wikimedia.org/wiki/File:St._Louis_Cathedral_(New_Orleans)_2.jpg","note":"resized"}},"story":["The first church on the site, a crude wooden building, went up in 1718. A brick and timber church was completed in 1727. The Great New Orleans Fire destroyed it on Good Friday, March 21, 1788.","The third church was begun in 1789 and finished in 1794, and the church became a cathedral in 1793. The present building dates mostly to 1850. A central tower designed by Benjamin Henry Latrobe in 1819 collapsed in 1850 during rebuilding.","Pope Paul VI named it a minor basilica in 1964. Wikipedia calls it \"the oldest cathedral in continuous use in the United States,\" a title it shares with the Royal Presidio Chapel in Monterey, California."],"fact":"The 1788 fire destroyed the earlier church and many other buildings.","disputed":"The \"oldest cathedral\" title is shared with a chapel in Monterey, California, so it depends on how you count.","claims":[{"t":"The Great New Orleans Fire of 1788 destroyed the earlier church on this site.","a":0,"why":"Wikipedia: it burned on Good Friday, March 21, 1788."},{"t":"St. Louis Cathedral is the only oldest cathedral in continuous use in the United States.","a":1,"why":"Wikipedia says it shares the distinction with the Royal Presidio Chapel in Monterey, California."}],"sources":[{"t":"Wikipedia: St. Louis Cathedral","u":"https://en.wikipedia.org/wiki/St._Louis_Cathedral_(New_Orleans)"},{"t":"The Clio: St. Louis Cathedral","u":"https://theclio.com/tour/122/5"}],"card":{"a":"1788","b":"1850","la":"Fire destroys church","lb":"Present building"}},{"id":"cabildo","name":"The Cabildo","short":"Cabildo","badge":"Cabildo","tag":"Stop 3 of 4","teaser":"The Spanish city hall where a country changed hands.","map":"The Cabildo, 701 Chartres St, New Orleans, LA","clue":"Next to the cathedral on Jackson Square, find the pale, arched building with a dark sloped roof.","safety":"Stay on the sidewalks, watch for street performers and carriages, and check hours if you want to go in.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"What kind of roof tops the Cabildo's top floor?","options":["Flat","Thatched","Dome","Mansard"],"answer":3,"hint":"A French style.","verify":"Wikipedia says a third floor with a French-style mansard roof was added in 1847. Written from sources, not yet checked on site."},"then":{"yr":"about 1900","label":"The Cabildo then","line":"The Cabildo around 1900, when it was home to the Louisiana Supreme Court.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"no_cb_then","by":"Detroit Publishing Co.","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Cabildo_Supreme_Court_c_1900_New_Orleans.jpg","note":"resized"}},"now":{"yr":"2007","head":"Today","label":"The Cabildo today","line":"The Cabildo beside the cathedral. Photo from 2007.","ph":{"k":"no_cb_now","by":"Infrogmation of New Orleans","lic":"CC BY-SA 3.0","lu":"https://creativecommons.org/licenses/by-sa/3.0/","page":"https://commons.wikimedia.org/wiki/File:Cabildo9Jul07SousaphoneFront.jpg","note":"resized"}},"story":["The Cabildo was built between 1795 and 1799 as the home of Spanish municipal government in New Orleans. Gilberto Guillemard is listed as its architect. Spanish officials used its courtroom from 1799 to 1803.","Ceremonies marking the transfer of Louisiana took place at the Cabildo in late 1803. A third floor with a French-style mansard roof was added in 1847.","A fire on May 11, 1988 destroyed the cupola and the entire third floor. The building reopened in 1994 after restoration. Since 1911 it has housed the Louisiana State Museum."],"fact":"The Sala Capitular hosted landmark court cases, including Plessy v. Ferguson.","disputed":"Nothing big is disputed here. The mistake is assuming the roof you see is original.","claims":[{"t":"The Cabildo was built in the 1790s as the home of Spanish city government.","a":0,"why":"Wikipedia: built between 1795 and 1799."},{"t":"The mansard roof on the Cabildo is original from the 1790s.","a":2,"why":"The third floor and mansard roof were added in 1847, then rebuilt after the 1988 fire."}],"sources":[{"t":"Wikipedia: The Cabildo","u":"https://en.wikipedia.org/wiki/The_Cabildo"},{"t":"National Park Service: Louisiana territory transferred","u":"https://www.nps.gov/articles/000/louisiana-territory-officially-transferred.htm"}],"card":{"a":"1799","b":"1994","la":"Completed","lb":"Reopened after fire"}},{"id":"frenchmarket","name":"French Market","short":"French Market","badge":"French Market","tag":"Stop 4 of 4","teaser":"A market older than the country around it.","map":"French Market, 1008 N Peters St, New Orleans, LA","clue":"Walk along the river side of the Quarter to the long covered market. At its upriver end you will find a famous café.","safety":"The market is crowded and the streets around it are busy. Watch for traffic and wet pavement.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"Which famous café marks one end of the French Market?","options":["Café du Monde","Café Beignet","Café Brasil","Café Amelie"],"answer":0,"hint":"Think powdered sugar.","verify":"Wikipedia says the market marks the upriver end at Café du Monde. Confirm on site. Written from sources, not yet checked on site."},"then":{"yr":"about 1900","label":"The market then","line":"A Detroit Photographic Company view of the French Market around 1900.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"no_fm_then","by":"Detroit Photographic Company","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Detroit_Photographic_Company_(0347)_-_French_Market,_New_Orleans.jpg","note":"resized"}},"now":{"yr":"2016","head":"Today","label":"The market hall today","line":"A covered hall of the French Market. Photo from 2016.","ph":{"k":"no_fm_now","by":"Infrogmation of New Orleans","lic":"CC BY-SA 4.0","lu":"https://creativecommons.org/licenses/by-sa/4.0/","page":"https://commons.wikimedia.org/wiki/File:French_Market_Hall_New_Orleans_11_October_2016.jpg","note":"resized"}},"story":["Part of the space was dedicated as a market in 1791, during the colonial period. Wikipedia says it began as a Native American trading post before European colonization, with no date given. The oldest surviving structures date to about 1813.","The Works Progress Administration made major renovations in the 1930s. The market spans six blocks, from Café du Monde to the flea market stalls across from the New Orleans Mint.","Wikipedia calls it \"the oldest of its kind in the United States.\""],"fact":"The market began where Café du Monde now stands.","disputed":"\"Oldest\" is argued. Other markets also claim long histories, and counts depend on what you mean by \"public market.\"","claims":[{"t":"The French Market was dedicated as a market in 1791.","a":0,"why":"Wikipedia: part of the space was dedicated as a market in 1791."},{"t":"The French Market is the oldest public market in the United States.","a":1,"why":"Wikipedia says so, but other markets claim long histories, so the claim depends on definitions."}],"sources":[{"t":"Wikipedia: French Market","u":"https://en.wikipedia.org/wiki/French_Market"},{"t":"French Quarter: French Market","u":"https://www.frenchquarter.com/nola/french-market/5803"}],"card":{"a":"1791","b":"1930s","la":"Dedicated","lb":"WPA renovation"}}],"heroKey":"no_js_now"},"detroit":{"id":"detroit","name":"Detroit","explorer":"Motor City Explorer","initials":"DET","ranks":[[0,"Visitor"],[100,"Woodward Walker"],[250,"Landmark Hunter"],[450,"Motor City Scholar"],[600,"Detroit Historian"]],"heroAlt":"The Fisher Building tower","heroLi":"<li>Header: Michael Barera · CC BY-SA 4.0 · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:Detroit_December_2021_12_(Fisher_Building).jpg\">Source</a> · resized</li>","heroCredit":"Photo: Michael Barera · <a target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by-sa/4.0/\">CC BY-SA 4.0</a> · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:Detroit_December_2021_12_(Fisher_Building).jpg\">Source</a>","mission":"Find four landmarks around Detroit. At each one, check in to earn its badge, unlock its story, and collect a Time Card. Do them in any order. Everything stays on this phone.","afterDone":"All four badges earned. The rest of Detroit is waiting.","safetyNote":"<li>Downtown Detroit is spread out. Stay on busy, well-lit streets, watch for traffic and the QLine streetcar, and keep your belongings close.</li>","badgeMap":{"dia":["de_di_now","60% 40%"],"michigancentral":["de_mc_now","50% 40%"],"fisher":["de_fb_now","50% 45%"],"campus":["de_cm_now","50% 45%"]},"level":"Classics","region":"The Midwest","stops":[{"id":"fisher","name":"Fisher Building","short":"Fisher Building","badge":"Fisher Building","tag":"Stop 1 of 4","teaser":"A 30-story art deco tower with a roof that glows gold at night.","map":"Fisher Building, 3011 W Grand Blvd, Detroit, MI","clue":"Go to the New Center area, north of downtown, and find the tall tower with the green roof on West Grand Boulevard.","safety":"West Grand Boulevard is busy. Use crosswalks. Respect the building's lobby hours and rules.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"Count the floors up the tower. About how many stories does the Fisher Building have?","options":["12","20","30","50"],"answer":2,"hint":"More than a couple of dozen, fewer than forty.","verify":"Wikipedia says 30 stories. Estimate from the street. Written from sources, not yet checked on site."},"then":{"yr":"1930s","label":"The tower then","line":"A postcard of the tower from the 1930s.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"de_fb_then","by":"Tichnor Brothers (publisher)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Fisher_Building,_West_Grand_Boulevard,_Detroit,_Mich_(65799).jpg","note":"resized"}},"now":{"yr":"Today","head":"Today","label":"The tower today","line":"The tower stands in New Center.","ph":{"k":"de_fb_now","by":"Michael Barera","lic":"CC BY-SA 4.0","lu":"https://creativecommons.org/licenses/by-sa/4.0/","page":"https://commons.wikimedia.org/wiki/File:Detroit_December_2021_12_(Fisher_Building).jpg","note":"resized"}},"story":["The Fisher Building was completed in 1928. Albert Kahn Associates designed it, with Joseph Nathaniel French as chief architect. It has 30 stories. The roof is 428 feet up and the spire reaches 444 feet.","The Fisher family paid for it with money from selling Fisher Body to General Motors. The three-story barrel-vaulted lobby uses forty kinds of marble and was decorated by the Hungarian artist Géza Maróti. Several sculptors worked on the outside, including Corrado Parducci.","The roof was first covered in gold-leaf tiles. They were covered with asphalt during World War II and replaced with green tiles. Since the 1980s, colored lights have made the green tiles look gold at night. It became a National Historic Landmark on June 29, 1989."],"fact":"The lobby uses forty kinds of marble.","disputed":"\"Detroit's largest art object\" is a nickname that the Detroit News used. Wikipedia treats it as a quote, not a measured fact.","claims":[{"t":"The Fisher Building was completed in 1928.","a":0,"why":"Wikipedia: completed in 1928."},{"t":"The Fisher Building's roof has always been green.","a":2,"why":"It was gold-leaf tiles at first, then green after World War II. The lights make it look gold at night."}],"sources":[{"t":"Wikipedia: Fisher Building","u":"https://en.wikipedia.org/wiki/Fisher_Building"},{"t":"Wikipedia: Albert Kahn (architect)","u":"https://en.wikipedia.org/wiki/Albert_Kahn_(architect)"}],"card":{"a":"1928","b":"1989","la":"Completed","lb":"Landmark status"}},{"id":"campus","name":"Campus Martius Park","short":"Campus Martius","badge":"Campus Martius","tag":"Stop 2 of 4","teaser":"The spot where every Detroit road number begins.","map":"Campus Martius Park, 800 Woodward Ave, Detroit, MI","clue":"Go to the downtown park around Woodward Avenue. Look for a medallion set into the stone walkway near the fountain.","safety":"Woodward Avenue is busy. Use crosswalks. In winter the ice rink gets crowded.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"Find the Point of Origin medallion in the walkway. What does it mark the start of?","options":["Detroit's first church","Detroit's coordinate system","A river ferry","The city wall"],"answer":1,"hint":"Think of Eight Mile Road.","verify":"Wikipedia says Detroit's coordinate system starts at the medallion. Confirm on site. Written from sources, not yet checked on site."},"then":{"yr":"1907","label":"The square then","line":"Campus Martius on a postcard from 1907.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"de_cm_then","by":"Unknown (postcard, uploaded by Dave Parker)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:CampusMartius1907.JPG","note":"resized"}},"now":{"yr":"Today","head":"Today","label":"The park today","line":"The park is the center of downtown.","ph":{"k":"de_cm_now","by":"Michael Barera","lic":"CC BY-SA 4.0","lu":"https://creativecommons.org/licenses/by-sa/4.0/","page":"https://commons.wikimedia.org/wiki/File:Detroit_December_2015_22_(Campus_Martius_Park).jpg","note":"resized"}},"story":["After the Great Fire of 1805, Judge Augustus Woodward planned the rebuilding of Detroit around Campus Martius. It is named for the main square in Marietta, Ohio, the first capital of the Northwest Territory. The name is Latin for Field of Mars.","Detroit's coordinate system starts here, marked by a medallion in the stone walkway. Seven Mile Road is seven miles north, Eight Mile Road is eight miles north, and so on.","The new park was dedicated on November 19, 2004. It has a seasonal ice rink designed to look like Rockefeller Center's rink, but larger. A Civil War-era monument stands on Campus Martius."],"fact":"Seven Mile and Eight Mile Roads are named for their distance from here.","disputed":"Wikipedia lists the park as created in 1850 and 2004 without explaining 1850. Treat any single founding year with caution.","claims":[{"t":"Detroit's coordinate system starts at Campus Martius.","a":0,"why":"Wikipedia: the Point of Origin medallion marks the start."},{"t":"Eight Mile Road is named for its distance to Lake Michigan.","a":2,"why":"It is eight miles north of the Point of Origin."}],"sources":[{"t":"Wikipedia: Campus Martius Park","u":"https://en.wikipedia.org/wiki/Campus_Martius_Park"},{"t":"Detroit Historical Society: Campus Martius Park","u":"https://detroithistorical.org/learn/encyclopedia-of-detroit/campus-martius-park"}],"card":{"a":"1805","b":"2004","la":"Rebuilding plan","lb":"Park dedicated"}},{"id":"dia","name":"Detroit Institute of Arts","short":"DIA","badge":"DIA","tag":"Stop 3 of 4","teaser":"A whole room painted by a famous muralist, and a priest-approved scandal.","map":"Detroit Institute of Arts, 5200 Woodward Ave, Detroit, MI","clue":"Go to the museum on Woodward Avenue. Inside, ask for the Rivera Court, the room covered in giant industrial murals.","safety":"Museum rules apply: do not touch the walls, and check hours and admission before you go.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"In the Rivera Court, the murals cover the walls of the room. How many walls have painted panels?","options":["4","1","2","3"],"answer":0,"hint":"Look all around the room.","verify":"Wikipedia says the 27 panels surround the room on all four walls. Count the walls on site. Written from sources, not yet checked on site."},"then":{"yr":"1932","label":"The mural","line":"One wall of the Detroit Industry mural, painted in 1932 and 1933.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"de_di_then","by":"Cactus.man (photo of a 1932-33 mural by Diego Rivera)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Rivera_detroit_industry_north.jpg","note":"resized"}},"now":{"yr":"2017","head":"Today","label":"The Rivera Court today","line":"Visitors in the Rivera Court under the glass roof, with the murals behind them. Photo from 2017.","ph":{"k":"de_di_now","by":"Timsox6","lic":"CC BY-SA 4.0","lu":"https://creativecommons.org/licenses/by-sa/4.0/","page":"https://commons.wikimedia.org/wiki/File:Detroit_Industrial_Murals.jpg","note":"resized"}},"story":["Diego Rivera, the Mexican muralist, painted the Detroit Industry murals in fresco in 1932 and 1933. They cover 27 panels on four walls of the Rivera Court at the Detroit Institute of Arts.","The museum director, Wilhelm Valentiner, brought Rivera in, and Edsel Ford contributed $20,000 to make the commission possible. Rivera was a controversial choice because he followed Marxist philosophy.","In 1933 some clergy and newspapers attacked the murals. The target was a panel showing a Christ-like child being vaccinated. Some demanded its destruction, but Edsel Ford and Valentiner refused. The murals became a National Historic Landmark in April 2014."],"fact":"The murals took painters about a year to finish.","disputed":"Many people say Edsel Ford commissioned the murals. Wikipedia says the museum director commissioned them and Ford helped pay.","claims":[{"t":"Diego Rivera painted the Detroit Industry murals in 1932 and 1933.","a":0,"why":"Wikipedia gives the dates 1932 to 1933."},{"t":"The murals were destroyed after the 1933 complaints.","a":2,"why":"Ford and Valentiner refused to destroy the panel, and the murals are still there."}],"sources":[{"t":"Wikipedia: Detroit Industry Murals","u":"https://en.wikipedia.org/wiki/Detroit_Industry_Murals"},{"t":"Wikipedia: Detroit Institute of Arts","u":"https://en.wikipedia.org/wiki/Detroit_Institute_of_Arts"}],"card":{"a":"1932","b":"2014","la":"Painted","lb":"Landmark status"}},{"id":"michigancentral","name":"Michigan Central Station","short":"Central Station","badge":"Central Station","tag":"Stop 4 of 4","teaser":"A skyscraper train station that sat empty for 30 years, then came back.","map":"Michigan Central Station, 2001 15th St, Detroit, MI","clue":"Go to Corktown, southwest of downtown, and look for the tall tower with rows of big windows beside the old rail yard.","safety":"Be respectful of the active campus. View from public sidewalks, watch traffic and do not enter closed areas.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"The station has a tower of offices above the main hall. About how many stories is it?","options":["10","14","30","18"],"answer":3,"hint":"More than a dozen, fewer than twenty.","verify":"The tower is 18 stories according to Bridge Michigan. Estimate from the street. Written from sources, not yet checked on site."},"then":{"yr":"2013","label":"Vacant","line":"The empty station in 2013, before the restoration.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"de_mc_then","by":"Bartosz Brzezinski","lic":"CC BY 2.0","lu":"https://creativecommons.org/licenses/by/2.0/","page":"https://commons.wikimedia.org/wiki/File:Michigan_Central_Station,_Detroit_(2013).jpg","note":"resized"}},"now":{"yr":"2024","head":"Today","label":"The station today","line":"The restored station and tower in 2024.","ph":{"k":"de_mc_now","by":"Coreyfein01","lic":"CC BY-SA 4.0","lu":"https://creativecommons.org/licenses/by-sa/4.0/","page":"https://commons.wikimedia.org/wiki/File:MichiganCentral2024.jpg","note":"resized"}},"story":["Michigan Central Station opened in December 1913. Warren & Wetmore and Reed & Stem designed it. Allen Stem of Reed & Stem also helped design New York's Grand Central. The tower is 18 stories with more than 500 offices.","The last train left in 1988. After that the building sat vacant for about 30 years.","Ford bought it from the Moroun family in 2018 and reopened the station in June 2024 as part of a campus project that cost $950 million."],"fact":"Allen Stem also designed Grand Central.","disputed":"Some stories call it a sad ruin forever. It was reopened, so be careful with old photos that show the empty building.","claims":[{"t":"Michigan Central Station reopened in 2024.","a":0,"why":"Bridge Michigan: reopened in June 2024."},{"t":"The station has been in continuous use since 1913.","a":2,"why":"The last train left in 1988 and the building sat vacant for about 30 years."}],"sources":[{"t":"Bridge Michigan: Michigan Central Station","u":"https://bridgemi.com/business-watch/after-photos-show-transformation-michigan-central-station-detroit/"},{"t":"Atlas Obscura: Michigan Central Station","u":"https://www.atlasobscura.com/places/michigan-central-station"}],"card":{"a":"1913","b":"2024","la":"Opened","lb":"Reopened"}}],"heroKey":"de_fb_now"},"minneapolis":{"id":"minneapolis","name":"Minneapolis","explorer":"Mill City Explorer","initials":"MSP","ranks":[[0,"Visitor"],[100,"River Walker"],[250,"Landmark Hunter"],[450,"Mill City Scholar"],[600,"Minneapolis Historian"]],"heroAlt":"The Stone Arch Bridge over the Mississippi","heroLi":"<li>Header: Jim Cadwell · CC BY-SA 2.0 · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:Stone_Arch_Bridge,_Minneapolis_2012.jpg\">Source</a> · resized</li>","heroCredit":"Photo: Jim Cadwell · <a target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by-sa/2.0/\">CC BY-SA 2.0</a> · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:Stone_Arch_Bridge,_Minneapolis_2012.jpg\">Source</a>","mission":"Find four landmarks around Minneapolis. At each one, check in to earn its badge, unlock its story, and collect a Time Card. Do them in any order. Everything stays on this phone.","afterDone":"All four badges earned. The rest of Minneapolis is waiting.","safetyNote":"<li>Stay on trails and bridges near the river, keep back from the edges and the falls, and dress for the weather. Winters are very cold.</li>","badgeMap":{"stonearch":["mn_sa_now","70% 40%"],"millcity":["mn_mc_now","40% 50%"],"stanthony":["mn_sf_now","50% 45%"],"basilica":["mn_bs_now","50% 45%"]},"level":"Classics","region":"The Midwest","stops":[{"id":"stonearch","name":"Stone Arch Bridge","short":"Stone Arch","badge":"Stone Arch","tag":"Stop 1 of 4","teaser":"A curved railroad bridge now just for walking and biking.","map":"Stone Arch Bridge, Minneapolis, MN","clue":"Walk to the old railroad bridge that curves across the Mississippi River next to Saint Anthony Falls.","safety":"The bridge is shared with bikes. Stay to the right, keep back from railings and watch your step.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"What is the bridge now used for, based on the signs and the people on it?","options":["Trains only","Cars","Walking and biking","Boats"],"answer":2,"hint":"Look at who is crossing.","verify":"Wikipedia says it became a bike and walking path in 1994. Confirm on site. Written from sources, not yet checked on site."},"then":{"yr":"about 1906","label":"The bridge then","line":"A postcard of the bridge and the mill district, around 1906.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"mn_sa_then","by":"Pamla J. Eisenberg (scan of an old postcard)","lic":"CC BY-SA 2.0","lu":"https://creativecommons.org/licenses/by-sa/2.0/","page":"https://commons.wikimedia.org/wiki/File:Stone_Arch_Bridge,_Minneapolis_1906_Post_Card.jpg","note":"resized"}},"now":{"yr":"2012","head":"Today","label":"The bridge today","line":"The curved stone arches over the Mississippi, with downtown behind. Photo from 2012.","ph":{"k":"mn_sa_now","by":"Jim Cadwell","lic":"CC BY-SA 2.0","lu":"https://creativecommons.org/licenses/by-sa/2.0/","page":"https://commons.wikimedia.org/wiki/File:Stone_Arch_Bridge,_Minneapolis_2012.jpg","note":"resized"}},"story":["James J. Hill built the bridge in 1882 and 1883 for his railroad, the St. Paul, Minneapolis and Manitoba, which became the Great Northern Railway. Charles C. Smith designed it.","It is about 2,100 feet long, with granite piers from Sauk Rapids and limestone upper sections. It carried trains to the Great Northern Depot.","The Minneapolis Park Board converted it to a bike and walking path in 1994. It was named a National Historic Civil Engineering Landmark in 1974."],"fact":"The bridge curves.","disputed":"Counts of its arches vary by source, since one span is steel. Treat any number you read as approximate.","claims":[{"t":"The Stone Arch Bridge was built in the 1880s.","a":0,"why":"Wikipedia: built 1882 to 1883."},{"t":"The Stone Arch Bridge was built for cars.","a":2,"why":"It was built as a railroad bridge."}],"sources":[{"t":"Wikipedia: Stone Arch Bridge (Minneapolis)","u":"https://en.wikipedia.org/wiki/Stone_Arch_Bridge_(Minneapolis)"},{"t":"Wikipedia: Saint Anthony Falls","u":"https://en.wikipedia.org/wiki/Saint_Anthony_Falls"}],"card":{"a":"1883","b":"1994","la":"Railroad bridge","lb":"Pedestrian path"}},{"id":"millcity","name":"Mill City Museum","short":"Mill City","badge":"Mill City","tag":"Stop 2 of 4","teaser":"The mill that blew up, and the ruins they built a museum inside.","map":"Mill City Museum, 704 S 2nd St, Minneapolis, MN","clue":"Find the museum built inside the ruins of a giant flour mill on the river, just west of the Stone Arch Bridge.","safety":"Museum hours and ticket rules apply. Stay on public paths and outside any fenced ruins.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"The museum rests inside what kind of old building?","options":["A brewery","A flour mill","A railroad depot","A sawmill"],"answer":1,"hint":"It is the reason for the city's nickname.","verify":"Wikipedia says it is in the ruins of the Washburn A Mill. Confirm on site. Written from sources, not yet checked on site."},"then":{"yr":"1878","label":"The mill burning","line":"A stereoview of the Washburn A Mill explosion in 1878.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"mn_mc_then","by":"Unknown photographer (stereoview of the 1878 mill)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Washburnamill.jpg","note":"resized"}},"now":{"yr":"2014","head":"Today","label":"The mill ruins today","line":"The Washburn A Mill ruins beside the silos. Photo from 2014.","ph":{"k":"mn_mc_now","by":"McGhiever","lic":"CC BY-SA 4.0","lu":"https://creativecommons.org/licenses/by-sa/4.0/","page":"https://commons.wikimedia.org/wiki/File:Washburn_A_Mill_2014.jpg","note":"resized"}},"story":["The Washburn A Mill was built in 1874 and was called the largest flour mill in the world. On May 2, 1878, airborne flour dust ignited. The explosion killed 14 workers instantly and four more died in the fire. Five other mills were destroyed.","Afterward, mills across the country added ventilation and other safety devices. William de la Barre designed a new Washburn A Mill, which opened in 1880 as the world's largest flour mill until 1881.","A fire in 1991 nearly destroyed the old mill. The Minnesota Historical Society opened the Mill City Museum in 2003, with a Flour Tower freight-elevator exhibit that feels like a working mill."],"fact":"The museum opened in 2003.","disputed":"The final death count is usually given as 18. Some counts treat the later deaths separately.","claims":[{"t":"Flour dust caused the 1878 mill explosion.","a":0,"why":"Wikipedia: airborne flour dust ignited."},{"t":"The Washburn A Mill was never rebuilt after 1878.","a":2,"why":"A new Washburn A Mill opened in 1880."}],"sources":[{"t":"Wikipedia: Mill City Museum","u":"https://en.wikipedia.org/wiki/Mill_City_Museum"},{"t":"Wikipedia: Great Mill Disaster","u":"https://en.wikipedia.org/wiki/Great_Mill_Disaster"}],"card":{"a":"1874","b":"2003","la":"Mill built","lb":"Museum opened"}},{"id":"stanthony","name":"Saint Anthony Falls","short":"St. Anthony Falls","badge":"St. Anthony Falls","tag":"Stop 3 of 4","teaser":"The only big waterfall on the Mississippi, and the reason there was a mill city.","map":"Saint Anthony Falls, Minneapolis, MN","clue":"Walk to the river just upstream of the Stone Arch Bridge, where the water drops over a wide apron beside the old mills.","safety":"Stay behind railings and on marked paths. Do not climb on the apron or lock walls. Wet stone is slippery.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"Read the signs at the falls. Who named them in 1680?","options":["Louis Hennepin","Zebulon Pike","James J. Hill","Henry Sibley"],"answer":0,"hint":"A priest and explorer who named them for his patron saint.","verify":"Wikipedia says Father Louis Hennepin named the falls in 1680. Confirm on a sign. Written from sources, not yet checked on site."},"then":{"yr":"1898","label":"The falls then","line":"A postcard of the falls and the Exposition Building, made after 1898.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"mn_sf_then","by":"Detroit Publishing Company","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:St._Anthony's_Falls_and_Exposition_Building,_Minneapolis,_Minn_(NYPL_b12647398-66728).tiff","note":"resized"}},"now":{"yr":"Today","head":"Today","label":"The falls today","line":"The falls drop over a wide apron beside the mill ruins.","ph":{"k":"mn_sf_now","by":"August Schwerdfeger","lic":"CC BY 4.0","lu":"https://creativecommons.org/licenses/by/4.0/","page":"https://commons.wikimedia.org/wiki/File:Upper_St._Anthony_Falls_2020-07-11.jpg","note":"resized"}},"story":["Saint Anthony Falls was the only natural major waterfall on the Mississippi River. Father Louis Hennepin named it in 1680 after St. Anthony of Padua. The Dakota name is Owámniyomni, meaning whirlpool.","The total drop is 49 feet. The natural falls were about 35 feet and the upper dam adds about 14. On October 5, 1869, the limestone cap was breached during a tunnel project, and a concrete dike finished in 1876 fixed the damage. An Army Corps of Engineers wooden apron went in around 1880 and was replaced with concrete after it was destroyed in 1952.","Water power ran flour and lumber mills, and Minneapolis was known as the Flour Milling Capital of the World from about 1880 to 1930. The locks were completed in 1963. The upper lock was permanently closed in 2015 to help stop the spread of Asian carp."],"fact":"The upper lock was closed in 2015 to stop Asian carp.","disputed":"Wikipedia says the falls was the only natural major waterfall, so some sources call it the only waterfall on the river. The natural falls no longer look natural, because the apron and dam changed them.","claims":[{"t":"Saint Anthony Falls was named in 1680.","a":0,"why":"Wikipedia: Father Louis Hennepin named it in 1680."},{"t":"The falls you see today are completely natural.","a":2,"why":"A concrete apron, dike and dam control the water."}],"sources":[{"t":"Wikipedia: Saint Anthony Falls","u":"https://en.wikipedia.org/wiki/Saint_Anthony_Falls"},{"t":"Wikipedia: Mill City Museum","u":"https://en.wikipedia.org/wiki/Mill_City_Museum"}],"card":{"a":"1680","b":"1963","la":"Named","lb":"Locks completed"}},{"id":"basilica","name":"Basilica of Saint Mary","short":"Basilica","badge":"Basilica","tag":"Stop 4 of 4","teaser":"America's first basilica, with a dome you can see from the highway.","map":"Basilica of Saint Mary, 1600 Hennepin Ave, Minneapolis, MN","clue":"Go to Hennepin Avenue near Loring Park and find the big domed church between 16th and 17th Streets.","safety":"It is an active church. Be quiet and respectful, check visiting hours, and use crosswalks on Hennepin.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"Step inside if it is open. How many large arched stained glass windows light the nave?","options":["3","4","6","5"],"answer":3,"hint":"Count the big arched windows along the nave.","verify":"Wikipedia says five large arched windows. Count on site. Written from sources, not yet checked on site."},"then":{"yr":"1907","label":"The groundbreaking","line":"The groundbreaking in 1907.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"mn_bs_then","by":"Unknown","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:St._Mary's_groundbreaking.jpg","note":"resized"}},"now":{"yr":"Today","head":"Today","label":"The basilica today","line":"The domed church stands on Hennepin Avenue.","ph":{"k":"mn_bs_now","by":"Switchroyale","lic":"CC BY-SA 4.0","lu":"https://creativecommons.org/licenses/by-sa/4.0/","page":"https://commons.wikimedia.org/wiki/File:Front_Entrance_to_the_Basilica_of_Saint_Mary.jpg","note":"resized"}},"story":["The Bas
