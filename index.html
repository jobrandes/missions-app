{"capitol":["px_cap_now","50% 45%"],"rosson":["px_ro_now","50% 45%"],"biltmore":["px_bi_now","50% 45%"],"falls":["px_af_now","50% 45%"]},"level":"Classics","region":"The Southwest","stops":[{"id":"capitol","name":"Arizona State Capitol","short":"Capitol","badge":"Capitol","tag":"Stop 1 of 4","teaser":"A small capitol building that ended up smaller than its architect dreamed.","map":"Arizona State Capitol Museum, 1700 W Washington St, Phoenix, AZ","clue":"Go to West Washington Street near 17th Avenue. Look for the stone building with a small dome on top, set back behind a lawn.","safety":"Washington Street is busy. Use crosswalks, stay on the paths, and check museum hours before you go inside.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"Which kind of tree stands on the capitol grounds?","options":["Pine","Oak","Maple","Palm"],"answer":3,"hint":"Think of a desert postcard, and a tree with a tall, bare trunk.","verify":"The photos show palm trees on the grounds. Check on site. Written from sources, not yet checked on site."},"then":{"yr":"1908","label":"The capitol then","line":"A panorama of the capitol, with palms and a dirt road, in 1908.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"px_cap_then","by":"Haines Photo Co.","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:CapitolBuilding.PhoenixAZ.1908.jpg","note":"resized, cropped"}},"now":{"yr":"Today","head":"Today","label":"The capitol today","line":"The old capitol, now a museum, with newer government buildings nearby.","ph":{"k":"px_cap_now","by":"David Jiang","lic":"CC BY-SA 4.0","lu":"https://creativecommons.org/licenses/by-sa/4.0/","page":"https://commons.wikimedia.org/wiki/File:Arizona_State_Capitol_Daytime_December_2021.jpg","note":"resized"}},"story":["The Arizona Territory's capital moved around: Prescott, Tucson, Prescott again, and finally Phoenix in 1889. To show the territory was ready for statehood, voters approved a $100,000 bond to build a real capitol.","Architect James Riely Gordon won a design contest. His original plan had wings for the legislature and a big dome, but money was short, so the wings were dropped and a small metal top was used. The capitol was finished in 1900.","Arizona became a state in 1912, and the building became the state capitol. Today the 1900 building is the Arizona Capitol Museum, and newer buildings behind it hold the legislature and the governor's offices."],"fact":"The capital moved around three times before landing here.","disputed":"Some people think Phoenix was always the capital. Wikipedia says the capital started in Prescott in 1864, then moved to Tucson, Prescott again, and Phoenix in 1889.","claims":[{"t":"The Arizona Territory's capital moved to Phoenix in 1889.","a":0,"why":"Wikipedia: the legislature voted on January 29, 1889."},{"t":"The capitol was built after Arizona became a state in 1912.","a":2,"why":"It was built in 1900 as the territorial capitol."}],"sources":[{"t":"Wikipedia: Arizona State Capitol","u":"https://en.wikipedia.org/wiki/Arizona_State_Capitol"},{"t":"Wikipedia: James Riely Gordon","u":"https://en.wikipedia.org/wiki/James_Riely_Gordon"}],"card":{"a":"1889","b":"1900","la":"Capital moves","lb":"Building finished"}},{"id":"rosson","name":"Rosson House","short":"Rosson House","badge":"Rosson House","tag":"Stop 2 of 4","teaser":"A bright Victorian house in the middle of a desert city, built by a mayor who quit.","map":"Rosson House Museum, 113 N 6th St, Phoenix, AZ","clue":"Go to Heritage Square downtown, at 6th and Monroe Streets. Look for a red brick Victorian house with a pointed corner tower.","safety":"Heritage Square is downtown, near busy streets. Use crosswalks, check museum hours, and stay on the paths.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"The house has a pointed tower on the corner. How many sides does the tower have?","options":["4","8","6","10"],"answer":1,"hint":"Walk around it and count the flat faces that go all the way round.","verify":"Wikipedia describes the tower as French and octagonal. Count the sides on site. Written from sources, not yet checked on site."},"then":{"yr":"1940","label":"The house then","line":"A survey photograph from 1940, taken from across the street.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"px_ro_then","by":"Delos H. Smith (Historic American Buildings Survey)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Historic_American_Buildings_Survey_Delos_H._Smith,_photographer_1940_-_Rosson_House,_139_North_Sixth_Street,_Phoenix,_Maricopa_County,_AZ_HABS_ARIZ,7-PHEN,5-1.tif","note":"resized, cropped"}},"now":{"yr":"Today","head":"Today","label":"The house today","line":"The restored house, now a museum in Heritage Square.","ph":{"k":"px_ro_now","by":"Greg O'Beirne","lic":"CC BY 2.5","lu":"https://creativecommons.org/licenses/by/2.5/","page":"https://commons.wikimedia.org/wiki/File:RossonHousePhoenix_gobeirne.jpg","note":"resized"}},"story":["Dr. Roland Lee Rosson was a doctor and a politician who came to Phoenix in 1879. His house was built between 1894 and 1895 in the Stick-Eastlake Queen Anne style, designed by San Francisco architect A. P. Petit. Petit died in the month it was finished.","Rosson was elected mayor of Phoenix on May 7, 1895, but after trouble with the city council he resigned on April 6, 1896. The house changed hands many times before the City of Phoenix bought it and restored it.","The house mixes styles from different cultures, including a Chinese moon gate, Italian hooded windows and a French octagonal turret. It was added to the National Register of Historic Places in 1971."],"fact":"Its architect died the month it was finished.","disputed":"Some sources say the design is unique. Wikipedia says nearly identical plans appear in an earlier house-plan book.","claims":[{"t":"Dr. Rosson was elected mayor of Phoenix in 1895.","a":0,"why":"Wikipedia: elected on May 7, 1895."},{"t":"Rosson served as mayor for ten years.","a":2,"why":"He resigned on April 6, 1896, less than a year later."}],"sources":[{"t":"Wikipedia: Rosson House","u":"https://en.wikipedia.org/wiki/Rosson_House"},{"t":"Wikipedia: Heritage Square (Phoenix)","u":"https://en.wikipedia.org/wiki/Heritage_and_Science_Park"}],"card":{"a":"1895","b":"1971","la":"Mayor elected","lb":"National Register"}},{"id":"biltmore","name":"Arizona Biltmore","short":"Biltmore","badge":"Biltmore","tag":"Stop 3 of 4","teaser":"A fancy resort made of patterned blocks, and a famous architect who didn't design it.","map":"Arizona Biltmore, 2400 E Missouri Ave, Phoenix, AZ","clue":"Go to 24th Street and Missouri Avenue, north of downtown near Camelback Road. Look for a resort made of patterned golden blocks.","safety":"The resort is private property. Look from public areas, ask staff before wandering, and watch for cars on the entrance road.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"The hotel's walls are made of patterned what?","options":["Concrete blocks","Wooden planks","Red brick","Glass panels"],"answer":0,"hint":"Look closely at the walls: they are repeating squares with designs pressed into them.","verify":"Wikipedia says the hotel used \"textile block\" construction, a system of patterned blocks. Look at the walls on site. Written from sources, not yet checked on site."},"then":{"yr":"Survey photo","label":"The pool then","line":"A survey photograph looking toward the main building from the pool area, with palms.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"px_bi_then","by":"Historic American Buildings Survey (U.S. government)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:View_to_main_hotel_building_from_pool_area_looking_west_-_Arizona_Biltmore,_Bathhouse_and_Cabanas,_Northeast_Corner,_Twenty-fourth_Street_and_Missouri_Avenue,_Phoenix,_Maricopa_HABS_ARIZ,7-PHEN,15-A-2.tif","note":"resized, cropped"}},"now":{"yr":"Today","head":"Today","label":"The hotel today","line":"The patterned block walls of the main building.","ph":{"k":"px_bi_now","by":"Aufaber","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Azbiltmore.jpg","note":"resized"}},"story":["The Arizona Biltmore opened on February 23, 1929. Brothers Warren and Charles McArthur built it with hotelier John McEntee Bowman. Three crews worked around the clock to finish it.","Many people say Frank Lloyd Wright designed it. Wikipedia says the architect was Albert Chase McArthur, who had been a draftsman for Wright. Wright consulted for four months in 1928 on the patterned \"textile block\" system.","Clark Gable and Carole Lombard often stayed here, and the Tequila sunrise was invented here. In 1930 the McArthurs lost control of the hotel, and chewing gum magnate William Wrigley Jr. later became the full owner."],"fact":"Three crews worked day and night to finish it.","disputed":"The big debate: Wright or McArthur. Wikipedia says McArthur is the architect, with original drawings and a 1929 article to prove it.","claims":[{"t":"The Arizona Biltmore opened in 1929.","a":0,"why":"Wikipedia: opened February 23, 1929."},{"t":"Frank Lloyd Wright was the hotel's architect of record.","a":2,"why":"Albert Chase McArthur was; Wright only consulted."}],"sources":[{"t":"Wikipedia: Arizona Biltmore Hotel","u":"https://en.wikipedia.org/wiki/Arizona_Biltmore_Hotel"},{"t":"Wikipedia: Albert Chase McArthur","u":"https://en.wikipedia.org/wiki/Albert_Chase_McArthur"}],"card":{"a":"1928","b":"1929","la":"Wright consults","lb":"Hotel opens"}},{"id":"falls","name":"Arizona Falls","short":"Arizona Falls","badge":"Arizona Falls","tag":"Stop 4 of 4","teaser":"A waterfall that wasn't natural, in a desert, that lit up a city.","map":"Arizona Falls, 56th St and Indian School Rd, Phoenix, AZ","clue":"Go to the Arizona Canal near 56th Street in the Arcadia neighborhood. Follow the canal path to the little park where water drops over a ledge.","safety":"Stay on the canal path and park paths, and watch for bikes. Do not climb on the walls or into the water. It gets very hot, so bring water.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"About how far does the water drop at the falls?","options":["5 feet","10 feet","20 feet","50 feet"],"answer":2,"hint":"It is taller than a person, but shorter than a tall tree.","verify":"Wikipedia says the canal crosses a natural 20-foot drop. Estimate on site. Written from sources, not yet checked on site."},"then":{"yr":"Survey photo","label":"The power plant then","line":"A survey photo of the old power plant at Arizona Falls, looking east.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"px_af_then","by":"Historic American Engineering Record (U.S. government)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:VIEW_OF_ARIZONA_FALLS_POWER_PLANT,_LOOKING_EAST_Photographer-_unknown._No_date_-_Arizona_Canal,_North_of_Salt_River,_Phoenix,_Maricopa_County,_AZ_HAER_ARIZ,7-PHEN.V,1-12.tif","note":"resized, cropped"}},"now":{"yr":"2013","head":"Today","label":"The falls today","line":"The rebuilt waterfall and park, photographed in 2013.","ph":{"k":"px_af_now","by":"Patrick Finnegan","lic":"CC BY 2.0","lu":"https://creativecommons.org/licenses/by/2.0/","page":"https://commons.wikimedia.org/wiki/File:Arizona_Falls,_Phoenix,_AZ.jpg","note":"resized"}},"story":["In 1883, workers began digging the Arizona Canal to bring water to farms in the Valley. In 1884 they hit hard rock at a natural drop of about 20 feet. They left it in place and let the water pour over it, making a waterfall in the desert.","The falls became a popular spot. The mist cooled the air, trees gave shade, and families from Phoenix and Tempe came for picnics. In 1901 and 1902 the Phoenix Light and Fuel Company built a power plant here to provide the first electricity to Phoenix.","After about 50 years of making power, the site was neglected. In the early 2000s it was rebuilt as a public-art project and a working power station that makes enough electricity for about 150 homes. The modern park opened in 2003."],"fact":"The falls was made by a canal, not a river.","disputed":"Many people assume the falls is natural. Wikipedia says it formed when a man-made canal crossed a natural drop.","claims":[{"t":"The first power plant here opened around 1901 and 1902.","a":0,"why":"Wikipedia: built in 1901 and 1902."},{"t":"The waterfall is on a natural river.","a":2,"why":"It formed where the man-made Arizona Canal crosses a natural drop."}],"sources":[{"t":"Wikipedia: Arizona Falls","u":"https://en.wikipedia.org/wiki/Arizona_Falls"},{"t":"Wikipedia: Salt River Project","u":"https://en.wikipedia.org/wiki/Salt_River_Project"}],"card":{"a":"1884","b":"2003","la":"Falls formed","lb":"Modern park opens"}}],"heroKey":"px_cap_now"},"albuquerque":{"id":"albuquerque","name":"Albuquerque","explorer":"Duke City Explorer","initials":"ABQ","ranks":[[0,"Visitor"],[100,"Old Town Walker"],[250,"Landmark Hunter"],[450,"Albuquerque Scholar"],[600,"Albuquerque Historian"]],"heroAlt":"The San Felipe de Neri Church in Albuquerque Old Town","heroLi":"<li>Header: Don McCulley · CC0 · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:San_Felipe_de_Neri_Church_IMG_5545.jpg\">Source</a> · resized</li>","heroCredit":"Photo: Don McCulley · <a target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/publicdomain/zero/1.0/\">CC0</a> · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:San_Felipe_de_Neri_Church_IMG_5545.jpg\">Source</a>","mission":"Find four landmarks around Albuquerque. At each one, check in to earn its badge, unlock its story, and collect a Time Card. Do them in any order. Everything stays on this phone.","afterDone":"All four badges earned. The rest of Albuquerque is waiting.","safetyNote":"<li>Albuquerque is high and dry. Bring water, wear sunscreen, use crosswalks on busy Central Avenue, and stay out of fenced-off rail yard areas.</li>","badgeMap":{"felipe":["ab_sf_now","50% 45%"],"alvarado":["ab_av_now","50% 45%"],"kimo":["ab_km_now","50% 45%"],"shops":["ab_ry_now","50% 45%"]},"level":"Classics","region":"The Southwest","stops":[{"id":"felipe","name":"San Felipe de Neri Church","short":"San Felipe","badge":"San Felipe","tag":"Stop 1 of 4","teaser":"A church that collapsed, got rebuilt in 1793, and has been in use ever since.","map":"San Felipe de Neri Church, 2005 N Plaza St NW, Albuquerque, NM","clue":"Go to Old Town and find the Plaza. On its north side, look for a church with a pair of pointed towers.","safety":"Old Town has narrow streets and lots of foot traffic. Use crosswalks, and be quiet if you step inside, since it is a place of worship.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"How many bell towers does the front of the church have?","options":["3","2","4","1"],"answer":1,"hint":"Look at the front from across the Plaza.","verify":"Wikipedia says Victorian-era changes added bell towers. Count them on site. Written from sources, not yet checked on site."},"then":{"yr":"After 1898","label":"The church then","line":"A postcard of the church with its two towers, soon after 1898.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"ab_sf_then","by":"Detroit Publishing Company (scan by NYPL)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Church_of_San_Felipo,_Albuquerque,_N._M_(NYPL_b12647398-62496).tiff","note":"resized"}},"now":{"yr":"2018","head":"Today","label":"The church today","line":"The church on the Plaza, with Old Town shops around it.","ph":{"k":"ab_sf_now","by":"Don McCulley","lic":"CC0","lu":"https://creativecommons.org/publicdomain/zero/1.0/","page":"https://commons.wikimedia.org/wiki/File:San_Felipe_de_Neri_Church_IMG_5545.jpg","note":"resized"}},"story":["The church was founded in 1706 by Fray Manuel Moreno, one of the original settlers of Albuquerque. It was first dedicated to Saint Francis Xavier, but the Viceroy changed the patron saint to Saint Philip Neri in July 1706 to honor King Philip V.","The first church fell down in the winter of 1792 to 1793. The governor called the collapse a disgrace and ordered everyone nearby to help build a new one. Construction on the second church began in 1793.","Under Bishop Jean-Baptiste Lamy in the Victorian era, the church was remodeled with Gothic Revival bell towers and a pitched roof. It is the only building in Old Town proven to date to the Spanish colonial period, and it has been in use for over 200 years."],"fact":"The first church fell down, and the town rebuilt it.","disputed":"Many people think the whole church is a single colonial building. Wikipedia says the Gothic bell towers and roof were added later, in the Victorian era.","claims":[{"t":"The current church was begun in 1793.","a":0,"why":"Wikipedia: the new church was begun in 1793."},{"t":"The first church from 1706 is the one still standing.","a":2,"why":"The first church collapsed in the winter of 1792 to 1793."}],"sources":[{"t":"Wikipedia: San Felipe de Neri Church","u":"https://en.wikipedia.org/wiki/San_Felipe_de_Neri_Church"},{"t":"Wikipedia: Old Town Albuquerque","u":"https://en.wikipedia.org/wiki/Old_Town_Albuquerque"}],"card":{"a":"1706","b":"1793","la":"First church","lb":"Second church"}},{"id":"alvarado","name":"Alvarado Hotel site","short":"Alvarado","badge":"Alvarado","tag":"Stop 2 of 4","teaser":"The biggest Harvey House hotel ever, torn down in 1970.","map":"Alvarado Transportation Center, 100 1st St SW, Albuquerque, NM","clue":"Go to First Street downtown, by the train platforms. Look for the red-roofed station building with a tall tower.","safety":"This is a working train and bus center. Stay on public walkways, keep clear of the tracks, and watch for buses.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"What kind of vehicles use the center that stands on the hotel's old site?","options":["Ferries","Cable cars","Trains","Airplanes"],"answer":2,"hint":"Look beside the building and notice the rails.","verify":"Wikipedia says the Alvarado Transportation Center opened in 2002 on the hotel site. Look at the platforms on site. Written from sources, not yet checked on site."},"then":{"yr":"Survey photo","label":"The arcade then","line":"A survey photograph of the covered arcade that led from the train platform to the hotel.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"ab_av_then","by":"Fred Mang (Historic American Buildings Survey)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:EAST_FRONT,_ENTRANCE_FROM_STATION_PLATFORM_TO_ARCADE_WHICH_LEADS_AROUND_CENTRAL_PATIO_TO_HOTEL_-_Alvarado_Hotel,_First_Street,_Albuquerque,_Bernalillo_County,_NM_HABS_NM,1-ALBU,5-4.tif","note":"resized, cropped"}},"now":{"yr":"2007","head":"Today","label":"The site today","line":"The Alvarado Transportation Center, built where the hotel stood.","ph":{"k":"ab_av_now","by":"Asaavedra32","lic":"CC BY-SA 3.0","lu":"https://creativecommons.org/licenses/by-sa/3.0/","page":"https://commons.wikimedia.org/wiki/File:Albuquerque_NM_Alvarado_Transportation_Center.jpg","note":"resized"}},"story":["The Alvarado Hotel was built in 1901 and 1902 by the Santa Fe Railway and opened on May 10, 1902. The Fred Harvey Company ran it. Charles Frederick Whittlesey designed it in the Mission Revival style, and he also designed El Tovar at the Grand Canyon.","In 1922 it was remodeled and expanded to 120 rooms, with interiors redone by architect Mary Colter. It was then the largest of all the Harvey hotels, and for many travelers it was their first look at the American Southwest.","The railroad tore it down in 1970. A preservationist called it the most serious loss of a landmark the city had suffered, and it helped rally support for saving old buildings. The Alvarado Transportation Center opened on the site in 2002."],"fact":"It was the biggest Harvey House ever built.","disputed":"The Alvarado Transportation Center is named for the lost hotel, but the hotel itself is gone. Wikipedia says the center stands on its site.","claims":[{"t":"The Alvarado Hotel opened in 1902.","a":0,"why":"Wikipedia: it opened on May 10, 1902."},{"t":"The Alvarado Hotel is still standing.","a":2,"why":"The railroad demolished it in 1970."}],"sources":[{"t":"Wikipedia: Alvarado Hotel","u":"https://en.wikipedia.org/wiki/Alvarado_Hotel"},{"t":"Wikipedia: Fred Harvey Company","u":"https://en.wikipedia.org/wiki/Fred_Harvey_Company"}],"card":{"a":"1902","b":"1970","la":"Opened","lb":"Demolished"}},{"id":"kimo","name":"KiMo Theatre","short":"KiMo","badge":"KiMo","tag":"Stop 3 of 4","teaser":"A movie palace named in a contest, and designed to look like a pueblo.","map":"KiMo Theatre, 423 Central Ave NW, Albuquerque, NM","clue":"Go to Central Avenue at 5th Street downtown. Look for the cream-colored building with colorful decorations and a tall red neon sign.","safety":"Central Avenue is busy. Use crosswalks, check box office hours, and keep off the street when taking photos.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"A row of decorated terra cotta shields sits above the windows of which floor?","options":["Third","First","Second","Fourth"],"answer":0,"hint":"Look at the very top row of windows.","verify":"Wikipedia says a row of terra cotta shields runs above the third-floor windows. Check on site. Written from sources, not yet checked on site."},"then":{"yr":"1979","label":"The theater in 1979","line":"The KiMo in 1979, with its marquee, before the later restoration.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"ab_km_then","by":"John Margolies","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Kimo_Theater,_Albuquerque,_New_Mexico_LCCN2017708024.tif","note":"resized, cropped"}},"now":{"yr":"2012","head":"Today","label":"The theater today","line":"The restored front, with its neon sign and blue windows.","ph":{"k":"ab_km_now","by":"Asaavedra32","lic":"CC BY-SA 3.0","lu":"https://creativecommons.org/licenses/by-sa/3.0/","page":"https://commons.wikimedia.org/wiki/File:Facade_of_KIMO_2012.JPG","note":"resized"}},"story":["The KiMo opened on September 19, 1927, in a style called Pueblo Deco, a blend of Pueblo Revival and Art Deco. The Boller Brothers architecture firm designed it, after studying Southwest cultures and building styles.","The Albuquerque Journal held a naming contest with a $50 prize. The name had to be Indian and could not have more than six letters. Pablo Abeita, a former governor of Isleta Pueblo, won with \"Kimo\", which means mountain lion.","The theater closed in 1970 and a fire damaged it by 1977. The family sold it to the city, which saved it and restored it. A replica of the original neon sign, 24 feet tall, went up in June 2011."],"fact":"The theater's name came from a contest.","disputed":"Some people say Kimo means \"king of the beasts\". Wikipedia says it means mountain lion, sometimes loosely translated that way.","claims":[{"t":"The KiMo opened in 1927.","a":0,"why":"Wikipedia: opened September 19, 1927."},{"t":"The architect named the theater himself.","a":2,"why":"Pablo Abeita won a newspaper naming contest."}],"sources":[{"t":"Wikipedia: KiMo Theater","u":"https://en.wikipedia.org/wiki/KiMo_Theater"},{"t":"Wikipedia: Boller Brothers","u":"https://en.wikipedia.org/wiki/Boller_Brothers"}],"card":{"a":"1927","b":"2011","la":"Opened","lb":"Neon sign replica"}},{"id":"shops","name":"Santa Fe Railway Shops","short":"Rail Shops","badge":"Rail Shops","tag":"Stop 4 of 4","teaser":"A railroad workshop so big that it was Albuquerque's biggest employer.","map":"Albuquerque Rail Yards, 777 1st St SW, Albuquerque, NM","clue":"Go south of downtown to the Barelas neighborhood. Look for a huge old industrial building with tall glass walls.","safety":"Much of the rail yard is private or closed. View from public streets, and do not enter fenced areas.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"The huge machine shop's long north and south faces are mostly made of what?","options":["Brick","Wood","Adobe","Glass"],"answer":3,"hint":"Light poured in from all sides for the workers.","verify":"Wikipedia says the shop has uninterrupted glass walls on its north and south faces. Check on site. Written from sources, not yet checked on site."},"then":{"yr":"1943","label":"The railyard then","line":"Jack Delano photographed the Santa Fe Railway's tie plant in Albuquerque in March 1943.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"ab_ry_then","by":"Jack Delano (Farm Security Administration)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:At_the_Santa_Fe_R.R._tie_plant,_Albuquerque1a34734v.jpg","note":"resized, cropped"}},"now":{"yr":"2005","head":"Today","label":"The shop today","line":"A 2005 survey photo of the transfer table and machine shop.","ph":{"k":"ab_ry_now","by":"Jet Lowe (Historic American Engineering Record)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Looking_southwest_at_dual-track_transfer_table,_with_Machine_Shop_(Bldg._163)_in_background_-_Atchison,_Topeka,_Santa_Fe_Railroad,_Albuquerque_Shops,_908_Second_Street,_Southwest,_HAER_NM-12-5.tif","note":"resized, cropped"}},"story":["The Santa Fe Railway built shops in Albuquerque in the 1880s. The buildings that remain were put up between 1915 and 1925, and the shops became the city's biggest employer, with 970 workers in 1919 and a peak of 1,500 in the 1940s.","The main job was steam locomotive maintenance. Each locomotive needed a full rebuild every 12 to 18 months, and the shops finished about 40 overhauls a month at their peak.","The huge erection and machine shop was designed in 1920 and built in eight months, starting in February 1921. It covers about 165,000 square feet, with a main bay 604 feet long, 57 feet high and a crane that can lift 250 tons. Work declined in the 1950s as the railroad switched to diesel, and the shops later sat empty."],"fact":"The main bay is 604 feet long.","disputed":"Many people think railroad shops like these built diesel locomotives. Wikipedia says the Santa Fe moved diesel repair to other yards.","claims":[{"t":"The shops were once Albuquerque's largest employer.","a":0,"why":"Wikipedia: they were the largest employer in the city in their heyday."},{"t":"The shops mostly serviced diesel engines.","a":2,"why":"Their core work was steam locomotive maintenance."}],"sources":[{"t":"Wikipedia: Santa Fe Railway Shops (Albuquerque)","u":"https://en.wikipedia.org/wiki/Santa_Fe_Railway_Shops_(Albuquerque)"},{"t":"Wikipedia: Atchison, Topeka and Santa Fe Railway","u":"https://en.wikipedia.org/wiki/Atchison,_Topeka_and_Santa_Fe_Railway"}],"card":{"a":"1921","b":"1950s","la":"Machine shop built","lb":"Diesels arrive"}}],"heroKey":"ab_sf_now"},"tucson":{"id":"tucson","name":"Tucson","explorer":"Old Pueblo Explorer","initials":"TUC","ranks":[[0,"Visitor"],[100,"Desert Walker"],[250,"Landmark Hunter"],[450,"Tucson Scholar"],[600,"Tucson Historian"]],"heroAlt":"Mission San Xavier del Bac near Tucson","heroLi":"<li>Header: Philcomanforterie · CC BY-SA 4.0 · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:Mission_San_Xavier_del_Bac,_Tucson_AZ.jpg\">Source</a> · resized</li>","heroCredit":"Photo: Philcomanforterie · <a target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by-sa/4.0/\">CC BY-SA 4.0</a> · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:Mission_San_Xavier_del_Bac,_Tucson_AZ.jpg\">Source</a>","mission":"Find four landmarks around Tucson. At each one, check in to earn its badge, unlock its story, and collect a Time Card. Do them in any order. Everything stays on this phone.","afterDone":"All four badges earned. The rest of Tucson is waiting.","safetyNote":"<li>Tucson gets very hot. Go early or late in the day, bring water, wear sunscreen, and use crosswalks. The San Xavier mission is a working church, so be quiet and respectful.</li>","badgeMap":{"xavier":["tu_sx_now","50% 45%"],"depot":["tu_dp_now","50% 45%"],"courthouse":["tu_cc_now","50% 45%"],"oldmain":["tu_om_now","50% 45%"]},"level":"Classics","region":"The Southwest","stops":[{"id":"xavier","name":"Mission San Xavier del Bac","short":"San Xavier","badge":"San Xavier","tag":"Stop 1 of 4","teaser":"A bright white church in the desert, about 230 years old.","map":"Mission San Xavier del Bac, 1950 W San Xavier Rd, Tucson, AZ","clue":"Go about 10 miles south of downtown to the San Xavier Indian Reservation. Look for a bright church with two bell towers, standing alone in the desert.","safety":"The mission is an active church and place of pilgrimage. Check visiting hours, dress respectfully, be quiet, and ask before taking photos inside.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"What color is the mission's main building?","options":["White","Red","Blue","Black"],"answer":0,"hint":"Think of a desert bird that is also a symbol of peace.","verify":"Wikipedia calls it an outstanding example of Spanish Colonial architecture. Check the color on site. Written from sources, not yet checked on site."},"then":{"yr":"About 1902","label":"The mission then","line":"A color photochrom of the mission from about 1902.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"tu_sx_then","by":"Detroit Photographic Company (Smithsonian American Art Museum)","lic":"CC0","lu":"https://creativecommons.org/publicdomain/zero/1.0/","page":"https://commons.wikimedia.org/wiki/File:San_Xavier_Mission,_Tucson,_Arizona-saam_2004.29.38.jpg","note":"resized"}},"now":{"yr":"2018","head":"Today","label":"The mission today","line":"The white church with its two towers.","ph":{"k":"tu_sx_now","by":"Philcomanforterie","lic":"CC BY-SA 4.0","lu":"https://creativecommons.org/licenses/by-sa/4.0/","page":"https://commons.wikimedia.org/wiki/File:Mission_San_Xavier_del_Bac,_Tucson_AZ.jpg","note":"resized"}},"story":["Father Eusebio Kino, a Jesuit of Italian descent, founded the mission in 1692. It was named for Francis Xavier. The first church was built about two miles from today's site, and construction began on April 28, 1700. An Apache raid in 1770 destroyed the earlier church.","The present church was built between 1783 and 1797, which makes it the oldest European structure in Arizona. The O'odham people provided the labor.","The mission sits on the San Xavier Indian Reservation, in a settlement of the Sobaipuri O'odham. It is a pilgrimage site, with thousands visiting every year on foot and on horseback, and about 200,000 visitors a year in all."],"fact":"O'odham workers built the church.","disputed":"The mission is often called the oldest church in Arizona, but Wikipedia only says it is the oldest European structure in Arizona, and it was built between 1783 and 1797.","claims":[{"t":"Mission San Xavier del Bac was founded in 1692.","a":0,"why":"Wikipedia: founded in 1692 by Eusebio Kino."},{"t":"The present church was built in the 1900s.","a":2,"why":"It was built between 1783 and 1797."}],"sources":[{"t":"Wikipedia: Mission San Xavier del Bac","u":"https://en.wikipedia.org/wiki/Mission_San_Xavier_del_Bac"},{"t":"Wikipedia: Eusebio Kino","u":"https://en.wikipedia.org/wiki/Eusebio_Kino"}],"card":{"a":"1692","b":"1797","la":"Founded","lb":"Church finished"}},{"id":"depot","name":"Tucson Depot","short":"Depot","badge":"Depot","tag":"Stop 2 of 4","teaser":"A train depot that was restored to look like it did in 1941.","map":"Tucson Amtrak Station, 400 N Toole Ave, Tucson, AZ","clue":"Go to the downtown rail area at Toole Avenue. Look for a long, tan station building with a red tile roof.","safety":"Keep clear of the tracks, and watch for trains and the streetcar. Use crosswalks.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"What color are the roof tiles on the depot?","options":["Green","Blue","Gray","Red"],"answer":3,"hint":"Look at the roof and think of clay.","verify":"Wikipedia says the restored depot has red clay roof tiles. Check on site. Written from sources, not yet checked on site."},"then":{"yr":"1930s to 1940s","label":"The depot then","line":"A postcard of the depot, described as a beautiful Spanish-type depot.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"tu_dp_then","by":"Tichnor Brothers (Boston Public Library)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Beautiful_Spanish_type_Southern_Pacific_Depot,_Tucson,_Arizona_(73692).jpg","note":"resized"}},"now":{"yr":"2015","head":"Today","label":"The depot today","line":"A restored building beside the tracks at the depot.","ph":{"k":"tu_dp_now","by":"Tony the Marine","lic":"CC BY-SA 3.0","lu":"https://creativecommons.org/licenses/by-sa/3.0/","page":"https://commons.wikimedia.org/wiki/File:Tucson-Amtrak_Station-1907-1922-1.JPG","note":"resized"}},"story":["The Southern Pacific Railroad built the depot in 1907. Its architect, Daniel J. Patterson, also designed other depots in the era, including the station in San Antonio.","In 1998 the city bought the whole depot property from the Union Pacific Railroad, which had absorbed the Southern Pacific. Restoration was finished in 2004, bringing the main building and three others back to their 1941 Spanish Colonial Revival look.","The restored station has stuccoed brick walls, red clay roof tiles and colorful decorative tilework in the waiting room. The Southern Arizona Transportation Museum is in the old records vault, and the Old Pueblo Trolley reached the depot in 2009."],"fact":"It was restored to its 1941 look, not its 1907 look.","disputed":"Many people assume the depot looks the way it did when it was built. Wikipedia says it was restored to its 1941 modernized style.","claims":[{"t":"The Tucson depot was built in 1907.","a":0,"why":"Wikipedia: built in 1907 by the Southern Pacific."},{"t":"The Union Pacific built the depot.","a":2,"why":"The Southern Pacific built it. The Union Pacific absorbed the Southern Pacific later."}],"sources":[{"t":"Wikipedia: Tucson station","u":"https://en.wikipedia.org/wiki/Tucson_station"},{"t":"Wikipedia: Southern Pacific Railroad","u":"https://en.wikipedia.org/wiki/Southern_Pacific_Railroad"}],"card":{"a":"1907","b":"2004","la":"Built","lb":"Restored"}},{"id":"courthouse","name":"Pima County Courthouse","short":"Courthouse","badge":"Courthouse","tag":"Stop 3 of 4","teaser":"A courthouse with a tiled dome, now a visitor center.","map":"Pima County Courthouse, 115 N Church Ave, Tucson, AZ","clue":"Go downtown to the Presidio area on Church Avenue. Look for a big building with a round dome and arched walkways.","safety":"Downtown streets have light rail and traffic. Use crosswalks, and check hours before going in.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"The courthouse's big dome is covered in what?","options":["Plain concrete","Wood shingles","Colorful tiles","Grass"],"answer":2,"hint":"Look at the dome in the sunlight and notice how it shines.","verify":"The photos show a patterned dome. Check what it is made of on site. Written from sources, not yet checked on site."},"then":{"yr":"1930s to 1940s","label":"The courthouse then","line":"A postcard of the courthouse, with the Santa Catalina Mountains in the background.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"tu_cc_then","by":"Tichnor Brothers (Boston Public Library)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Pima_County_Court_House,_Tucson,_Arizona,_Santa_Catalina_Mountains_in_background-_portion_of_Old_City_of_Tucson_wall_in_foreground_(65323).jpg","note":"resized"}},"now":{"yr":"2003","head":"Today","label":"The courthouse today","line":"The domed courthouse, framed by palm trees.","ph":{"k":"tu_cc_now","by":"Gillfoto","lic":"CC BY-SA 3.0","lu":"https://creativecommons.org/licenses/by-sa/3.0/","page":"https://commons.wikimedia.org/wiki/File:Pima_County_Courthouse_10.JPG","note":"resized"}},"story":["Architect Roy Place designed the courthouse in 1928, in a blend of Mission Revival and Spanish Colonial Revival styles. It is listed on the National Register of Historic Places.","It housed the Pima County Superior Court from 1930 to 1977, and then the Pima County Consolidated Justice Court until 2015.","After the courts moved to newer buildings, the county planned to turn it into museum space. The University of Arizona Mineral Museum began moving in during 2020, and the building now holds the Southern Arizona Heritage and Visitor Center."],"fact":"It was a working courthouse for decades.","disputed":"Many people still call it the county courthouse. Wikipedia says the courts have moved out, and the building is now a visitor center.","claims":[{"t":"Roy Place designed the courthouse in 1928.","a":0,"why":"Wikipedia: designed by Roy Place in 1928."},{"t":"The courthouse still hosts trials today.","a":2,"why":"The courts moved out by 2015."}],"sources":[{"t":"Wikipedia: Pima County Courthouse","u":"https://en.wikipedia.org/wiki/Pima_County_Courthouse"},{"t":"Wikipedia: Roy Place","u":"https://en.wikipedia.org/wiki/Roy_Place"}],"card":{"a":"1928","b":"2015","la":"Designed","lb":"Courts move out"}},{"id":"oldmain","name":"Old Main, University of Arizona","short":"Old Main","badge":"Old Main","tag":"Stop 4 of 4","teaser":"The first building at a university that started with 32 students.","map":"Old Main, 1200 E University Blvd, Tucson, AZ","clue":"Go to the University of Arizona campus. Look for the brick building with two-story porches near the mall.","safety":"The campus has bikes and scooters. Stay on walkways, and check whether the building is open before you go in.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"What is Old Main mostly built from?","options":["Brick","Glass","Adobe","Logs"],"answer":0,"hint":"Look at the walls up close and think of fired clay.","verify":"The photos show a brick building. Check the walls on site. Written from sources, not yet checked on site."},"then":{"yr":"1938","label":"Old Main then","line":"A survey photo from January 1938, the year the city condemned the building.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"tu_om_then","by":"Frederick D. Nichols (Historic American Buildings Survey)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Historic_American_Buildings_Survey_Frederick_D._Nichols,_Photographer_January_1938_DETAIL_OF_WING._-_University_of_Arizona,_Old_Main,_University_of_Arizona_Campus,_Tucson,_HABS_ARIZ,10-TUCSO,14A-3.tif","note":"resized, cropped"}},"now":{"yr":"2015","head":"Today","label":"Old Main today","line":"The restored brick building with its two-story porches.","ph":{"k":"tu_om_now","by":"Tony the Marine","lic":"CC BY-SA 3.0","lu":"https://creativecommons.org/licenses/by-sa/3.0/","page":"https://commons.wikimedia.org/wiki/File:Tucson-Old_Main_University_of_Arizona_Building-1875.JPG","note":"resized"}},"story":["Construction began on October 27, 1887, and the money ran out before the roof was finished. Officials then discovered that federal loans were available for agricultural schools, so the building was renamed the School of Agriculture instead of the School of Mines.","Old Main opened for the first class on October 1, 1891. It held classrooms, a library, offices and dorms, and was the only building on campus. Six teachers taught 32 students.","The city condemned the building in 1938 because of neglect. The US Navy repaired it in 1942 for World War II, and it came back to campus use in 1945. A full renovation reopened it in 2014."],"fact":"The budget ran out before the roof was done.","disputed":"Many people assume Old Main was always meant to be a university hall. Wikipedia says it was planned as a School of Mines and renamed to get federal money.","claims":[{"t":"Old Main opened for classes in 1891.","a":0,"why":"Wikipedia: first class on October 1, 1891."},{"t":"Old Main was condemned in 1887.","a":2,"why":"Construction began in 1887. It was condemned in 1938."}],"sources":[{"t":"Wikipedia: Old Main, University of Arizona","u":"https://en.wikipedia.org/wiki/Old_Main,_University_of_Arizona"},{"t":"Wikipedia: University of Arizona","u":"https://en.wikipedia.org/wiki/University_of_Arizona"}],"card":{"a":"1887","b":"1891","la":"Construction begins","lb":"First class"}}],"heroKey":"tu_sx_now"},"pittsburgh":{"id":"pittsburgh","name":"Pittsburgh","explorer":"Steel City Explorer","initials":"PIT","ranks":[[0,"Visitor"],[100,"River Walker"],[250,"Landmark Hunter"],[450,"Pittsburgh Scholar"],[600,"Pittsburgh Historian"]],"heroAlt":"The Monongahela Incline climbing Mount Washington in Pittsburgh","heroLi":"<li>Header: Cbaile19 · CC0 · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:Monongahela_Incline,_2024-12-15.jpg\">Source</a> · resized</li>","heroCredit":"Photo: Cbaile19 · <a target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/publicdomain/zero/1.0/\">CC0</a> · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:Monongahela_Incline,_2024-12-15.jpg\">Source</a>","mission":"Find four landmarks around Pittsburgh. At each one, check in to earn its badge, unlock its story, and collect a Time Card. Do them in any order. Everything stays on this phone.","afterDone":"All four badges earned. The rest of Pittsburgh is waiting.","safetyNote":"<li>Pittsburgh is hilly and full of bridges and one-way streets. Use crosswalks, keep off bridge roadways, and mind the steep steps near the inclines.</li>","badgeMap":{"incline":["pg_mi_now","50% 45%"],"bridge":["pg_sb_now","50% 45%"],"courthouse":["pg_cc_now","50% 45%"],"blockhouse":["pg_bh_now","50% 45%"]},"level":"Classics","region":"The East","stops":[{"id":"incline","name":"Monongahela Incline","short":"Mon Incline","badge":"Mon Incline","tag":"Stop 1 of 4","teaser":"A tiny cable car that has hauled people up a cliff since 1870.","map":"Monongahela Incline lower station, Station Square, Pittsburgh, PA","clue":"Go to Station Square on the south bank of the Monongahela River, across from downtown. Look for a small brick station at the foot of the hillside, with tracks climbing steeply up it.","safety":"Cars run on a fixed schedule and fares apply. Stay on the platform, watch your step boarding, and use crosswalks near Carson Street.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"Which hill does the incline climb?","options":["Mount Olive","Mount Vernon","Mount Washington","Mount Hood"],"answer":2,"hint":"The hill was once nicknamed Coal Hill.","verify":"Wikipedia says the incline climbs Mount Washington. Look up at the hillside on site. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"1897","label":"The incline then","line":"The lower station and tracks of the Monongahela Incline, with the freight incline beside it, photographed in 1897.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"pg_mi_then","by":"Cassier's Magazine","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Monongahela_incline_and_freight_incline.jpg","note":"resized"}},"now":{"yr":"2024","head":"Today","label":"The incline today","line":"The red brick lower station, with the tracks running up the hillside.","ph":{"k":"pg_mi_now","by":"Cbaile19","lic":"CC0","lu":"https://creativecommons.org/publicdomain/zero/1.0/","page":"https://commons.wikimedia.org/wiki/File:Monongahela_Incline,_2024-12-15.jpg","note":"resized"}},"story":["The Monongahela Incline opened on May 28, 1870, and it was the first incline built for carrying passengers. German immigrants had crowded into Pittsburgh for factory jobs, and the only space left was on the steep hills. Prussian-born engineer John Endres designed it, with help from his daughter Caroline, one of the first women engineers in the United States.","On opening day, 944 fares were collected. On the second day, 4,174 people rode it. Each car carries 23 passengers up a track 635 feet long, climbing about 369 feet at a grade of roughly 35 degrees.","Steam power gave way to electricity in 1935. It is the oldest continuously operating funicular in the United States, and one of only two survivors of the 17 passenger inclines Pittsburgh once had. The other is the nearby Duquesne Incline."],"fact":"It was the first passenger incline in the city.","disputed":"Many people say the Duquesne Incline is the oldest. Wikipedia says the Monongahela Incline, from 1870, is the oldest continuously operating funicular in the US.","claims":[{"t":"The Monongahela Incline opened in 1870.","a":0,"why":"Wikipedia: opened May 28, 1870."},{"t":"Pittsburgh still has all 17 of its original passenger inclines.","a":2,"why":"Only two survive: the Monongahela and the Duquesne."}],"sources":[{"t":"Wikipedia: Monongahela Incline","u":"https://en.wikipedia.org/wiki/Monongahela_Incline"},{"t":"Wikipedia: Duquesne Incline","u":"https://en.wikipedia.org/wiki/Duquesne_Incline"}],"card":{"a":"1870","b":"1935","la":"Opened","lb":"Electric power"}},{"id":"bridge","name":"Smithfield Street Bridge","short":"Bridge","badge":"Bridge","tag":"Stop 2 of 4","teaser":"A bridge with lens-shaped steel arches that has carried traffic since 1883.","map":"Smithfield Street Bridge, Smithfield St at Fort Pitt Blvd, Pittsburgh, PA","clue":"Go to the Monongahela River at the bottom of Smithfield Street. Look for a long steel bridge with great curved arches.","safety":"The roadway is busy with cars and buses. Stay on the sidewalk, use crosswalks, and keep your phone away from the rail.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"What shape are the bridge's big steel trusses?","options":["Lens-shaped","Triangles","Squares","Spirals"],"answer":0,"hint":"Think of the glass in a magnifying glass.","verify":"Wikipedia calls it a lenticular truss bridge. Look at the curves from the riverbank on site. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"About 1907","label":"The bridge then","line":"A stereoview of the bridge from the river, with a train and smoke behind it.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"pg_sb_then","by":"William H. Wolf","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Smithfield_Street_Bridge_(200413.013B.WF).png","note":"resized, cropped"}},"now":{"yr":"2011","head":"Today","label":"The bridge today","line":"One of the bridge's end portals, lit up at night with streaks of traffic light.","ph":{"k":"pg_sb_now","by":"Jmblough","lic":"CC BY-SA 4.0","lu":"https://creativecommons.org/licenses/by-sa/4.0/","page":"https://commons.wikimedia.org/wiki/File:Smithfield_Street_Bridge_at_Night.jpg","note":"resized"}},"story":["The present bridge opened on March 19, 1883, and it was designed by Gustav Lindenthal, who later designed the Hell Gate Bridge in New York City. It is the third bridge on this spot. A wooden bridge from 1818 burned in the Great Fire of 1845, and a wire-rope suspension bridge by John Roebling came next.","The Lindenthal bridge reused the stone piers from Roebling's bridge. It was widened in 1889 and again in 1911, and it is the second-oldest steel bridge in the United States.","Streetcars crossed it until July 1985. It became a National Historic Landmark in 1976, after officials considered replacing it with a modern bridge."],"fact":"It is built on the piers of an earlier bridge.","disputed":"Many people think the first Pittsburgh bridges were steel. Wikipedia says the first bridge here was wooden, from 1818.","claims":[{"t":"The Smithfield Street Bridge opened in 1883.","a":0,"why":"Wikipedia: opened March 19, 1883."},{"t":"John Roebling designed the bridge that stands today.","a":2,"why":"Roebling built the earlier suspension bridge. Gustav Lindenthal designed the present one."}],"sources":[{"t":"Wikipedia: Smithfield Street Bridge","u":"https://en.wikipedia.org/wiki/Smithfield_Street_Bridge"},{"t":"Wikipedia: Gustav Lindenthal","u":"https://en.wikipedia.org/wiki/Gustav_Lindenthal"}],"card":{"a":"1883","b":"1976","la":"Opened","lb":"National Historic Landmark"}},{"id":"courthouse","name":"Allegheny County Courthouse","short":"Courthouse","badge":"Courthouse","tag":"Stop 3 of 4","teaser":"A stone castle of a courthouse that its architect called his greatest achievement.","map":"Allegheny County Courthouse, 436 Grant St, Pittsburgh, PA","clue":"Go downtown to Grant Street. Look for a huge dark stone building with round arches, a tall tower and a steep tiled roof.","safety":"Grant Street is busy with traffic and visitors. Use crosswalks, and note that this is a working courthouse with security at the door.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"What covers the courthouse's steep roof?","options":["Copper sheets","Clay tiles","Slate shingles","Straw"],"answer":1,"hint":"Think of what flowerpots are made from.","verify":"Wikipedia says the roof is covered in Ludowici clay tiles. Look up at the roof on site. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"Survey photo","label":"The courthouse then","line":"A survey photograph of the Grant Street front, looking from the north.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"pg_cc_then","by":"Historic American Buildings Survey","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:COURTHOUSE,_GRANT_STREET_FACADE,_FROM_THE_NORTH_-_Allegheny_County_Courthouse_and_Jail,_436_Grant_Street_(Courthouse),_420_Ross_Street_(Jail),_Pittsburgh,_Allegheny_County,_PA_HABS_PA,2-PITBU,29-1.tif","note":"resized"}},"now":{"yr":"2023","head":"Today","label":"The courthouse today","line":"The tower and tiled roof, seen from Grant Street with tall towers behind.","ph":{"k":"pg_cc_now","by":"w_lemay","lic":"CC BY-SA 2.0","lu":"https://creativecommons.org/licenses/by-sa/2.0/","page":"https://commons.wikimedia.org/wiki/File:Allegheny_County_Courthouse,_Grant_Street,_Pittsburgh,_PA.jpg","note":"resized"}},"story":["The earlier courthouse, a Greek Revival building finished in 1841, burned on May 7, 1882. The county held a design competition, and Boston architect Henry Hobson Richardson won it. The Norcross Brothers began construction, and the cornerstone was laid on October 13, 1884.","The building was completed in 1888. It is arranged around an open courtyard that lets light and air reach most of the building, with a five-story tower rising from the courtyard's open side. A covered walkway known as the Bridge of Sighs links it to the old jail.","It is one of the finest examples of Romanesque Revival architecture. Richardson called it his \"great achievement\", and it became a National Historic Landmark in 1976."],"fact":"The county held a contest to design it.","disputed":"Many people think the courthouse was always on Grant Street. Wikipedia says the first Allegheny County courthouse was a wooden building at Market Square, first used in 1794.","claims":[{"t":"Henry Hobson Richardson designed the courthouse.","a":0,"why":"Wikipedia: he won the design competition."},{"t":"The courthouse was built in the 1700s.","a":2,"why":"The current building was completed in 1888."}],"sources":[{"t":"Wikipedia: Allegheny County Courthouse and Jail","u":"https://en.wikipedia.org/wiki/Allegheny_County_Courthouse_and_Jail"},{"t":"Wikipedia: Henry Hobson Richardson","u":"https://en.wikipedia.org/wiki/Henry_Hobson_Richardson"}],"card":{"a":"1884","b":"1888","la":"Cornerstone","lb":"Completed"}},{"id":"blockhouse","name":"Fort Pitt Block House","short":"Block House","badge":"Block House","tag":"Stop 4 of 4","teaser":"A small fort building from 1764, the oldest standing structure in western Pennsylvania.","map":"Fort Pitt Block House, Point State Park, Pittsburgh, PA","clue":"Go to Point State Park at the tip of downtown, where the rivers meet. Look for a small old stone and brick building sitting alone on the grass.","safety":"The park is open and busy, with paths shared by walkers and bikes. Check opening hours before you go, and stay off the building's walls.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"In which park does the Block House stand?","options":["Schenley Park","Frick Park","Highland Park","Point State Park"],"answer":3,"hint":"Look for the place where the rivers meet.","verify":"Wikipedia says the Block House stands in Point State Park. Check the park signs on site. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"1963","label":"The Block House then","line":"A survey photograph from April 1963 of the front of the Block House, seen through a fence and a tree.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"pg_bh_then","by":"Jack Boucher (Historic American Buildings Survey)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Historic_American_Buildings_Survey,_April,_1963_SOUTHEAST_(FRONT)_ELEVATION._-_Fort_Pitt_Blockhouse,_25_Penn_Avenue,_Point_State_Historic_Park,_Pittsburgh,_Allegheny_County,_PA_HABS_PA,2-PITBU,20-1.tif","note":"resized, cropped"}},"now":{"yr":"2014","head":"Today","label":"The Block House today","line":"The small building on the lawn of Point State Park, with a flag behind it.","ph":{"k":"pg_bh_now","by":"Own work (Wikimedia Commons user)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Fort_Pitt_Blockhouse,_11_October_2014.jpg","note":"resized"}},"story":["The Block House was built in 1764 as a redoubt, a small defensive fort, for Fort Pitt. Henry Bouquet started building a few of them around the fort's outer walls, and this is the only one that survives.","After the army left, Isaac Craig turned it into a house in 1785. That saved it when Fort Pitt itself was torn down in 1792. In 1894, Mary Schenley gave the deed to the Daughters of the American Revolution.","In 1902, industrialist Henry Clay Frick bought all the land around it and offered the Daughters $25,000 to move it. They refused, and after a long court fight the Pennsylvania Supreme Court sided with them and the Block House stayed put."],"fact":"It survived because someone turned it into a house.","disputed":"Many people think the Block House is part of the original fort walls. Wikipedia says it was a separate redoubt built outside them in 1764.","claims":[{"t":"The Block House was built in 1764.","a":0,"why":"Wikipedia: constructed in 1764 as a redoubt of Fort Pitt."},{"t":"Henry Clay Frick moved the Block House to Schenley Park.","a":2,"why":"The Daughters refused his offer, and the court let the building stay."}],"sources":[{"t":"Wikipedia: Fort Pitt Block House","u":"https://en.wikipedia.org/wiki/Fort_Pitt_Block_House"},{"t":"Wikipedia: Point State Park","u":"https://en.wikipedia.org/wiki/Point_State_Park"}],"card":{"a":"1764","b":"1894","la":"Built","lb":"Given to the DAR"}}],"heroKey":"pg_mi_now"},"baltimore":{"id":"baltimore","name":"Baltimore","explorer":"Charm City Explorer","initials":"BAL","ranks":[[0,"Visitor"],[100,"Harbor Walker"],[250,"Landmark Hunter"],[450,"Baltimore Scholar"],[600,"Baltimore Historian"]],"heroAlt":"The Washington Monument in Baltimore","heroLi":"<li>Header: R. Corbet · CC BY-SA 4.0 · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:Washington_Monument_Mount_Vernon,_Baltimore.jpg\">Source</a> · resized</li>","heroCredit":"Photo: R. Corbet · <a target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by-sa/4.0/\">CC BY-SA 4.0</a> · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:Washington_Monument_Mount_Vernon,_Baltimore.jpg\">Source</a>","mission":"Find four landmarks around Baltimore. At each one, check in to earn its badge, unlock its story, and collect a Time Card. Do them in any order. Everything stays on this phone.","afterDone":"All four badges earned. The rest of Baltimore is waiting.","safetyNote":"<li>Baltimore has busy downtown streets and a lot of brick sidewalks. Use crosswalks, watch for light rail and buses, and check opening hours before you plan to go inside anywhere.</li>","badgeMap":{"mountclare":["bl_mc_now","50% 45%"],"monument":["bl_wm_now","50% 45%"],"fort":["bl_fm_now","50% 45%"],"library":["bl_pl_now","50% 45%"]},"level":"Classics","region":"The East","stops":[{"id":"mountclare","name":"Mount Clare Station","short":"Mount Clare","badge":"Mount Clare","tag":"Stop 1 of 4","teaser":"Where America's first regular passenger railroad service began in 1830.","map":"B&O Railroad Museum, 901 W Pratt St, Baltimore, MD","clue":"Go to West Pratt Street, west of downtown. Look for a brick railroad station beside a huge round building with a little dome on top.","safety":"Pratt Street is busy. Use crosswalks, check the museum's hours and ticket rules, and stay behind the barriers near tracks.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"What shape is the big domed building next to the station?","options":["Round","Square","Triangle","Star"],"answer":0,"hint":"Think of a plate, not a box.","verify":"Wikipedia says the museum sits in the old Mount Clare Station and its adjacent roundhouse. Look at the shape on site. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"August 1936","label":"The station then","line":"A survey photograph from 1936 of the old station building, with a round-roofed building behind it.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"bl_mc_then","by":"E. H. Pickering (Historic American Buildings Survey)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Historic_American_Buildings_Survey_E.H._Pickering,_Photographer_August_1936_THIS_BUILDING_ERECTED_1830_IS_THE_FIRST_PASSENGER_AND_FREIGHT_STATION_IN_AMERICA_AND_THE_OLDEST_IN_THE_HABS_MD,4-BALT,51-1.tif","note":"resized, cropped"}},"now":{"yr":"2006","head":"Today","label":"The roundhouse today","line":"The museum's round building with its dome, next to the old station.","ph":{"k":"bl_mc_now","by":"Reading Tom","lic":"CC BY 2.0","lu":"https://creativecommons.org/licenses/by/2.0/","page":"https://commons.wikimedia.org/wiki/File:Baltimore_&_Ohio_Railroad_Museum_-_Baltimore_(2643287108).jpg","note":"resized"}},"story":["The Baltimore and Ohio Railroad began America's first railroad here in 1829. The first regular passenger service started on May 22, 1830, when a horse-drawn train traveled 13 miles to Ellicott Mills, now Ellicott City.","On May 24, 1844, Samuel Morse's telegraph carried the first message, \"What hath God wrought?\", from Washington, D.C. to this site. The museum opened in 1953 and now has the largest collection of 19th-century locomotives in the country.","The station and the museum were named a National Historic Landmark in 1961. In 2021, the National Park Service added the Mount Clare Station building to its Underground Railroad Network to Freedom, because freedom seekers used the B&O Railroad on their journeys."],"fact":"The first regular passenger train here was pulled by horses.","disputed":"Old survey notes call the building \"erected 1830\", but Wikipedia says the brick Mount Clare Station standing today was constructed in 1851.","claims":[{"t":"Regular passenger service began at Mount Clare in 1830.","a":0,"why":"Wikipedia: the first regular passenger service started May 22, 1830."},{"t":"The brick station standing today was built in 1830.","a":2,"why":"Wikipedia says it was constructed in 1851."}],"sources":[{"t":"Wikipedia: National Museum of Railroad History & Innovation","u":"https://en.wikipedia.org/wiki/National_Museum_of_Railroad_History_%26_Innovation"},{"t":"Wikipedia: Baltimore and Ohio Railroad","u":"https://en.wikipedia.org/wiki/Baltimore_and_Ohio_Railroad"}],"card":{"a":"1830","b":"1851","la":"First passenger trains","lb":"Station built"}},{"id":"monument","name":"Washington Monument","short":"Monument","badge":"Monument","tag":"Stop 2 of 4","teaser":"A tall stone column honoring Washington, started years before the one in D.C.","map":"Washington Monument, 699 N Charles St, Baltimore, MD","clue":"Go to Mount Vernon Place, a park square in the middle of the neighborhood north of downtown. Look for a tall white stone column in the middle.","safety":"Mount Vernon Place has streets on all sides. Use crosswalks, and check the monument's hours before you plan to climb.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"How many steps lead to the top of the column?","options":["127","327","227","27"],"answer":2,"hint":"It is more than two hundred, but fewer than three hundred.","verify":"Wikipedia says visitors climb 227 steps to the top. If it is open, count them on the way up. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"About 1907 to 1914","label":"The square then","line":"A colorized postcard of the column and the church beside it, with Mount Vernon Place spread out below.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"bl_wm_then","by":"National Trust Library Historic Postcard Collection","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Mount_Vernon_Place_and_Washington_Monument,_Baltimore,_Maryland,_circa_1907-1914.jpg","note":"resized, cropped"}},"now":{"yr":"2016","head":"Today","label":"The monument today","line":"The white column rising behind a street lamp and bare branches.","ph":{"k":"bl_wm_now","by":"R. Corbet","lic":"CC BY-SA 4.0","lu":"https://creativecommons.org/licenses/by-sa/4.0/","page":"https://commons.wikimedia.org/wiki/File:Washington_Monument_Mount_Vernon,_Baltimore.jpg","note":"resized"}},"story":["Architect Robert Mills, who later designed the Washington Monument in Washington, D.C., won the design competition in 1814. The cornerstone was laid on July 4, 1815, on land from Colonel John Eager Howard's estate. The masonry was finished in 1829.","The column stands 178 feet 8 inches tall, and visitors climb 227 steps to the top. Its ground floor holds a gallery with exhibits about building the monument and the neighborhood around it.","Baltimore's monument was the first major monument to honor George Washington. Mills's first design had a statue of Washington in a four-horse chariot on top, but the plan changed because of concerns about cost and height."],"fact":"Maryland held its first state-approved lottery in 1810 for the monument.","disputed":"Many people think the monument in Washington, D.C. was first. Wikipedia says Baltimore's was the first major monument to honor Washington.","claims":[{"t":"Robert Mills designed the monument in Baltimore.","a":0,"why":"Wikipedia: Mills won the competition in 1814."},{"t":"The monument was completed in 1815.","a":2,"why":"The cornerstone was laid in 1815, and the masonry was finished in 1829."}],"sources":[{"t":"Wikipedia: Washington Monument (Baltimore)","u":"https://en.wikipedia.org/wiki/Washington_Monument_(Baltimore)"},{"t":"Wikipedia: Robert Mills","u":"https://en.wikipedia.org/wiki/Robert_Mills_(architect)"}],"card":{"a":"1815","b":"1829","la":"Cornerstone","lb":"Masonry finished"}},{"id":"fort","name":"Fort McHenry","short":"Fort McHenry","badge":"Fort McHenry","tag":"Stop 3 of 4","teaser":"The fort whose flag inspired the national anthem.","map":"Fort McHenry National Monument, 2400 E Fort Ave, Baltimore, MD","clue":"Go to Locust Point, on the south side of the harbor. Look for a star-shaped fort with brick buildings inside and a huge flag on a tall pole.","safety":"The fort is a national park site with its own entry rules. Stay on paths and off the earthen walls, watch the edges of the moat, and bring water on hot days.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"How many points does the fort's star shape have?","options":["Three","Four","Six","Five"],"answer":3,"hint":"Think of the name of a famous US Defense building.","verify":"Wikipedia calls it a pentagonal bastion fort. Count the points on a map or sign on site. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"About 1936","label":"The fort then","line":"A survey photograph from about 1936 of a grassy earthwork and the passage beside it.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"bl_fm_then","by":"Charles E. Peterson (Historic American Buildings Survey)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Historic_American_Buildings_Survey_Charles_E._Peterson,_Photographer_c._1936_VIEW_OF_PASSAGE_BETWEEN_DEMILUNE_AND_FORT_-_Fort_McHenry_National_Monument_and_Historic_Shrine,_East_HABS_MD,4-BALT,5-6.tif","note":"resized, cropped"}},"now":{"yr":"2012","head":"Today","label":"The fort today","line":"The parade ground, brick buildings and walls of the fort under a big sky.","ph":{"k":"bl_fm_now","by":"m01229","lic":"CC BY 2.0","lu":"https://creativecommons.org/licenses/by/2.0/","page":"https://commons.wikimedia.org/wiki/File:Fort_McHenry,_Baltimore_Maryland.jpg","note":"resized"}},"story":["Jean Foncin, a Frenchman, designed the fort in 1798, and it was built between 1798 and 1800 on the site of the older Fort Whetstone. It was named for James McHenry, a signer of the Constitution and the Secretary of War at the time.","On September 13 and 14, 1814, British warships bombarded the fort for 25 hours during the War of 1812. A chain of 22 sunken ships and the fort's cannons kept the ships from entering the harbor.","A huge flag, 30 by 42 feet, was raised on the morning of September 14. Francis Scott Key saw it and wrote a poem that was set to music and became \"The Star-Spangled Banner\". The fort became a national park in 1925 and a national monument in 1939."],"fact":"The flag was bigger than a house wall.","disputed":"Many people think the fort was built for the War of 1812. Wikipedia says it was built between 1798 and 1800, well before that war.","claims":[{"t":"Fort McHenry was built before the War of 1812.","a":0,"why":"Wikipedia: built between 1798 and 1800."},{"t":"The British captured Fort McHenry in 1814.","a":2,"why":"The fort held, and the British withdrew."}],"sources":[{"t":"Wikipedia: Fort McHenry","u":"https://en.wikipedia.org/wiki/Fort_McHenry"},{"t":"Wikipedia: The Star-Spangled Banner","u":"https://en.wikipedia.org/wiki/The_Star-Spangled_Banner"}],"card":{"a":"1798","b":"1814","la":"Designed","lb":"Bombardment"}},{"id":"library","name":"George Peabody Library","short":"Peabody Library","badge":"Peabody Library","tag":"Stop 4 of 4","teaser":"A library so grand that people call it a cathedral of books.","map":"George Peabody Library, 17 E Mount Vernon Pl, Baltimore, MD","clue":"Go to Mount Vernon Place and find the Peabody Institute, a grand building a block from the Washington Monument. The library is part of it.","safety":"The library is run by Johns Hopkins University, so check public hours and visitor rules before you go. Keep voices low and photos polite.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"What fills the walls of the library's great hall?","options":["Paintings","Mirrors","Books","Flags"],"answer":2,"hint":"It is a library, after all.","verify":"Wikipedia says the collection holds about 300,000 volumes. Look at the walls on site. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"After 1898","label":"The building then","line":"A postcard of the Peabody Institute's front, from soon after 1898.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"bl_pl_then","by":"Detroit Publishing Company (scan by NYPL)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Peabody_Institute,_Baltimore,_Md_(NYPL_b12647398-62700).tiff","note":"resized, cropped"}},"now":{"yr":"2013","head":"Today","label":"The library today","line":"The great hall, with rows of iron balconies full of books under a skylight.","ph":{"k":"bl_pl_now","by":"Matthew Petroff","lic":"CC BY-SA 3.0","lu":"https://creativecommons.org/licenses/by-sa/3.0/","page":"https://commons.wikimedia.org/wiki/File:George-peabody-library.jpg","note":"resized"}},"story":["George Peabody, a Baltimore merchant, gave $300,000 to start the Peabody Institute in 1857. The library was meant for the \"free use of all persons who desire to consult it\".","The Civil War delayed the plans, and the institute was not established until 1866. Local architect Edmund George Lind designed the library in the East Wing, and it opened to the public in 1878.","The library stayed part of the Peabody Institute until 1967, when it passed to the city and then, in 1982, to Johns Hopkins University. Its collection of about 300,000 volumes focuses on the 19th century and includes first editions by Poe, Hawthorne and Melville."],"fact":"It was built to be free for everyone.","disputed":"Many people think the library opened in 1860 as first planned. Wikipedia says the Civil War delayed the institute, and the library building opened in 1878.","claims":[{"t":"The Peabody Library building opened in 1878.","a":0,"why":"Wikipedia: the East Wing library opened to the public in 1878."},{"t":"The library was designed to charge a fee.","a":2,"why":"It was meant for the free use of all persons."}],"sources":[{"t":"Wikipedia: George Peabody Library","u":"https://en.wikipedia.org/wiki/George_Peabody_Library"},{"t":"Wikipedia: Peabody Institute","u":"https://en.wikipedia.org/wiki/Peabody_Institute"}],"card":{"a":"1857","b":"1878","la":"Gift","lb":"Library opens"}}],"heroKey":"bl_wm_now"},"cleveland":{"id":"cleveland","name":"Cleveland","explorer":"Forest City Explorer","initials":"CLE","ranks":[[0,"Visitor"],[100,"Public Square Walker"],[250,"Landmark Hunter"],[450,"Cleveland Scholar"],[600,"Cleveland Historian"]],"heroAlt":"Soldiers' and Sailors' Monument on Cleveland's Public Square","heroLi":"<li>Header: Warren LeMay · CC0 · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:Soldiers'_and_Sailors'_Monument,_Public_Square,_Cleveland,_OH_(27732118517).jpg\">Source</a> · resized</li>","heroCredit":"Photo: Warren LeMay · <a target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/publicdomain/zero/1.0/\">CC0</a> · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:Soldiers'_and_Sailors'_Monument,_Public_Square,_Cleveland,_OH_(27732118517).jpg\">Source</a>","mission":"Find four landmarks around Cleveland. At each one, check in to earn its badge, unlock its story, and collect a Time Card. Do them in any order. Everything stays on this phone.","afterDone":"All four badges earned. The rest of Cleveland is waiting.","safetyNote":"<li>Downtown Cleveland has busy streets and rail lines. Use crosswalks, watch for buses on Public Square, and check opening hours before you plan to go inside anywhere.</li>","badgeMap":{"tower":["cl_tt_now","50% 45%"],"monument":["cl_ss_now","50% 45%"],"church":["cl_os_now","50% 45%"],"arcade":["cl_ar_now","50% 45%"]},"level":"Classics","region":"The Midwest","stops":[{"id":"tower","name":"Terminal Tower","short":"Terminal Tower","badge":"Terminal Tower","tag":"Stop 1 of 4","teaser":"A skyscraper that grew from 14 floors to 52 and was once the second tallest building in the world.","map":"Terminal Tower, 50 Public Square, Cleveland, OH","clue":"Go to Public Square in the middle of downtown. Look for the tall tower with a pointed top that rises above everything else.","safety":"Public Square is crossed by buses and busy streets. Use crosswalks, and keep out of the bus lanes while you look up.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"How many stories does the Terminal Tower have?","options":["12","52","25","100"],"answer":1,"hint":"It is a little over half of a hundred.","verify":"Wikipedia calls it a 52-story landmark skyscraper. Count the windows or read a sign on site. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"1932","label":"The tower then","line":"A 1932 postcard of the Municipal Water Works, with the Terminal Tower far away in the background.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"cl_tt_then","by":"Unknown author","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Municipal_Water_Works_and_Terminal_Tower_From_Edgewater_Park_(NBY_673).jpg","note":"resized, cropped"}},"now":{"yr":"2021","head":"Today","label":"The tower today","line":"The tower rising above the Tower City buildings at its base.","ph":{"k":"cl_tt_now","by":"Erik Drost (derivative: LakeCityCle)","lic":"CC BY 2.0","lu":"https://creativecommons.org/licenses/by/2.0/","page":"https://commons.wikimedia.org/wiki/File:Terminal_Tower_from_Cuyahoga_River_Cropped.jpg","note":"resized"}},"story":["The Van Sweringen brothers built the tower for $179 million as an office building on top of Cleveland's new rail station, the Cleveland Union Terminal. It was originally planned as 14 stories, and then expanded to 52 floors and 708 feet.","It was completed in 1927 and opened for tenants in 1928, though the whole Union Terminal complex was not dedicated until 1930. It rests on caissons 280 feet deep.","When it was finished it was the second-tallest building in the world, and it stayed the tallest in North America outside New York City until 1964. In 2016 a new owner turned 11 of the lower floors into 293 apartments."],"fact":"It was planned as a 14-story building.","disputed":"Many people say the tower was the tallest building in the world. Wikipedia says it was the second-tallest in the world when completed in 1927.","claims":[{"t":"The Terminal Tower was completed in 1927.","a":0,"why":"Wikipedia: completed in 1927 and opened for tenants in 1928."},{"t":"The Terminal Tower was the tallest building in the world when it was finished.","a":2,"why":"Wikipedia says it was the second-tallest in the world."}],"sources":[{"t":"Wikipedia: Terminal Tower","u":"https://en.wikipedia.org/wiki/Terminal_Tower"},{"t":"Wikipedia: Van Sweringen brothers","u":"https://en.wikipedia.org/wiki/Van_Sweringen_brothers"}],"card":{"a":"1927","b":"1930","la":"Tower completed","lb":"Terminal dedicated"}},{"id":"monument","name":"Soldiers' and Sailors' Monument","short":"Monument","badge":"Monument","tag":"Stop 2 of 4","teaser":"A monument with a tall column and a room inside for memorial tablets.","map":"Soldiers' and Sailors' Monument, Public Square, Cleveland, OH","clue":"Stay on Public Square and look at the southeast corner, at the end of Euclid Avenue. Look for a big stone memorial with a tall column and statues around its base.","safety":"The monument sits in a busy plaza. Use crosswalks, check hours before going inside, and stay off the statues and steps when they are slippery.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"Which war does the monument honor?","options":["Civil War","Revolutionary War","World War I","Korean War"],"answer":0,"hint":"The war ended in 1865.","verify":"Wikipedia says it honors more than 9,000 Union soldiers and sailors from Cuyahoga County. Look for the dates on site. Written from sources, not yet checked on site. Written from sources, not yet checked on site."},"then":{"yr":"About 1900","label":"The monument then","line":"A color print from about 1900 of the monument and its gardens, with Public Square around it.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"cl_ss_then","by":"Detroit Publishing Company (Library of Congress)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Soldiers'_and_Sailors'_Monument,_Cleveland-LCCN2008679520.jpg","note":"resized, cropped"}},"now":{"yr":"2018","head":"Today","label":"The monument today","line":"The stone base and the column, with sculptures and city towers around it.","ph":{"k":"cl_ss_now","by":"Warren LeMay","lic":"CC0","lu":"https://creativecommons.org/publicdomain/zero/1.0/","page":"https://commons.wikimedia.org/wiki/File:Soldiers'_and_Sailors'_Monument,_Public_Square,_Cleveland,_OH_(27732118517).jpg","note":"resized"}},"story":["The idea began at a meeting of Civil War veterans on October 22, 1879. Ohio's legislature allowed a countywide tax for a monument in 1880. Levi T. Scofield, a local veteran and architect, designed a combination of a tablet room and an obelisk, and made the sculptures too.","The monument was dedicated on July 4, 1894, on the southeast quadrant of Public Square. It honors the more than 9,000 people from Cuyahoga County who served the Union during the Civil War.","
