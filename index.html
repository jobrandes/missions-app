<meta charset="utf-8">
<title>Stamp the Past</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: one phone-width column. A skyline hero carries rank and progress. Each stop has a badge, a Now scene, a Then scene, and a sticky Back bar. */
:root{
  --font-display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --font-body:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --bg:#EDF0F3; --surface:#FFFFFF; --surface-2:#E1E7EC; --ink:#13202C; --muted:#53626F; --line:#C9D1D9;
  --accent:#1B58B8; --accent-ink:#FFFFFF; --bulb:#F2B01E; --bulb-off:#B4BEC8;
  --good:#1E7A4C; --warn:#9A5A08; --bad:#B3322B;
  --mat:#F7F4EE; --mat-ink:#3A3226;
  /* scene palette: "now" scenes */
  --sky1:#8EC1EE; --sky2:#F6DDB0; --hill:#6C88A3; --hill2:#8AA2B8; --bldg:#3C5167; --bldg2:#52697F;
  --water:#4C93C9; --steel:#2D3C4B; --lamp:#FFD25A; --tree:#47875B; --road:#56626E; --wood:#8A6A45;
  --stone:#BAC4CD; --grass:#6FA45C;
  /* scene palette: "then" scenes (sepia print) */
  --p1:#E3D7BC; --p2:#C9B999; --p3:#A08E70; --p4:#6E5E47; --p5:#3A2F21;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D141B; --surface:#16202A; --surface-2:#1E2B37; --ink:#E9EFF4; --muted:#9AAAB8; --line:#2B3946;
    --accent:#7BB0FF; --accent-ink:#0B1722; --bulb:#FFC83D; --bulb-off:#3F4E5B;
    --good:#59C58E; --warn:#F0A957; --bad:#FF8A80;
    --mat:#2B2823; --mat-ink:#E4DAC8;
    --sky1:#0F2238; --sky2:#40506B; --hill:#20374D; --hill2:#2B465E; --bldg:#101C28; --bldg2:#1B2C3C;
    --water:#1F5E8C; --steel:#9AB1C6; --lamp:#FFC83D; --tree:#2D6C48; --road:#252F39; --wood:#6B5236;
    --stone:#6F7C88; --grass:#3C6B49;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D141B; --surface:#16202A; --surface-2:#1E2B37; --ink:#E9EFF4; --muted:#9AAAB8; --line:#2B3946;
  --accent:#7BB0FF; --accent-ink:#0B1722; --bulb:#FFC83D; --bulb-off:#3F4E5B;
  --good:#59C58E; --warn:#F0A957; --bad:#FF8A80;
  --mat:#2B2823; --mat-ink:#E4DAC8;
  --sky1:#0F2238; --sky2:#40506B; --hill:#20374D; --hill2:#2B465E; --bldg:#101C28; --bldg2:#1B2C3C;
  --water:#1F5E8C; --steel:#9AB1C6; --lamp:#FFC83D; --tree:#2D6C48; --road:#252F39; --wood:#6B5236;
  --stone:#6F7C88; --grass:#3C6B49;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--font-body);
  padding-block:16px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%;
}
body.hasbar{padding-bottom:112px}
.app{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--font-display);font-weight:800;margin:0;text-wrap:balance;text-transform:uppercase;letter-spacing:.015em;line-height:1}
h1{font-size:clamp(56px,16vw,88px)}
h2{font-size:34px}
h3{font-size:22px;font-weight:700}
p{margin:0;max-width:65ch}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mono{font:500 12px/1.3 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
button{font-family:inherit}

/* hero: city skyline backdrop */
.hero{position:relative;overflow:hidden;border-radius:16px;color:#fff;padding:18px 16px 14px;display:flex;flex-direction:column;gap:10px;min-height:360px;justify-content:flex-end;isolation:isolate;background:#12263F}
.hero > img.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 55%;z-index:-2}
.cities{display:flex;gap:8px;flex-wrap:wrap}
.city{min-height:44px;padding:8px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:15px;cursor:pointer}
.city[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.city[disabled]{opacity:.55;border-style:dashed;cursor:default}
.hero.nophoto{background:linear-gradient(180deg,#0E2238 0%,#2A4A6E 62%,#6B5A44 100%)}
.hero.nophoto > img.art{display:none}
.hero h1.long{font-size:clamp(44px,12.5vw,72px)}
.bimg.plain{display:flex;align-items:center;justify-content:center;border-radius:50%;border:3px solid var(--bulb-off);color:var(--muted);font:800 20px var(--font-display);letter-spacing:.04em}
.bimg.plain.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--bulb);color:var(--ink);background:var(--surface-2)}
.bbox.lg .bimg.plain{font-size:30px}
.hero-credit{font:500 11px var(--font-mono);letter-spacing:.04em;color:rgba(255,255,255,.8)}
.hero-credit a{color:#fff}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(6,14,24,.72) 0%,rgba(6,14,24,.38) 48%,rgba(6,14,24,.12) 72%,rgba(6,14,24,.4) 100%)}
.hero h1{color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.45)}
.hero .mono{color:rgba(255,255,255,.82)}
.rank-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
#rankName{font:700 20px var(--font-display);text-transform:uppercase;letter-spacing:.03em;text-shadow:0 1px 8px rgba(0,0,0,.7)}
#xpText{text-shadow:0 1px 6px rgba(0,0,0,.8)}
.xp{height:10px;border-radius:999px;background:rgba(255,255,255,.25);overflow:hidden}
#xpFill{height:100%;width:0;background:#FFC83D;border-radius:999px}
.bulbs{display:grid;grid-template-columns:repeat(4,1fr);position:relative;background:rgba(6,14,24,.62);border-radius:12px;padding:10px 4px 8px}
.bulbs::before{content:"";position:absolute;left:12.5%;right:12.5%;top:22px;height:2px;background:rgba(255,255,255,.28)}
.bulb{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px}
.bulb i{width:24px;height:24px;border-radius:50%;background:#3F4E5B;border:2px solid #0E1A27}
.bulb.on i{background:#FFC83D;box-shadow:0 0 14px 2px #FFC83D}
.bulb span{font:500 11px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.75);text-align:center}
.bulb.on span{color:#fff}

/* tabs */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;background:var(--surface-2);border-radius:12px}
.tab{border:0;background:transparent;color:var(--muted);font-weight:600;font-size:15px;min-height:44px;border-radius:9px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.18)}

/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.view{display:flex;flex-direction:column;gap:16px}
.btn{display:block;width:100%;min-height:52px;padding:12px 16px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:16px;cursor:pointer;text-align:center;text-decoration:none;line-height:1.3}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn.small{min-height:44px;width:auto;display:inline-block;font-size:15px}
.link{background:none;border:0;color:var(--accent);font-weight:600;font-size:15px;cursor:pointer;padding:8px 0;min-height:44px}
.note{border:1.5px dashed var(--warn);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.note .mono{color:var(--warn)}
.safety{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface-2);display:flex;flex-direction:column;gap:4px;font-size:15px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > *{flex:1 1 160px;min-width:0}

/* scenes + badges */
.scene{aspect-ratio:4/3;max-width:100%;overflow:hidden;border-radius:10px;background:var(--surface-2)}
.scene svg{display:block;width:100%;height:100%}
.banner{position:relative}
.banner .tagline{position:absolute;left:10px;bottom:8px;font:500 11px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:#fff;background:rgba(6,14,24,.6);padding:3px 8px;border-radius:999px}
.bimg{display:block;width:100%;height:100%}
.bimg img{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover;filter:grayscale(1) brightness(.62) contrast(.9);box-shadow:0 0 0 3px var(--bulb-off)}
.bimg.on img{filter:none;box-shadow:0 0 0 3px var(--bulb),0 0 0 6px var(--accent),0 2px 10px rgba(0,0,0,.3)}
.bbox{width:60px;height:60px;flex:none;padding:6px}
.bbox.lg{width:92px;height:92px;padding:8px}

/* trail */
.stops{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.stop{display:grid;grid-template-columns:60px minmax(0,1fr) auto;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;color:inherit;font:inherit;cursor:pointer;min-height:80px}
.stop h3{margin-bottom:4px}
.stop .sub{font-size:14px;color:var(--muted)}
.stop .chev{font-size:26px;color:var(--muted)}
.status{display:inline-block;margin-top:6px;font:500 11px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.status.ok{color:var(--good);border-color:var(--good)}
.soon{opacity:.6;border-style:dashed}

/* stop */
.stophead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.step{background:none;border:0;padding:0;cursor:pointer;display:flex;flex-direction:column;gap:6px;text-align:left;min-height:44px;justify-content:flex-end}
.step::before{content:"";height:6px;border-radius:999px;background:var(--surface-2)}
.step.cur::before{background:var(--accent)}
.step.ok::before{background:var(--bulb)}
.step span{font:500 11px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.step.cur span{color:var(--ink)}
.step[disabled]{cursor:default;opacity:.55}
.opts{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;border:0}
.opts legend{padding:0;margin-bottom:10px;font-weight:600;font-size:18px;line-height:1.4}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;min-height:52px;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font-weight:500;font-size:16px;cursor:pointer}
.opt.wrong{border-color:var(--bad);opacity:.75}
.opt.right{border-color:var(--good);box-shadow:inset 0 0 0 1px var(--good)}
.opt em{font:500 12px var(--font-mono);font-style:normal;letter-spacing:.06em;text-transform:uppercase}
.opt.wrong em{color:var(--bad)}
.opt.right em{color:var(--good)}
.feedback{min-height:1.5em;font-weight:500}
.feedback.bad{color:var(--bad)}
.feedback.good{color:var(--good)}
.earned{display:flex;gap:14px;align-items:center;border:1.5px solid var(--good);border-radius:12px;padding:12px}
.earned strong{font:800 24px/1 var(--font-display);text-transform:uppercase;letter-spacing:.02em;display:block}
.pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;align-items:start}
.then{background:var(--mat);color:var(--mat-ink);padding:10px 10px 12px;border-radius:4px;box-shadow:0 6px 18px rgba(0,0,0,.2);display:flex;flex-direction:column;gap:10px;min-width:0}
.then .scene{border-radius:2px;position:relative}
.scene.pend{display:flex;align-items:center;justify-content:center;padding:14px;text-align:center;font-size:13px;line-height:1.4;color:var(--muted);border:1.5px dashed var(--line);background:transparent}
.then .scene.pend{color:var(--mat-ink);border-color:var(--mat-ink);opacity:.75}
.scene img{display:block;width:100%;height:100%;object-fit:cover}
.credit{font-size:12px;line-height:1.45;opacity:.85}
.then .credit a{font-size:12px}
.then .cap{font-size:14px}
.then .fine{font-size:12px;opacity:.8}
.then a{color:var(--mat-ink);font-weight:600;font-size:14px}
.now{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:10px 10px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.now .cap{font-size:14px}
.now b.yr{font:800 40px/1 var(--font-display);color:var(--accent)}
.story{display:flex;flex-direction:column;gap:12px}
.fact{border-radius:10px;background:var(--surface-2);padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.claim{display:flex;flex-direction:column;gap:10px;padding-top:14px;border-top:1px solid var(--line)}
.claim:first-of-type{border-top:0;padding-top:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-weight:500;font-size:15px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.why{font-size:15px;color:var(--muted)}
.srcs{margin:0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:4px}
details summary{cursor:pointer;font-weight:600;min-height:44px;display:flex;align-items:center}
details ul{margin:0 0 4px;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:15px}

/* cards + rewards */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.tcard{border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:12px;display:flex;flex-direction:column;gap:8px;text-align:left;color:inherit;font:inherit;min-width:0;cursor:pointer}
.tcard.locked{border-style:dashed;background:transparent;color:var(--muted);cursor:default;padding:16px}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mini .scene{border-radius:6px}
.credit-txt{font-size:12px;color:var(--muted);line-height:1.4}
.years{font:800 34px/1 var(--font-display);display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.years i{font-style:normal;color:var(--accent);font-size:26px}
.ladder{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ladder li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.ladder li.got{border-color:var(--good)}
.ladder li.got .mono{color:var(--good)}
.cases{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.case{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:12px 8px;border:1px solid var(--line);border-radius:12px}
.case.got{border-color:var(--accent)}
.case .nm{font:700 18px var(--font-display);text-transform:uppercase;letter-spacing:.03em;line-height:1.05}
.master{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.code{display:flex;gap:8px;flex-wrap:wrap}
.code input{flex:1 1 180px;min-width:0;min-height:48px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:500 16px var(--font-mono)}
.done-banner{border-radius:14px;padding:16px;background:var(--accent);color:var(--accent-ink);display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.done-banner .bbox{color:var(--accent-ink)}
.done-banner h2{color:inherit}
.done-banner p{font-size:15px}

/* sticky back bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bar-in{max-width:600px;margin:0 auto;display:flex;gap:10px}
.bar-in .btn{flex:1 1 0;width:auto;min-height:48px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:15px;opacity:0;pointer-events:none;max-width:calc(100% - 32px);text-align:center;z-index:20}
.toast.show{opacity:1}
@media (prefers-reduced-motion:no-preference){
  .toast{transition:opacity .2s}
  .bulb.on i{animation:glow 2.8s ease-in-out infinite}
  .pop{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
  #xpFill{transition:width .5s ease}
  @keyframes pop{from{transform:scale(1.4) rotate(-6deg);opacity:0}to{transform:none;opacity:1}}
  @keyframes glow{50%{box-shadow:0 0 6px 1px #FFC83D}}
}

/* Passport page: each earned badge is a stamp */
.cases{padding:14px 10px;border-radius:12px;background:var(--surface-2);gap:18px 10px}
.case{position:relative;border:0;padding:6px 4px}
.case.got .bbox{transform:rotate(-6deg)}
.case.got:nth-child(even) .bbox{transform:rotate(5deg)}
.case.got .bbox::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px dashed var(--ink,var(--accent));opacity:.9;pointer-events:none}
.case .bbox{position:relative}
.case:not(.got) .bbox{opacity:.55}
.case:not(.got) .bbox::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px dashed var(--bulb-off);pointer-events:none}
.case.got .mono{color:var(--ink,var(--accent));font-weight:600;letter-spacing:.14em;text-transform:uppercase}
@media (prefers-reduced-motion:no-preference){.case.got .bbox{animation:stampin .35s ease-out both}@keyframes stampin{from{transform:scale(1.35) rotate(-14deg);opacity:0}}}

/* Then/Now fade slider */
.cmp{margin:0 0 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px}
.cmp .box{touch-action:pan-y;cursor:ew-resize;user-select:none;-webkit-user-select:none;position:relative;aspect-ratio:4/3;max-width:100%;border-radius:8px;overflow:hidden;background:var(--surface-2)}
.cmp .box img{-webkit-user-drag:none;pointer-events:none;position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.cmp .top{opacity:0}
.cmp .row{display:flex;align-items:center;gap:10px;margin-top:10px}
.cmp .row span{font:600 12px var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);flex:none}
.cmp input[type=range]{flex:1;min-width:0;height:36px;accent-color:var(--accent)}
.cmp .hint{margin:6px 0 0;font:500 12px var(--font-mono);color:var(--muted)}

/* Fact or Fiction */
.fof{display:flex;flex-direction:column;gap:12px}
.fdots{display:flex;gap:8px}
.fdots i{width:26px;height:8px;border-radius:4px;background:var(--bulb-off)}
.fdots i.on{background:var(--good)}
.streak{margin:0;font:700 13px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--warn)}
.fcard{border:2px solid var(--ink);border-radius:16px;background:var(--mat);color:var(--mat-ink);padding:22px 18px;min-height:150px;display:flex;align-items:center;box-shadow:0 6px 0 var(--ink);touch-action:pan-y}
.ftxt{margin:0;font:700 clamp(20px,5.4vw,26px)/1.25 var(--font-display);letter-spacing:.01em}
.fbtns{display:grid;gap:10px}
.fbtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;min-height:56px;padding:10px 14px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font-family:var(--font-body);cursor:pointer}
.fbtn b{font:700 17px var(--font-display);letter-spacing:.03em;text-transform:uppercase}
.fbtn span{font-size:13px;color:var(--muted)}
.fbtn:hover,.fbtn:focus-visible{border-color:var(--accent)}
.fdone{padding-top:12px;border-top:1px solid var(--line)}
@media (prefers-reduced-motion:no-preference){.fcard.shake{animation:fshake .35s}@keyframes fshake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}}

/* Stamp ink: XP unlocks */
.inks{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.ink{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:64px;padding:8px 6px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:500 11px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.ink i{width:28px;height:28px;border-radius:50%;display:block;border:3px dashed currentColor}
.ink[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.ink:disabled{opacity:.45;cursor:default}

/* Home screen */
body.ishome .hero, body.ishome .tabs{display:none}
.city.home{font-weight:700}
.home-hero{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:center;padding:20px 0 8px}
.home-hero h1{font:800 clamp(48px,13vw,88px)/.95 var(--font-display);text-transform:uppercase;margin:6px 0 14px}
.home-hero .sub{font-size:17px;max-width:34ch;margin:0}
.hstamps{position:relative;aspect-ratio:1/1;width:100%;max-width:300px;margin-inline:auto}
.hstamp{position:absolute;width:52%;aspect-ratio:1/1;border-radius:50%;padding:6px;background:var(--surface);box-shadow:0 8px 22px rgba(0,0,0,.22)}
.hstamp::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2.5px dashed var(--accent);opacity:.8}
.hstamp img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;box-shadow:0 0 0 3px var(--gold,#E9A91A)}
.hstamp:nth-child(1){left:2%;top:4%;transform:rotate(-8deg)}
.hstamp:nth-child(2){right:0;top:12%;transform:rotate(6deg)}
.hstamp:nth-child(3){left:6%;bottom:2%;transform:rotate(5deg)}
.hstamp:nth-child(4){right:6%;bottom:0;transform:rotate(-5deg)}
@media (max-width:560px){.home-hero{grid-template-columns:1fr}}
.passport-line{margin-top:12px;color:var(--muted)}
.navy{background:#0F1F33;color:#F3EFE6;border-radius:16px;padding:22px 18px;margin:20px 0}
.navy .mono{color:#E9A91A}
.navy h2{font:800 clamp(30px,8vw,42px)/1 var(--font-display);text-transform:uppercase;margin:6px 0 16px}
.hsteps{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.hsteps{grid-template-columns:1fr}}
.hstep{border:1px solid rgba(255,255,255,.22);border-radius:12px;padding:14px}
.hstep b{display:block;font:800 40px/1 var(--font-display);color:#E9A91A}
.hstep h3{margin:6px 0;font:800 22px var(--font-display);text-transform:uppercase;color:#F3EFE6}
.hstep p{font-size:14px;opacity:.92}
.hsec{margin:26px 0}
.hh2{font:800 clamp(28px,7vw,38px)/1 var(--font-display);text-transform:uppercase;margin:6px 0 10px}
.fof{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:16px;display:grid;gap:12px}
.fcard-h{border:2px solid var(--ink);border-radius:16px;background:#F7F4EE;color:#3A3226;padding:20px 16px;min-height:110px;display:flex;align-items:center;box-shadow:0 5px 0 var(--ink);font:700 clamp(21px,5vw,26px)/1.2 var(--font-display)}
.fb-h{display:grid;gap:8px}
.fb-h button{min-height:48px;text-align:left;padding:8px 14px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:700 16px var(--font-display);letter-spacing:.04em;text-transform:uppercase;cursor:pointer}
.fb-h button:hover,.fb-h button:focus-visible{border-color:var(--accent)}
.res-h{font-size:15px;min-height:3.2em}
.res-h.good{color:var(--good,#1E7A4C)} .res-h.bad{color:var(--bad,#B3322B)}
.grown{background:var(--surface-2);border-radius:16px;padding:22px 18px;margin:20px 0}
.grown ul{margin:14px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.grown li{padding-left:26px;position:relative}
.grown li::before{content:"";position:absolute;left:0;top:.45em;width:13px;height:13px;border-radius:50%;background:var(--good,#1E7A4C)}
.hh{font:800 28px var(--font-display);text-transform:uppercase;margin:22px 0 10px}
.towns{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.town{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);font:inherit;cursor:pointer;min-height:84px}
.town:hover,.town:focus-visible{border-color:var(--accent)}
.town.soon{opacity:.6;cursor:default;border-style:dashed}
.town .tph{flex:none;width:72px;height:72px;border-radius:12px;overflow:hidden;background:var(--surface-2);display:block}
.town .tph img{width:100%;height:100%;object-fit:cover;display:block}
.town .tin{flex:1;min-width:0;display:block}
.town h3{margin:0;font:800 24px var(--font-display);text-transform:uppercase}
.town .sub{color:var(--muted);font-size:14px}
.town .go{flex:none;font:600 13px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.band-home{margin:18px 0;padding:18px;border-radius:14px;background:var(--surface-2)}
.hiw{margin:10px 0 0;padding-left:22px;display:grid;gap:10px}
.home-foot{text-align:center;color:var(--muted);font:500 12px var(--font-mono);letter-spacing:.1em;text-transform:uppercase;margin:18px 0 8px}

.lvl{display:inline-block;margin:2px 0 4px;padding:2px 8px;border-radius:999px;font:600 11px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);color:var(--muted)}
.lvl.ic{color:var(--accent);border-color:var(--accent)}
.town .sub{display:block}

/* town rail: one tidy row of tabs instead of wrapping bubbles */
.cities{flex-wrap:nowrap;gap:0;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x proximity;scrollbar-width:none;-webkit-overflow-scrolling:touch;border-bottom:1px solid var(--line);margin:0 0 4px}
.cities::-webkit-scrollbar{display:none}
.city{flex:none;scroll-snap-align:start;min-height:44px;padding:8px 14px;border:0;border-bottom:3px solid transparent;border-radius:0;background:transparent;color:var(--muted);font:600 13px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.city:hover{color:var(--ink)}
.city[aria-pressed="true"]{background:transparent;color:var(--ink);border-color:transparent;border-bottom-color:var(--accent)}
.city.home{font-weight:700}
.hero h1.xl{font-size:clamp(34px,9.5vw,58px)}

.resume{margin:0 0 18px}
.rcard{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;min-height:64px;padding:12px 14px;border:1.5px solid var(--accent);border-radius:14px;background:var(--surface);color:var(--ink);font:inherit;cursor:pointer}
.rcard strong{display:block;font:800 22px var(--font-display);text-transform:uppercase}
.rcard .rsub{display:block;color:var(--muted);font-size:14px}
.rcard .go{flex:none;font:600 13px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}

.region{margin:18px 0 8px;font:600 12px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.region:first-of-type{margin-top:4px}

details.reg{margin:0 0 6px}
details.reg>summary.region{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:44px;margin:8px 0 6px;cursor:pointer;list-style:none}
details.reg>summary.region::-webkit-details-marker{display:none}
details.reg>summary.region::after{content:"+";font:600 18px var(--font-mono);color:var(--accent);padding-left:8px}
details.reg[open]>summary.region::after{content:"–"}
.rcount{margin-left:auto;font:500 12px var(--font-mono);letter-spacing:.06em;color:var(--muted)}

.rlabel{flex:none;align-self:center;padding:0 6px 0 12px;margin-left:6px;border-left:1px solid var(--line);font:600 11px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);white-space:nowrap}
.city.home{position:sticky;left:0;z-index:2;background:var(--bg)}

/* two-level rail: regions on top, that region's missions below */
.cities{display:block;overflow:visible;border-bottom:1px solid var(--line);margin:0 0 4px}
.rail1,.rail2{display:flex;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.rail1::-webkit-scrollbar,.rail2::-webkit-scrollbar{display:none}
.rail1{gap:6px;padding:4px 0 6px}
.rtab{flex:none;min-height:44px;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:600 13px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;white-space:nowrap}
.rtab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rail1 .city.home{position:static;border:1.5px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);padding:8px 14px}
.rail1 .city.home[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.rlabel{display:none}

/* passport */
.bbox.sm{width:46px;height:46px;padding:4px}
.passport{margin:22px 0}
.pprow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 12px;margin:8px 0;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.pprow.full{border-color:var(--accent)}
.ppname{min-width:0;flex:1 1 140px}.ppname strong{display:block;font:800 18px var(--font-display);text-transform:uppercase}
.ppname .mono{color:var(--muted);font-size:12px}
.ppstamps{display:flex;gap:8px;flex:none}
/* mission complete */
.celeb{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-left));background:rgba(8,14,22,.72)}
.celeb-card{position:relative;overflow:hidden;width:min(440px,100%);max-height:100%;overflow-y:auto;text-align:center;background:var(--surface);color:var(--ink);border:2px solid var(--accent);border-radius:18px;padding:26px 20px}
.celeb-card h2{margin:4px 0 6px;font:800 clamp(28px,8vw,38px) var(--font-display);text-transform:uppercase;text-wrap:balance}
.celeb-stamp{display:flex;justify-content:center;margin:0 0 10px}
.celeb-stats{color:var(--muted);margin:10px 0 16px}
.celeb-btns{display:grid;gap:10px}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-12px;left:var(--x);width:8px;height:14px;border-radius:2px;background:#FFC83D;opacity:0}
.confetti i:nth-child(3n+1){background:var(--accent)}.confetti i:nth-child(3n+2){background:#E4572E}
@media (prefers-reduced-motion:no-preference){
 .celeb-card{animation:celebin .4s cubic-bezier(.2,1.3,.4,1)}
 .celeb-stamp .bbox{animation:stampin .6s .25s ease-out both}
 .confetti i{animation:fall 1.8s var(--d) ease-in forwards}
 @keyframes celebin{from{transform:scale(.85);opacity:0}}
 @keyframes fall{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(420px) rotate(260deg)}}
}
.celeb-stamp{margin-bottom:16px}.celeb-card .mono{margin:0}

.vbadge{display:flex;flex-direction:column;gap:2px;margin:12px 0 0;padding:10px 12px;border-radius:10px;border:1.5px dashed var(--line);color:var(--muted);font-size:14px}
.vbadge b{font:700 12px var(--font-mono);letter-spacing:.1em;text-transform:uppercase}
.vbadge em{font-style:normal;color:var(--ink);margin-top:2px}
.vbadge.ok{border:1.5px solid var(--accent);color:var(--ink);background:var(--surface-2)}
.vbadge.ok b{color:var(--accent)}
.vchip{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;border:1px solid var(--accent);color:var(--accent);font:700 11px var(--font-mono);letter-spacing:.08em;text-transform:uppercase}

.argue{margin:14px 0;border:2px solid var(--warn);border-radius:14px;padding:14px;background:var(--surface-2)}
.argue-h{display:flex;align-items:center;gap:12px;margin:0 0 8px}
.argue-ic{flex:none;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2.5px solid var(--warn);color:var(--warn);font:800 24px var(--font-display)}
.argue-h b{display:block;font:800 19px var(--font-display);text-transform:uppercase;letter-spacing:.02em}
.argue-h em{display:block;font-style:normal;color:var(--muted);font-size:13px}
.argue p{margin:0 0 6px}
.argue .argue-go{margin:8px 0 0;color:var(--muted);font:600 12px var(--font-mono);letter-spacing:.04em}

.boss-res{text-align:center}
.boss-res h2{font:800 clamp(44px,14vw,72px) var(--font-display);margin:4px 0}
.boss-res.perfect{border:2px solid var(--accent)}
.opt:disabled{cursor:default}

.tour-card h2{font-size:clamp(34px,10vw,48px)}
.tour-dots{display:flex;justify-content:center;gap:8px;margin:14px 0 16px}

.tour-dots i.on{background:var(--accent)}

.sealwrap{display:flex;flex-direction:column;align-items:center;gap:4px;margin:10px 0;text-align:center}

.seal{display:block;max-width:100%;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25))}
.sealbox{display:grid;place-items:center;padding:2px}
.grand-line{display:flex;align-items:center;gap:10px;margin:10px 0;font-size:14px}

.bfb.bad{color:var(--bad,#b3342b)}

.opt.thunk{animation:thunk .35s}
@keyframes thunk{0%{transform:scale(1.07)}60%{transform:scale(.97)}100%{transform:scale(1)}}

@keyframes sealin{0%{transform:scale(.3) rotate(-25deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
}

.repline{margin:18px 0 6px;text-align:center;font-size:13px}

.wordmark{display:inline-block;font:800 clamp(28px,8vw,44px)/1 var(--font-display);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);border:4px solid var(--accent);border-radius:10px;padding:9px 14px 7px;transform:rotate(-2.5deg);box-shadow:inset 0 0 0 3px var(--bg),inset 0 0 0 5px var(--accent);margin:2px 0 16px}

}

o the street for a photo.","field":"Field notes pending: sidewalk surfaces and curb cuts have not been checked on foot yet.","q":{"prompt":"Find the historical marker on the arch's support column. What year is it dated?","options":["1926","1949","1987","2001"],"answer":2,"hint":"The marker is at eye level on the east side of the east column.","verify":"Listed on HMDB (marker dated Aug 8, 1987). Confirm on site."},"then":{"yr":"1973","label":"The second arch","line":"This 1963 arch stood until the current one replaced it in 1987. Photo taken in June 1973.","ph":{"k":"sign1973","by":"Michael Holley (Swtpc6800)","lic":"CC0","lu":"http://creativecommons.org/publicdomain/zero/1.0/","page":"https://commons.wikimedia.org/wiki/File:Reno_Biggest_Little_City_Sign_Day_1973.jpg","note":"resized"},"link":{"t":"See the 1926 arch in UNLV Special Collections","u":"https://special.library.unlv.edu/node/535788"}},"now":{"yr":"1987","label":"Today's arch","line":"The arch over Virginia Street went up in 1987 and has been relit and repainted since. Photo taken in 2021.","ph":{"k":"arch_now","by":"Missvain","lic":"CC BY 4.0","lu":"https://creativecommons.org/licenses/by/4.0/","page":"https://commons.wikimedia.org/wiki/File:Reno_Arch_-_2021-10-17_-_Sarah_Stierch.jpg","note":"resized"}},"story":["On October 23, 1926, Reno raised a steel arch over Virginia Street. It marked the completion of the Lincoln and Victory Highways and helped promote a 1927 highways exposition.","When the exposition ended, residents had grown fond of the arch, so the city kept it and ran a slogan contest. An entrant from Sacramento named Burns won $100 for \"Reno, The Biggest Little City in the World.\"","A larger arch with plastic panels and a rotating star replaced the first one in 1963. The arch you are standing under today was installed in 1987."],"fact":"The 1963 arch was donated to Willits, California. The town changed its slogan to welcome visitors to the redwoods.","disputed":"Sources disagree on when the famous slogan first appeared on the arch. One says June 1929. Another describes it as part of the arch from 1926.","claims":[{"t":"The first Reno Arch was built in 1926.","a":0,"why":"Several sources agree on October 23, 1926."},{"t":"The arch switched to LED lights in 2018.","a":1,"why":"One source says 2009 and another says 2018. Until a city record settles it, treat it as disputed."}],"sources":[{"t":"Wikipedia: Reno Arch","u":"https://en.wikipedia.org/wiki/Reno_Arch"},{"t":"Travel Nevada: Reno Arch","u":"https://travelnevada.com/historical-interests/reno-arch/"},{"t":"Reno Historical: the arch","u":"https://www.renohistorical.org/items/show/106"},{"t":"SkyscraperPage: Reno Arch","u":"https://skyscraperpage.com/b185627"},{"t":"UNLV Northern Nevada Neon: 2018 arch photo record","u":"https://special-delta.library.unlv.edu/node/547075"}],"card":{"a":"1973","b":"2021","la":"The 1963 arch","lb":"Lit-up arch today"}},{"id":"depot","name":"Reno Train Depot","short":"Train Depot","badge":"Train Depot","tag":"Stop 2 of 4","teaser":"The reason Reno exists: the railroad reached here in 1868.","map":"Amtrak Station, 280 N Center St, Reno, NV","clue":"Walk to the downtown Reno train station, the tan Spanish-style building beside the tracks, a few blocks from the arch.","safety":"Stay on public sidewalks and away from the tracks. Trains pass here, so keep behind the fences and cross streets only at crosswalks.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"Look at the building's style and the tracks. In what year did Southern Pacific build the current depot?","options":["1926","1868","1931","2006"],"answer":0,"hint":"The same decade as Reno's first arch.","verify":"Wikipedia and a historical marker say the current depot was built in 1926. Confirm on site. Written from sources, not yet checked on site."},"then":{"yr":"1931","label":"Passengers then","line":"Travelers beside the station on September 7, 1931.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"re_dp_then","by":"Relative of John Atherton","lic":"CC BY-SA 2.0","lu":"https://creativecommons.org/licenses/by-sa/2.0/","page":"https://commons.wikimedia.org/wiki/File:Reno,_Nevada,_railroad_station,_1931.jpg","note":"resized"}},"now":{"yr":"2014","head":"Today","label":"The depot today","line":"The Southern Pacific depot, now used by Amtrak.","ph":{"k":"re_dp_now","by":"Jon Roanhaus","lic":"CC BY-SA 3.0","lu":"https://creativecommons.org/licenses/by-sa/3.0/","page":"https://commons.wikimedia.org/wiki/File:SP_Railroad_Depot.jpg","note":"resized"}},"story":["Reno began as a railroad town. When the first transcontinental railroad reached the Truckee Meadows in 1868, a depot stood at this site. Myron Lake, who owned a toll bridge nearby, gave the Central Pacific Railroad land for it, and lots in the new town were auctioned on May 9.","A bigger Depot Hotel replaced the first wooden depot, burned in the Great Fire of 1879, was rebuilt, and burned again in May 1889. After that the railroad built a one-story brick station with a slate roof, and a new depot opened that December.","The current stucco depot was built by the Southern Pacific in 1926 in a Mission and Spanish Revival style. In the 2007 ReTRAC project the tracks were lowered below ground through downtown. The depot was added to the National Register of Historic Places on November 12, 2012, and Amtrak's California Zephyr stops here."],"fact":"Reno's street railway ran to the depot from 1908 to 1925.","disputed":"Wikipedia lists the station as opened in 1868, but the building you see dates from 1926. Amtrak's move into it is dated January 2006 on a marker, and 2007 for the renovation in Wikipedia.","claims":[{"t":"A depot has stood on this spot since 1868.","a":0,"why":"Wikipedia and a historical marker: the first depot arrived with the railroad in 1868."},{"t":"The train tracks still run at street level through downtown Reno.","a":2,"why":"They were lowered below ground in the 2007 ReTRAC project."}],"sources":[{"t":"Wikipedia: Reno station","u":"https://en.wikipedia.org/wiki/Reno_station"},{"t":"Historical Marker Database: Reno depots","u":"https://www.hmdb.org/m.asp?m=167822"}],"card":{"a":"1868","b":"1926","la":"First depot","lb":"Current depot built"}},{"id":"bridge","name":"Virginia Street Bridge","short":"Bridge","badge":"Virginia St Bridge","tag":"Stop 3 of 4","teaser":"A crossing older than the city.","map":"Virginia Street Bridge, Reno NV","clue":"Walk south from the first arch until the street crosses the water. This crossing is older than the city itself, and a famous legend is tied to it.","safety":"Use the sidewalk and stay behind the railing. Do not lean over, climb, or throw anything into the river.","field":"Field notes pending: sidewalk width and ramps have not been checked on foot yet.","q":{"prompt":"Look for the giant word sculpture in City Plaza, next to the bridge. What word does it spell?","options":["DREAM","RENO","WELCOME","BELIEVE"],"answer":3,"hint":"Its letters are about 12 feet tall.","verify":"This Is Reno (May 2016) says the BELIEVE sculpture was moved to City Plaza, northeast of the bridge. Sculptures can move, so confirm on site."},"then":{"yr":"1910","label":"The 1905 bridge","line":"About five years after it opened, with the old Riverside Hotel rising behind it. Photo from around 1910.","ph":{"k":"bridge_1910","by":"Mella Harmon, via the Online Nevada Encyclopedia","lic":"Public domain","lu":"https://commons.wikimedia.org/wiki/File:Virginia_Street_Bridge_Reno.jpg","page":"https://commons.wikimedia.org/wiki/File:Virginia_Street_Bridge_Reno.jpg"},"link":{"t":"See real archive photos at Reno Historical","u":"https://www.renohistorical.org/items/show/22"}},"now":{"yr":"2015","head":"Before 2015","label":"The 1905 bridge, last look","line":"The concrete bridge as documented for the Historic American Engineering Record before it was replaced. The new bridge opened April 12, 2016, with four restored light fixtures from the 1905 one. It has no free photo yet.","ph":{"k":"bridge_haer","by":"Library of Congress, HAER NV-14-3","lic":"Public domain","lu":"https://commons.wikimedia.org/wiki/File:Virginia_Street_Bridge.jpg","page":"https://commons.wikimedia.org/wiki/File:Virginia_Street_Bridge.jpg"}},"story":["In 1860, Charles Fuller built the first bridge here. Myron Lake took over in 1861 and charged tolls. In 1868 the railroad founded the town of Reno beside this crossing.","An iron bridge arrived in 1877. In 1905 a concrete bridge designed by John B. Leonard replaced it. It was one of the first reinforced concrete bridges in Nevada and joined the National Register of Historic Places in 1980.","In 2015 the 1905 bridge was torn down as part of a flood control plan. The new bridge opened in April 2016. A 12-foot word sculpture reading BELIEVE, by Laura Kimpton and Jeff Schomberg, was moved to City Plaza beside the new bridge in May 2016.","Reno was once called the Divorce Capital of the World. A popular legend says newly divorced people tossed their wedding rings into the river from this bridge. Books and movies helped spread the story, including a 1929 novel and the 1961 film The Misfits."],"fact":"The 2016 bridge cost about $18.3 million and is 166 feet long.","disputed":"The ring-tossing story is a legend. The sources we found do not say how often it happened, if at all.","claims":[{"t":"The 1905 bridge was torn down in 2015.","a":0,"why":"Reno Historical and the Northern Nevada Business Weekly both report it."},{"t":"Newly divorced people regularly threw wedding rings off this bridge.","a":1,"why":"It is a well-known legend, but the sources we found do not confirm it."}],"sources":[{"t":"Reno Historical: Virginia Street Bridge","u":"https://www.renohistorical.org/items/show/22"},{"t":"Northern Nevada Business Weekly: Virginia Street's bridges","u":"https://nnbw.com/news/2017/sep/14/renos-roots-intertwined-with-virginia-streets-brid"},{"t":"This Is Reno: BELIEVE gets a home","u":"https://thisisreno.com/2016/05/art-dedicated-virginia-street-bridge-believe-gets-home"}],"card":{"a":"1910","b":"2015","la":"The 1905 bridge","lb":"Last look before 2015"}},{"id":"park","name":"Wingfield Park","short":"Park","badge":"Wingfield Park","tag":"Stop 4 of 4","teaser":"An island that has been a resort and a runway.","map":"Wingfield Park, 2 N Arlington Ave, Reno NV","clue":"Find the island in the middle of the river. It has been a resort, a runway, and a park. Look for the outdoor stage.","safety":"Stay away from the water's edge. River levels and currents can change quickly, so keep close together.","field":"Field notes pending: paths and surfaces have not been checked on foot yet.","q":{"prompt":"Read the marker on West 1st Street. What was this island before it became a city park?","options":["A lumber mill","An amusement park (Belle Isle)","A rodeo ground","A fish hatchery"],"answer":1,"hint":"The island's old name was Belle Isle.","verify":"Listed on HMDB (city acquired Belle Isle in 1920). Confirm on site."},"then":{"yr":"1935","label":"The river dam by the park","line":"A hand-tinted photo of the Truckee River dam at Wingfield Park, around 1935.","ph":{"k":"park_dam","by":"WaterArchives.org","lic":"CC BY-SA 2.0","lu":"https://creativecommons.org/licenses/by-sa/2.0/","page":"https://commons.wikimedia.org/wiki/File:(NEVADA-A-0307)_Wingfield_Park_Dam_(Truckee_River_Dam).jpg","note":"resized"},"link":{"t":"See real archive photos at Reno Historical","u":"https://www.renohistorical.org/items/show/39"}},"now":{"yr":"2015","label":"The river today","line":"The Truckee River beside downtown Reno, near Wingfield Park. Photo taken in 2015.","ph":{"k":"park_a","by":"Ken Lund","lic":"CC BY-SA 2.0","lu":"https://creativecommons.org/licenses/by-sa/2.0/","page":"https://commons.wikimedia.org/wiki/File:Truckee_River,_Reno,_Nevada_(18979480279).jpg","note":"resized"}},"story":["Before it was a park, this island was a resort called Belle Isle. By 1911 it had a dance hall, an open-air theater with 700 seats, and boats to rent. Visitors crossed on a footbridge.","In July 1911, aviation pioneer Eugene Ely used part of the island as a runway. A roller skating rink opened in 1912.","George Wingfield bought the island in 1920 and gave it to the city. In the late 1930s, Works Progress Administration crews built retaining walls to hold the river banks in place."],"fact":"The amphitheater is named for Glenn Little, a longtime performer and director of the Reno Municipal Band.","disputed":"","claims":[{"t":"Aviation pioneer Eugene Ely used part of this park as a runway in 1911.","a":0,"why":"Reno Historical lists it in the park's history."},{"t":"The park has always been called Wingfield Park.","a":2,"why":"It was Belle Isle first and was renamed after Wingfield gave it to the city in 1920."}],"sources":[{"t":"Reno Historical: Wingfield Park","u":"https://www.renohistorical.org/items/show/39"},{"t":"Living New Deal: Wingfield Park","u":"https://livingnewdeal.org/?p=81196"}],"card":{"a":"1935","b":"2015","la":"Hand-tinted dam photo","lb":"The river today"}}],"ranks":[[0,"Out-of-towner"],[100,"Sidewalk Scholar"],[250,"Downtown Detective"],[450,"Arch Expert"],[600,"Biggest Little Historian"]],"heroKey":"hero","heroAlt":"Downtown Reno skyline with the Sierra beyond","heroLi":"<li>Skyline at the top: Kc0616 · <a target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by/3.0/\">CC BY 3.0</a> · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:Reno_skyline.JPG\">Source</a></li>","heroCredit":"Skyline: Kc0616 · <a target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by/3.0/\">CC BY 3.0</a> · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:Reno_skyline.JPG\">Source</a>","mission":"Find four downtown landmarks. At each one, check in to earn its badge, unlock its story, and collect a Time Card. Do them in any order. Everything stays on this phone.","afterDone":"All four badges earned. Try Virginia City next.","safetyNote":"<li>Every stop is outdoors. Downtown has casinos, and minors generally cannot be on gaming floors, so none of the stops go inside one.</li>","badgeMap":{"arch":["arch_now","50% 28%"],"bridge":["bridge_1910","55% 70%"],"park":["park_a","50% 62%"],"depot":["re_dp_now","50% 45%"]},"level":"Classics","region":"The West"},"vc":{"id":"vc","name":"Virginia City","explorer":"Comstock Explorer","initials":"VC","stops":[{"id":"cstreet","name":"C Street","short":"C Street","badge":"C Street","tag":"Stop 1 of 4","teaser":"The main street of a silver boom town.","map":"C Street, Virginia City, NV","clue":"Find the main street of Virginia City. Its name is just one letter. Two- and three-story brick buildings line it, and most of them went up after a huge fire in 1875.","safety":"Sidewalks are narrow and steep in places, and cars share the road. Cross only at corners. The town sits at about 6,100 feet, so bring water. Saloons and casinos are for adults, so stay out of them. None of the stops need you to go inside.","field":"Field notes pending: sidewalk surfaces and slopes have not been checked on foot yet.","q":{"prompt":"Find the 'Great Fire of 1875' marker on the old hose house. What does it say started the fire?","options":["A lightning strike","A knocked-over coal oil lamp","A mine explosion","A fireworks accident"],"answer":1,"hint":"It started in a boarding house, on a morning in October.","verify":"Nevada SHPO marker No. 228, near where the fire began. The street is not given. Confirm location and wording on site."},"then":{"ph":{"k":"vc_cs_then","by":"I. W. Taber (stereo card)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Panorama_of_Virginia_City,_by_Taber,_I._W._(Isaiah_West),_1830-1912.jpg","note":"cropped and resized"},"yr":"Old view","label":"Virginia City from the hills","line":"The archive dates this stereo photo somewhere between 1867 and 1920. About 25,000 people lived here in the mid-1870s, before the Great Fire.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/search/?q=Virginia%20City%20Nevada&co=hh"}},"now":{"yr":"1961","head":"Today","label":"A National Historic Landmark","line":"The whole historic district became a National Historic Landmark on July 4, 1961. Photo taken in 2015.","ph":{"k":"vc_cs_now","by":"Famartin","lic":"CC BY-SA 4.0","lu":"https://creativecommons.org/licenses/by-sa/4.0/","page":"https://commons.wikimedia.org/wiki/File:2015-10-30_13_48_37_View_north_along_C_Street_(Nevada_State_Route_341)_between_Taylor_Street_and_Union_Street_in_Virginia_City,_Nevada.jpg","note":"resized"}},"story":["Silver was found here in 1859, and the Comstock Lode set off the first big silver rush. Virginia City was incorporated in February 1861.","By the mid-1870s more than 25,000 people lived here. On October 26, 1875, the Great Fire burned much of the town, did about $12 million in damage, and left about 2,000 people homeless.","The town was rebuilt. Most buildings along C Street are two- and three-story brick. Today about 800 people live here, at roughly 6,100 feet above sea level."],"fact":"One year after the town was founded, it reportedly had 42 saloons, 42 stores, 6 restaurants, 3 hotels, and 868 homes.","disputed":"The story goes that the town was named when \"Old Virginny\" Finney broke a whiskey bottle at a saloon near Gold Hill. That is local folklore. The settlement also went by earlier names, such as Pleasant Hill and Mount Pleasant Point.","claims":[{"t":"The Great Fire of Virginia City happened on October 26, 1875.","a":0,"why":"Sources agree on the date and on about $12 million in damage."},{"t":"Henry Comstock discovered the Comstock Lode.","a":2,"why":"Peter O'Riley and Patrick McLaughlin are credited with the discovery. Comstock later attached his name to it and claimed a share."}],"sources":[{"t":"Wikipedia: Virginia City, Nevada","u":"https://en.wikipedia.org/wiki/Virginia_City,_Nevada"},{"t":"Wikipedia: Virginia City Historic District","u":"https://en.wikipedia.org/wiki/Virginia_City_Historic_District_(Virginia_City,_Nevada)"}],"card":{"a":"1875","b":"1961","la":"The boom years","lb":"National Historic Landmark"}},{"id":"enterprise","name":"Territorial Enterprise","short":"Enterprise","badge":"Territorial Enterprise","tag":"Stop 2 of 4","teaser":"Where a young writer became Mark Twain.","map":"Mark Twain Museum, C Street, Virginia City, NV","clue":"Walk along C Street and look for the old newspaper building, now a museum with a famous writer's name on it.","safety":"Stay on the sidewalk. The museum is optional and has its own hours and rules. Look from the street.","field":"Field notes pending: the exact viewing spot has not been checked on foot yet.","q":{"prompt":"Find the marker about Mark Twain. In what year does it say he first used that name?","options":["1859","1864","1875","1863"],"answer":3,"hint":"It is the year before he left the paper.","verify":"Nevada Centennial Marker No. 28 (placed 1960). Its exact location was not found. Confirm on site."},"then":{"ph":{"k":"vc_ent_then","by":"Robert W. Kerrigan (HABS)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Historic_American_Buildings_Survey_Robert_W._Kerrigan,_Photographer_March_1937_-_Mark_Twain_%22Enterprise%22_Building,_C_Street,_Virginia_City,_Storey_County,_NV_HABS_NEV,15-VIRG,6-1.tif","note":"resized"},"yr":"1937","label":"The building in 1937","line":"On February 3, 1863, a letter in this paper was signed \"Mark Twain\" for the first time. This photo of the building was taken in March 1937.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/search/?q=Mark%20Twain%20Enterprise%20Building%20Virginia%20City"}},"now":{"yr":"Today","head":"Today","label":"Mark Twain Museum","line":"A Mark Twain Museum operates in the original Territorial Enterprise building. Photo taken in 2010.","ph":{"k":"vc_ent_now","by":"Jaydec","lic":"CC BY-SA 3.0","lu":"https://creativecommons.org/licenses/by-sa/3.0/","page":"https://commons.wikimedia.org/wiki/File:Territorial_Enterprise,_2010.JPG","note":"resized"}},"story":["The Territorial Enterprise was founded on December 18, 1858, in Genoa, then part of Utah Territory. It moved to Carson City in 1859 and to Virginia City in 1860.","In 1862 a young writer named Sam Clemens began sending letters to the paper, and that fall he accepted a job as city editor. On February 3, 1863, he signed a funny letter about a party \"Mark Twain\" for the first time.","He wrote for the paper until 1865, working alongside the writer Dan DeQuille. The two shared a room on North B Street, steps from the newspaper office."],"fact":"The paper started in Genoa, Nevada, and moved twice before it landed in Virginia City.","disputed":"One list dates the newspaper building to 1862 and another to the 1870s. We could not find a record that settles it.","claims":[{"t":"Mark Twain first signed a letter with that name on February 3, 1863.","a":0,"why":"Both the Mark Twain at the Territorial Enterprise page and History.com report that date."},{"t":"Twain lived inside the newspaper building.","a":2,"why":"One source says he and Dan DeQuille shared a room on North B Street, steps from the office."}],"sources":[{"t":"Wikipedia: Territorial Enterprise","u":"https://en.wikipedia.org/wiki/Territorial_Enterprise"},{"t":"Wikipedia: Mark Twain at the Territorial Enterprise","u":"https://en.wikipedia.org/wiki/Mark_Twain_at_the_Territorial_Enterprise"},{"t":"History.com: Mark Twain begins reporting in Virginia City","u":"https://www.history.com/this-day-in-history/february-3/mark-twain-begins-reporting-in-virginia-city"}],"card":{"a":"1863","b":"Today","la":"A new pen name","lb":"Mark Twain Museum"}},{"id":"piper","name":"Piper's Opera House","short":"Piper","badge":"Piper's Opera House","tag":"Stop 3 of 4","teaser":"A theater that burned down twice.","map":"Piper's Opera House, Virginia City, NV","clue":"Find the big theater at the corner of B Street and a cross street. Two earlier opera houses on the spot burned down. This is the third.","safety":"Stay on the sidewalk and cross at the corner. Hills here are steep, so watch your footing. Look at the building from outside.","field":"Field notes pending: curb cuts and the viewing spot have not been checked on foot yet.","q":{"prompt":"Find the Nevada State Historic Marker at the opera house. What number is it?","options":["236","28","228","797"],"answer":0,"hint":"It is a three-digit number between 200 and 300.","verify":"Marker 236 at 12 N. B Street per noehill.com. Confirm on site."},"then":{"ph":{"k":"vc_pip_then","by":"Robert W. Kerrigan (HABS)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Piper%27s_Opera_House.jpg","note":"resized"},"yr":"1937","label":"The third Piper's","line":"It opened with a grand ball on March 6, 1885. This photo was taken in March 1937 for a historic buildings survey.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/search/?q=Piper%27s%20Opera%20House%20Virginia%20City"}},"now":{"yr":"1997","head":"Today","label":"A working theater","line":"A nonprofit bought it in 1997, and it is a performing arts venue today. Photo taken in 2009.","ph":{"k":"vc_pip_now","by":"Vivaverdi","lic":"CC BY 3.0","lu":"https://creativecommons.org/licenses/by/3.0/","page":"https://commons.wikimedia.org/wiki/File:Virginia_City-Pipers_Opera_House-1885.JPG","note":"resized"}},"story":["John Piper's first opera house opened here in 1863. It burned in the Great Fire of October 26, 1875. A second one opened on January 28, 1878 and burned on March 13, 1883.","The building you see today opened with a grand ball on March 6, 1885. It switched from gas to electric lighting in 1900.","Mark Twain lectured on the original stage in 1866 and again in 1868. Later stars included Edwin Booth, Lillie Langtry, John Philip Sousa, and Al Jolson. It joined the National Register of Historic Places on March 21, 1997."],"fact":"In 1897, the boxer Gentleman Jim Corbett trained here for a big fight against Bob Fitzsimmons.","disputed":"A famous theater man named David Belasco later published sensational stories about his time here. Historians treat his recollections as unreliable.","claims":[{"t":"The Piper's Opera House you can visit opened in 1885.","a":0,"why":"The current building opened with a grand ball on March 6, 1885."},{"t":"The same building has stood here since 1863.","a":2,"why":"The first two opera houses burned, in 1875 and 1883."}],"sources":[{"t":"Wikipedia: Piper's Opera House","u":"https://en.wikipedia.org/wiki/Piper%27s_Opera_House"},{"t":"National Park Service: National Register record for Piper's Opera House","u":"https://npgallery.nps.gov/AssetDetail/NRIS/97000217"}],"card":{"a":"1885","b":"1997","la":"The third Piper's","lb":"A working theater"}},{"id":"school","name":"Fourth Ward School","short":"School","badge":"Fourth Ward School","tag":"Stop 4 of 4","teaser":"A four-story school with a steep roof.","map":"537 S C St, Virginia City, NV","clue":"Look for a big four-story school building on the south end of C Street. It has a steep roof and a lot of windows. It was built in 1876 for more than 1,000 students.","safety":"Stay on public sidewalks. The museum inside is optional and has its own hours. Do not climb fences or go into any old mine sites around town.","field":"Field notes pending: sidewalk slope and the viewing spot have not been checked on foot yet.","q":{"prompt":"The marker in the museum's parking area says the school closed in what year?","options":["1876","1875","1936","1986"],"answer":2,"hint":"It closed during the Great Depression, after enrollment dropped below 200.","verify":"HMDB marker at 537 S. C Street. Confirm on site."},"then":{"ph":{"k":"vc_sch_then","by":"Robert W. Kerrigan (HABS)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Historic_American_Buildings_Survey_Robert_W._Kerrigan,_Photographer_March_1937_(NO_LONGER_IN_USE)_-_Fourth_Ward_School,_South_C_Street_at_Highway_17,_Virginia_City,_Storey_County,_HABS_NEV,15-VIRG,8-1.tif","note":"resized"},"yr":"1937","label":"The school in 1937","line":"Built in 1876 for more than 1,000 students, with indoor plumbing and central heat. This photo was taken in March 1937.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/search/?q=Fourth%20Ward%20School%20Virginia%20City"}},"now":{"yr":"1986","head":"Reopened","label":"A school museum","line":"The school reopened in 1986 as the Historic Fourth Ward School Museum. Photo from the Library of Congress, taken between 1980 and 2006.","ph":{"k":"vc_sch_now","by":"Carol M. Highsmith","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Fourth_Ward_School,_Virginia_City,_Nevada_LCCN2011631000.jpg","note":"resized"}},"story":["The Fourth Ward School was built in 1876 in the Second Empire style, with a steep mansard roof and four stories. The architect was C. M. Bennett.","It was designed for more than 1,000 students. It had indoor plumbing, drinking fountains, gas lighting, and central heat. The last class graduated in 1936, and students moved to a new school.","The building sat closed and falling apart for years. In 1986 it reopened as the Historic Fourth Ward School Museum at 537 South C Street."],"fact":"One building held primary school, grammar school, and high school under the same roof.","disputed":"Some pages call it the last wood-built school of its design in the United States. We could not find a source that backs that up.","claims":[{"t":"The Fourth Ward School graduated its last class in 1936.","a":0,"why":"The school page gives 1936, when students moved to a new school."},{"t":"It is the last wood-built school of its design in the whole country.","a":1,"why":"Some pages say so, but we found no source that backs it up."}],"sources":[{"t":"Wikipedia: Fourth Ward School (Virginia City, Nevada)","u":"https://en.wikipedia.org/wiki/Fourth_Ward_School_(Virginia_City,_Nevada)"},{"t":"Wikipedia: Virginia City, Nevada","u":"https://en.wikipedia.org/wiki/Virginia_City,_Nevada"}],"card":{"a":"1876","b":"1986","la":"A brand-new school","lb":"A school museum"}}],"ranks":[[0,"Tenderfoot"],[100,"Prospector"],[250,"Pick and Shovel"],[450,"Comstock Scholar"],[600,"Silver State Historian"]],"heroKey":"vc_hero","heroAlt":"Old stereo photograph of Virginia City from the hills, with mine dumps in front","heroLi":"<li>Header: C. E. Watkins stereo card, cropped and resized · Public domain · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:Panorama_at_Virginia_City,_by_Watkins,_Carleton_E.,_1829-1916.jpg\">Source</a></li>","heroCredit":"Photo: C. E. Watkins · <a target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/publicdomain/mark/1.0/\">Public domain</a> · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:Panorama_at_Virginia_City,_by_Watkins,_Carleton_E.,_1829-1916.jpg\">Source</a>","mission":"Find four landmarks in an old silver boom town. At each one, check in to earn its badge, unlock its story, and collect a Time Card. Do them in any order. Everything stays on this phone.","afterDone":"All four badges earned. Lake Tahoe is coming next.","safetyNote":"<li>Every stop is outdoors on public sidewalks. The town is at about 6,100 feet, so bring water. Saloons and casinos are for adults, and none of the stops go inside one. Stay out of old mine sites and fenced areas.</li>","badgeMap":{"cstreet":["vc_cs_now","50% 55%"],"enterprise":["vc_ent_now","50% 30%"],"piper":["vc_pip_now","50% 50%"],"school":["vc_sch_now","50% 50%"]},"level":"Hidden Gems","region":"The West"},"tahoeicons":{"id":"tahoeicons","name":"Tahoe Classics","explorer":"Lake Tahoe Explorer","initials":"LT","stops":[{"id":"emerald","name":"Emerald Bay","short":"Emerald Bay","badge":"Emerald Bay","tag":"Stop 1 of 4","teaser":"The famous blue bay with a tiny island in it.","map":"Emerald Bay State Park, Highway 89, South Lake Tahoe, CA","clue":"Drive Highway 89 along the lake's southwest shore to the big overlook above a deep blue bay. A single tiny island sits in the middle, and a stone mansion hides on the shore below.","safety":"Highway 89 is narrow and winding, and the overlook parking fills up. Park only in marked spots, watch for people crossing the road, and keep behind the barriers at the overlook. The trail down to Vikingsholm is steep, so follow the signs and bring water. The lake is cold all year.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"Look out over the bay. How many islands can you see in Emerald Bay?","options":["1","2","3","5"],"answer":0,"hint":"The one you see is the only island in all of Lake Tahoe.","verify":"Wikipedia: Fannette Island is the only island in Lake Tahoe. Count on site."},"then":{"yr":"1910","label":"The bay then","line":"A steamer at the pier in Emerald Bay, about 1910.","link":{"t":"Look for historic photos at the Lake Tahoe Historical Society","u":"https://www.laketahoemuseum.org/"},"ph":{"k":"ti_em_then","by":"Unknown","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Emerald_Bay,_Lake_Tahoe,_steamer_at_pier_LCCN2007660509.tif","note":"resized"}},"now":{"yr":"2011","head":"Today","label":"The bay from the overlook","line":"The view of the bay and Fannette Island. Photo taken on July 26, 2011.","ph":{"k":"ti_em_now","by":"DimiTalen","lic":"CC0","lu":"https://creativecommons.org/publicdomain/zero/1.0/","page":"https://commons.wikimedia.org/wiki/File:Emerald_Bay_2011.jpg","note":"resized"}},"story":["Emerald Bay is a glacier-carved inlet, about 1.7 miles long. It is part of a 1,533-acre California state park established in 1953. In 1969 it was named a National Natural Landmark.","Down at the shore is Vikingsholm, a 38-room Scandinavian-style mansion built in the summer of 1929 by Lora Josephine Knight. She bought 240 acres in the bay for $250,000. The architect was Lennart Palme, a relative by marriage.","Knight also built a small tea house on Fannette Island. The island has had several names. The first to stick, Coquette, was thought up by vacationers in 1866, and the current name is believed to be a misreading of it."],"fact":"In 1994 the bay's water was added to the park, making it one of the first underwater parks of its kind in California.","disputed":"Sources disagree on where the name Fannette comes from. The common theory is that it is a mix-up of the earlier name Coquette, but that is a belief, not a proven fact.","claims":[{"t":"Emerald Bay has the only island in Lake Tahoe.","a":0,"why":"Fannette Island is the only island in Lake Tahoe, according to Wikipedia."},{"t":"Vikingsholm was built in the 1800s.","a":2,"why":"It was built in the summer of 1929 by Lora Josephine Knight."}],"sources":[{"t":"Wikipedia: Emerald Bay (Lake Tahoe)","u":"https://en.wikipedia.org/wiki/Emerald_Bay_(Lake_Tahoe)"},{"t":"Wikipedia: Lora Josephine Knight","u":"https://en.wikipedia.org/wiki/Lora_Josephine_Knight"},{"t":"Visit Lake Tahoe: Origins of Lake Tahoe's places","u":"https://visitlaketahoe.com/attractions/the-origins-of-lake-tahoes-most-popular-places/"}],"card":{"a":"1929","b":"1953","la":"Vikingsholm built","lb":"State park"}},{"id":"caverock","name":"Cave Rock","short":"Cave Rock","badge":"Cave Rock","tag":"Stop 2 of 4","teaser":"A sacred rock with a highway tunnel drilled through it.","map":"Cave Rock Lake Tahoe Nevada State Park, US-50, NV","clue":"Drive to the Nevada side of the lake on Highway 50 and find the big volcanic rock that the road goes through, near the boat launch.","safety":"Park only at the boat launch lot and keep off Highway 50, which has tunnels and narrow shoulders. Do not climb the rock. Climbing is banned, and the Washoe consider it sacred.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"Look at how Highway 50 gets past the rock. What does it do?","options":["Goes over the top","Goes through tunnels","Crosses on a ferry","Hangs on a bridge above the water"],"answer":1,"hint":"Look for the dark openings in the rock face.","verify":"The state park and Wikipedia both say US 50 passes through tunnels. Confirm on site. Written from sources, not yet checked on site."},"then":{"yr":"1870","label":"The rock then","line":"Cave Rock in a photograph from about 1870, before any tunnel.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"ti_cv_then","by":"Thomas Houseworth & Co.","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Cave_Rock,_Eastern_shore_of_Lake_Tahoe,_by_Thomas_Houseworth_&_Co..jpg","note":"resized, cropped to one frame of a stereoview"}},"now":{"yr":"2008","head":"Today","label":"The rock today","line":"Highway 50 passes through the rock in a tunnel.","ph":{"k":"ti_cv_now","by":"Davemeistermoab","lic":"CC BY-SA 4.0","lu":"https://creativecommons.org/licenses/by-sa/4.0/","page":"https://commons.wikimedia.org/wiki/File:Caverock.JPG","note":"resized"}},"story":["Cave Rock is sacred to the Washoe people. Wikipedia says tribal leaders were not consulted about the highway tunnels. The old Washoe trail and Johnson's Cut-Off Road went over the rock, while the Lake Tahoe Wagon Road and the Lincoln Highway went around it.","The first tunnel opened in 1931 and carries traffic through the rock. Construction of the second tunnel began in 1957. The westbound tunnel is 153 feet long and the eastbound one is 410 feet. The tunnels sit at about 6,360 feet above sea level, about 80 feet above the lake.","In 1967 the Nevada Legislature gave the boat launch and parking area to the state park system. The U.S. Forest Service banned rock climbing equipment on February 9, 1997, and the state says climbing has been prohibited under all circumstances since September 2, 2003."],"fact":"The second tunnel cost just over $450,000.","disputed":"Sources differ on the climbing ban: the state park history says September 2, 2003, and Wikipedia mentions a 2007 federal ruling. Both agree that climbing is not allowed.","claims":[{"t":"Cave Rock is a sacred place to the Washoe people.","a":0,"why":"Wikipedia: the Washoe Tribe considers Cave Rock sacred."},{"t":"Visitors may climb Cave Rock if they bring the right gear.","a":2,"why":"Climbing has been prohibited under all circumstances since 2003."}],"sources":[{"t":"Wikipedia: Cave Rock Tunnel","u":"https://en.wikipedia.org/wiki/Cave_Rock_Tunnel"},{"t":"Nevada State Parks: History of Cave Rock","u":"https://parks.nv.gov/learn/park-histories/cave-rock-history"}],"card":{"a":"1931","b":"1957","la":"First tunnel","lb":"Second tunnel begun"}},{"id":"kingsbeach","name":"Kings Beach","short":"Kings Beach","badge":"Kings Beach","tag":"Stop 3 of 4","teaser":"A long sandy beach on the north shore, named for a postmaster.","map":"Kings Beach State Recreation Area, Kings Beach, CA","clue":"Go to the north shore, in California, near the Nevada line. A wide sandy beach with a view straight across the lake is right next to the main road.","safety":"The beach is next to Highway 28, so cross only at marked crossings and watch for cars and bikes. The water is cold. Keep an eye on younger kids near the water.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"Lake Tahoe's surface sits at about how many feet above sea level?","options":["About 2,000","About 4,500","About 6,225","About 9,500"],"answer":2,"hint":"You are in the high Sierra. Your phone's altitude may show a similar number.","verify":"Wikipedia gives 6,225 feet for the lake surface. A phone's altitude may be off by a few hundred feet."},"then":{"yr":"1972","label":"A pier near Kings Beach","line":"A pier and small hut on the north shore in May 1972. The photo is labeled as near Kings Beach.","ph":{"k":"ti_kb_then","by":"Belinda Rain (U.S. National Archives)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Lake_Tahoe_Shore_Near_Kings_Beach_-_NARA_-_543514.jpg","note":"resized"},"link":{"t":"Look for historic photos at the North Lake Tahoe Historical Society","u":"https://northtahoemuseums.org/"}},"now":{"yr":"2012","head":"Today","label":"The beach today","line":"Kings Beach State Recreation Area on August 13, 2012.","ph":{"k":"ti_kb_now","by":"U.S. Department of the Interior","lic":"CC BY-SA 2.0","lu":"https://creativecommons.org/licenses/by-sa/2.0/","page":"https://commons.wikimedia.org/wiki/File:Kings_Beach_State_Recreation_Area,_Lake_Tahoe_in_2012.jpg","note":"resized"}},"story":["The town is named after its first postmaster, Joe King. It sits on the north shore at about 6,444 feet.","The post office was built in 1937. The 2020 census counted 3,563 residents.","Kings Beach is also a place where wildlife and people share space. In 2009 and 2010, beavers were removed from nearby Griff Creek, and local schoolchildren protested."],"fact":"Lake Tahoe is about 22 miles long, up to 12 miles wide, and 1,645 feet deep at its deepest.","disputed":"Our sources do not give an exact founding date for Kings Beach, so we do not claim one.","claims":[{"t":"Kings Beach is named after its first postmaster.","a":0,"why":"Wikipedia says it is named after its first postmaster, Joe King."},{"t":"Lake Tahoe is more than 3,000 feet deep.","a":2,"why":"The maximum depth is 1,645 feet, still the second deepest lake in the U.S."}],"sources":[{"t":"Wikipedia: Kings Beach, California","u":"https://en.wikipedia.org/wiki/Kings_Beach,_California"},{"t":"Wikipedia: Lake Tahoe","u":"https://en.wikipedia.org/wiki/Lake_Tahoe"}],"card":{"a":"1937","b":"1972","la":"Post office","lb":"Pier photo"}},{"id":"richardson","name":"Camp Richardson","short":"Camp Richardson","badge":"Camp Richardson","tag":"Stop 4 of 4","teaser":"A lakeside resort that has been welcoming visitors for a century.","map":"Camp Richardson Resort, Emerald Bay Rd, South Lake Tahoe, CA","clue":"On the south shore, a few miles west of the town of South Lake Tahoe, find a long beach with a marina, cabins and a lodge. Snowy peaks rise across the water.","safety":"Highway 89 runs beside the resort, so cross at marked spots and watch for bikes on the shared path. The water is cold. Stay on paths and out of private cabin areas.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"Stand on the beach and face the water. Which direction are you looking?","options":["South","West","North","East"],"answer":2,"hint":"Camp Richardson is on the lake's south shore. Use your phone's compass.","verify":"Camp Richardson is on the south shore, so facing the lake means facing north. Confirm with a compass on site."},"then":{"yr":"Survey photo","label":"The resort entrance","line":"A survey photo of the entrance to Camp Richardson Resort and Highway 89.","link":{"t":"Look for historic photos at the Lake Tahoe Historical Society","u":"https://www.laketahoemuseum.org/"},"ph":{"k":"ti_cr_then","by":"Historic American Buildings Survey (U.S. government)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://www.loc.gov/pictures/item/ca2192.photos.182550p/","note":"resized"}},"now":{"yr":"2014","head":"Today","label":"The beach today","line":"The beach at Camp Richardson with the Sierra across the water. Photo taken on February 17, 2014.","ph":{"k":"ti_cr_now","by":"Blake Everett","lic":"CC0","lu":"https://creativecommons.org/publicdomain/zero/1.0/","page":"https://commons.wikimedia.org/wiki/File:Camp_Richardson_Beach,_Lake_Tahoe.jpg","note":"resized"}},"story":["The resort is named after Captain Alonzo L. Richardson, who started a stage service from Placerville to South Lake Tahoe in 1921. He was also the first postmaster in the area.","An 1891 U.S. Geological Survey map shows the site as Yanks. The Camp Richardson post office ran from 1927 to 1973, with a closure in 1964 and 1965.","Today the resort has a marina, cabins, hotel rooms and a bar and grill, at about 6,250 feet above sea level."],"fact":"The Camp Richardson post office operated for almost half a century, from 1927 to 1973.","disputed":"Accounts differ on who gets credit for the resort's start. Richardson leased the land in 1921, but a later figure, Ray Kinsley, helped keep the area from being over-commercialized.","claims":[{"t":"Camp Richardson began in 1921.","a":0,"why":"Wikipedia says the camp was established in 1921 by Captain Alonzo Richardson."},{"t":"The site was always called Camp Richardson.","a":2,"why":"An 1891 USGS map labels it Yanks."}],"sources":[{"t":"Wikipedia: Camp Richardson, California","u":"https://en.wikipedia.org/wiki/Camp_Richardson,_California"},{"t":"Visit Lake Tahoe: Origins of Lake Tahoe's places","u":"https://visitlaketahoe.com/attractions/the-origins-of-lake-tahoes-most-popular-places/"}],"card":{"a":"1921","b":"1927","la":"Stage service","lb":"Post office opens"}}],"ranks":[[0,"Day Tripper"],[100,"Beach Walker"],[250,"Shore Scout"],[450,"Lake Keeper"],[600,"Tahoe Classics Historian"]],"heroKey":"ti_em_now","heroAlt":"Emerald Bay and Fannette Island under a blue sky","heroLi":"<li>Header: DimiTalen · <a target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/publicdomain/zero/1.0/\">CC0</a> · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:Emerald_Bay_2011.jpg\">Source</a> · resized</li>","heroCredit":"Photo: DimiTalen · <a target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/publicdomain/zero/1.0/\">CC0</a> · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:Emerald_Bay_2011.jpg\">Source</a>","mission":"Visit four of Lake Tahoe's best-known spots, one on each shore. At each one, check in to earn its badge, unlock its story, and collect a Time Card. Do them in any order. Everything stays on this phone.","afterDone":"All four badges earned. You have done the big four. Ready for the Hidden Gems?","safetyNote":"<li>These stops are spread around the lake, so plan the drive. Highway 89 and Highway 28 are busy and winding, so park in marked spots and cross at crosswalks. The lake is cold all year and the area is high, so bring water and sun protection.</li>","badgeMap":{"emerald":["ti_em_now","55% 55%"],"kingsbeach":["ti_kb_now","50% 60%"],"richardson":["ti_cr_now","50% 40%"],"caverock":["ti_cv_now","50% 45%"]},"level":"Classics","region":"The West"},"tahoe":{"id":"tahoe","name":"Tahoe Hidden Gems","explorer":"Tahoe City Explorer","initials":"TC","stops":[{"id":"commons","name":"Commons Beach","short":"Commons Beach","badge":"Commons Beach","tag":"Stop 1 of 4","teaser":"The pier where a lumber baron's railroad met the lake.","map":"Commons Beach Park, 400 North Lake Blvd, Tahoe City, CA","clue":"Walk to the lakefront park in Tahoe City. Look for the historical markers near the bike path and the old pier area.","safety":"Tahoe City sidewalks and North Lake Boulevard are busy. Cross only at marked crossings. Keep off the water's edge when waves or ice are present, and watch for bikes on the path.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"Read the Trains and Tourists marker. What kind of railway ran from Truckee
