to the pier at Tahoe City by 1902?","options":["Cable car","Monorail","Streetcar","Narrow gauge"],"answer":3,"hint":"Look for the word gauge on the sign.","verify":"From a historical marker's text. Confirm on site. Written from sources, not yet checked on site."},"then":{"yr":"1910","label":"The landing then","line":"The Tahoe City landing about 1910.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"ta_gt_then","by":"C. C. Pierce","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Tahoe_City_landing_in_Lake_Tahoe,_ca.1910_(CHS-1846).jpg","note":"resized"}},"now":{"yr":"2014","head":"Today","label":"The waterfront today","line":"The Tahoe City waterfront, with its marina and pier.","ph":{"k":"ta_cb_now","by":"Bohao Zhao","lic":"CC BY 3.0","lu":"https://creativecommons.org/licenses/by/3.0/","page":"https://commons.wikimedia.org/wiki/File:Tahoe_City_-_panoramio.jpg","note":"resized"}},"story":["After the Comstock mines declined in the 1890s, lumber baron Duane L. Bliss turned from timber to tourism. He took his Glenbrook operation apart and shipped its buildings across the lake by barge. At Tahoe City he built a railroad line to the pier at Commons Beach, began the grand Tahoe Tavern hotel and built the two-story Tahoe Mercantile on the pier.","He formed the Lake Tahoe Railway and Transportation Company. By 1902 passenger cars ran along 15 miles of narrow gauge track from Truckee to a trestle pier at Tahoe City. About 25 years later the Linnard Steamship Company and Southern Pacific replaced it with standard gauge track, and Snowball Specials carried visitors to winter sports. During World War II the tracks were taken up and the rails recycled.","Not everyone liked it. Many people opposed the use of public lands, and lumberman Walter Bickford won a lawsuit against Bliss, but it did not stop the development. Bliss died in 1907 and his son William took over. A mysterious fire in 1937 destroyed the Mercantile, the post office and the Cedar Log Saloon. The Tahoe Tavern was torn down in 1964."],"fact":"Snowball Specials carried winter sports fans on this railway.","disputed":"The marker says the standard gauge change came about 25 years after 1902, so the exact year is not given.","claims":[{"t":"A narrow gauge railway reached the Tahoe City pier by 1902.","a":0,"why":"A historical marker says passenger cars ran 15 miles from Truckee by 1902."},{"t":"The Truckee-to-Tahoe City railway still runs today.","a":2,"why":"The tracks were dismantled during World War II."}],"sources":[{"t":"Historical Marker Database: Trains and Tourists","u":"https://www.hmdb.org/m.asp?m=112972"},{"t":"Historical Marker Database: Development and Conflict","u":"https://www.hmdb.org/m.asp?m=112973"}],"card":{"a":"1902","b":"1964","la":"Railway to the pier","lb":"Tahoe Tavern torn down"}},{"id":"dam","name":"Lake Tahoe Dam","short":"The Dam","badge":"The Dam","tag":"Stop 2 of 4","teaser":"A small dam that controls a giant lake.","map":"Lake Tahoe Dam, Tahoe City, CA","clue":"Follow the water to where it leaves the lake. A low concrete dam with a row of gates holds back Lake Tahoe, and a walkway runs along the top.","safety":"Tahoe City sidewalks are busy with cars, bikes and visitors. Cross only at marked crossings. Stay behind railings near the water. The river runs fast and cold, so never climb on rocks or walls, and keep your hands and feet out of the outlet.","field":"Field notes pending: the viewing areas have not been checked on foot yet.","q":{"prompt":"Look along the dam. How many gate bays does it have?","options":["9","17","12","25"],"answer":1,"hint":"It is an odd number, more than a dozen.","verify":"Wikipedia lists a gated spillway with 17 bays. Count on site before shipping."},"then":{"yr":"1875","label":"The wharf then","line":"A stereoview of the Tahoe City wharf, about 1875, near the lake's outlet.","link":{"t":"Look for historic photos at the North Lake Tahoe Historical Society","u":"https://northtahoemuseums.org/"},"ph":{"k":"ta_ws_then","by":"Carleton E. Watkins","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:The_Embarcadero,_Tahoe_City,_Lake_Tahoe,_by_Watkins,_Carleton_E.,_1829-1916.jpg","note":"resized, cropped to one frame of a stereoview"}},"now":{"yr":"1981","head":"Today","label":"The dam today","line":"A National Register of Historic Places listing since March 25, 1981. Photo taken in 2012.","ph":{"k":"tahoe_dam_now","by":"Almonroth","lic":"CC BY-SA 3.0","lu":"https://creativecommons.org/licenses/by-sa/3.0/","page":"https://commons.wikimedia.org/wiki/File:Lake_Tahoe_Dam-2.jpg","note":"resized"}},"story":["A small dam of lumber and rock was built at the outlet in 1870. Sources disagree on who built it, so we list both names below.","The present concrete dam was built between 1909 and 1913 to store irrigation water for the Newlands Project, which waters about 55,000 acres of farmland in Nevada.","It controls the top six feet of the lake and can raise it by up to 10.1 feet. The federal government bought it in 1915 for $139,500."],"fact":"The dam is only 18.2 feet high and 109 feet long, yet it regulates the top six feet of a lake 22 miles long.","disputed":"Wikipedia says the Donner Lumber and Boom Company got the right to build the 1870 dam. The state historical marker says Colonel A. W. Von Schmidt built the first outlet works in 1870. The sources do not agree on who.","claims":[{"t":"The Lake Tahoe Dam was finished in 1913.","a":0,"why":"The historical marker and Wikipedia agree on 1913."},{"t":"The dam can raise Lake Tahoe by more than 30 feet.","a":2,"why":"It regulates the top six feet and can raise the lake up to 10.1 feet."}],"sources":[{"t":"Wikipedia: Lake Tahoe Dam","u":"https://en.wikipedia.org/wiki/Lake_Tahoe_Dam"},{"t":"HMDB: Lake Tahoe Outlet Works and Gatekeepers Cabin","u":"https://www.hmdb.org/m.asp?m=143497"}],"card":{"a":"1870","b":"1913","la":"First outlet dam","lb":"Present dam"}},{"id":"gate","name":"Gatekeeper's Museum","short":"Gatekeeper's","badge":"Gatekeeper's","tag":"Stop 3 of 4","teaser":"A log cabin for the person who kept the lake's gates.","map":"Gatekeeper's Museum, Tahoe City, CA","clue":"Beside the dam, in a small park, look for a log cabin built for the person who opened and closed the gates. Today it is a museum.","safety":"Tahoe City sidewalks are busy with cars, bikes and visitors. Cross only at marked crossings. Stay behind railings near the water. The river runs fast and cold, so never climb on rocks or walls, and keep your hands and feet out of the outlet. The museum is open seasonally. You do not need to go inside.","field":"Field notes pending: the park paths have not been checked on foot yet.","q":{"prompt":"Find the state historical marker at the base of the flagpole. What number is it?","options":["479","1913","797","64"],"answer":2,"hint":"It is a three-digit number, and it is not a year.","verify":"HMDB lists California Registered Historical Landmark No. 797 at the flagpole. Confirm on site."},"then":{"yr":"1870","label":"The shore then","line":"A stereoview of the lake shore near Tahoe City, about 1870.","link":{"t":"Look for old photos at the North Lake Tahoe Historical Society","u":"https://northtahoemuseums.org/"},"ph":{"k":"ta_dm_then","by":"Eadweard Muybridge","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:The_shore_of_Lake_Tahoe,_near_Tahoe_City,_by_Muybridge,_Eadweard,_1830-1904.png","note":"resized, cropped to one frame of a stereoview"}},"now":{"yr":"1981","head":"Today","label":"The rebuilt cabin","line":"The cabin you see today was completed in 1981. Photo taken in 2012.","ph":{"k":"tahoe_gate_now","by":"Almonroth","lic":"CC BY-SA 3.0","lu":"https://creativecommons.org/licenses/by-sa/3.0/","page":"https://commons.wikimedia.org/wiki/File:Outlet_Gates_Gatekeepers_Cabin.jpg","note":"resized"}},"story":["The gatekeeper's job was to open and close the dam gates and keep the lake and river at the right levels. A cabin went up in 1910 so the gatekeeper could live beside the gates.","In 1910 and 1911 the Tahoe Water War between lakeshore owners and downstream river users was settled. Measuring the snow's water content let people predict river and lake levels.","The original cabin burned in 1978. The present one was finished in 1981 and is a museum with local history exhibits and a collection of Native baskets."],"fact":"The site became California Registered Historical Landmark No. 797 on September 16, 1964.","claims":[{"t":"The cabin you see today is the original from 1910.","a":2,"why":"The original burned in 1978. The present cabin was completed in 1981."},{"t":"The museum in the rebuilt cabin holds a collection of Native baskets.","a":0,"why":"The historical marker page describes the cabin as housing local history exhibits and a Native basket collection."}],"sources":[{"t":"HMDB: Lake Tahoe Outlet Works and Gatekeepers Cabin","u":"https://www.hmdb.org/m.asp?m=143497"},{"t":"Wikipedia: Lake Tahoe Dam","u":"https://en.wikipedia.org/wiki/Lake_Tahoe_Dam"}],"card":{"a":"1910","b":"1981","la":"Original cabin","lb":"Rebuilt cabin"}},{"id":"watson","name":"Watson Cabin","short":"Watson Cabin","badge":"Watson Cabin","tag":"Stop 4 of 4","teaser":"A log cabin built as a wedding present.","map":"Watson Cabin, 560 N Lake Blvd, Tahoe City, CA","clue":"Walk along the Tahoe City sidewalk and look for a small dark log cabin tucked under tall pines, with a flag out front. It was a wedding gift.","safety":"Tahoe City sidewalks are busy with cars, bikes and visitors. Cross only at marked crossings. Stay behind railings near the water. The river runs fast and cold, so never climb on rocks or walls, and keep your hands and feet out of the outlet.","field":"Field notes pending: the sidewalk to the cabin has not been checked on foot yet.","q":{"prompt":"Look for a sign or date at the cabin. In what year was it built?","options":["1908","1870","1929","1964"],"answer":0,"hint":"It was built in the first decade of the 1900s.","verify":"Built 1908 per Wikipedia and Tahoe Magazine. Not yet confirmed that a sign shows the year. Replace with something visible if not."},"then":{"yr":"1875","label":"Tahoe City then","line":"A stereoview of Tahoe City from the lake, about 1875, three decades before the cabin was built.","link":{"t":"Look for old photos at the North Lake Tahoe Historical Society","u":"https://northtahoemuseums.org/"},"ph":{"k":"ta_wt_then","by":"Carleton E. Watkins","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Tahoe_City_from_the_Lake,_by_Watkins,_Carleton_E.,_1829-1916.jpg","note":"resized, cropped to one frame of a stereoview"}},"now":{"yr":"1979","head":"Today","label":"A museum","line":"Listed on the National Register of Historic Places on August 24, 1979. Photo taken in 2012.","ph":{"k":"tahoe_watson_now","by":"Almonroth","lic":"CC BY-SA 3.0","lu":"https://creativecommons.org/licenses/by-sa/3.0/","page":"https://commons.wikimedia.org/wiki/File:Watson_Cabin-2.jpg","note":"resized"}},"story":["Robert Montgomery Watson came to Tahoe City in 1875 and became its first constable. In 1908 he built a log cabin for his son and daughter-in-law. They moved in during 1909.","From 1947 until 1976 the family leased it to E. P. and Fern Hunt, who ran it as a summer gift shop.","The Tahoe City Public Utility District and the North Lake Tahoe Historical Society bought it in 1979. Today it is a museum and gift shop, restored in 2024 and 2025."],"fact":"The cabin stands at 560 N. Lake Blvd and is owned by the North Lake Tahoe Historical Society.","disputed":"Wikipedia calls it the only historic log cabin in the Tahoe City area, and one local magazine says it was submitted as Tahoe's oldest home. Those are claims from the sources, not something we could check.","claims":[{"t":"Watson Cabin was built in 1908.","a":0,"why":"Wikipedia and Tahoe Magazine both give 1908."},{"t":"Watson Cabin is the oldest home in all of Tahoe.","a":1,"why":"One magazine says it was submitted as Tahoe's oldest home, but we found no source that proves it."}],"sources":[{"t":"Wikipedia: Watson Log Cabin","u":"https://en.wikipedia.org/wiki/Watson_Log_Cabin"},{"t":"Tahoe Magazine: The history and future of Watson Cabin","u":"https://www.tahoemagazine.com/the-history-and-future-of-watson-cabin/"}],"card":{"a":"1908","b":"1979","la":"Built","lb":"National Register"}}],"ranks":[[0,"Day Tripper"],[100,"Shore Walker"],[250,"Outlet Scout"],[450,"Lake Keeper"],[600,"Tahoe Historian"]],"heroKey":"tahoe_hero","heroAlt":"The Lake Tahoe Dam gates with the Truckee River flowing out","heroLi":"<li>Header: Almonroth · <a target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by-sa/3.0/\">CC BY-SA 3.0</a> · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:Lake_Tahoe_Dam-3.jpg\">Source</a> · resized</li>","heroCredit":"Photo: Almonroth · <a target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by-sa/3.0/\">CC BY-SA 3.0</a> · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:Lake_Tahoe_Dam-3.jpg\">Source</a>","mission":"Find four landmarks where the Truckee River leaves Lake Tahoe. At each one, check in to earn its badge, unlock its story, and collect a Time Card. Do them in any order. Everything stays on this phone.","afterDone":"All four badges earned. You know where the Truckee River begins.","safetyNote":"<li>All four stops are in Tahoe City, outdoors, close together. Stay behind railings near the water, because the outlet is fast and cold. The area is at about 6,200 feet, so bring water and sun protection.</li>","badgeMap":{"dam":["tahoe_dam_now","50% 50%"],"gate":["tahoe_gate_now","40% 35%"],"watson":["tahoe_watson_now","55% 55%"],"commons":["ta_cb_now","50% 45%"]},"level":"Hidden Gems","region":"The West"},"boston":{"id":"boston","name":"Boston","explorer":"Freedom Trail Explorer","initials":"BO","stops":[{"id":"oldstate","name":"Old State House","short":"Old State House","badge":"Old State House","tag":"Stop 1 of 4","teaser":"A 1713 brick building, now surrounded by skyscrapers.","map":"Old State House, 206 Washington St, Boston, MA","clue":"Find the small red-brick building with a lion and unicorn on its roof, standing among glass towers. A ring in the pavement beside it marks something that happened in 1770.","safety":"Freedom Trail stops are on busy downtown sidewalks. Cross only at crosswalks and watch for bikes and delivery vehicles. Stay with your group. Museums and churches have their own hours, and you do not need to go inside for any check-in.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"Find the ring set into the pavement just east of the building. What event does it mark?","options":["The Boston Tea Party","The Boston Massacre","The Great Fire of 1872","The Battle of Bunker Hill"],"answer":1,"hint":"It happened in March 1770, and British soldiers were involved.","verify":"HMDB/Wikipedia: marker east of the building, with a brass ring (moved in the 2010s). Not yet confirmed on site."},"then":{"yr":"1900","label":"A photochrom print","line":"A color print of the Old State House made in 1900, when tall office buildings were already crowding in. The print is from the Detroit Publishing Co.","ph":{"k":"bos_osh_then","by":"Detroit Publishing Co. (Library of Congress)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Old_State_House,_Boston,_Massachusetts,_1900.jpg","note":"resized"},"link":{"t":"Look for historic photos at the Boston Public Library","u":"https://www.bpl.org/"}},"now":{"yr":"2009","head":"Today","label":"The site of the Boston Massacre","line":"The stone circle in front is a memorial to the 1770 Boston Massacre. Photo taken in 2009. Since then the marker has been moved and now has a ring with stars.","ph":{"k":"bos_osh_now","by":"Dion Hinchcliffe","lic":"CC BY-SA 2.0","lu":"https://creativecommons.org/licenses/by-sa/2.0/","page":"https://commons.wikimedia.org/wiki/File:2009_BostonMassacre_site_3658174192.jpg","note":"resized"}},"story":["The Old State House was completed in 1713 and is the city's oldest surviving public building. It was the seat of the colonial government, with a merchants' exchange on the first floor and the courts and legislature upstairs.","A memorial near the building marks the area where the Boston Massacre happened in 1770. On July 18, 1776, two weeks after independence was declared, the Declaration was read from the balcony to the crowds below.","The lion and the unicorn, symbols of the British Crown, were torn down and burned in 1776. Replicas went back up in the 1800s and 1900s. Today it is a museum, and an entrance to the subway is in the basement."],"fact":"The building went up in 1713 and is still standing, even though glass towers now rise on every side.","disputed":"Nobody knows who designed it. Robert Twelves is sometimes credited, but the sources do not settle it.","claims":[{"t":"The Declaration of Independence was read from the Old State House balcony on July 18, 1776.","a":0,"why":"Wikipedia reports the reading on that date, two weeks after independence was declared."},{"t":"The Boston Massacre happened inside the Old State House.","a":2,"why":"The memorial marks the street area near the building. The shootings took place outside."}],"sources":[{"t":"Wikipedia: Old State House (Boston)","u":"https://en.wikipedia.org/wiki/Old_State_House_(Boston)"},{"t":"Wikipedia: Freedom Trail","u":"https://en.wikipedia.org/wiki/Freedom_Trail"}],"card":{"a":"1713","b":"1776","la":"Built","lb":"Declaration read"}},{"id":"faneuil","name":"Faneuil Hall","short":"Faneuil Hall","badge":"Faneuil Hall","tag":"Stop 2 of 4","teaser":"A market hall with a golden grasshopper on top.","map":"Faneuil Hall, Boston, MA","clue":"Look for a brick hall with a white cupola. On top of the cupola sits a gilded weathervane in the shape of an insect.","safety":"Freedom Trail stops are on busy downtown sidewalks. Cross only at crosswalks and watch for bikes and delivery vehicles. Stay with your group. Museums and churches have their own hours, and you do not need to go inside for any check-in. The area around the hall is crowded, so keep track of your group.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"Find the marker on the east side of Faneuil Hall. It says \"Still used by a free people.\" What year comes right after that?","options":["1776","1742","1930","1963"],"answer":2,"hint":"It is the year the marker went up, not the year the hall opened.","verify":"HMDB lists a marker on the east side, from Congress and North Streets, ending 'Still used by a free people 1930'. Confirm on site."},"then":{"yr":"c. 1900","label":"A colored postcard","line":"Faneuil Hall on a colored postcard from around 1900, with horse-drawn wagons at the market. Detroit Publishing dated it only as after 1898.","link":{"t":"Look for historic photos at the Boston Public Library","u":"https://www.bpl.org/"},"ph":{"k":"bos_fh_then","by":"Detroit Publishing Company (NYPL scan)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Faneuil_Hall,_Boston,_Mass_(NYPL_b12647398-68720).tiff","note":"cropped and resized"}},"now":{"yr":"1806","head":"Today","label":"Faneuil Hall today","line":"The hall was doubled in width and a third floor added in 1806 by Charles Bulfinch, so it is wider than the original. Photo taken in 2010.","ph":{"k":"bos_fh_now","by":"EgorovaSvetlana","lic":"CC BY-SA 4.0","lu":"https://creativecommons.org/licenses/by-sa/4.0/","page":"https://commons.wikimedia.org/wiki/File:Faneuil_Hall_Boston_Suffolk_County_Massachusetts.jpg","note":"resized"}},"story":["Peter Faneuil, a wealthy merchant, offered to build a market for Boston. The town voted 367 to 360 to accept it in 1740, so the vote was very close. The hall opened in 1742.","The ground floor was a market and the second floor was a meeting hall. After 1763 it hosted pro-independence speeches, and it picked up the nickname 'Cradle of Liberty.'","Faneuil made part of his fortune in the slave trade, and the building was funded in part by those profits. Faneuil Hall now has a permanent exhibit on slavery that opened in 2023."],"fact":"The gilded grasshopper weathervane on top was made by Shem Drowne in 1742 and weighs 25 pounds.","disputed":"Nobody agrees on why it is a grasshopper. One theory links it to a London building's crest. Another says Drowne chased grasshoppers as a boy. Both are unproven.","claims":[{"t":"Faneuil Hall opened in 1742.","a":0,"why":"Wikipedia gives September 10, 1742."},{"t":"The grasshopper weathervane was used to catch spies in the War of 1812.","a":1,"why":"Wikipedia presents this as a legend. It is not proven."}],"sources":[{"t":"Wikipedia: Faneuil Hall","u":"https://en.wikipedia.org/wiki/Faneuil_Hall"},{"t":"Wikipedia: Freedom Trail","u":"https://en.wikipedia.org/wiki/Freedom_Trail"},{"t":"Historical Marker Database: Faneuil Hall","u":"https://www.hmdb.org/m.asp?m=18088"}],"card":{"a":"1742","b":"1806","la":"Opened","lb":"Expanded"}},{"id":"revere","name":"Paul Revere House","short":"Revere House","badge":"Revere House","tag":"Stop 3 of 4","teaser":"Downtown Boston's oldest surviving house.","map":"Paul Revere House, 19 North Square, Boston, MA","clue":"Find a dark wooden house on a small square in the North End. Its upstairs windows are made of many tiny panes of glass.","safety":"Freedom Trail stops are on busy downtown sidewalks. Cross only at crosswalks and watch for bikes and delivery vehicles. Stay with your group. Museums and churches have their own hours, and you do not need to go inside for any check-in. North End streets are narrow and the sidewalks are tight.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"Look at the windows on the house. What shape are the small panes?","options":["Diamonds","Squares","Circles","Hexagons"],"answer":0,"hint":"The panes are set in a lattice that crisscrosses diagonally.","verify":"Matches the 1912 and 2006 photos in the app. Confirm on site."},"then":{"yr":"1912","label":"The house in 1912","line":"A photo from a 1912 book on Boston's historic houses, four years after the house opened as a museum.","ph":{"k":"bos_prh_then","by":"Internet Archive Book Images","lic":"No known copyright restrictions","lu":"https://www.flickr.com/commons/usage/","page":"https://commons.wikimedia.org/wiki/File:Forty_of_Boston%27s_historic_houses;_a_brief_illustrated_description_of_the_residences_of_historic_characters_of_Boston_who_have_lived_in_or_near_the_business_section_(1912)_(14595266497).jpg","note":"resized"},"link":{"t":"Look for historic photos at the Boston Public Library","u":"https://www.bpl.org/"}},"now":{"yr":"2006","head":"Today","label":"Still standing","line":"Photo taken in 2006. The house has been a museum since April 18, 1908.","ph":{"k":"bos_prh_now","by":"surlygirl","lic":"CC BY 2.0","lu":"https://creativecommons.org/licenses/by/2.0/","page":"https://commons.wikimedia.org/wiki/File:Paul_Revere%E2%80%99s_House_(2006).jpg","note":"resized"}},"story":["The house was built around 1680 and is the oldest surviving residence in downtown Boston. Paul Revere bought it on January 13, 1770, and owned it until 1800.","In 1907 a memorial association bought the house and restored it, and it opened as a museum on April 18, 1908, the anniversary of Revere's ride.","Much of the outside was replaced during that restoration. One historian wrote that Revere 'would not recognize it.'"],"fact":"Paul Revere owned this house from 1770 to 1800, which is thirty years.","disputed":"Sources give the building date as anywhere from 1676 to 1681. The builder is unknown. Some sources wrongly call it Boston's oldest house.","claims":[{"t":"Paul Revere owned this house from 1770 to 1800.","a":0,"why":"Wikipedia reports he bought it in January 1770 and sold it in 1800."},{"t":"This is the oldest house in all of Boston.","a":2,"why":"The James Blake House in Dorchester dates to 1661. This is the oldest surviving residence in downtown Boston."}],"sources":[{"t":"Wikipedia: Paul Revere House","u":"https://en.wikipedia.org/wiki/Paul_Revere_House"},{"t":"Wikipedia: Freedom Trail","u":"https://en.wikipedia.org/wiki/Freedom_Trail"}],"card":{"a":"1680","b":"1908","la":"Built, about","lb":"Opened as a museum"}},{"id":"oldnorth","name":"Old North Church","short":"Old North","badge":"Old North","tag":"Stop 4 of 4","teaser":"The steeple where the lanterns hung.","map":"Old North Church, 193 Salem St, Boston, MA","clue":"Walk up the tree-lined Paul Revere Mall. At the end stands a tall white steeple on a brick church, the oldest standing church in Boston.","safety":"Freedom Trail stops are on busy downtown sidewalks. Cross only at crosswalks and watch for bikes and delivery vehicles. Stay with your group. Museums and churches have their own hours, and you do not need to go inside for any check-in.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"Find the plaque on the first-story belt course. What year is on it?","options":["1775","1804","1954","1723"],"answer":3,"hint":"It is the year the church was started, not the year of the ride.","verify":"Wikipedia mentions a 'Christ Church 1723' plaque. Not yet confirmed on site."},"then":{"yr":"c. 1900","label":"A colored photochrom","line":"The steeple of Old North Church in a colored print from around 1900. Cropped to the steeple.","link":{"t":"Look for historic photos at the Boston Public Library","u":"https://www.bpl.org/"},"ph":{"k":"bos_onc_then","by":"Detroit Photographic Company","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Detroit_Photographic_Company_(0367).jpg","note":"cropped and resized"}},"now":{"yr":"2020","head":"Today","label":"The steeple today","line":"The steeple you see now is not the original one. A hurricane knocked it down in 1954 and a new one went up in 1955. Photo taken in 2020, with the Paul Revere statue.","ph":{"k":"bos_onc_now","by":"Kram McThunder","lic":"CC BY 4.0","lu":"https://creativecommons.org/licenses/by/4.0/","page":"https://commons.wikimedia.org/wiki/File:Old_North_Church_Boston_Ma.Winter.jpg","note":"resized"}},"story":["The church's groundbreaking was April 15, 1723, and the first service was held on December 29, 1723. The steeple is 191 feet tall.","On the night of April 18, 1775, Paul Revere had two lanterns hung in the steeple to warn patriots in Charlestown that the British were moving by water. They were taken down within two minutes.","The steeple has fallen more than once. A hurricane destroyed the original in 1804, and Hurricane Carol knocked down its replacement in 1954."],"fact":"The church has eight bells that were cast in 1744 and installed in 1745, and are described as the oldest in North America.","disputed":"Historians disagree on who hung the lanterns: sexton Robert Newman, sea captain John Pulling, or both. A city commission in 1876 also debated whether it was this church or another one.","claims":[{"t":"Two lanterns were hung in the steeple on April 18, 1775.","a":0,"why":"Wikipedia reports two lanterns, taken down within two minutes."},{"t":"Robert Newman was the one who hung the lanterns.","a":1,"why":"Sources credit Newman, John Pulling, or both. It is not settled."}],"sources":[{"t":"Wikipedia: Old North Church","u":"https://en.wikipedia.org/wiki/Old_North_Church"},{"t":"Wikipedia: Freedom Trail","u":"https://en.wikipedia.org/wiki/Freedom_Trail"}],"card":{"a":"1723","b":"1775","la":"First service","lb":"The lanterns"}}],"ranks":[[0,"Tourist"],[100,"Trail Walker"],[250,"Town Crier"],[450,"Liberty Scholar"],[600,"Freedom Trail Historian"]],"heroKey":"bos_fh_now","heroAlt":"The brick front of Faneuil Hall under a white cupola","heroLi":"<li>Header: EgorovaSvetlana · <a target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by-sa/4.0/\">CC BY-SA 4.0</a> · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:Faneuil_Hall_Boston_Suffolk_County_Massachusetts.jpg\">Source</a> · resized</li>","heroCredit":"Photo: EgorovaSvetlana · <a target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by-sa/4.0/\">CC BY-SA 4.0</a> · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:Faneuil_Hall_Boston_Suffolk_County_Massachusetts.jpg\">Source</a>","mission":"Find four stops on the Freedom Trail, a 2.5-mile walk through old Boston. At each one, check in to earn its badge, unlock its story, and collect a Time Card. Do them in any order. Everything stays on this phone.","afterDone":"All four badges earned. The rest of the Freedom Trail is waiting.","safetyNote":"<li>The stops are on downtown sidewalks that are busy all day. Cross only at crosswalks and stay with your group. Museums and churches have their own hours, and none of the check-ins need you to go inside.</li>","badgeMap":{"oldstate":["bos_osh_then","50% 40%"],"faneuil":["bos_fh_now","50% 30%"],"revere":["bos_prh_now","50% 45%"],"oldnorth":["bos_onc_now","50% 25%"]},"level":"Classics","region":"The East"},"dc":{"id":"dc","name":"Washington DC","explorer":"National Mall Explorer","initials":"DC","stops":[{"id":"lincoln","name":"Lincoln Memorial","short":"Lincoln","badge":"Lincoln","tag":"Stop 1 of 4","teaser":"A marble temple with a very large seated president.","map":"Lincoln Memorial, 2 Lincoln Memorial Cir NW, Washington, DC","clue":"Walk to the west end of the Reflecting Pool. A white temple with tall columns holds a seated figure inside, and the steps are famous for a speech given in 1963.","safety":"The National Mall is about two miles long, so plan for a lot of walking, shade and water, especially in summer. Cross streets only at crosswalks. Stay on paths and do not climb on statues or walls. Security officers work around the Capitol, so stay in the public areas and follow their directions.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"The spot where Martin Luther King Jr. spoke in 1963 is engraved on the landing. How many steps below the statue is it?","options":["12","36","18","48"],"answer":2,"hint":"Count up from the landing to the chamber floor.","verify":"Wikipedia says the engraved spot is 18 steps below the statue. Count on site."},"then":{"yr":"1917","label":"Under construction","line":"The memorial in January 1917, with cranes and scaffolding. It was dedicated five years later.","ph":{"k":"dc_lm_then","by":"National Photo Company (Library of Congress)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Lincoln_Memorial,_Jany._1917.jpg","note":"resized"},"link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"}},"now":{"yr":"1980s to 2006","head":"Today","label":"The memorial today","line":"The memorial seen across the Reflecting Pool. Carol Highsmith took this photo between 1980 and 2006.","ph":{"k":"dc_lm_now","by":"Carol M. Highsmith (Library of Congress)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Lincoln_Memorial,_Washington,_D.C_LCCN2011630704.tif","note":"resized"}},"story":["Construction began in 1914 and the memorial was dedicated on May 30, 1922. Henry Bacon designed the building and Daniel Chester French designed the statue, which took about four years to carve from Georgia marble.","The 36 columns stand for the 36 states in the Union when Lincoln died. The names of the 48 states of 1922 are carved above them. Inside are the Gettysburg Address and Lincoln's second inaugural address.","On August 28, 1963, Martin Luther King Jr. spoke from the steps. The spot on the landing was engraved in 2003, forty years later."],"fact":"The seated statue is about 19 feet tall. Standing, Lincoln would be about 28 feet tall.","disputed":"A popular legend says Lincoln's hands spell his initials, A and L, in sign language. The National Park Service denies it, and historians say there is no document showing the sculptor meant it. It could not be proven.","claims":[{"t":"The Lincoln Memorial was dedicated in 1922.","a":0,"why":"Wikipedia gives May 30, 1922, with President Harding accepting it."},{"t":"Lincoln's hands in the statue spell the letters A and L in sign language.","a":1,"why":"The National Park Service denies it. Some historians say it is possible. No document proves it."}],"sources":[{"t":"Wikipedia: Lincoln Memorial","u":"https://en.wikipedia.org/wiki/Lincoln_Memorial"},{"t":"Wikipedia: National Mall","u":"https://en.wikipedia.org/wiki/National_Mall"}],"card":{"a":"1917","b":"1922","la":"Under construction","lb":"Dedicated"}},{"id":"monument","name":"Washington Monument","short":"Monument","badge":"Monument","tag":"Stop 2 of 4","teaser":"A 555-foot stone needle with two shades of marble.","map":"Washington Monument, 2 15th St NW, Washington, DC","clue":"Find the tall white obelisk in the middle of the Mall. A ring of flags circles its base. Look closely at the stone partway up.","safety":"The National Mall is about two miles long, so plan for a lot of walking, shade and water, especially in summer. Cross streets only at crosswalks. Stay on paths and do not climb on statues or walls. Security officers work around the Capitol, so stay in the public areas and follow their directions.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"Count the flags that fly in a circle around the monument. How many are there?","options":["50","13","48","36"],"answer":0,"hint":"Count slowly. There is one for each state.","verify":"Wikipedia says 50 flags fly around the monument. Count on site."},"then":{"yr":"1903","label":"A photochrom print","line":"A color print of the monument in 1903, standing alone on open grass.","ph":{"k":"dc_wm_then","by":"Library of Congress (Prints and Photographs)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Washington_Monument-LCCN2008679642.jpg","note":"resized"},"link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"}},"now":{"yr":"1980s to 2006","head":"Today","label":"The monument today","line":"Carol Highsmith took this photo between 1980 and 2006.","ph":{"k":"dc_wm_now","by":"Carol M. Highsmith (Library of Congress)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Washington_Monument,_Washington,_D.C_LCCN2011630604.tif","note":"resized"}},"story":["The cornerstone was laid on July 4, 1848. Work stopped from 1854 until 1877 because of money problems and the Civil War, and the stone was finished in 1884. It was dedicated on February 21, 1885 and opened to the public on October 9, 1888.","Look about a third of the way up. The lower part is a whiter marble and the upper part is warmer in color, because different quarries supplied the stone before and after the pause.","The tip is an aluminum cap cast in 1884. At the time it was the largest piece of aluminum ever cast. A 5.8 magnitude earthquake cracked the monument in 2011, and it reopened in 2014 after $15 million of repairs."],"fact":"The monument is about 555 feet tall. Official measurements give slightly different numbers depending on the method.","disputed":"Historians disagree about whether enslaved people helped build it. The first phase may have used some enslaved labor, while the second phase likely did not.","claims":[{"t":"Work on the Washington Monument stopped for more than 20 years.","a":0,"why":"Work stopped in 1854 and began again in the late 1870s."},{"t":"Enslaved people helped build the Washington Monument.","a":1,"why":"Historians disagree. The first phase may have used some enslaved labor, while the second phase likely did not."}],"sources":[{"t":"Wikipedia: Washington Monument","u":"https://en.wikipedia.org/wiki/Washington_Monument"},{"t":"Wikipedia: National Mall","u":"https://en.wikipedia.org/wiki/National_Mall"}],"card":{"a":"1848","b":"1888","la":"Cornerstone","lb":"Opened to the public"}},{"id":"capitol","name":"U.S. Capitol","short":"Capitol","badge":"Capitol","tag":"Stop 3 of 4","teaser":"The big white dome at the east end of the Mall.","map":"United States Capitol, Washington, DC","clue":"Walk to the east end of the Mall. A huge white dome sits on top of the building where Congress meets, and a statue stands on its very top.","safety":"The National Mall is about two miles long, so plan for a lot of walking, shade and water, especially in summer. Cross streets only at crosswalks. Stay on paths and do not climb on statues or walls. Security officers work around the Capitol, so stay in the public areas and follow their directions.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"Look at the very top of the dome. What is the statue called?","options":["Lady Liberty","Statue of Freedom","Columbia","Statue of Justice"],"answer":1,"hint":"It is the opposite of being held captive.","verify":"Guessable. Replace with something only visible on site once someone has been there."},"then":{"yr":"1902","label":"The Capitol in 1902","line":"A color photo print of the building from 1902, when the grounds were quieter.","ph":{"k":"dc_cap_then","by":"Library of Congress (Prints and Photographs)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:The_Capitol_at_Washington-LCCN2008678107.jpg","note":"resized"},"link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"}},"now":{"yr":"2008","head":"Today","label":"The Capitol today","line":"Carol Highsmith took this photo on December 7, 2008.","ph":{"k":"dc_cap_now","by":"Carol M. Highsmith (Library of Congress)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:United_States_Capitol,_Washington,_D.C_LCCN2010630189.tif","note":"resized"}},"story":["George Washington helped lay the cornerstone on September 18, 1793. William Thornton designed the original building.","On August 24, 1814, British troops burned the Capitol during the War of 1812. It was repaired and the work was finished by 1826.","The cast-iron dome you see now was designed by Thomas U. Walter. The decision to replace the old dome was made in 1855, and it was finished around 1866. The Capitol is the meeting place of the U.S. Congress."],"fact":"The dome is made of cast iron, painted to look like stone.","disputed":"Who designed the Capitol is argued over. William Thornton's plan was approved in 1793, but other architects changed it a lot, and some credit the dome idea to L'Enfant.","claims":[{"t":"George Washington took part in laying the Capitol's cornerstone in 1793.","a":0,"why":"Wikipedia reports he laid it on September 18, 1793, with Freemasons."},{"t":"The Capitol's dome is made of solid stone.","a":2,"why":"The dome is cast iron, designed by Thomas U. Walter and finished around 1866."}],"sources":[{"t":"Wikipedia: United States Capitol","u":"https://en.wikipedia.org/wiki/United_States_Capitol"},{"t":"Wikipedia: National Mall","u":"https://en.wikipedia.org/wiki/National_Mall"}],"card":{"a":"1793","b":"1866","la":"Cornerstone","lb":"Cast-iron dome"}},{"id":"jefferson","name":"Jefferson Memorial","short":"Jefferson","badge":"Jefferson","tag":"Stop 4 of 4","teaser":"A round marble memorial on the Tidal Basin.","map":"Jefferson Memorial, 900 Ohio Dr SW, Washington, DC","clue":"Head to the Tidal Basin, where cherry trees bloom in spring. A round white memorial with a dome and columns stands at the water's edge.","safety":"The National Mall is about two miles long, so plan for a lot of walking, shade and water, especially in summer. Cross streets only at crosswalks. Stay on paths and do not climb on statues or walls. Security officers work around the Capitol, so stay in the public areas and follow their directions. The Tidal Basin has a low wall and open water, so keep back from the edge.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"Read the words carved around the inside of the dome. Eternal hostility against every form of what?","options":["Ignorance","Silence","Greed","Tyranny"],"answer":3,"hint":"It is what a king can rule with.","verify":"Wikipedia gives this line from Jefferson's 1800 letter on the frieze below the dome. Confirm on site."},"then":{"yr":"1940","label":"Under construction","line":"The memorial under construction in 1940, seen across the Tidal Basin through cherry branches. It was dedicated in 1943.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"dc_jm_then","by":"Harris & Ewing (Library of Congress)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Jefferson_Memorial_under_construction_LCCN2016877445.jpg","note":"cropped and resized"}},"now":{"yr":"2006","head":"Today","label":"The memorial at dusk","line":"Carol Highsmith took this photo on November 25, 2006.","ph":{"k":"dc_jm_now","by":"Carol M. Highsmith (Library of Congress)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Jefferson_Memorial,_Washington,_D.C_LCCN2010630676.tif","note":"resized"}},"story":["John Russell Pope designed the memorial in a style inspired by the Roman Pantheon and Jefferson's own rotunda at the University of Virginia. It was dedicated on April 13, 1943.","The first statue was plaster. The 19-foot bronze Jefferson, sculpted by Rudulph Evans, was installed in April 1947.","In November 1938, women protesters chained themselves to cherry trees at the construction site. Opposition eased once revised plans showed the trees could be kept."],"fact":"The bronze statue is 19 feet tall and weighs about 10,000 pounds.","disputed":"The Commission of Fine Arts never approved the design and opposed both it and the site in 1939. Whether trees were cut for the memorial is not settled in the sources we found.","claims":[{"t":"The Jefferson Memorial was dedicated on the 200th anniversary of Jefferson's birth.","a":0,"why":"Wikipedia reports April 13, 1943, the 200th anniversary."},{"t":"The statue inside was bronze from the day the memorial opened in 1943.","a":2,"why":"A plaster cast stood there in 1943. The bronze statue was installed in 1947."}],"sources":[{"t":"Wikipedia: Jefferson Memorial","u":"https://en.wikipedia.org/wiki/Jefferson_Memorial"},{"t":"Wikipedia: National Mall","u":"https://en.wikipedia.org/wiki/National_Mall"}],"card":{"a":"1943","b":"1947","la":"Dedicated","lb":"Bronze statue"}}],"ranks":[[0,"Visitor"],[100,"Mall Walker"],[250,"Monument Hunter"],[450,"Capitol Scholar"],[600,"National Mall Historian"]],"heroKey":"dc_cap_now","heroAlt":"The U.S. Capitol under a blue sky","heroLi":"<li>Header: Carol M. Highsmith, Library of Congress · Public domain · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:United_States_Capitol,_Washington,_D.C_LCCN2010630189.tif\">Source</a> · resized</li>","heroCredit":"Photo: Carol M. Highsmith (Library of Congress) · <a target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/publicdomain/mark/1.0/\">Public domain</a> · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:United_States_Capitol,_Washington,_D.C_LCCN2010630189.tif\">Source</a>","mission":"Find four landmarks on and around the National Mall. At each one, check in to earn its badge, unlock its story, and collect a Time Card. Do them in any order. Everything stays on this phone.","afterDone":"All four badges earned. The rest of the Mall is waiting.","safetyNote":"<li>The Mall is about two miles long, so bring water and plan your walking. Cross at crosswalks, stay on paths, and follow the directions of security officers near the Capitol.</li>","badgeMap":{"lincoln":["dc_lm_now","50% 50%"],"monument":["dc_wm_now","50% 35%"],"capitol":["dc_cap_now","50% 30%"],"jefferson":["dc_jm_now","50% 50%"]},"level":"Classics","region":"The East"},"ny":{"id":"ny","name":"New York","level":"Classics","explorer":"New York Explorer","initials":"NY","stops":[{"id":"bridge","name":"Brooklyn Bridge","short":"Bridge","badge":"Bridge","tag":"Stop 1 of 4","teaser":"A stone-and-steel bridge that opened in 1883.","map":"Brooklyn Bridge Promenade, New York, NY","clue":"Find the walkway that climbs above the traffic and leads to two giant stone towers. Thousands of steel cables fan out from the tops of those towers.","safety":"The walkway is shared by walkers and bikes. Stay on the walking side and step aside to take photos. It is crowded, so keep young kids close. Never climb on the cables or railings.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"Look up at one of the stone towers. What shape are the two big arches?","options":["Round","Square","Pointed","Flat"],"answer":2,"hint":"The style is called Gothic. Think of a church window.","verify":"Wikipedia: neo-Gothic pointed arches. Confirm on site."},"then":{"yr":"c. 1900","label":"The bridge from the waterfront","line":"The bridge in the distance over South Street, with ships at the dock, in a colored print from about 1900.","ph":{"k":"ny_bb_then","by":"Detroit Publishing Company","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:South_Street_Seaport,_Detroit_Photographic_Company_(0616).jpg","note":"cropped and resized"},"link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"}},"now":{"yr":"1980s to 2006","head":"Today","label":"On the walkway","line":"The tower and cables from the pedestrian walkway. Carol Highsmith took this between 1980 and 2006.","ph":{"k":"ny_bb_now","by":"Carol M. Highsmith (Library of Congress)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Brooklyn_Bridge,_New_York,_New_York_LCCN2011632099.tif","note":"cropped and resized"}},"story":["The bridge opened on May 24, 1883. It was first called the New York and Brooklyn Bridge, and got its current name in 1915. At opening it was the longest suspension bridge in the world, with a main span of 1,595.5 feet.","John A. Roebling designed it but died in 1869, before work began. His son Washington Roebling took over as chief engineer. Washington became too ill to visit the site, and his wife, Emily Warren Roebling, helped supervise the work for about 11 years.","Six days after opening, a stampede on the walkway killed at least twelve people. On May 17, 1884, P. T. Barnum led 21 elephants across to show the bridge was safe."],"fact":"Each stone tower is 278 feet tall. Four main cables each hold 5,282 galvanized steel wires.","disputed":"Emily Roebling is officially listed as the first person to cross the bridge. Some accounts debate that, so this app treats it as a reported fact, not a certain one.","claims":[{"t":"The Brooklyn Bridge opened in 1883.","a":0,"why":"It opened on May 24, 1883, per Wikipedia."},{"t":"The bridge has always been called the Brooklyn Bridge.","a":2,"why":"It was first the New York and Brooklyn Bridge. The current name became official in 1915."}],"sources":[{"t":"Wikipedia: Brooklyn Bridge","u":"https://en.wikipedia.org/wiki/Brooklyn_Bridge"},{"t":"Wikipedia: Emily Warren Roebling","u":"https://en.wikipedia.org/wiki/Emily_Warren_Roebling"}],"card":{"a":"1883","b":"1915","la":"Opened","lb":"Renamed"}},{"id":"grandcentral","name":"Grand Central Terminal","short":"Grand Central","badge":"Grand Central","tag":"Stop 2 of 4","teaser":"A train station so grand it is a landmark.","map":"Grand Central Terminal, 89 E 42nd St, New York, NY","clue":"Walk into the huge main hall of the train station on 42nd Street. Look for a round information booth right in the middle, with something famous on top.","safety":"The station is packed at rush hour, so step out of the walking lanes to look around. Watch for people carrying bags and rolling luggage. Hold onto your phone and keep your belongings close.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"Find the information booth in the middle of the main concourse. How many faces does the clock on top of it have?","options":["2","3","6","4"],"answer":3,"hint":"One faces each direction you could walk.","verify":"Wikipedia: a four-sided brass clock tops the booth. Count on site."},"then":{"yr":"1903 to the 1920s","label":"The main concourse, long ago","line":"A black-and-white view of the main concourse from the early years. Detroit Publishing dated it only between 1903 and the 1920s.","ph":{"k":"ny_gc_then","by":"Detroit Publishing Company","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Main_concourse,_Grand_Central_Terminal.jpg","note":"cropped and resized"},"link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"}},"now":{"yr":"2007","head":"Today","label":"The concourse today","line":"The main concourse and its blue-green ceiling in 2007.","ph":{"k":"ny_gc_now","by":"Carol M. Highsmith (Library of Congress)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Interior,_Grand_Central_Station,_New_York,_New_York_LCCN2010630085.tif","note":"resized"}},"story":["The terminal was built from 1903 to 1913 and opened on February 2, 1913. The Vanderbilt family owned the station. Cornelius Vanderbilt chose the acorn as the family symbol, and you can spot acorns around the building.","Two firms share the design credit. Reed and Stem designed the overall plan, and Warren and Wetmore, led by Whitney Warren, shaped much of the look.","In the 1970s, the owner wanted to tear down the main concourse and build a tower. Jacqueline Kennedy Onassis helped lead the fight to save it."],"fact":"The terminal has 44 platforms, with 67 tracks in all. Forty-one are used for passenger trains.","disputed":"Who deserves the credit for the design is shared between two firms, so we list both. Stories about the ceiling stars being painted backwards are not covered in our sources, so we make no claim either way.","claims":[{"t":"Grand Central Terminal opened in 1913.","a":0,"why":"It opened on February 2, 1913, according to Wikipedia."},{"t":"The clock above the information booth has three faces.","a":2,"why":"It is a four-sided brass clock."}],"sources":[{"t":"Wikipedia: Grand Central Terminal","u":"https://en.wikipedia.org/wiki/Grand_Central_Terminal"},{"t":"Wikipedia: Penn Central v. New York City","u":"https://en.wikipedia.org/wiki/Penn_Central_Transportation_Co._v._New_York_City"}],"card":{"a":"1913","b":"2007","la":"Opened","lb":"Today"}},{"id":"flatiron","name":"Flatiron Building","short":"Flatiron","badge":"Flatiron","tag":"Stop 3 of 4","teaser":"A skyscraper shaped like a slice of pie.","map":"Flatiron Building, 175 5th Ave, New York, NY","clue":"Find where Fifth Avenue crosses Broadway near a small park. A tall stone building comes to a very narrow point there, like the bow of a ship.","safety":"Midtown and Lower Manhattan are very busy. Cross only at crosswalks and wait for the signal, even when others do not. Stay out of bike lanes and watch for bikes and scooters. Keep your phone away from the curb while you look at it. The streets around the building meet at odd angles, so look both ways twice.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"Stand at the narrow tip of the building. Which numbered street touches that northern point?","options":["14th Street","23rd Street","34th Street","42nd Street"],"answer":1,"hint":"It is a little more than 22.","verify":"Wikipedia: East 23rd Street touches the northern peak. Confirm on site."},"then":{"yr":"c. 1903","label":"A colored photo print","line":"The building a year or two after it opened, with horse-drawn carts and trolleys below. Dated between 1902 and 1905.","ph":{"k":"ny_fi_then","by":"Detroit Publishing Company","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Detroit_Photographic_Company_(0645).jpg","note":"cropped and resized"},"link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"}},"now":{"yr":"2011","head":"Today","label":"The building today","line":"Photo taken on July 19, 2011.","ph":{"k":"ny_fi_now","by":"Carol M. Highsmith (Library of Congress)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:No_Known_Restrictions_Flatiron_Building,_New_York_City_(Highsmith_LOC)_(6718401639).jpg","note":"cropped and resized"}},"story":["The Flatiron Building was finished in 1902 and opened to tenants on October 1, 1902. It was first called the Fuller Building, after George A. Fuller. The architect was Daniel Burnham's firm.","The triangle shape comes from the site. Broadway cuts across the city grid on a diagonal, so the block is a wedge. It was first 20 stories plus an attic, and grew to 22 stories in 1905.","Early on it was nicknamed Burnham's Folly, because people doubted a building so thin could stand. It is now a National Historic Landmark."],"fact":"The narrow end is only about 6 feet wide. The building is 307 feet tall.","disputed":"Sources give the width of the narrow end as either 6 feet or 6.5 feet, so we say about 6 feet.","claims":[{"t":"The Flatiron Building was first called the Fuller Building.","a":0,"why":"It was named for George A. Fuller, founder of the Fuller Company."},{"t":"The Flatiron Building's narrow tip is about 60 feet wide.","a":2,"why":"The narrow end is only about 6 feet wide."}],"sources":[{"t":"Wikipedia: Flatiron Building","u":"https://en.wikipedia.org/wiki/Flatiron_Building"},{"t":"Wikipedia: Broadway (Manhattan)","u":"https://en.wikipedia.org/wiki/Broadway_(Manhattan)"}],"card":{"a":"1902","b":"1966","la":"Opened","lb":"City landmark"}},{"id":"liberty","name":"Statue of Liberty","short":"Liberty","badge":"Liberty","tag":"Stop 4 of 4","teaser":"The big green lady in the harbor.","map":"Statue of Liberty National Monument, Liberty Island, New York, NY","clue":"Head to the water at the southern tip of Manhattan, or take a ferry to Liberty Island. A giant green statue holds a torch high above the harbor.","safety":"Only buy ferry tickets from the official ferry company or the National Park Service site, never from street sellers. Expect security screening. Stay behind railings near the water and follow park staff directions.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"The tablet in the statue's left hand shows a date in Roman numerals. Which date?","options":["July 4, 1776","October 28, 1886","September 17, 1787","January 1, 1863"],"answer":0,"hint":"It is the birthday of the United States.","verify":"Wikipedia says the tablet shows the Roman-numeral date of July 4, 1776. Check on site; you may need to be close to read it."},"then":{"yr":"c. 1900","label":"A colored photo print","line":"The statue on its island around 1900, when the copper was still turning from shiny brown to green.","ph":{"k":"ny_sl_then","by":"Detroit Photographic Company","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Detroit_Photographic_Company_(0707)_-_Statue_of_Liberty.jpg","note":"cropped and resized"},"link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"}},"now":{"yr":"2017","head":"Today","label":"From the air","line":"Liberty Island with the Manhattan skyline behind it. Carol Highsmith took this on August 24, 2017.","ph":{"k":"ny_sl_now","by":"Carol M. Highsmith (Library of Congress)","lic":"CC0","lu":"https://creativecommons.org/publicdomain/zero/1.0/","page":"https://commons.wikimedia.org/wiki/File:HIghsmith_2017_LOC_Statue_of_Liberty_NY_Harbor.jpg","note":"resized"}},"story":["The statue was a gift from the people of France. The sculptor was Frédéric Auguste Bartholdi, and Gustave Eiffel's company built the iron frame inside. It was dedicated on October 28, 1886, with President Grover Cleveland.","The French people paid for the statue, and Americans paid for the pedestal. The statue was shiny reddish-brown copper at first. The green color came from oxidation and covered it by 1906.","The island was called Bedloe's Island until Congress renamed it in 1956. The famous poem, The New Colossus by Emma Lazarus, is on a plaque at the base."],"fact":"From the ground to the tip of the torch, the statue and pedestal together are about 305 feet tall.","disputed":"Many people say Bartholdi's mother was the model for the face. The curator of the Bartholdi Museum says there is no factual basis for that, so we do not claim it.","claims":[{"t":"The Statue of Liberty was dedicated in 1886.","a":0,"why":"It was dedicated on October 28, 1886."},{"t":"The Statue of Liberty stands on Ellis Island.","a":2,"why":"It stands on Liberty Island. Ellis Island is a separate island."}],"sources":[{"t":"Wikipedia: Statue of Liberty","u":"https://en.wikipedia.org/wiki/Statue_of_Liberty"},{"t":"National Park Service: Statue of Liberty","u":"https://www.nps.gov/stli/index.htm"}],"card":{"a":"1886","b":"1906","la":"Dedicated","lb":"Fully green"}}],"ranks":[[0,"Tourist"],[100,"Subway Rider"],[250,"Street Smart"],[450,"Gotham Scholar"],[600,"New York Historian"]],"heroKey":"ny_sl_now","heroAlt":"The Statue of Liberty and Liberty Island with the Manhattan skyline behind","heroLi":"<li>Header: Carol M. Highsmith · <a target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/publicdomain/zero/1.0/\">CC0</a> · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:HIghsmith_2017_LOC_Statue_of_Liberty_NY_Harbor.jpg\">Source</a> · resized</li>","heroCredit":"Photo: Carol M. Highsmith (Library of Congress) · <a target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/publicdomain/zero/1.0/\">CC0</a> · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:HIghsmith_2017_LOC_Statue_of_Liberty_NY_Harbor.jpg\">Source</a>","mission":"Find four New York icons. At each one, check in to earn its badge, unlock its story, and collect a Time Card. Do them in any order. Everything stays on this phone.","afterDone":"All four badges earned. New York has plenty more stories waiting.","safetyNote":"<li>New York is busy. Cross only at crosswalks, stay out of bike lanes, keep your belongings close, and only buy ferry tickets from official sellers.</li>","badgeMap":{"bridge":["ny_bb_now","50% 40%"],"grandcentral":["ny_gc_now","50% 40%"],"flatiron":["ny_fi_now","50% 30%"],"liberty":["ny_sl_now","75% 40%"]},"region":"The East"},"chicago":{"id":"chicago","name":"Chicago","explorer":"Loop Explorer","initials":"CHI","ranks":[[0,"Visitor"],[100,"Loop Walker"],[250,"Landmark Hunter"],[450,"Skyline Scholar"],[600,"Chicago Historian"]],"heroAlt":"Buckingham Fountain with the Chicago skyline behind it","heroLi":"<li>Header: Cdurrani · CC BY-SA 3.0 · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:Buckingham_Fountain_-_Chicago,_IL.JPG\">Source</a> · resized</li>","heroCredit":"Photo: Cdurrani · <a target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by-sa/3.0/\">CC BY-SA 3.0</a> · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:Buckingham_Fountain_-_Chicago,_IL.JPG\">Source</a>","mission":"Find four landmarks in and around the Loop. At each one, check in to earn its badge, unlock its story, and collect a Time Card. Do them in any order. Everything stays on this phone.","afterDone":"All four badges earned. The rest of Chicago is waiting.","safetyNote":"<li>Chicago weather swings fast and the lakefront wind is real. Dress for it, cross at crosswalks, and keep an eye on traffic and bikes near the park paths.</li>","badgeMap":{"cloudgate":["chi_cg_now","50% 40%"],"buckingham":["chi_bf_now","50% 30%"],"rookery":["chi_ro_now","50% 45%"],"lpconservatory":["chi_lp_now","50% 45%"]},"level":"Classics","region":"The Midwest","stops":[{"id":"cloudgate","name":"Cloud Gate","short":"Cloud Gate","badge":"Cloud Gate","tag":"Stop 1 of 4","teaser":"A giant mirror bean. Everyone calls it something else.","map":"Cloud Gate, 201 E Randolph St, Chicago, IL","clue":"Head to AT&T Plaza in Millennium Park. Look for a huge polished steel sculpture shaped like a kidney bean, and walk into the arch underneath.","safety":"Millennium Park is crowded on summer weekends. Watch your step on the plaza, keep young kids close, and stay on the ground. The sculpture is for looking, not climbing.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"Step into the arch underneath the sculpture and look up at your reflection. What does it do?","options":["It disappears","It splits into many warped copies","It turns green","It stays one normal copy"],"answer":1,"hint":"Look straight up, not at the outside.","verify":"The arch underneath is called the omphalos. Its curved mirror multiplies and bends reflections (Wikipedia, Cloud Gate). Check on site. Written from sources, not yet checked on site."},"then":{"yr":"2004","label":"Under construction","line":"Cloud Gate under construction in 2004, with a crane and a large steel ring on the site.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"chi_cg_then","by":"Cmgiulini","lic":"CC BY 3.0","lu":"https://creativecommons.org/licenses/by/3.0/","page":"https://commons.wikimedia.org/wiki/File:Cloud_gate_construction.jpg","note":"resized"}},"now":{"yr":"2013","head":"Today","label":"From under Cloud Gate","line":"The Chicago skyline seen from underneath the sculpture. Photo from 2013.","ph":{"k":"chi_cg_now","by":"Roman Boed","lic":"CC BY 2.0","lu":"https://creativecommons.org/licenses/by/2.0/","page":"https://commons.wikimedia.org/wiki/File:Chicago_from_under_the_Cloud_Gate_(9694666470).jpg","note":"resized"}},"story":["Artist Anish Kapoor designed it, and it was built from 2004 to 2006. It was partly unveiled at the Millennium Park opening on July 15, 2004, finished in August 2005, and formally dedicated on May 15, 2006.","It is made of 168 stainless steel plates, joined and polished so the seams are hard to find. It is about 33 feet tall, 66 feet long and 42 feet wide, and weighs about 110 short tons.","The public nicknamed it \"The Bean\" while it was under construction. Kapoor did not like the nickname at first but later accepted it. The arch underneath has its own name, the omphalos, Greek for navel."],"fact":"Kapoor's official title is Cloud Gate. The Bean was the crowd's idea.","disputed":"Nothing big is disputed here. The thing people most often get wrong is who came up with the name.","claims":[{"t":"Cloud Gate is made of 168 stainless steel plates.","a":0,"why":"Wikipedia gives 168 plates, polished so the seams are hard to see."},{"t":"Artist Anish Kapoor named the sculpture \"The Bean.\"","a":2,"why":"The public came up with the nickname during construction. Kapoor's title is Cloud Gate."}],"sources":[{"t":"Wikipedia: Cloud Gate","u":"https://en.wikipedia.org/wiki/Cloud_Gate"},{"t":"Structurae: Cloud Gate","u":"https://structurae.net/en/structures/cloud-gate"}],"card":{"a":"2004","b":"2006","la":"Partly unveiled","lb":"Dedicated"}},{"id":"rookery","name":"The Rookery","short":"The Rookery","badge":"The Rookery","tag":"Stop 2 of 4","teaser":"A building named for a pigeon-and-politician nest, with a Frank Lloyd Wright lobby.","map":"The Rookery Building, 209 S LaSalle St, Chicago, IL","clue":"Go to the Loop at LaSalle and Adams Streets and find the big red-brick building with a glowing glass court inside.","safety":"The Loop is busy on weekdays. Use crosswalks. The lobby is open to the public on business days only.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"Look at the building from the street. About how many stories is the Rookery?","options":["8","12","20","30"],"answer":1,"hint":"More than ten, fewer than twenty.","verify":"Wikipedia says 12 stories. Estimate from the street. Written from sources, not yet checked on site."},"then":{"yr":"1891","label":"The Rookery then","line":"The Rookery in 1891, three years after it opened.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"chi_ro_then","by":"Unknown","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:1891_Rookery_building.jpg","note":"resized"}},"now":{"yr":"Today","head":"Today","label":"The building today","line":"The red-brick building stands on LaSalle Street.","ph":{"k":"chi_ro_now","by":"Marlene Calderon","lic":"CC BY-SA 3.0","lu":"https://creativecommons.org/licenses/by-sa/3.0/","page":"https://commons.wikimedia.org/wiki/File:The_Rookery,_Chicago,_IL.jpg","note":"resized"}},"story":["The Rookery was completed in 1888 and designed by Burnham and Root. The name may refer to pigeons that nested on a reservoir previously on the site, or to the temporary city hall that later stood there. The old city hall was nicknamed a rookery for the crows and pigeons that flocked to it and for the corrupt politicians it housed.","It has 12 stories and stands 181 feet tall. The exterior walls carry load, and there is an interior steel frame. Frank Lloyd Wright redesigned the lobby between 1905 and 1907, and William Drummond remodeled the building in 1931.","A two-story light court in white terracotta brings daylight to inside offices. Its skylight has 5,000 glass panes. It was designated a National Historic Landmark on May 15, 1975."],"fact":"The skylight has 5,000 glass panes.","disputed":"The name has two origin stories, and Wikipedia gives both without choosing one.","claims":[{"t":"Frank Lloyd Wright remodeled the Rookery's lobby.","a":0,"why":"Wikipedia: he remodeled it from 1905 to 1907."},{"t":"The Rookery was named for a flock of pigeons, and nothing else.","a":1,"why":"Wikipedia gives two accounts: pigeons on an old reservoir, or an old city hall nicknamed the rookery."}],"sources":[{"t":"Wikipedia: Rookery Building","u":"https://en.wikipedia.org/wiki/Rookery_Building"},{"t":"Encyclopedia of Chicago: Rookery","u":"https://encyclopedia.chicagohistory.org/pages/10549.html"}],"card":{"a":"1888","b":"1907","la":"Built","lb":"Wright's lobby"}},{"id":"buckingham","name":"Buckingham Fountain","short":"Fountain","badge":"Fountain","tag":"Stop 3 of 4","teaser":"A wedding cake for a lake.","map":"Buckingham Fountain, 301 S Columbus Dr, Chicago, IL","clue":"Cross into Grant Park and find a giant, many-layered fountain with stone sea horses around it.","safety":"The fountain runs only in warm months, usually early May to mid October. Stay off the basin walls and keep clear of the spray, which can soak the pavement.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"Walk around the fountain and count the sea horse statues. How many are there?","options":["4","6","8","12"],"answer":2,"hint":"They come in pairs.","verify":"Four pairs of sea horses stand for four states (Wikipedia, Buckingham Fountain). Count on site. Written from sources, not yet checked on site."},"then":{"yr":"1939","label":"A 1939 poster","line":"A Federal Art Project poster advertising the fountain as free, in 1939.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"chi_bf_then","by":"John Buczak, Federal Art Project","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Buckinghamfountain3g05158u.jpg","note":"resized"}},"now":{"yr":"2012","head":"Today","label":"The fountain today","line":"Buckingham Fountain in front of the Chicago skyline. Photo from 2012.","ph":{"k":"chi_bf_now","by":"Cdurrani","lic":"CC BY-SA 3.0","lu":"https://creativecommons.org/licenses/by-sa/3.0/","page":"https://commons.wikimedia.org/wiki/File:Buckingham_Fountain_-_Chicago,_IL.JPG","note":"resized"}},"story":["The fountain was dedicated on August 26, 1927. Kate Sturges Buckingham gave it to the city in memory of her brother Clarence Buckingham.","Edward H. Bennett designed it, and French sculptor Marcel Loyau made the statues. It was inspired by the Latona Fountain at the Palace of Versailles.","The four pairs of sea horses stand for the four states that touch Lake Michigan: Illinois, Wisconsin, Michigan and Indiana. The whole fountain stands for the lake. The center jet can reach 150 feet."],"fact":"The fountain holds about 1.5 million gallons and has 193 jets.","disputed":"Wikipedia calls it \"one of the largest fountains in the world.\" Whether it is the largest depends on how you measure, so treat that as a claim, not a record.","claims":[{"t":"The sea horses at Buckingham Fountain stand for the four states that touch Lake Michigan.","a":0,"why":"Wikipedia: four pairs of sea horses for Illinois, Wisconsin, Michigan and Indiana."},{"t":"Buckingham Fountain is the largest fountain in the world.","a":1,"why":"Wikipedia says \"one of the largest.\" Rankings depend on what is measured."}],"sources":[{"t":"Wikipedia: Buckingham Fountain","u":"https://en.wikipedia.org/wiki/Buckingham_Fountain"},{"t":"The Clio: Buckingham Memorial Fountain","u":"https://theclio.com/tour/224/8"}],"card":{"a":"1927","b":"150 ft","la":"Dedicated","lb":"Tallest jet"}},{"id":"lpconservatory","name":"Lincoln Park Conservatory","short":"Conservatory","badge":"Conservatory","tag":"Stop 4 of 4","teaser":"A glass-house jungle in the middle of winter.","map":"Lincoln Park Conservatory, 2391 N Stockton Dr, Chicago, IL","clue":"Go to Lincoln Park and find the big glass-house conservatory near the zoo.","safety":"Watch for bikes on park paths. Stay on walkways and do not pick or touch plants.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"One room sits about 5.5 feet below ground level, filled with ferns. What is it called?","options":["The Palm House","The Orchid Room","The Display House","The Fern Room"],"answer":3,"hint":"It's named for what grows in it.","verify":"Wikipedia says the Fern Room sits about 5.5 feet below grade. Written from sources, not yet checked on site."},"then":{"yr":"1914","label":"The conservatory then","line":"A postcard of the flower garden and conservatory, about 1914.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"chi_lp_then","by":"Unknown (Library of Congress / NYPL postcard)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:392,_Flower_Garden,_Fountain,_and_Conservatory,_Lincoln_Park_(NBY_417804).jpg","note":"resized"}},"now":{"yr":"Today","head":"Today","label":"The conservatory today","line":"The glass house stands beside the flower garden.","ph":{"k":"chi_lp_now","by":"Alanscottwalker","lic":"CC BY-SA 3.0","lu":"https://creativecommons.org/licenses/by-sa/3.0/","page":"https://commons.wikimedia.org/wiki/File:LPConserv.JPG","note":"resized"}},"story":["The current Lincoln Park Conservatory was built between 1890 and 1895 by the Lincoln Park Commission. Joseph Lyman Silsbee designed it with Mifflin E. Bell. The style is Victorian and exotic, with trusses shaped as ogee arches.","The vestibule and Palm House opened in 1892. The Fern Room and the Tropical Room, now the Orchid Room, opened in 1895. The Display House shows seasonal flower shows.","The conservatory covers about 3 acres. It has four display halls, a vestibule and fifteen propagating and growing houses. A fiddle-leaf rubber tree in the Palm House was planted in 1891."],"fact":"A rubber tree in the Palm House was planted in 1891.","disputed":"Wikipedia lists several different dates for the greenhouse and the present building, so use ranges.","claims":[{"t":"The current conservatory was built in the early 1890s.","a":0,"why":"Wikipedia: built 1890 to 1895."},{"t":"The conservatory is entirely outdoors.","a":2,"why":"It is a glass building with indoor display houses."}],"sources":[{"t":"Wikipedia: Lincoln Park Conservatory","u":"https://en.wikipedia.org/wiki/Lincoln_Park_Conservatory"},{"t":"TCLF: Lincoln Park Conservatory","u":"https://www.tclf.org/lincoln-park-conservatory"}],"card":{"a":"1892","b":"1895","la":"Palm House","lb":"Fern Room"}}],"heroKey":"chi_bf_now"},"sf":{"id":"sf","name":"San Francisco","explorer":"Bay Explorer","initials":"SF","ranks":[[0,"Visitor"],[100,"Bay Walker"],[250,"Landmark Hunter"],[450,"Hill Scholar"],[600,"Bay Area Historian"]],"heroAlt":"The San Francisco Ferry Building and its clock tower","heroLi":"<li>Header: JaGa · CC BY-SA 4.0 · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:San_Francisco_Ferry_Building_(cropped).jpg\">Source</a> · resized</li>","heroCredit":"Photo: JaGa · <a target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by-sa/4.0/\">CC BY-SA 4.0</a> · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:San_Francisco_Ferry_Building_(cropped).jpg\">Source</a>","mission":"Find four landmarks around San Francisco. At each one, check in to earn its badge, unlock its story, and collect a Time Card. Do them in any order. Everything stays on this phone.","afterDone":"All four badges earned. The rest of the Bay is waiting.","safetyNote":"<li>San Francisco is hilly, windy and often cold, even on sunny days. Bring a jacket, wear real shoes, and watch for traffic on steep streets.</li>","badgeMap":{"goldengate":["sf_gg_now","50% 45%"],"ferrybuilding":["sf_fb_now","50% 40%"],"coittower":["sf_ct_now","50% 40%"],"palace":["sf_pf_now","50% 50%"]},"level":"Classics","region":"The West","stops":[{"id":"goldengate","name":"Golden Gate Bridge","short":"Golden Gate","badge":"Golden Gate","tag":"Stop 1 of 4","teaser":"The bridge with a color the Navy did not want.","map":"Golden Gate Bridge Welcome Center, San Francisco, CA","clue":"Head to the San Francisco end of the bridge, near the Welcome Center and Vista Point. Find the tall red-orange towers.","safety":"The bridge is windy and cold, and fog can roll in fast. Stay on the sidewalk, watch for cyclists, and never lean over the rail.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"The bridge's color has an official name. What is it?","options":["Burnt Sienna","Signal Red","International Orange","Coral Fog"],"answer":2,"hint":"It sounds like a shipping term.","verify":"The bridge is painted International Orange (Wikipedia, Golden Gate Bridge). Confirm on site signage. Written from sources, not yet checked on site."},"then":{"yr":"1937","label":"Opening day","line":"A visitor on the bridge on opening day, May 26, 1937.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"sf_gg_then","by":"Mr. Euler","lic":"CC BY-SA 3.0","lu":"https://creativecommons.org/licenses/by-sa/3.0/","page":"https://commons.wikimedia.org/wiki/File:GoldenGateBridge_openingday.jpg","note":"resized"}},"now":{"yr":"2008","head":"Today","label":"From Baker Beach","line":"The bridge seen from Baker Beach at sunset. Photo from 2008.","ph":{"k":"sf_gg_now","by":"Christian Mehlführer","lic":"CC BY 3.0","lu":"https://creativecommons.org/licenses/by/3.0/","page":"https://commons.wikimedia.org/wiki/File:GoldenGateBridge_BakerBeach_MC.jpg","note":"resized"}},"story":["Construction began on January 5, 1933 and the bridge opened on May 27, 1937. Its main span is 4,200 feet, and it was the longest suspension span in the world until 1964. The towers rise 746 feet above the water.","Joseph Strauss oversaw the project. Leon Moisseiff conceived the suspension design, and Charles Ellis did much of the engineering but received little credit while he lived.","Architect Irving Morrow designed the Art Deco touches and chose the color. He picked International Orange because it suits the setting and shows up in fog. The Navy had suggested black and yellow stripes."],"fact":"The Navy wanted stripes. Morrow chose orange.","disputed":"Credit for the design is argued over. Strauss led the project, but Moisseiff and Ellis did much of the engineering.","claims":[{"t":"The bridge's color was chosen partly because it shows up well in fog.","a":0,"why":"Wikipedia: Morrow chose International Orange partly for visibility in fog."},{"t":"Joseph Strauss alone designed the Golden Gate Bridge.","a":1,"why":"Strauss oversaw it. Moisseiff conceived the suspension design and Ellis did much of the engineering."}],"sources":[{"t":"Wikipedia: Golden Gate Bridge","u":"https://en.wikipedia.org/wiki/Golden_Gate_Bridge"},{"t":"Structurae: Golden Gate Bridge","u":"https://structurae.net/en/structures/golden-gate-bridge"}],"card":{"a":"1933","b":"1937","la":"Construction began","lb":"Opened"}},{"id":"ferrybuilding","name":"Ferry Building","short":"Ferry Building","badge":"Ferry Building","tag":"Stop 2 of 4","teaser":"A clock tower that outlasted a freeway.","map":"Ferry Building, 1 Ferry Building, San Francisco, CA","clue":"Go to the foot of Market Street on the Embarcadero. Find the old stone terminal with a tall clock tower facing the bay.","safety":"The Embarcadero has streetcars, bikes and ferry crowds. Cross at signals and keep clear of the tracks.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"Walk around the tower. How many clock faces does it have?","options":["2","4","3","6"],"answer":1,"hint":"Think compass points.","verify":"Wikipedia says the tower has four clock dials. Count on site. Written from sources, not yet checked on site."},"then":{"yr":"1906","label":"After the earthquake","line":"Market Street looking toward the Ferry Building after the 1906 earthquake. The building survived with little damage.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"sf_fb_then","by":"Willard Worden","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Willard_Wodern--Willard_Wodern--Market_Street_looking_toward_Ferry_Building_after_1906_San_Francisco_Earthquake.webp","note":"resized"}},"now":{"yr":"2008","head":"Today","label":"The Ferry Building today","line":"The clock tower rising over the Ferry Building and the Embarcadero. Photo from 2008.","ph":{"k":"sf_fb_now","by":"JaGa","lic":"C
