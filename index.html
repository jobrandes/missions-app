ilica of Saint Mary was designated a minor basilica by Pope Pius XI in 1926, the first in the United States. Emmanuel Masqueray was the architect. Construction ran from 1907 to 1914, and the first Mass was held on May 31, 1914.","The sanctuary dome rises 138 feet above the floor. With the flèche and cross it reaches 200 feet. The nave is lit by five large arched stained glass windows, and the pews hold 1,600 people.","The style is Classical Revival, and the history section calls it Beaux-Arts. It stands at 1600 Hennepin Avenue between 16th and 17th Streets."],"fact":"The pews seat 1,600 people.","disputed":"Wikipedia gives two dedication dates, 1913 in the lead and 1921 in the history section, and does not reconcile them. Check a church source before repeating one.","claims":[{"t":"The Basilica of Saint Mary was the first basilica in the United States.","a":0,"why":"Wikipedia: designated by Pope Pius XI in 1926."},{"t":"The basilica was finished in 1907.","a":2,"why":"Construction began in 1907. The first Mass was on May 31, 1914."}],"sources":[{"t":"Wikipedia: Basilica of Saint Mary (Minneapolis)","u":"https://en.wikipedia.org/wiki/Basilica_of_Saint_Mary_(Minneapolis)"},{"t":"MNopedia: Basilica of St. Mary","u":"https://www.mnhs.org/mnopedia/search/index/structure/basilica-st-mary-minneapolis"}],"card":{"a":"1907","b":"1926","la":"Construction began","lb":"Named a basilica"}}],"heroKey":"mn_sa_now"},"atlanta":{"id":"atlanta","name":"Atlanta","explorer":"Peach City Explorer","initials":"ATL","ranks":[[0,"Visitor"],[100,"Peachtree Walker"],[250,"Landmark Hunter"],[450,"Atlanta Scholar"],[600,"Atlanta Historian"]],"heroAlt":"The Georgia State Capitol and its gold dome","heroLi":"<li>Header: Ken Lund · CC BY-SA 2.0 · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:Georgia_State_Capitol,_Atlanta,_Georgia.jpg\">Source</a> · resized</li>","heroCredit":"Photo: Ken Lund · <a target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by-sa/2.0/\">CC BY-SA 2.0</a> · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:Georgia_State_Capitol,_Atlanta,_Georgia.jpg\">Source</a>","mission":"Find four landmarks around Atlanta. At each one, check in to earn its badge, unlock its story, and collect a Time Card. Do them in any order. Everything stays on this phone.","afterDone":"All four badges earned. The rest of Atlanta is waiting.","safetyNote":"<li>Atlanta is hot and humid in summer. Bring water, use crosswalks, and be respectful at churches and cemeteries.</li>","badgeMap":{"ebenezer":["at_eb_now","40% 40%"],"capitol":["at_cp_now","50% 45%"],"flatiron":["at_fl_now","50% 45%"],"piedmont":["at_pk_now","50% 45%"]},"level":"Classics","region":"The South","stops":[{"id":"ebenezer","name":"Ebenezer Baptist Church","short":"Ebenezer","badge":"Ebenezer","tag":"Stop 1 of 4","teaser":"The church where Martin Luther King Jr. preached, and where his funeral was held.","map":"Ebenezer Baptist Church, 407 Auburn Ave NE, Atlanta, GA","clue":"Go to the Martin Luther King Jr. National Historical Park and find the red-brick church with the tall bell tower.","safety":"The church is an active place of worship and a national park site. Be quiet and respectful, and check visiting hours.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"Read the park signs near the church. Who is the park named for?","options":["Ralph Abernathy","Andrew Young","Martin Luther King Jr.","John Lewis"],"answer":2,"hint":"The pastor who preached here.","verify":"Wikipedia says the church is in the Martin Luther King Jr. National Historical Park. Written from sources, not yet checked on site."},"then":{"yr":"1979","label":"The sanctuary then","line":"The church interior in 1979, looking toward the pulpit and organ.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"at_eb_then","by":"Historic American Buildings Survey (U.S. government)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://www.loc.gov/pictures/item/ga0474.photos.057134p/","note":"resized"}},"now":{"yr":"2007","head":"Today","label":"The church today","line":"The brick church with its Ebenezer sign on Auburn Avenue. Photo from 2007.","ph":{"k":"at_eb_now","by":"Erin McDaniel (Erinmcd)","lic":"CC BY 3.0","lu":"https://creativecommons.org/licenses/by/3.0/","page":"https://commons.wikimedia.org/wiki/File:Ebenezer_Baptist_Church.jpg","note":"resized"}},"story":["Ebenezer Baptist Church was founded in 1886 by Pastor John A. Parker and eight people on Airline Street.","The church building was dedicated in 1922. Martin Luther King Jr. served as co-pastor with his father from 1960 until his assassination in 1968, and his funeral was held at Ebenezer on April 9, 1968.","The newer Horizon Sanctuary was inaugurated in 1999 with 1,700 seats, in the Martin Luther King Jr. National Historical Park."],"fact":"The church was founded with nine people.","disputed":"Wikipedia does not give the national park's founding year or the old sanctuary's style, so check the park's own history before repeating them.","claims":[{"t":"Ebenezer Baptist Church was founded in 1886.","a":0,"why":"Wikipedia: founded in 1886 by Pastor John A. Parker."},{"t":"The church was founded in 1968.","a":2,"why":"1968 is the year of King's funeral. It was founded in 1886."}],"sources":[{"t":"Wikipedia: Ebenezer Baptist Church","u":"https://en.wikipedia.org/wiki/Ebenezer_Baptist_Church"},{"t":"Wikipedia: Martin Luther King Jr. National Historical Park","u":"https://en.wikipedia.org/wiki/Martin_Luther_King_Jr._National_Historical_Park"}],"card":{"a":"1886","b":"1999","la":"Founded","lb":"Horizon Sanctuary"}},{"id":"capitol","name":"Georgia State Capitol","short":"State Capitol","badge":"State Capitol","tag":"Stop 2 of 4","teaser":"A gold dome made from gold dug up in Georgia.","map":"Georgia State Capitol, 206 Washington St SW, Atlanta, GA","clue":"Go downtown near Underground Atlanta and find the big domed building with a gold top.","safety":"Downtown streets are busy. Use crosswalks. The building has security screening and set visiting hours.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"Look at the dome. What is it covered in?","options":["Gold leaf","Copper","Slate","Terra cotta"],"answer":0,"hint":"A precious metal.","verify":"Wikipedia says the dome is gilded with gold leaf. Confirm on site. Written from sources, not yet checked on site."},"then":{"yr":"1889","label":"The Capitol then","line":"An 1889 print of the Capitol from a cigarette card series.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"at_cp_then","by":"Allen & Ginter / August Gast","lic":"CC0","lu":"https://creativecommons.org/publicdomain/zero/1.0/","page":"https://commons.wikimedia.org/wiki/File:Capitol_of_Georgia_in_Atlanta,_from_the_General_Government_and_State_Capitol_Buildings_series_(N14)_for_Allen_%26_Ginter_Cigarettes_Brands_MET_DP834734.jpg","note":"resized"}},"now":{"yr":"Today","head":"Today","label":"The Capitol today","line":"The gold dome rises over downtown Atlanta.","ph":{"k":"at_cp_now","by":"Ken Lund","lic":"CC BY-SA 2.0","lu":"https://creativecommons.org/licenses/by-sa/2.0/","page":"https://commons.wikimedia.org/wiki/File:Georgia_State_Capitol,_Atlanta,_Georgia.jpg","note":"resized"}},"story":["The Georgia State Capitol was completed in March 1889. Willoughby J. Edbrooke and Franklin Pierce Burnham of Chicago designed it. Miles and Horne of Toledo handled construction. The style is Renaissance Revival and Classical Revival, modeled to resemble the U.S. Capitol.","The dome was gilded in a 1958 renovation with native gold leaf from near Dahlonega in Lumpkin County. The original dome was terra cotta covered with tin. A statue named Miss Freedom has stood on top since the building opened.","A convention voted in 1877 to move the state capital permanently to Atlanta, and the city handed over its City Hall tract in 1880. The Georgia Capitol Museum has existed inside since 1889."],"fact":"The dome was gilded with gold from near Dahlonega in 1958.","disputed":"Wikipedia does not say whether the dome was gilded before 1958. Do not claim it was always gold.","claims":[{"t":"The Georgia State Capitol was completed in 1889.","a":0,"why":"Wikipedia: completed March 1889."},{"t":"The dome has always been covered in gold.","a":2,"why":"The original dome was terra cotta covered in tin. The gold leaf was added in 1958."}],"sources":[{"t":"Wikipedia: Georgia State Capitol","u":"https://en.wikipedia.org/wiki/Georgia_State_Capitol"},{"t":"Georgia Encyclopedia: Georgia State Capitol","u":"https://www.georgiaencyclopedia.org/articles/arts-culture/georgia-state-capitol/"}],"card":{"a":"1889","b":"1958","la":"Completed","lb":"Dome gilded"}},{"id":"flatiron","name":"Flatiron Building","short":"Flatiron","badge":"Flatiron","tag":"Stop 3 of 4","teaser":"A wedge-shaped skyscraper that beat New York's by five years.","map":"Flatiron Building, 84 Peachtree St NW, Atlanta, GA","clue":"Walk to the downtown block where Peachtree, Poplar and Broad Streets meet and look for the narrow wedge-shaped tower.","safety":"Peachtree Street is busy. Use crosswalks, and stay on public sidewalks around the building.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"The building sits on a wedge-shaped block. About how many stories does it have?","options":["8","11","15","20"],"answer":1,"hint":"More than ten, fewer than fifteen.","verify":"Wikipedia says 11 stories. Count on site. Written from sources, not yet checked on site."},"then":{"yr":"1921","label":"The building then","line":"A magazine photograph of the Flatiron Building in 1921.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"at_fl_then","by":"Ewing Galloway","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Collier's_1921_Georgia_-_Atlanta_(Flatiron_Building).jpg","note":"resized"}},"now":{"yr":"Today","head":"Today","label":"The building today","line":"The wedge-shaped tower stands on Peachtree Street.","ph":{"k":"at_fl_now","by":"dbking","lic":"CC BY 2.0","lu":"https://creativecommons.org/licenses/by/2.0/","page":"https://commons.wikimedia.org/wiki/File:Flatiron_Building_Atlanta.jpg","note":"resized"}},"story":["The Flatiron Building was built in 1897 and designed by Bradford Gilbert. It goes by several names: the English-American Building, the Georgia Savings Bank Building and the Empire Life Insurance Building.","It has 11 stories on a wedge-shaped block at 84 Peachtree Street NW, between Peachtree Street NE, Poplar Street NW and Broad Street NW. It was completed five years before New York's Flatiron Building and is described as the city's oldest standing skyscraper.","It was added to the National Register of Historic Places on March 26, 1976. It is now used for offices and includes a Microsoft Innovation Center."],"fact":"It was finished five years before New York's Flatiron.","disputed":"\"Oldest\" depends on how you define a skyscraper. Wikipedia calls it the city's second and oldest standing one in the same description.","claims":[{"t":"Atlanta's Flatiron Building was built before New York's.","a":0,"why":"Wikipedia: completed five years before New York's Flatiron Building."},{"t":"The building has 50 stories.","a":2,"why":"It has 11 stories."}],"sources":[{"t":"Wikipedia: Flatiron Building (Atlanta)","u":"https://en.wikipedia.org/wiki/Flatiron_Building_(Atlanta)"},{"t":"The Clio: The Flatiron Building","u":"https://www.theclio.com/tour/2431/5"}],"card":{"a":"1897","b":"1976","la":"Built","lb":"National Register"}},{"id":"piedmont","name":"Piedmont Park","short":"Piedmont Park","badge":"Piedmont Park","tag":"Stop 4 of 4","teaser":"A park built on the site of an 1895 world's fair.","map":"Piedmont Park, 1071 Piedmont Ave NE, Atlanta, GA","clue":"Go to the big park in Midtown and walk to the lake in the middle, Lake Clara Meer.","safety":"Watch for bikes, skaters and joggers on the paths. Stay back from the water's edge.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"Lake Clara Meer is part of a park plan by which firm?","options":["Wright Brothers","Warner Brothers","Ringling Brothers","Olmsted Brothers"],"answer":3,"hint":"They were landscape architects.","verify":"Wikipedia says Lake Clara Meer is in the Olmsted Brothers design. Written from sources, not yet checked on site."},"then":{"yr":"1902","label":"The park then","line":"A newspaper photograph of the grandstand at Piedmont Park in 1902.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"at_pk_then","by":"Unknown (newspaper photograph)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Piedmont_Park_Atlanta_1902_04_27.jpg","note":"resized"}},"now":{"yr":"Today","head":"Today","label":"The park today","line":"The lake and lawn sit in the middle of Midtown.","ph":{"k":"at_pk_now","by":"Gatorfan252525","lic":"CC BY-SA 4.0","lu":"https://creativecommons.org/licenses/by-sa/4.0/","page":"https://commons.wikimedia.org/wiki/File:View_of_Lake_Clara_Meer_from_bridge.jpg","note":"resized"}},"story":["Piedmont Park covers 189 acres in Atlanta. It sits on the site of the 1895 Cotton States and International Exposition. The city bought the land in 1904, which extended the city limits to include the park and several developing neighborhoods.","The Olmsted Brothers offered a design between 1909 and 1912, and some of it was built. It includes Lake Clara Meer, an 11.5-acre lake.","The park gained a bathhouse, the Park Drive Bridge and Isamu Noguchi's Playscapes playground. After two decades of decline, the city adopted a master plan in 1982 and the Piedmont Park Conservancy formed in 1983. It was listed on the National Register of Historic Places in 1976."],"fact":"The Conservancy formed in 1983.","disputed":"The Olmsted plan was only partly built. Do not say the whole park follows it.","claims":[{"t":"Piedmont Park is on the site of the 1895 Cotton States and International Exposition.","a":0,"why":"Wikipedia: the park is on the exposition's site."},{"t":"The Olmsted Brothers designed the entire park.","a":1,"why":"Wikipedia says some of the plan was realized, but not all."}],"sources":[{"t":"TCLF: Piedmont Park","u":"https://www.tclf.org/piedmont-park"},{"t":"Wikipedia: Piedmont Park","u":"https://en.wikipedia.org/wiki/Piedmont_Park"}],"card":{"a":"1895","b":"1983","la":"Exposition","lb":"Conservancy formed"}}],"heroKey":"at_cp_now"},"memphis":{"id":"memphis","name":"Memphis","explorer":"Bluff City Explorer","initials":"MEM","ranks":[[0,"Visitor"],[100,"Beale Walker"],[250,"Landmark Hunter"],[450,"Blues Scholar"],[600,"Memphis Historian"]],"heroAlt":"The front of Graceland","heroLi":"<li>Header: Maha · CC BY 2.5 · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:Graceland_front.jpg\">Source</a> · resized</li>","heroCredit":"Photo: Maha · <a target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by/2.5/\">CC BY 2.5</a> · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:Graceland_front.jpg\">Source</a>","mission":"Find four landmarks around Memphis. At each one, check in to earn its badge, unlock its story, and collect a Time Card. Do them in any order. Everything stays on this phone.","afterDone":"All four badges earned. The rest of Memphis is waiting.","safetyNote":"<li>Memphis summers are hot. Bring water, stay in busy areas at night, and respect that Graceland and Sun Studio y Lee Lewis, Howlin' Wolf and B.B. King also recorded there. Jackie Brenston and his Delta Cats recorded Rocket 88 there in 1951, often cited as the first rock and roll single.","On December 4, 1956, Presley, Lewis, Perkins and Cash had an impromptu session that was later called the Million Dollar Quartet. Sun Studio became a National Historic Landmark on July 31, 2003 and is still used by recording artists."],"fact":"Sam Phillips opened the studio on January 3, 1950.","disputed":"\"First rock and roll record\" is an old argument. Wikipedia calls the Rocket 88 claim reputed.","claims":[{"t":"Sam Phillips opened Sun Studio in 1950.","a":0,"why":"Wikipedia: opened January 3, 1950."},{"t":"Rocket 88 is certainly the first rock and roll record.","a":1,"why":"It is often cited as the first, but that claim is disputed."}],"sources":[{"t":"Wikipedia: Sun Studio","u":"https://en.wikipedia.org/wiki/Sun_Studio"},{"t":"Wikipedia: Sam Phillips","u":"https://en.wikipedia.org/wiki/Sam_Phillips"}],"card":{"a":"1950","b":"2003","la":"Opened","lb":"Landmark"}},{"id":"beale","name":"Beale Street","short":"Beale Street","badge":"Beale Street","tag":"Stop 2 of 4","teaser":"A street the U.S. Congress officially named the Home of the Blues.","map":"Beale Street, Memphis, TN","clue":"Go downtown and walk the pedestrian blocks of Beale Street, lit with neon signs.","safety":"The street is crowded at night. Keep your belongings close, stay in a group and use crosswalks.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"Find B.B. King's Blues Club. What is its street number?","options":["143","127","201","119"],"answer":0,"hint":"It is on the same block as the neon.","verify":"Wikipedia lists B.B. King's Blues Club at 143 Beale. Written from sources, not yet checked on site."},"then":{"yr":"1939","label":"Beale Street then","line":"Beale Street in October 1939.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"me_be_then","by":"New York Public Library","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Memphis,_Tennessee,_Beale_Street,_October_1939._(3110571760).jpg","note":"resized"}},"now":{"yr":"2012","head":"Today","label":"The street today","line":"Neon signs on Beale Street. Photo from 2012.","ph":{"k":"me_be_now","by":"Adam Jones, Ph.D.","lic":"CC BY-SA 3.0","lu":"https://creativecommons.org/licenses/by-sa/3.0/","page":"https://commons.wikimedia.org/wiki/File:Beale_Street_Pastiche_-_Downtown_Memphis_-_Tennessee_-_USA.jpg","note":"resized"}},"story":["Developer Robertson Topp laid out Beale Street in 1841. It was first called Beale Avenue and was later renamed for Edward Fitzgerald Beale.","W.C. Handy came to Memphis around 1903. He wrote Mr. Crump in 1909 as a campaign song, and it was later renamed The Memphis Blues.","The street declined in the 1960s as urban renewal tore down buildings. Beale Street became a National Historic Landmark in May 1966, and on December 15, 1977, Congress declared it the Home of the Blues."],"fact":"B.B. King was billed as the Beale Street Blues Boy.","disputed":"The Wikipedia article does not use the title Father of the Blues for Handy. Check that nickname before repeating it.","claims":[{"t":"Congress declared Beale Street the Home of the Blues in 1977.","a":0,"why":"Wikipedia: December 15, 1977."},{"t":"Beale Street was built in the 1960s.","a":2,"why":"It was laid out in 1841. The 1960s was a period of decline."}],"sources":[{"t":"Wikipedia: Beale Street","u":"https://en.wikipedia.org/wiki/Beale_Street"},{"t":"Wikipedia: W. C. Handy","u":"https://en.wikipedia.org/wiki/W._C._Handy"}],"card":{"a":"1841","b":"1977","la":"Laid out","lb":"Home of the Blues"}},{"id":"graceland","name":"Graceland","short":"Graceland","badge":"Graceland","tag":"Stop 3 of 4","teaser":"The mansion Elvis bought for $102,500 when he was 22.","map":"Graceland, ace Toof, daughter of the founder of a family business, not from the Moores themselves.","claims":[{"t":"Elvis bought Graceland in 1957.","a":0,"why":"Wikipedia: March 19, 1957."},{"t":"Graceland opened to the public in 1960.","a":2,"why":"It opened June 7, 1982."}],"sources":[{"t":"Wikipedia: Graceland","u":"https://en.wikipedia.org/wiki/Graceland"},{"t":"Wikipedia: Elvis Presley","u":"https://en.wikipedia.org/wiki/Elvis_Presley"}],"card":{"a":"1957","b":"1982","la":"Elvis buys it","lb":"Public opening"}},{"id":"cottonex","name":"Memphis Cotton Exchange","short":"Cotton Exchange","badge":"Cotton Exchange","tag":"Stop 4 of 4","teaser":"Where fortunes were made on cotton, until trading went digital in 1978.","map":"Cotton Exchange Building, 65 Union Ave, Memphis, TN","clue":"Go downtown to the corner of Front Street and Union Avenue and find the old exchange building.","safety":"Front Street and Union Avenue are busy. Use crosswalks. The museum has its own hours and tickets.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"Look for the sign or plaque. In what year did the Memphis Cotton Exchange start trading?","options":["1850","1900","1925","1874"],"answer":3,"hint":"Nine years after the Civil War ended.","verify":"Wikipedia says the exchange was founded in 1874. Written from sources, not yet checked on site."},"then":{"yr":"1939","label":"The trading floor then","line":"Traders on the exchange floor in November 1939.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"me_ce_then","by":"Marion Post Wolcott (Farm Security Administration)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Memphis_Cotton_Exchange.JPG","note":"resized"}},"now":{"yr":"Today","head":"Today","label":"The building today","line":"The old trading floor is now a museum.","ph":{"k":"me_ce_now","by":"Thomas R Machnitzki","lic":"CC BY-SA 3.0","lu":"https://creativecommons.org/licenses/by-sa/3.0/","page":"https://commons.wikimedia.org/wiki/File:Cotton_Exchange_Building_Memphis_TN.jpg","note":"resized"}},"story":["The Memphis Cotton Exchange was founded in 1874, after the Civil War. It operated as a spot market, where cotton was bought and sold for immediate delivery.","The Cotton Exchange Building stands at the corner of Front Street and Union Avenue. Trading took place on the first floor, where only exchange members could trade.","Floor trading ended in 1978, when computer trading took over. The remodeled historic trading floor is now home to The Cotton Museum."],"fact":"Only exchange members could trade on the floor.","disputed":"Wikipedia is inconsistent on the building date. The infobox says 1925 and the text also mentions 1922, so check the museum's own history.","claims":[{"t":"The Memphis Cotton Exchange was founded in 1874.","a":0,"why":"Wikipedia: founded in 1874."},{"t":"Floor trading at the exchange ended in 1925.","a":2,"why":"1925 is the likely building date. Floor trading closed in 1978."}],"sources":[{"t":"Wikipedia: Memphis Cotton Exchange","u":"https://en.wikipedia.org/wiki/Memphis_Cotton_Exchange"},{"t":"Wikipedia: The Cotton Museum","u":"https://en.wikipedia.org/wiki/The_Cotton_Museum"}],"card":{"a":"1874","b":"1978","la":"Founded","lb":"Floor trading ended"}}],"heroKey":"me_gl_now"},"savannah":{"id":"savannah","name":"Savannah","explorer":"Hostess City Explorer","initials":"SAV","ranks":[[0,"Visitor"],[100,"Square Walker"],[250,"Landmark Hunter"],[450,"Savannah Scholar"],[600,"Savannah Historian"]],"heroAlt":"The fountain in Forsyth Park","heroLi":"<li>Header: Jennifer Morrow · CC BY 2.0 · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:Forsyth_Park_Fountain_(1).jpg\">Source</a> · resized</li>","heroCredit":"Photo: Jennifer Morrow · <a target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by/2.0/ in_Forsyth_Park,_Savannah,_Ga,_by_J._A._Palmer.jpg","note":"resized"}},"now":{"yr":"2010","head":"Today","label":"The fountain today","line":"The white iron fountain in Forsyth Park. Photo from 2010.","ph":{"k":"sv_fp_now","by":"Jennifer Morrow","lic":"CC BY 2.0","lu":"https://creativecommons.org/licenses/by/2.0/","page":"https://commons.wikimedia.org/wiki/File:Forsyth_Park_Fountain_(1).jpg","note":"resized"}},"story":["Forsyth Park began in the 1840s on 10 acres given by William Brown Hodgson. It was expanded and named for Georgia Governor John Forsyth in 1851. It covers 30 acres.","The fountain was installed in 1858 and cast by Janes, Beebe & Company. Its design comes from the work of French sculptor Michel Lienard and resembles fountains at the Place de la Concorde in Paris.","The Confederate Memorial was unveiled in 1874 and a bronze soldier was added in 1879. The Fragrant Garden was designed for the blind, and the fountain is ceremonially turned green for St. Patrick's Day."],"fact":"The fountain is turned green for St. Patrick's Day.","disputed":"Many sources say Forsyth donated the land. Wikipedia says William Brown Hodgson gave the first 10 acres.","claims":[{"t":"The Forsyth Park fountain was installed in 1858.","a":0,"why":"Wikipedia: installed in 1858."},{"t":"Governor Forsyth donated the first 10 acres.","a":2,"why":"William Brown Hodgson donated the first 10 acres."}],"sources":[{"t":"Wikipedia: Forsyth Park","u":"https://en.wikipedia.org/wiki/Forsyth_Park"},{"t":"Wikipedia: Savannah Historic District","u":"https://en.wikipedia.org/wiki/Savannah_Historic_District"}],"card":{"a":"1851","b":"1858","la":"Park named","lb":"Fountain installed"}},{"id":"riverstreet","name":"River Street","short":"River Street","badge":"River Street","tag":"Stop 2 of 4","teaser":"A cobbled street where giant ships pass within a few yards.","map":"River Street, Savannah, GA","clue":"Take the steps or ramp down the bluff to the cobbled street on the Savannah River, lined with old cotton warehouses.","safety":"The cobblestones are uneven and slippery when wet. Watch for streetcar tracks and keep back from the river edge.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"Looking at the river, what kind of vessels pass close to the promenade?","options":["Kayaks","Large cargo ships","Ferries only","Sailboats only"],"answer":1,"hint":"Think of the Port of Savannah.","verify":"Wikipedia says large tankers and container ships sometimes pass within yards of the promenade. Written from sources, not yet checked on site."},"then":{"yr":"1883","label":"The waterfront then","line":"An 1883 illustration of Savannah and its harbor, with ships along the river.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"sv_rs_then","by":"J. O. Davidson (illustrator)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:City_and_Harbor_of_Savannah,_Georgia.jpg","note":"resized"}},"now":{"yr":"2017","head":"Today","label":"The street today","line":"The cobbled street and old warehouses along the river. Photo from 2017.","ph":{"k":"sv_rs_now","by":"Seasider53","lic":"CC BY-SA 4.0","lu":"https://creativecommons.org/licenses/by-sa/4.0/","page":"https://commons.wikimedia.org/wiki/File:River_Street,_Savannah,_Georgia,_2017.jpg","note":"resized"}},"story":["River Street is about 2 miles long along the Savannah River, according to Wikipedia. The south side has rows of former cotton warehouses, some dating from the 1850s.","Factors Walk is built on the middle level of the sloping bluff, with warehouses beneath and Bay Street above. Cotton brokers, called factors, bargained there. The name Factors Row preserves the industry's name.","The pavement is Belgian block with streetcar tracks set in. Large tankers and container ships heading to and from the Port of Savannah sometimes pass within yards of the promenade."],"fact":"The warehouses were built for the cotton trade.","disputed":"A popular claim says the cobblestones are old ship ballast stones. Wikipedia describes Belgian block paving instead.","claims":[{"t":"River Street has former cotton warehouses.","a":0,"why":"Wikipedia: terraces of former King Cotton warehouses."},{"t":"The paving is all old ship ballast.","a":1,"why":"A popular story, but Wikipedia describes Belgian block paving."}],"sources":[{"t":"Wikipedia: River Street (Savannah, Georgia)","u":"https://en.wikipedia.org/wiki/River_Street_(Savannah,_Georgia)"},{"t":"Wikipedia: Factors Walk","u":"https://en.wikipedia.org/wiki/Factors_Walk"}],"card":{"a":"1850s","b":"Today","la":"Warehouses","lb":"Waterfront"}},{"id":"cathedral","name":"Cathedral of St. John the Baptist","short":"Cathedral","badge":"Cathedral","tag":"Stop 3 of 4","teaser":"Spires over Lafayette Square, rebuilt after a fire.","map":"Cathedral Basilica of St. John the Baptist, 222 E Harris St, Savannah, GA","clue":"Go to Lafayette Square and find the big Gothic church with tall spires.","safety":"It is an active church. Be quiet and respectful, check visiting hours, and watch for traffic around the square.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"How many tall spires rise from the front of the cathedral?","options":["1","2","3","4"],"answer":1,"hint":"Look at the front tower area.","verify":"Wikipedia mentions the cathedral's spires. Count on site. Written from sources, not yet checked on site."},"then":{"yr":"before 1914","label":"The cathedral then","line":"A printed view of the cathedral and its two spires, published before 1914.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"sv_ca_then","by":"Unknown (print published before 1914)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Cathedral_of_St._John_the_Baptist,_Savannah,_Georgia.jpg","note":"resized"}},"now":{"yr":"2015","head":"Today","label":"Inside the cathedral","line":"A stained-glass window inside the cathedral. Photo from 2015.","ph":{"k":"sv_ca_now","by":"Dsdugan","lic":"CC0","lu":"https://creativecommons.org/publicdomain/zero/1.0/","page":"https://commons.wikimedia.org/wiki/File:Savannah_cathedral_2015_17_052.jpg","note":"resized"}},"story":["The parish started in 1799. The present cathedral was dedicated on April 30, 1876, and Ephraim Francis Baldwin was its architect, in Gothic Revival style.","A fire destroyed the interior on February 6, 1898. The first Mass in the rebuilt building was held in December 1899, and it was rededicated on October 28, 1900.","It is 214 feet tall overall and has 81 stained-glass windows. Windows installed in 1904 came from Austria-Hungary. Pope Francis made it a minor basilica in January 2020."],"fact":"It became a minor basilica in 2020.","disputed":"Older guides say the basilica title dates to the 1990s. Wikipedia says January 2020.","claims":[{"t":"The cathedral was dedicated in 1876.","a":0,"why":"Wikipedia: dedicated April 30, 1876."},{"t":"The cathedral was named a basilica in 1996.","a":2,"why":"Pope Francis elevated it in January 2020."}],"sources":[{"t":"Wikipedia: Cathedral Basilica of St. John the Baptist","u":"https://en.wikipedia.org/wiki/Cathedral_Basilica_of_St._John_the_Baptist_(Savannah,_Georgia)"},{"t":"Wikipedia: Lafayette Square (Savannah)","u":"https://en.wikipedia.org/wiki/Lafayette_Square_(Savannah,_Georgia)"}],"card":{"a":"1876","b":"1900","la":"Dedicated","lb":"Rededicated"}},{"id":"pulaski","name":"Fort Pulaski","short":"Fort Pulaski","badge":"Fort Pulaski","tag":"Stop 4 of 4","teaser":"A fort with 11-foot walls that fell in 30 hours.","map":"Fort Pulaski National Monument, Cockspur Island, GA","clue":"Drive east of Savannah toward Tybee Island to Cockspur Island and find the brick fort surrounded by a moat.","safety":"It is a national park site on an island. Watch for traffic on the highway, stay on trails and bring water and sun protection.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"How thick are the fort's walls?","options":["3 feet","7 feet","11 feet","20 feet"],"answer":2,"hint":"A bit more than a basketball hoop is tall.","verify":"Wikipedia says the walls are 11 feet thick. Written from sources, not yet checked on site."},"then":{"yr":"1862","label":"After the siege","line":"The damaged corner wall after the 1862 siege.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"sv_pu_then","by":"Unknown","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:FTPulaski1862a01.jpg","note":"resized"}},"now":{"yr":"Today","head":"Today","label":"The fort today","line":"The brick fort sits on Cockspur Island.","ph":{"k":"sv_pu_now","by":"Jud McCranie","lic":"CC BY 3.0","lu":"https://creativecommons.org/licenses/by/3.0/","page":"https://commons.wikimedia.org/wiki/File:FtPulaskiFront.jpg","note":"resized"}},"story":["Fort Pulaski was built from 1829 to 1847 on Cockspur Island at the mouth of the Savannah River. It was named in 1833 for Casimir Pulaski, a Polish-born soldier who fought in the American Revolution. About 25 million bricks went into it, supported by wooden pilings sunk up to 70 feet.","As a young second lieutenant, Robert E. Lee worked on its construction under Major Samuel Babcock. The walls are 11 feet thick.","In April 1862, Union forces used 36 guns, including James rifled cannons and Parrott rifles, to breach the corner wall within about 30 hours. Colonel Charles H. Olmstead surrendered reluctantly. Only two soldiers were killed. The success of rifled cannon rendered brick forts obsolete. It became a national monument on October 15, 1924."],"fact":"Only two soldiers were killed in the siege.","disputed":"Dates for the surrender differ slightly. The siege began on April 10, 1862, and a photo of the surrender room is dated April 11.","claims":[{"t":"Fort Pulaski was breached by rifled cannon in 1862.","a":0,"why":"Wikipedia: the corner wall was breached within 30 hours."},{"t":"Robert E. Lee designed Fort Pulaski.","a":2,"why":"He worked on construction as a young lieutenant, but did not design it."}],"sources":[{"t":"Wikipedia: Fort Pulaski National Monument","u":"https://en.wikipedia.org/wiki/Fort_Pulaski_National_Monument"},{"t":"Georgia Encyclopedia: Fort Pulaski","u":"https://www.georgiaencyclopedia.org/articles/counties-cities-neighborhoods/chatham-county/m-851"}],"card":{"a":"1829","b":"1862","la":"Construction began","lb":"Siege"}}],"heroKey":"sv_fp_now"},"denver":{"id":"denver","name":"Denver","explorer":"Mile High Explorer","initials":"DEN","ranks":[[0,"Visitor"],[100,"Mile Marker"],[250,"Landmark Hunter"],[450,"Denver Scholar"],[600,"Denver Historian"]],"heroAlt":"The marble Cheesman Memorial pavilion in Denver","heroLi":"<li>Header: Carol M. Highsmith · Public domain · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:The_1908_pavilion_in_Denver,_Colorado's,_Cheesman_Park_LCCN2015633572.tif\">Source</a> · resized</li>","heroCredit":"Photo: Carol M. Highsmith · <a target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/publicdomain/mark/1.0/\">Public domain</a> · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:The_1908_pavilion_in_Denver,_Colorado's,_Cheesman_Park_LCCN2015633572.tif\">Source</a>","mission":"Find four landmarks around Denver. At each one, check in to earn its badge, unlock its story, and collect a Time Card. Do them in any order. Everything stays on this phone.","afterDone":"All four badges earned. The rest of Denver is waiting.","safetyNote":"<li>Downtown Denver has busy streets, light rail and bike lanes. Use crosswalks, and remember the city is a mile up, so drink water and go easy on the sun.</li>","badgeMap":{"union":["dn_un_now","50% 45%"],"brown":["dn_br_now","50% 45%"],"mint":["dn_mi_now","50% 45%"],"cheesman":["dn_ce_now","50% 45%"]},"level":"Classics","region":"The Southwest","stops":[{"id":"union","name":"Denver Union Station","short":"Union Station","badge":"Union Station","tag":"Stop 1 of 4","teaser":"A train station with a welcome arch that was torn down for being in the way.","map":"Denver Union Station, 1701 Wynkoop St, Denver, CO","clue":"Go to the LoDo neighborhood at 17th and Wynkoop Streets. Look for the stone station hall with a tall central tower and big orange letters.","safety":"Trains, buses and light rail all meet here. Stay on the platforms' public side, use crosswalks and watch for traffic on Wynkoop Street.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"The big orange sign on the station hall says \"Union Station\" and what else?","options":["Welcome to Denver","Travel by Train","Mile High City","Rocky Mountain Rail"],"answer":1,"hint":"The sign advertises a way of getting around that does not involve a car or a plane.","verify":"Wikipedia says orange \"Union Station: Travel by Train\" signs were added in the late 1950s. Read the sign on site. Written from sources, not yet checked on site."},"then":{"yr":"About 1908","label":"The arch then","line":"Looking down 17th Street, with the Mizpah arch in front of Union Depot, about 1908.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"dn_un_then","by":"Detroit Publishing Company","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Welcome_Arch_and_Union_Depot,_Denver,_Colo..jpg","note":"resized, cropped"}},"now":{"yr":"2014","head":"Today","label":"The station today","line":"The station and the new open-air train hall during the 2014 renovation.","ph":{"k":"dn_un_now","by":"Isaac Kim","lic":"CC BY-SA 4.0","lu":"https://creativecommons.org/licenses/by-sa/4.0/","page":"https://commons.wikimedia.org/wiki/File:Denver_Union_Station_Panorama,_July_2014.jpg","note":"resized"}},"story":["A station first opened on this spot on June 1, 1881, after four railroads agreed to share one \"union\" station. A fire in 1894 destroyed the middle of it, and a bigger one went up in the Romanesque Revival style.","On July 4, 1906, a huge arch was dedicated in front of the station. It cost $22,500, used 70 tons of steel and had more than 2,000 light bulbs. One side said \"Welcome\" and the other said \"Mizpah\", a farewell word. The arch was torn down in 1931 because it was considered a traffic hazard.","The current central building, in the Beaux-Arts style, opened in 1914. After a big renovation, the station house reopened in summer 2014 with the 112-room Crawford Hotel, shops and a modern open-air train hall."],"fact":"The arch said \"Welcome\" on one side and \"Mizpah\" on the other.","disputed":"Many people call the whole building the 1881 station. Wikipedia says the central part was replaced after the 1894 fire and again in 1914.","claims":[{"t":"Denver's Mizpah Arch was dedicated in 1906.","a":0,"why":"Wikipedia: dedicated July 4, 1906."},{"t":"The arch is still standing in front of the station.","a":2,"why":"It was torn down in 1931 as a traffic hazard."}],"sources":[{"t":"Wikipedia: Denver Union Station","u":"https://en.wikipedia.org/wiki/Denver_Union_Station"},{"t":"Wikipedia: Union Pacific Railroad","u":"https://en.wikipedia.org/wiki/Union_Pacific_Railroad"}],"card":{"a":"1881","b":"1914","la":"First station","lb":"Current hall"}},{"id":"brown","name":"Brown Palace Hotel","short":"Brown Palace","badge":"Brown Palace","tag":"Stop 2 of 4","teaser":"A triangle-shaped hotel where presidents slept and a football league was dreamed up.","map":"Brown Palace Hotel, 321 17th St, Denver, CO","clue":"Go to 17th Street near Broadway. Look for the red-brown stone hotel that comes to a sharp point like a slice of pie.","safety":"17th Street is busy with cars and light rail. Use crosswalks, and be polite in the lobby, since it is a working hotel.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"What shape is the hotel building, seen from above?","options":["A square","A circle","A star","A triangle"],"answer":3,"hint":"Look at how the corners meet on the street side, then count them.","verify":"Wikipedia says the architect gave it a distinctive triangular shape. Check the corners on site. Written from sources, not yet checked on site."},"then":{"yr":"1898","label":"The hotel then","line":"The Brown Palace in 1898, a few years after it opened.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"dn_br_then","by":"Detroit Publishing Company (via Library of Congress)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Brown_Palace_Hotel,_1898.JPG","note":"resized"}},"now":{"yr":"Today","head":"Today","label":"The hotel today","line":"The triangular hotel stands among tall towers on 17th Street.","ph":{"k":"dn_br_now","by":"Hustvedt","lic":"CC BY-SA 3.0","lu":"https://creativecommons.org/licenses/by-sa/3.0/","page":"https://commons.wikimedia.org/wiki/File:Brown_Palace_Hotel_Denver_CO.jpg","note":"resized"}},"story":["The Brown Palace opened in 1892. Frank Edbrooke designed it in a triangle shape, and it was named for its owner, Henry C. Brown. When it was finished, it was the tallest building in Denver.","Wikipedia says an iron and steel frame covered in cement and sandstone made it one of America's first fireproof buildings. It is also one of the first atrium-style hotels ever built.","Theodore Roosevelt became the first sitting president to visit the hotel, on May 8, 1905. In 1959, Lamar Hunt and Bob Howsam met in the lobby to talk about a new football league, and Howsam agreed to own what became the Denver Broncos."],"fact":"A plaque in the lobby marks the football meeting.","disputed":"Some stories say every president has stayed here. Wikipedia says nearly every one has visited, which is not the same thing.","claims":[{"t":"The Brown Palace opened in 1892.","a":0,"why":"Wikipedia: the hotel was built in 1892."},{"t":"The hotel was the first in Denver, built before any other.","a":2,"why":"The Oxford Hotel was built a year earlier."}],"sources":[{"t":"Wikipedia: Brown Palace Hotel (Denver)","u":"https://en.wikipedia.org/wiki/Brown_Palace_Hotel_(Denver,_Colorado)"},{"t":"Wikipedia: Frank Edbrooke","u":"https://en.wikipedia.org/wiki/Frank_E._Edbrooke"}],"card":{"a":"1892","b":"1959","la":"Opened","lb":"Broncos meeting"}},{"id":"mint","name":"Denver Mint","short":"Denver Mint","badge":"Denver Mint","tag":"Stop 3 of 4","teaser":"The biggest coin factory in the world, behind a building copied from Florence.","map":"Denver Mint, 320 W Colfax Ave, Denver, CO","clue":"Go to Colfax Avenue near Cherokee Street in the Civic Center area. Look for the gray stone building that looks like an Italian palace.","safety":"Colfax Avenue is a busy road. Use crosswalks, view the building from the public sidewalk, and do not approach the secured areas.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"The bottom level uses stone from Pikes Peak. What kind of stone is it?","options":["Granite","Marble","Limestone","Brick"],"answer":0,"hint":"It is a hard, speckled rock, tough enough to take a lot of weather.","verify":"Wikipedia says the first level uses Pikes Peak granite. Look at the lowest floor on site. Written from sources, not yet checked on site."},"then":{"yr":"Early 1900s","label":"The mint then","line":"A postcard of the mint soon after it opened, with a telegraph pole out front.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"dn_mi_then","by":"Detroit Publishing Company (scan by NYPL)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:U._S._Mint,_Denver,_Colo_(NYPL_b12647398-68693).tiff","note":"resized"}},"now":{"yr":"Today","head":"Today","label":"The mint today","line":"The Italian-palace building on Colfax Avenue still makes coins.","ph":{"k":"dn_mi_now","by":"Paul Sableman","lic":"CC BY 2.0","lu":"https://creativecommons.org/licenses/by/2.0/","page":"https://commons.wikimedia.org/wiki/File:Denver_Mint_(40212263814).jpg","note":"resized"}},"story":["Gold miners in the Colorado Gold Rush needed a place to turn gold dust into money. In 1860, a private firm, Clark, Gruber and Company, opened a mint at 16th and Market Streets that made gold coins.","The US government bought that building in 1863 and used it as an assay office. A new mint was planned in 1896, and construction on Colfax Avenue began in 1897. The first coins were struck on February 1, 1906.","The building is based on the Palazzo Medici-Riccardi in Florence, Italy. Today the Denver Mint is the single largest producer of coins in the world, with a D mint mark on its coins."],"fact":"Coins from this mint carry a D.","disputed":"Many people think the mint has always sat on Colfax. Its first home was a two-story brick building at 16th and Market Streets.","claims":[{"t":"The Denver Mint struck its first coins in 1906.","a":0,"why":"Wikipedia: first coins struck on February 1, 1906."},{"t":"The Denver Mint's building copies a palace in Paris.","a":2,"why":"It is based on the Palazzo Medici-Riccardi in Florence, Italy."}],"sources":[{"t":"Wikipedia: Denver Mint","u":"https://en.wikipedia.org/wiki/Denver_Mint"},{"t":"Wikipedia: Pike's Peak gold rush","u":"https://en.wikipedia.org/wiki/Pike%27s_Peak_gold_rush"}],"card":{"a":"1860","b":"1906","la":"Private mint","lb":"Coins from Colfax"}},{"id":"cheesman","name":"Cheesman Memorial Pavilion","short":"Cheesman Pavilion","badge":"Cheesman Pavilion","tag":"Stop 4 of 4","teaser":"A marble temple on a hill that used to be a cemetery.","map":"Cheesman Park Pavilion, E 8th Ave and N Humboldt St, Denver, CO","clue":"Go to Cheesman Park, southeast of downtown. On the east side, look for a white marble pavilion with a reflecting pool in front.","safety":"Stay on the paths, keep off the pavilion's steps if there is a fence or event, and watch for bikes and joggers.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"The marble pavilion in the park has a row of what, holding up its roof?","options":["Arches","Domes","Columns","Towers"],"answer":2,"hint":"It is called neoclassical, a style copied from ancient Greece and Rome.","verify":"Wikipedia calls the memorial neoclassical. Check the roof supports on site. Written from sources, not yet checked on site."},"then":{"yr":"About 1911","label":"The pavilion then","line":"The marble Cheesman Memorial about 1911, with a stone platform and steps.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"dn_ce_then","by":"Mile High Photo Co.","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:CO_Cheesman_Memorial_Denver_1911.jpg","note":"resized"}},"now":{"yr":"Today","head":"Today","label":"The pavilion today","line":"The marble pavilion, with gardens and a reflecting pool in front.","ph":{"k":"dn_ce_now","by":"Carol M. Highsmith","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:The_1908_pavilion_in_Denver,_Colorado's,_Cheesman_Park_LCCN2015633572.tif","note":"resized"}},"story":["The land that is now Cheesman Park was once a cemetery, opened in 1858. After years of neglect, Congress let the city turn it into a park in 1890. The park finally opened in 1907.","The park was named for Denver pioneer Walter Cheesman, whose family paid for the pavilion in his honor. The Cheesman Memorial was built in 1908 from Colorado Yule marble in the neoclassical style.","German-born landscape architect Reinhard Schuetze did the first designs, with winding carriage paths, the pavilion and a reflecting pool. From 1934 to 1972, the Denver Post sponsored open-air musicals and operas at the pavilion."],"fact":"The marble comes from Colorado.","disputed":"Some visitors assume the pavilion is much older. Wikipedia says it was built in 1908, after the park opened.","claims":[{"t":"The Cheesman Memorial was built in 1908.","a":0,"why":"Wikipedia: constructed in 1908 from Colorado Yule marble."},{"t":"The pavilion is made of wood.","a":2,"why":"It is built from Colorado Yule marble."}],"sources":[{"t":"Wikipedia: Cheesman Park","u":"https://en.wikipedia.org/wiki/Cheesman_Park,_Denver"},{"t":"Wikipedia: Denver Botanic Gardens","u":"https://en.wikipedia.org/wiki/Denver_Botanic_Gardens"}],"card":{"a":"1858","b":"1908","la":"Cemetery opened","lb":"Pavilion built"}}],"heroKey":"dn_ce_now"},"santafe":{"id":"santafe","name":"Santa Fe","explorer":"City Different Explorer","initials":"SFE","ranks":[[0,"Visitor"],[100,"Plaza Stroller"],[250,"Landmark Hunter"],[450,"Santa Fe Scholar"],[600,"Santa Fe Historian"]],"heroAlt":"Shaded porches and shops around the Santa Fe Plaza","heroLi":"<li>Header: Asaavedra32 · CC BY-SA 3.0 · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:Santa_Fe_plaza.JPG\">Source</a> · resized</li>","heroCredit":"Photo: Asaavedra32 · <a target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by-sa/3.0/\">CC BY-SA 3.0</a> · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:Santa_Fe_plaza.JPG\">Source</a>","mission":"Find four landmarks around Santa Fe. At each one, check in to earn its badge, unlock its story, and collect a Time Card. Do them in any order. Everything stays on this phone.","afterDone":"All four badges earned. The rest of Santa Fe is waiting.","safetyNote":"<li>Santa Fe is high and dry, so drink water and use sunscreen. Sidewalks are narrow and uneven in places, and the Plaza streets are shared with cars.</li>","badgeMap":{"plaza":["sa_pl_now","50% 45%"],"fonda":["sa_lf_now","50% 45%"],"miguel":["sa_sm_now","50% 45%"],"palace":["sa_pg_now","50% 45%"]},"level":"Classics","region":"The Southwest","stops":[{"id":"plaza","name":"Santa Fe Plaza","short":"Plaza","badge":"Plaza","tag":"Stop 1 of 4","teaser":"The end of the Santa Fe Trail, and the town square for four centuries.","map":"Santa Fe Plaza, 100 Old Santa Fe Trail, Santa Fe, NM","clue":"Go to the middle of downtown. Look for the grassy square with trees, benches and a bandstand, ringed by low buildings.","safety":"Streets around the Plaza have cars and tour carts. Use crosswalks and keep to the sidewalks and paths.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"Most buildings around the Plaza are built in a pueblo style. What material are they made of?","options":["Glass","Steel","Adobe","Brick"],"answer":2,"hint":"It is sun-dried earth, shaped into blocks and plastered over.","verify":"Wikipedia says the Plaza architecture is traditional adobe. Check the walls on site. Written from sources, not yet checked on site."},"then":{"yr":"1885","label":"The Plaza then","line":"The Plaza in 1885, with a white picket fence around the park.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"sa_pl_then","by":"D. B. Chase","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Santa_Fe_Plaza_in_1885.jpg","note":"resized"}},"now":{"yr":"Today","head":"Today","label":"The Plaza today","line":"Shaded porches and shops around the Plaza.","ph":{"k":"sa_pl_now","by":"Asaavedra32","lic":"CC BY-SA 3.0","lu":"https://creativecommons.org/licenses/by-sa/3.0/","page":"https://commons.wikimedia.org/wiki/File:Santa_Fe_plaza.JPG","note":"resized"}},"story":["The Plaza dates to the early 1600s, when Santa Fe was settled by the Spanish. As in other colonial towns, it was where soldiers gathered and where the governor's palace stood.","When Mexico won independence from Spain in 1821, the Santa Fe Trail opened between Missouri and New Mexico. Its western end was this Plaza, where wagon caravans camped and unloaded goods.","After New Mexico became a US territory, a fence was built around the Plaza to keep out animals, and trees and paths were added. New Mexico became the 47th state in 1912. Today the Plaza is a National Historic Landmark."],"fact":"Wagons from Missouri ended their trip here.","disputed":"Many people say the Plaza is the oldest in the country. Wikipedia only says it dates to the early 17th century.","claims":[{"t":"The Santa Fe Trail ended at the Plaza.","a":0,"why":"Wikipedia: its western terminus was the Santa Fe Plaza."},{"t":"New Mexico became a state in 1821.","a":2,"why":"1821 was Mexico's independence. New Mexico became the 47th state in 1912."}],"sources":[{"t":"Wikipedia: Santa Fe Plaza","u":"https://en.wikipedia.org/wiki/Santa_Fe_Plaza"},{"t":"Wikipedia: Santa Fe Trail","u":"https://en.wikipedia.org/wiki/Santa_Fe_Trail"}],"card":{"a":"1821","b":"1912","la":"Trail opens","lb":"Statehood"}},{"id":"fonda","name":"La Fonda on the Plaza","short":"La Fonda","badge":"La Fonda","tag":"Stop 2 of 4","teaser":"An inn on the same corner for 400 years, and the last stop of a famous trail.","map":"La Fonda on the Plaza, 100 E San Francisco St, Santa Fe, NM","clue":"Go to the southeast corner of the Plaza, where San Francisco Street meets the Old Santa Fe Trail. Look for the stepped, earth-colored hotel.","safety":"The corner has traffic and people with luggage. Use crosswalks, and be polite in the lobby, since it is a working hotel.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"What rises above the roof at the top of the hotel?","options":["A bell tower","A flagpole","A clock","A dome"],"answer":0,"hint":"The roof has a tall, narrow part, with a bar named after it.","verify":"Wikipedia says the Bell Tower Bar is on the roof of the fifth floor. Look up on site. Written from sources, not yet checked on site."},"then":{"yr":"Mid-1900s","label":"The hotel then","line":"A postcard of La Fonda, sold as \"at the end of the Santa Fe Trail\".","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"sa_lf_then","by":"Boston Public Library (linen postcard)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:La_Fonda_Hotel,_at_the_end_of_the_Santa_Fe_trail,_Santa_Fe,_New_Mexico.jpg","note":"resized"}},"now":{"yr":"Today","head":"Today","label":"The hotel today","line":"The stepped adobe-style hotel at the corner of the Plaza.","ph":{"k":"sa_lf_now","by":"Atakra","lic":"CC0","lu":"https://creativecommons.org/publicdomain/zero/1.0/","page":"https://commons.wikimedia.org/wiki/File:La_fonda_sw_view.jpg","note":"resized"}},"story":["Wikipedia says an inn has stood on this site since 1609. It sits at the end of the Old Santa Fe Trail, which was the main trade route from Missouri until the railroad came in 1880.","An earlier hotel, the United States Hotel, burned down in 1912. A new hotel was designed by Isaac Hamilton Rapp in the Pueblo Revival style, inspired by the adobe buildings of the Pueblo peoples. In 1925 the Santa Fe Railway bought it.","Architect Mary Colter redesigned the inside with exposed wooden beams called vigas and Mexican tiles. The Fred Harvey Company ran it as a Harvey House until 1969, and offered \"Indian Detours\" tours starting in 1926."],"fact":"The first inn on this spot dates to 1609.","disputed":"The name sounds like a place's name, but Wikipedia says \"La Fonda\" simply means \"the inn\" in Spanish.","claims":[{"t":"An inn has been on this site since 1609.","a":0,"why":"Wikipedia: various inns have stood here since 1609."},{"t":"The hotel was built by railroad workers in 1880.","a":2,"why":"The current hotel was designed by Isaac Rapp in the 1920s and bought by the Santa Fe Railway in 1925."}],"sources":[{"t":"Wikipedia: La Fonda on the Plaza","u":"https://en.wikipedia.org/wiki/La_Fonda_on_the_Plaza"},{"t":"Wikipedia: Mary Colter","u":"https://en.wikipedia.org/wiki/Mary_Jane_Colter"}],"card":{"a":"1609","b":"1925","la":"First inn","lb":"Railway buys it"}},{"id":"miguel","name":"San Miguel Chapel","short":"San Miguel","badge":"San Miguel","tag":"Stop 3 of 4","teaser":"A very old church that got rebuilt after a rebellion burned it.","map":"San Miguel Chapel, 401 Old Santa Fe Trail, Santa Fe, NM","clue":"Go south of the Plaza across the Santa Fe River, on Old Santa Fe Trail. Look for a small brown adobe church with a short front tower.","safety":"The chapel is on a busy street. Use crosswalks, check the visiting hours, and be quiet inside, since it is a place of worship.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"What sits at the very top of the front of the chapel?","options":["A star","A weather vane","A bell","A cross"],"answer":3,"hint":"It is a simple shape, found on top of many churches.","verify":"The photos show the chapel topped with a symbol. Check the very top of the front on site. Written from sources, not yet checked on site."},"then":{"yr":"1873","label":"The chapel then","line":"Timothy O'Sullivan photographed the chapel in 1873.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"sa_sm_then","by":"Timothy H. O'Sullivan","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:The_Church_of_San_Miguel,_the_oldest_church_in_Santa_Fe,_N.M._-_T._H._O'Sullivan,_phot._LCCN2007684822.jpg","note":"resized, cropped"}},"now":{"yr":"Today","head":"Today","label":"The chapel today","line":"The adobe chapel on Old Santa Fe Trail.","ph":{"k":"sa_sm_now","by":"Dorothy Harris","lic":"CC BY 2.0","lu":"https://creativecommons.org/licenses/by/2.0/","page":"https://commons.wikimedia.org/wiki/File:San_Miguel_Mission_Church.jpg","note":"resized"}},"story":["Wikipedia says the first church on this spot was probably built shortly after Santa Fe was founded in 1610, and was first mentioned in writing in 1628. It served the mostly Native and Tlaxcalan people living in the Barrio de Analco across the river.","The Pueblo Revolt of 1680 burned the mission. When Diego de Vargas led the Spanish back in 1692, he found it burned but fixable. The church was rebuilt in 1710.","The wooden altar screen, called a reredos, was added in 1798. It holds a statue of Saint Michael that dates to at least 1709. The chapel is often called the oldest church building in the continental United States."],"fact":"The chapel was rebuilt after being burned in 1680.","disputed":"\"Oldest church\" is a popular claim. Wikipedia says it is often called that, and that the building was rebuilt, so the age depends on what counts.","claims":[{"t":"San Miguel Chapel was rebuilt in 1710.","a":0,"why":"Wikipedia: rebuilt in 1710 after the Pueblo Revolt."},{"t":"It was built in 1880.","a":2,"why":"The first church dates to about 1610. 1880 is when the railroad arrived."}],"sources":[{"t":"Wikipedia: San Miguel Chapel","u":"https://en.wikipedia.org/wiki/San_Miguel_Chapel"},{"t":"Wikipedia: Pueblo Revolt","u":"https://en.wikipedia.org/wiki/Pueblo_Revolt"}],"card":{"a":"1610","b":"1710","la":"First church","lb":"Rebuilt"}},{"id":"palace","name":"Palace of the Governors","short":"Palace","badge":"Palace","tag":"Stop 4 of 4","teaser":"A government building from the 1600s that is still standing on the Plaza.","map":"Palace of the Governors, 105 W Palace Ave, Santa Fe, NM","clue":"Go to the north side of the Plaza. Look for a long, low adobe building with a wooden porch running along the whole front.","safety":"Check hours before you go. Keep to the sidewalk, and be careful on the porch, where people walk and sell things.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"What runs along the whole front of the Palace, shading the sidewalk?","options":["A stone wall","A covered porch","A moat","A fountain"],"answer":1,"hint":"Look at the front and see what keeps the sun off people walking past.","verify":"The photos show a long covered porch with wooden posts. Check the front on site. Written from sources, not yet checked on site."},"then":{"yr":"Mid-1900s","label":"The Palace then","line":"A postcard of the Palace, with a procession passing in front of the long porch.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"sa_pg_then","by":"Boston Public Library (linen postcard)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Palace_of_the_Governors,_erected_1605_A.D.,_Santa_Fe,_New_Mexico.jpg","note":"resized"}},"now":{"yr":"Today","head":"Today","label":"The Palace today","line":"The long adobe porch along the Plaza.","ph":{"k":"sa_pg_now","by":"Dicklyon","lic":"CC BY-SA 4.0","lu":"https://creativecommons.org/licenses/by-sa/4.0/","page":"https://commons.wikimedia.org/wiki/File:Palace_of_the_Governors_pano.jpg","note":"resized"}},"story":["Pedro de Peralta, the new governor, began building the Palace of the Governors in 1610. Some recent research suggests construction started in 1618. It was the seat of government for the Spanish colony of Nuevo México, and later for Mexico and then the New Mexico Territory.","The Pueblo Revolt of 1680 hit Santa Fe, and the Spanish came back in 1693 and 1694. New Mexico stayed governed from the Palace until 1901, and it was the territory's first capitol.","Governor Lew Wallace finished writing his novel Ben-Hur here in the late 1870s. The Palace has been a museum since 1909, and it became a National Historic Landmark in 1960."],"fact":"A governor wrote a famous novel here.","disputed":"The Palace is often called the oldest public building in the US. Wikipedia's Plaza article uses that title, and the Palace article says some research puts the start of construction later than 1610.","claims":[{"t":"Lew Wallace finished Ben-Hur in the Palace of the Governors.","a":0,"why":"Wikipedia: he wrote the final parts while territorial governor."},{"t":"The Palace was built in the 1900s.","a":2,"why":"Construction began in 1610, or possibly 1618."}],"sources":[{"t":"Wikipedia: Palace of the Governors","u":"https://en.wikipedia.org/wiki/Palace_of_the_Governors"},{"t":"Wikipedia: Lew Wallace","u":"https://en.wikipedia.org/wiki/Lew_Wallace"}],"card":{"a":"1610","b":"1909","la":"Construction starts","lb":"Becomes a museum"}}],"heroKey":"sa_pl_now"},"phoenix":{"id":"phoenix","name":"Phoenix","explorer":"Valley Explorer","initials":"PHX","ranks":[[0,"Visitor"],[100,"Desert Walker"],[250,"Landmark Hunter"],[450,"Phoenix Scholar"],[600,"Phoenix Historian"]],"heroAlt":"The Arizona State Capitol in Phoenix","heroLi":"<li>Header: David Jiang · CC BY-SA 4.0 · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:Arizona_State_Capitol_Daytime_December_2021.jpg\">Source</a> · resized</li>","heroCredit":"Photo: David Jiang · <a target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/licenses/by-sa/4.0/\">CC BY-SA 4.0</a> · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:Arizona_State_Capitol_Daytime_December_2021.jpg\">Source</a>","mission":"Find four landmarks around Phoenix. At each one, check in to earn its badge, unlock its story, and collect a Time Card. Do them in any order. Everything stays on this phone.","afterDone":"All four badges earned. The rest of Phoenix is waiting.","safetyNote":"<li>Phoenix gets dangerously hot. Go in the morning or evening, bring plenty of water, wear sunscreen, and take breaks in the shade. Check traffic at crosswalks.</li>","badgeMap":{"capitol":["px_cap_now","50% 45%"],"rosson":["px_ro_now","50% 45%"],"biltmore":["px_bi_now","50% 45%"],"falls":["px_af_now","50% 45%"]},"level":"Classics","region":"The Southwest","stops":[{"id":"capitol","name":"Arizona State Capitol","short":"Capitol","badge":"Capitol","tag":"Stop 1 of 4","teaser":"A small capitol building that ended up smaller than its architect dreamed.","map":"Arizona State Capitol Museum, 1700 W Washington St, Phoenix, AZ","clue":"Go to West Washington Street near 17th Avenue. Look for the stone building with a small dome on top, set back behind a lawn.","safety":"Washington Street is busy. Use crosswalks, stay on the paths, and check museum hours before you go inside.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"Which kind of tree stands on the capitol grounds?","options":["Pine","Oak","Maple","Palm"],"answer":3,"hint":"Think of a desert postcard, and a tree with a tall, bare trunk.","verify":"The photos show palm trees on the grounds. Check on site. Written from sources, not yet checked on site."},"then":{"yr":"1908","label":"The capitol then","line":"A panorama of the capitol, with palms and a dirt road, in 1908.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"px_cap_then","by":"Haines Photo Co.","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:CapitolBuilding.PhoenixAZ.1908.jpg","note":"resized, cropped"}},"now":{"yr":"Today","head":"Today","label":"The capitol today","line":"The old capitol, now a museum, with newer government buildings nearby.","ph":{"k":"px_cap_now","by":"David Jiang","lic":"CC BY-SA 4.0","lu":"https://creativecommons.org/licenses/by-sa/4.0/","page":"https://commons.wikimedia.org/wiki/File:Arizona_State_Capitol_Daytime_December_2021.jpg","note":"resized"}},"story":["The Arizona Territory's capital moved around: Prescott, Tucson, Prescott again, and finally Phoenix in 1889. To show the territory was ready for statehood, voters approved a $100,000 bond to build a real capitol.","Architect James Riely Gordon won a design contest. His original plan had wings for the legislature and a big dome, but money was short, so the wings were dropped and a small metal top was used. The capitol was finished in 1900.","Arizona became a state in 1912, and the building became the state capitol. Today the 1900 building is the Arizona Capitol Museum, and newer buildings behind it hold the legislature and the governor's offices."],"fact":"The capital moved around three times before landing here.","disputed":"Some people think Phoenix was always the capital. Wikipedia says the capital started in Prescott in 1864, then moved to Tucson, Prescott again, and Phoenix in 1889.","claims":[{"t":"The Arizona Territory's capital moved to Phoenix in 1889.","a":0,"why":"Wikipedia: the legislature voted on January 29, 1889."},{"t":"The capitol was built after Arizona became a state in 1912.","a":2,"why":"It was built in 1900 as the territorial capitol."}],"sources":[{"t":"Wikipedia: Arizona State Capitol","u":"https://en.wikipedia.org/wiki/Arizona_State_Capitol"},{"t":"Wikipedia: James Riely Gordon","u":"https://en.wikipedia.org/wiki/James_Riely_Gordon"}],"card":{"a":"1889","b":"1900","la":"Capital moves","lb":"Building finished"}},{"id":"rosson","name":"Rosson House","short":"Rosson House","badge":"Rosson House","tag":"Stop 2 of 4","teaser":"A bright Victorian house in the middle of a desert city, built by a mayor who quit.","map":"Rosson House Museum, 113 N 6th St, Phoenix, AZ","clue":"Go to Heritage Square downtown, at 6th and Monroe Streets. Look for a red brick Victorian house with a pointed corner tower.","safety":"Heritage Square is downtown, near busy streets. Use crosswalks, check museum hours, and stay on the paths.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"The house has a pointed tower on the corner. How many sides does the tower have?","options":["4","8","6","10"],"answer":1,"hint":"Walk around it and count the flat faces that go all the way round.","verify":"Wikipedia describes the tower as French and octagonal. Count the sides on site. Written from sources, not yet checked on site."},"then":{"yr":"1940","label":"The house then","line":"A survey photograph from 1940, taken from across the street.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"px_ro_then","by":"Delos H. Smith (Historic American Buildings Survey)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Historic_American_Buildings_Survey_Delos_H._Smith,_photographer_1940_-_Rosson_House,_139_North_Sixth_Street,_Phoenix,_Maricopa_County,_AZ_HABS_ARIZ,7-PHEN,5-1.tif","note":"resized, cropped"}},"now":{"yr":"Today","head":"Today","label":"The house today","line":"The restored house, now a museum in Heritage Square.","ph":{"k":"px_ro_now","by":"Greg O'Beirne","lic":"CC BY 2.5","lu":"https://creativecommons.org/licenses/by/2.5/","page":"https://commons.wikimedia.org/wiki/File:RossonHousePhoenix_gobeirne.jpg","note":"resized"}},"story":["Dr. Roland Lee Rosson was a doctor and a politician who came to Phoenix in 1879. His house was built between 1894 and 1895 in the Stick-Eastlake Queen Anne style, designed by San Francisco architect A. P. Petit. Petit died in the month it was finished.","Rosson was elected mayor of Phoenix on May 7, 1895, but after trouble with the city council he resigned on April 6, 1896. The house changed hands many times before the City of Phoenix bought it and restored it.","The house mixes styles from different cultures, including a Chinese moon gate, Italian hooded windows and a French octagonal turret. It was added to the National Register of Historic Places in 1971."],"fact":"Its architect died the month it was finished.","disputed":"Some sources say the design is unique. Wikipedia says nearly identical plans appear in an earlier house-plan book.","claims":[{"t":"Dr. Rosson was elected mayor of Phoenix in 1895.","a":0,"why":"Wikipedia: elected on May 7, 1895."},{"t":"Rosson served as mayor for ten years.","a":2,"why":"He resigned on April 6, 1896, less than a year later."}],"sources":[{"t":"Wikipedia: Rosson House","u":"https://en.wikipedia.org/wiki/Rosson_House"},{"t":"Wikipedia: Heritage Square (Phoenix)","u":"https://en.wikipedia.org/wiki/Heritage_and_Science_Park"}],"card":{"a":"1895","b":"1971","la":"Mayor elected","lb":"National Register"}},{"id":"biltmore","name":"Arizona Biltmore","short":"Biltmore","badge":"Biltmore","tag":"Stop 3 of 4","teaser":"A fancy resort made of patterned blocks, and a famous architect who didn't design it.","map":"Arizona Biltmore, 2400 E Missouri Ave, Phoenix, AZ","clue":"Go to 24th Street and Missouri Avenue, north of downtown near Camelback Road. Look for a resort made of patterned golden blocks.","safety":"The resort is private property. Look from public areas, ask staff before wandering, and watch for cars on the entrance road.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"The hotel's walls are made of patterned what?","options":["Concrete blocks","Wooden planks","Red brick","Glass panels"],"answer":0,"hint":"Look closely at the walls: they are repeating squares with designs pressed into them.","verify":"Wikipedia says the hotel used \"textile block\" construction, a system of patterned blocks. Look at the walls on site. Written from sources, not yet checked on site."},"then":{"yr":"Survey photo","label":"The pool then","line":"A survey photograph looking toward the main building from the pool area, with palms.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"px_bi_then","by":"Historic American Buildings Survey (U.S. government)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:View_to_main_hotel_building_from_pool_area_looking_west_-_Arizona_Biltmore,_Bathhouse_and_Cabanas,_Northeast_Corner,_Twenty-fourth_Street_and_Missouri_Avenue,_Phoenix,_Maricopa_HABS_ARIZ,7-PHEN,15-A-2.tif","note":"resized, cropped"}},"now":{"yr":"Today","head":"Today","label":"The hotel today","line":"The patterned block walls of the main building.","ph":{"k":"px_bi_now","by":"Aufaber","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:Azbiltmore.jpg","note":"resized"}},"story":["The Arizona Biltmore opened on February 23, 1929. Brothers Warren and Charles McArthur built it with hotelier John McEntee Bowman. Three crews worked around the clock to finish it.","Many people say Frank Lloyd Wright designed it. Wikipedia says the architect was Albert Chase McArthur, who had been a draftsman for Wright. Wright consulted for four months in 1928 on the patterned \"textile block\" system.","Clark Gable and Carole Lombard often stayed here, and the Tequila sunrise was invented here. In 1930 the McArthurs lost control of the hotel, and chewing gum magnate William Wrigley Jr. later became the full owner."],"fact":"Three crews worked day and night to finish it.","disputed":"The big debate: Wright or McArthur. Wikipedia says McArthur is the architect, with original drawings and a 1929 article to prove it.","claims":[{"t":"The Arizona Biltmore opened in 1929.","a":0,"why":"Wikipedia: opened February 23, 1929."},{"t":"Frank Lloyd Wright was the hotel's architect of record.","a":2,"why":"Albert Chase McArthur was; Wright only consulted."}],"sources":[{"t":"Wikipedia: Arizona Biltmore Hotel","u":"https://en.wikipedia.org/wiki/Arizona_Biltmore_Hotel"},{"t":"Wikipedia: Albert Chase McArthur","u":"https://en.wikipedia.org/wiki/Albert_Chase_McArthur"}],"card":{"a":"1928","b":"1929","la":"Wright consults","lb":"Hotel opens"}},{"id":"falls","name":"Arizona Falls","short":"Arizona Falls","badge":"Arizona Falls","tag":"Stop 4 of 4","teaser":"A waterfall that wasn't natural, in a desert, that lit up a city.","map":"Arizona Falls, 56th St and Indian School Rd, Phoenix, AZ","clue":"Go to the Arizona Canal near 56th Street in the Arcadia neighborhood. Follow the canal path to the little park where water drops over a ledge.","safety":"Stay on the canal path and park paths, and watch for bikes. Do not climb on the walls or into the water. It gets very hot, so bring water.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"About how far does the water drop at the falls?","options":["5 feet","10 feet","20 feet","50 feet"],"answer":2,"hint":"It is taller than a person, but shorter than a tall tree.","verify":"Wikipedia says the canal crosses a natural 20-foot drop. Estimate on site. Written from sources, not yet checked on site."},"then":{"yr":"Survey photo","label":"The power plant then","line":"A survey photo of the old power plant at Arizona Falls, looking east.","link":{"t":"Look for historic photos at the Library of Congress","u":"https://www.loc.gov/pictures/"},"ph":{"k":"px_af_then","by":"Historic American Engineering Record (U.S. government)","lic":"Public domain","lu":"https://creativecommons.org/publicdomain/mark/1.0/","page":"https://commons.wikimedia.org/wiki/File:VIEW_OF_ARIZONA_FALLS_POWER_PLANT,_LOOKING_EAST_Photographer-_unknown._No_date_-_Arizona_Canal,_North_of_Salt_River,_Phoenix,_Maricopa_County,_AZ_HAER_ARIZ,7-PHEN.V,1-12.tif","note":"resized, cropped"}},"now":{"yr":"2013","head":"Today","label":"The falls today","line":"The rebuilt waterfall and park, photographed in 2013.","ph":{"k":"px_af_now","by":"Patrick Finnegan","lic":"CC BY 2.0","lu":"https://creativecommons.org/licenses/by/2.0/","page":"https://commons.wikimedia.org/wiki/File:Arizona_Falls,_Phoenix,_AZ.jpg","note":"resized"}},"story":["In 1883, workers began digging the Arizona Canal to bring water to farms in the Valley. In 1884 they hit hard rock at a natural drop of about 20 feet. They left it in place and let the water pour over it, making a waterfall in the desert.","The falls became a popular spot. The mist cooled the air, trees gave shade, and families from Phoenix and Tempe came for picnics. In 1901 and 1902 the Phoenix Light and Fuel Company built a power plant here to provide the first electricity to Phoenix.","After about 50 years of making power, the site was neglected. In the early 2000s it was rebuilt as a public-art project and a working power station that makes enough electricity for about 150 homes. The modern park opened in 2003."],"fact":"The falls was made by a canal, not a river.","disputed":"Many people assume the falls is natural. Wikipedia says it formed when a man-made canal crossed a natural drop.","claims":[{"t":"The first power plant here opened around 1901 and 1902.","a":0,"why":"Wikipedia: built in 1901 and 1902."},{"t":"The waterfall is on a natural river.","a":2,"why":"It formed where the man-made Arizona Canal crosses a natural drop."}],"sources":[{"t":"Wikipedia: Arizona Falls","u":"https://en.wikipedia.org/wiki/Arizona_Falls"},{"t":"Wikipedia: Salt River Project","u":"https://en.wikipedia.org/wiki/Salt_River_Project"}],"card":{"a":"1884","b":"2003","la":"Falls formed","lb":"Modern park opens"}}],"heroKey":"px_cap_now"},"albuquerque":{"id":"albuquerque","name":"Albuquerque","explorer":"Duke City Explorer","initials":"ABQ","ranks":[[0,"Visitor"],[100,"Old Town Walker"],[250,"Landmark Hunter"],[450,"Albuquerque Scholar"],[600,"Albuquerque Historian"]],"heroAlt":"The San Felipe de Neri Church in Albuquerque Old Town","heroLi":"<li>Header: Don McCulley · CC0 · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:San_Felipe_de_Neri_Church_IMG_5545.jpg\">Source</a> · resized</li>","heroCredit":"Photo: Don McCulley · <a target=\"_blank\" rel=\"noopener\" href=\"https://creativecommons.org/publicdomain/zero/1.0/\">CC0</a> · <a target=\"_blank\" rel=\"noopener\" href=\"https://commons.wikimedia.org/wiki/File:San_Felipe_de_Neri_Church_IMG_5545.jpg\">Source</a>","mission":"Find four landmarks around Albuquerque. At each one, check in to earn its badge, unlock its story, and collect a Time Card. Do them in any order. Everything stays on this phone.","afterDone":"All four badges earned. The rest of Albuquerque is waiting.","safetyNote":"<li>Albuquerque is high and dry. Bring water, wear sunscreen, use crosswalks on busy Central Avenue, and stay out of fenced-off rail yard areas.</li>","badgeMap":{"felipe":["ab_sf_now","50% 45%"],"alvarado":["ab_av_now","50% 45%"],"kimo":["ab_km_now","50% 45%"],"shops":["ab_ry_now","50% 45%"]},"level":"Classics","region":"The Southwest","stops":[{"id":"felipe","name":"San Felipe de Neri Church","short":"San Felipe","badge":"San Felipe","tag":"Stop 1 of 4","teaser":"A church that collapsed, got rebuilt in 1793, and has been in use ever since.","map":"San Felipe de Neri Church, 2005 N Plaza St NW, Albuquerque, NM","clue":"Go to Old Town and find the Plaza. On its north side, look for a church with a pair of pointed towers.","safety":"Old Town has narrow streets and lots of foot traffic. Use crosswalks, and be quiet if you step inside, since it is a place of worship.","field":"Field notes pending: nobody has walked this stop for the app yet.","q":{"prompt":"How many bell towers does the front of the church have?","options":["3","2","4","1"],"answer":1,"hint":"Look at the front from across the Plaza.","verify":"Wikipedia says Victorian-era changes added bell towers
